# TEMPLATE: final ClayVerse deployment profile.
# Replace image and secret/PVC details only after exact artifact acceptance.
# The installed Kata RuntimeClass name MUST be verified on the target cluster.
#
# TIER-2 REPLACEMENT LAW:
# This StatefulSet is the workload/isolation profile only. Kubernetes may restart
# a terminated container inside the same Pod/Kata sandbox. Such an in-place
# container restart is NOT ClayVerse Tier-2 recovery. Final deployment MUST bind
# an external fail-closed orchestrator that deletes/replaces the whole Pod/Kata
# sandbox/VM after a fatal invariant signal and proves new Pod + sandbox identity
# before ingress reopens. Until that is verified, final acceptance is
# TIER2_REPLACEMENT_BLOCKED.
#
# NETWORK FAIL-CLOSED LAW:
# This template intentionally ships with a default-deny NetworkPolicy for the
# ClayVerse pod. It is not network-functional by itself. Final deployment MUST
# add a separate deployment-specific, reviewed allow policy for only the exact
# admitted ingress/egress surfaces and bind that policy into acceptance
# evidence. hostNetwork: false alone is NOT a network-isolation policy.
# The admitted CNI MUST actually enforce NetworkPolicy. Standard Kubernetes
# NetworkPolicy also has node-local traffic exceptions; node/control-plane/
# metadata reachability must therefore be separately fenced and tested by the
# deployment + microVM boundary rather than inferred from this policy object.
apiVersion: v1
kind: Service
metadata:
  name: clayverse
spec:
  selector:
    app: clayverse
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Governing service for StatefulSet network identity. Keep this separate from
# the client-facing ClusterIP service above: Kubernetes StatefulSets require a
# headless governing Service, while ingress may continue to target `clayverse`.
apiVersion: v1
kind: Service
metadata:
  name: clayverse-headless
spec:
  clusterIP: None
  selector:
    app: clayverse
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clayverse
  annotations:
    clayverse.seimensch.net/tier2-replacement: external-full-sandbox-required
    clayverse.seimensch.net/in-place-container-restart: not-tier2
spec:
  serviceName: clayverse-headless
  replicas: 1
  selector:
    matchLabels:
      app: clayverse
  template:
    metadata:
      labels:
        app: clayverse
      annotations:
        clayverse.seimensch.net/tier2-replacement: external-full-sandbox-required
        clayverse.seimensch.net/in-place-container-restart: not-tier2
    spec:
      # Final acceptance requires a Kata VM-backed RuntimeClass.
      # Current Kata runtime-rs quick-start example uses kata-qemu-runtime-rs.
      runtimeClassName: kata-qemu-runtime-rs
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 30
      # PVC mounts replace the image-owned /var/lib/clayverse and /workspace
      # directories. Bind them to the non-root runtime group without adding a
      # privileged/root ownership-repair path. Actual CSI behavior remains an
      # executable final-acceptance gate.
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clayverse
          # MUST be replaced by the exact accepted immutable image digest.
          image: registry.example.invalid/clayverse@sha256:REPLACE_WITH_ACCEPTED_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: CLAYVERSE_STATE_ROOT
              value: /var/lib/clayverse
            - name: CLAYVERSE_WORKSPACE
              value: /workspace
            - name: CLAYVERSE_REQUIRE_CLAUDE
              value: "1"
            - name: CLAYVERSE_ENABLE_ENTITYOS_EXEC
              value: "1"
            - name: CLAYVERSE_ENTITYOS_PATH
              value: /opt/entityos/EntityOS
            # EntityOS artifact identity is image-authoritative. The image bakes
            # CLAYVERSE_ENTITYOS_SHA256 only after Docker build-time verification
            # against the tracked entityos.lock.json and the embedded bytes.
            # Do not override that digest from a deployment Secret/config source.
            - name: CLAYVERSE_CLERK_MAP_JSON
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-map-json
            - name: CLERK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-issuer
            - name: CLERK_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-jwks-url
            - name: CLERK_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-audience
            - name: CLERK_AUTHORIZED_PARTIES
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-authorized-parties
            - name: CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-publishable-key
            - name: CLERK_FRONTEND_API_URL
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-frontend-api-url
            # GLM is inference-only. Token is injected as a secret and must never
            # enter UnifiedDB, snapshots, receipts or logs.
            - name: GLM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: glm-api-token
                  optional: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: clayverse-state
              mountPath: /var/lib/clayverse
            - name: clayverse-workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
  volumeClaimTemplates:
    # ClayVerse is a one-entity/single-writer appliance. Kubernetes ReadWriteOnce
    # is node-scoped and can still admit multiple Pods on one node; use the CSI
    # ReadWriteOncePod fence so stale/replacement Pods cannot share a writable PVC.
    - metadata:
        name: clayverse-state
      spec:
        accessModes: ["ReadWriteOncePod"]
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: clayverse-workspace
      spec:
        accessModes: ["ReadWriteOncePod"]
        resources:
          requests:
            storage: 20Gi
---
# Fail-closed baseline for policy-governed pod traffic. This selects ClayVerse
# for ingress+egress isolation until a deployment-specific allow policy is
# supplied. It does NOT prove CNI enforcement and does NOT imply Kubernetes'
# node-local NetworkPolicy exceptions are denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clayverse-default-deny
spec:
  podSelector:
    matchLabels:
      app: clayverse
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []