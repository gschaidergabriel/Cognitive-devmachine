name: ClayCode real sealed effect bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_effect_pipeline.py'
      - 'tools/claycode_base_runtime.py'
      - 'tools/claycode_effect_runtime_bridge.py'
      - 'tools/claycode_effect_runtime_bridge_validation.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - '.github/workflows/claycode-effect-real-runtime-bridge.yml'

concurrency:
  group: claycode-effect-real-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Execute compiled effects through sealed runtime
        run: python tools/claycode_effect_runtime_bridge_validation.py || true
      - name: Persist pass or failure receipt
        if: always()
        run: |
          test -f research_entity/claycode/autonomous/BASE_EFFECT_REAL_RUNTIME_BRIDGE_RECEIPT.json
          git config user.name 'claycode-effect-runtime-bridge'
          git config user.email 'claycode-effect-runtime-bridge@users.noreply.github.com'
          git add research_entity/claycode/autonomous/BASE_EFFECT_REAL_RUNTIME_BRIDGE_RECEIPT.json
          git diff --cached --quiet || git commit -m 'ClayCode: record sealed real-effect bridge receipt'
          if git log -1 --pretty=%B | grep -q 'record sealed real-effect bridge receipt'; then
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((attempt * 2))
            done
          fi
      - name: Enforce bridge verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/BASE_EFFECT_REAL_RUNTIME_BRIDGE_RECEIPT.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['pass'], d
          assert d['counts_as_target_acceptance'] is False
          assert d['counts_as_work_package_pass'] is False
          print('REAL_EFFECT_RUNTIME_BRIDGE_HOSTED_PASS')
          PY
