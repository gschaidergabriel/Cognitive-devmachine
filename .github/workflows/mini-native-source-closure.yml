name: mini-native-source-closure

on:
  push:
    branches:
      - gpt56sol/go-native-source-closure-20260822-1311
  pull_request:
    paths:
      - 'the artefact/blogpost_entity/native/build_native_bound.py'
      - 'the artefact/blogpost_entity/native/test_native_source_closure.py'
      - 'the artefact/blogpost_entity/native/mini_entity.c'
      - 'the artefact/blogpost_entity/native/mini_entity_part*.inc'
      - '.github/workflows/mini-native-source-closure.yml'

permissions:
  contents: read

jobs:
  source-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile provenance wrapper
        run: python -m py_compile 'the artefact/blogpost_entity/native/build_native_bound.py'
      - name: Run source-closure falsifiers
        run: python -m pytest 'the artefact/blogpost_entity/native/test_native_source_closure.py' -q
      - name: Bind current native source closure
        run: >-
          python -c "import importlib.util,pathlib,json; p=pathlib.Path('the artefact/blogpost_entity/native/build_native_bound.py'); s=importlib.util.spec_from_file_location('b',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(json.dumps(m.source_closure(p.with_name('mini_entity.c')),sort_keys=True))"
