name: claycog-08b-direct-admission
on:
  pull_request:
    paths:
      - 'the artefact/blogpost_entity/mini_cognition/**'
      - 'research_entity/global/MINI_ENTITY_CLAYCOG_APPROX1B_TRAINING_DIRECTIVE.md'
      - '.github/workflows/claycog-08b-direct-admission-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: claycog-08b-direct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  direct-lane-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exact source identity
        run: |
          set -euo pipefail
          echo "sha=$GITHUB_SHA"
          git rev-parse HEAD
      - name: Pin current Together SDK contract
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'together==2.28.0'
          python3 - <<'PY'
          import together
          print('together_sdk_version=' + getattr(together, '__version__', 'UNKNOWN'))
          PY
      - name: Canonical SFT v2 regeneration and split gates
        run: |
          set -euo pipefail
          cd 'the artefact/blogpost_entity/mini_cognition'
          python3 generate_sft_v2.py
          python3 validate_sft_v2.py train_v2.jsonl --against validation_v2.jsonl
          python3 validate_sft_v2.py validation_v2.jsonl --against train_v2.jsonl
      - name: Direct 0.8B launcher deterministic regressions
        run: |
          set -euo pipefail
          cd 'the artefact/blogpost_entity/mini_cognition'
          python3 -m py_compile launch_together_qwen35_08b_v1.py test_launch_together_qwen35_08b_v1.py
          python3 test_launch_together_qwen35_08b_v1.py

# No provider secret, upload, price request or billed create is performed by this workflow.
# Exactly one unusual experiment for this user-triggered go is documented in the bounded
# receipt: SDK_CREATE_SCHEMA_SPLIT_FALSIFIER. These workflow checks are deterministic
# regressions around that single discriminator, not additional unusual experiments.
