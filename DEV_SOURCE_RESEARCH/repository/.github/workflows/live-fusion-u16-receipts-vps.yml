name: Live Fusion U16 Receipts VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-fusion-u16-receipts-vps.yml'
      - 'research_entity/runtime/RAE_UNIFIEDDB_V16_LIVE_FUSION_RECEIPTS.sql'
      - 'research_entity/runtime/test_live_fusion_receipts_v16.py'

concurrency:
  group: live-fusion-u16-receipts-vps
  cancel-in-progress: false

jobs:
  test-and-measure:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Run receipt invariants
        run: |
          set -euo pipefail
          python3 -m py_compile research_entity/runtime/test_live_fusion_receipts_v16.py
          python3 -m unittest -v research_entity.runtime.test_live_fusion_receipts_v16
      - name: Measure durable receipt-chain microfixture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, platform, socket, sqlite3, statistics, tempfile, time
          from datetime import datetime, timezone
          from pathlib import Path

          migration=Path('research_entity/runtime/RAE_UNIFIEDDB_V16_LIVE_FUSION_RECEIPTS.sql').read_text()
          samples=[]
          with tempfile.TemporaryDirectory() as td:
              dbpath=Path(td)/'u16.sqlite'
              db=sqlite3.connect(dbpath)
              db.executescript(migration)
              db.execute("INSERT INTO clay_live_fusion_events VALUES(?,?,?,?,?,?,?,?,?)",('urn:clay:vps','evt','h',9,3,'CONTRADICTS','git:payload','RESEARCH_EVIDENCE','t'))
              db.execute("INSERT INTO clay_live_fusion_branch_projections VALUES(?,?,?,?,?,?)",('harness',9,'p9','CURRENT',8,'t'))
              db.execute("INSERT INTO clay_live_fusion_route_plans(route_plan_id,source,event_id,mode,confidence,route_epoch,reason_clay,created_at) VALUES(?,?,?,?,?,?,?,?)",('p','urn:clay:vps','evt','TARGETED_DELTA',0.9,9,'{}','t'))
              db.execute("INSERT INTO clay_live_fusion_route_decisions VALUES(?,?,?,?,?,?,?,?)",('p','harness','CONFLICT_INTERRUPT','FULL_REF','NEXT_SAFE_POINT',9,'p9','t'))
              for stage in range(1,8):
                  t0=time.perf_counter_ns()
                  db.execute("INSERT INTO clay_live_fusion_receipt_events VALUES(?,?,?,?,?,?,?,?,?)",('urn:clay:vps','evt','harness',stage,'p',f'r{stage}',None,'RESEARCH_EVIDENCE','t'))
                  db.commit()
                  samples.append((time.perf_counter_ns()-t0)/1000.0)
              db.close()
              db=sqlite3.connect(dbpath)
              stage=db.execute("SELECT stage_name FROM v_clay_live_fusion_current_receipt_stage").fetchone()[0]
              integrity=db.execute('PRAGMA integrity_check').fetchone()[0]
              db.close()

          s=sorted(samples)
          receipt={
            'schema_version':'1.0',
            'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION_OF_SYNTHETIC_LIVE_FUSION_PERSISTENCE_FIXTURE',
            'created_at':datetime.now(timezone.utc).isoformat(),
            'github_sha':os.environ.get('GITHUB_SHA',''),
            'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),
            'runner_os':os.environ.get('RUNNER_OS','unknown'),
            'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
            'hostname':socket.gethostname(),
            'platform':platform.platform(),
            'python':platform.python_version(),
            'sqlite':sqlite3.sqlite_version,
            'receipt_commit_latency_us':{
              'n':len(samples),
              'median':statistics.median(samples),
              'p95':s[min(len(s)-1,max(0,int(round(0.95*(len(s)-1)))))],
              'min':min(samples),
              'max':max(samples),
            },
            'restart_stage':stage,
            'sqlite_integrity':integrity,
            'acceptance':{
              'tests_executed_before_measurement':True,
              'restart_preserved_reentry':stage=='REENTRY',
              'integrity_ok':integrity=='ok',
            },
            'scope_guard':'Synthetic persistence fixture only; no production live-broker, real worker-topology, Andreas-target or whole-FRANK promotion claim.'
          }
          Path('/tmp/LIVE_FUSION_U16_VPS_RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          assert all(receipt['acceptance'].values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-fusion-u16-${{ github.run_id }}
          path: /tmp/LIVE_FUSION_U16_VPS_RECEIPT.json
          if-no-files-found: error

  persist-receipt:
    if: always()
    needs: test-and-measure
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: live-fusion-u16-${{ github.run_id }}
          path: /tmp/live-fusion-u16
      - name: Persist immutable receipt
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/tmp/live-fusion-u16/LIVE_FUSION_U16_VPS_RECEIPT.json')
          x=json.loads(p.read_text())
          assert x['github_sha']==os.environ['TESTED_SHA']
          root=Path('research_entity/state/system/live_fusion_u16_receipts')
          root.mkdir(parents=True,exist_ok=True)
          (root/'LATEST.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          (root/f"{x['github_run_id']}.json").write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'clay-live-fusion-u16'
          git config user.email 'clay-live-fusion-u16@users.noreply.github.com'
          git add research_entity/state/system/live_fusion_u16_receipts/
          git commit -m "evidence(live-fusion): persist U16 Ubuntu receipt ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt*2))
          done
          exit 1
