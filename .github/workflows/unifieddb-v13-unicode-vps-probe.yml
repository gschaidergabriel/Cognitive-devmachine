name: UnifiedDB V13 Unicode VPS Probe

on:
  pull_request:
    paths:
      - 'research_entity/runtime/semantic_retrieval_runtime_v13.py'
      - 'research_entity/runtime/test_semantic_access_v13.py'
      - 'research_entity/runtime/test_semantic_access_v13_unicode.py'
      - 'tools/unifieddb_v13_unicode_benchmark.py'
      - '.github/workflows/unifieddb-v13-unicode-vps-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unicode-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Compile V13 runtime and falsifiers
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research_entity/runtime/semantic_retrieval_runtime_v13.py \
            research_entity/runtime/test_semantic_access_v13.py \
            research_entity/runtime/test_semantic_access_v13_unicode.py \
            tools/unifieddb_v13_unicode_benchmark.py
      - name: Run V13 snapshot and Unicode tests
        run: |
          set -euo pipefail
          cd research_entity/runtime
          python3 -m unittest -v test_semantic_access_v13.py test_semantic_access_v13_unicode.py
      - name: Run normalization collision ablation
        run: |
          set -euo pipefail
          python3 tools/unifieddb_v13_unicode_benchmark.py

  unicode-vps:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Compile V13 runtime and falsifiers
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research_entity/runtime/semantic_retrieval_runtime_v13.py \
            research_entity/runtime/test_semantic_access_v13.py \
            research_entity/runtime/test_semantic_access_v13_unicode.py \
            tools/unifieddb_v13_unicode_benchmark.py
      - name: Run V13 snapshot and Unicode tests
        run: |
          set -euo pipefail
          cd research_entity/runtime
          python3 -m unittest -v test_semantic_access_v13.py test_semantic_access_v13_unicode.py
      - name: Run normalization collision ablation
        run: |
          set -euo pipefail
          mkdir -p research_entity/benchmarks/unifieddb_claygraph
          python3 tools/unifieddb_v13_unicode_benchmark.py \
            | tee research_entity/benchmarks/unifieddb_claygraph/v13_unicode_vps_latest.json
      - name: Attach runner metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, platform, sqlite3
          p=pathlib.Path('research_entity/benchmarks/unifieddb_claygraph/v13_unicode_vps_latest.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          x['execution_metadata']={
              'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
              'scope':'REMOTE_PRELIMINARY_UNICODE_NORMALIZER_NOT_ANDREAS_TARGET_ACCEPTANCE',
              'runner_name':os.environ.get('RUNNER_NAME','UNKNOWN'),
              'runner_os':os.environ.get('RUNNER_OS','UNKNOWN'),
              'runner_arch':os.environ.get('RUNNER_ARCH','UNKNOWN'),
              'platform':platform.platform(),
              'sqlite':sqlite3.sqlite_version,
              'git_sha':os.environ.get('GITHUB_SHA','UNKNOWN'),
          }
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unifieddb-v13-unicode-vps
          path: research_entity/benchmarks/unifieddb_claygraph/v13_unicode_vps_latest.json
