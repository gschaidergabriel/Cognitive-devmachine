name: Trigger1 intermediate Qwen06 causal discriminator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger1-intermediate-qwen06.yml'
      - 'tools/trigger1_local_qwen06_intermediate_contrastive_execute.py'
      - 'tools/trigger1_intermediate_contrastive_protocol.py'
      - 'tools/trigger1_local_qwen06_activation_api_execute.py'
      - 'tests/test_trigger1_local_qwen06_intermediate_executor_872.py'
      - 'tests/test_trigger1_intermediate_contrastive_protocol.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trigger1-intermediate-qwen06
  cancel-in-progress: false

jobs:
  intermediate-causal-discriminator:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity'
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Checkout exact current source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Guard exact source and deterministic component regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          python3 -m py_compile \
            tools/trigger1_intermediate_contrastive_protocol.py \
            tools/trigger1_local_qwen06_intermediate_contrastive_execute.py \
            tests/test_trigger1_local_qwen06_intermediate_executor_872.py
          python3 -m unittest -v \
            tests.test_trigger1_intermediate_contrastive_protocol \
            tests.test_trigger1_local_qwen06_intermediate_executor_872
          sha256sum \
            tools/trigger1_intermediate_contrastive_protocol.py \
            tools/trigger1_local_qwen06_intermediate_contrastive_execute.py \
            tools/trigger1_local_qwen06_activation_api_execute.py
          avail_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$avail_kib" -ge 6291456

      - name: Prepare zero-cost local model runtime
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          VENV="${RUNNER_TEMP:-/tmp}/clay-trigger1-intermediate-${GITHUB_RUN_ID}"
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check --no-input --upgrade pip
          "$VENV/bin/python" -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
          "$VENV/bin/python" -m pip install --disable-pip-version-check --no-input \
            'transformers>=4.51,<5' 'huggingface_hub>=0.30,<1' 'safetensors>=0.5,<1'
          echo "venv=$VENV" >> "$GITHUB_OUTPUT"

      - name: Execute intermediate representation discriminator
        id: experiment
        shell: bash
        env:
          VENV: ${{ steps.deps.outputs.venv }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP:-/tmp}/clay-trigger1-intermediate-out-${GITHUB_RUN_ID}"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          set +e
          env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u NVIDIA_API_KEY -u OPENROUTER_API_KEY \
              -u GROQ_API_KEY -u TOGETHER_API_KEY -u HF_TOKEN \
              "$VENV/bin/python" tools/trigger1_local_qwen06_intermediate_contrastive_execute.py \
              --output-dir "$OUT" \
              --cache-dir "${HOME}/.cache/huggingface"
          rc=$?
          set -e
          test -f "$OUT/trigger1_intermediate_contrastive_result.json"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat "$OUT/trigger1_intermediate_contrastive_result.json"

      - name: Persist bounded exact-source runtime receipt
        shell: bash
        env:
          OUT: ${{ steps.experiment.outputs.out }}
          EXPERIMENT_RC: ${{ steps.experiment.outputs.rc }}
        run: |
          set -euo pipefail
          DEST='research_entity/runtime/local_qwen06_intermediate/actions'
          mkdir -p "$DEST"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,subprocess
          from datetime import datetime,timezone
          out=pathlib.Path(os.environ['OUT'])
          result=json.loads((out/'trigger1_intermediate_contrastive_result.json').read_text())
          def sha(path): return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          receipt={
            'schema':'CLAY_TRIGGER1_LOCAL_QWEN06_INTERMEDIATE_SELFHOSTED_RECEIPT/v1',
            'evidence_class':'REAL_SELF_HOSTED_LOCAL_QWEN06_INTERMEDIATE_CAUSAL_DISCRIMINATOR',
            'created_at':datetime.now(timezone.utc).isoformat(),
            'github_repository':os.environ.get('GITHUB_REPOSITORY'),
            'github_sha':os.environ.get('GITHUB_SHA'),
            'github_run_id':os.environ.get('GITHUB_RUN_ID'),
            'github_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'runner_name':os.environ.get('RUNNER_NAME'),
            'runner_os':os.environ.get('RUNNER_OS'),
            'runner_arch':os.environ.get('RUNNER_ARCH'),
            'platform':platform.platform(),
            'repo_head_observed':git('rev-parse','HEAD'),
            'repo_tree_observed':git('rev-parse','HEAD^{tree}'),
            'repo_dirty_before_persist':bool(git('status','--porcelain=v1')),
            'executor_path':'tools/trigger1_local_qwen06_intermediate_contrastive_execute.py',
            'executor_sha256':sha('tools/trigger1_local_qwen06_intermediate_contrastive_execute.py'),
            'protocol_path':'tools/trigger1_intermediate_contrastive_protocol.py',
            'protocol_sha256':sha('tools/trigger1_intermediate_contrastive_protocol.py'),
            'base_loader_path':'tools/trigger1_local_qwen06_activation_api_execute.py',
            'base_loader_sha256':sha('tools/trigger1_local_qwen06_activation_api_execute.py'),
            'workflow_path':'.github/workflows/trigger1-intermediate-qwen06.yml',
            'workflow_sha256':sha('.github/workflows/trigger1-intermediate-qwen06.yml'),
            'experiment_exit_code':int(os.environ['EXPERIMENT_RC']),
            'external_llm_credentials_explicitly_unset':['OPENAI_API_KEY','ANTHROPIC_API_KEY','NVIDIA_API_KEY','OPENROUTER_API_KEY','GROQ_API_KEY','TOGETHER_API_KEY','HF_TOKEN'],
            'zero_paid_provider_calls_by_experiment_design':True,
            'result':result,
            'scope_guard':'A PASS is only exact-source intermediate-representation causal-candidate evidence. It never alone mints canonical truth, whole EntityOS/HCU, full HCU, J-Space model-runtime, or training credit.'
          }
          material=json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          receipt['receipt_sha256']=hashlib.sha256(material).hexdigest()
          dest=pathlib.Path('research_entity/runtime/local_qwen06_intermediate/actions')
          run_id=os.environ['GITHUB_RUN_ID']
          text=json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n'
          (dest/f'{run_id}.json').write_text(text)
          (dest/'LATEST.json').write_text(text)
          print(json.dumps({'status':result.get('status'),'classification':(result.get('verdict') or {}).get('classification'),'run_id':run_id,'receipt_sha256':receipt['receipt_sha256']},sort_keys=True))
          PY
          git config user.name 'clay-trigger1-intermediate-runner'
          git config user.email 'clay-trigger1-intermediate-runner@users.noreply.github.com'
          git add research_entity/runtime/local_qwen06_intermediate/actions/
          git commit -m "evidence(trigger1): intermediate Qwen06 runtime ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done
          case "$EXPERIMENT_RC" in
            0|2) exit 0 ;;
            *) exit 1 ;;
          esac

      - name: Clean temporary runtime
        if: always()
        shell: bash
        env:
          VENV: ${{ steps.deps.outputs.venv }}
          OUT: ${{ steps.experiment.outputs.out }}
        run: |
          rm -rf "${VENV:-}" "${OUT:-}"
