name: Mini Entity structured sandbox

on:
  pull_request:
    paths:
      - 'the artefact/blogpost_entity/BLOGPOST_ENTITY.clay'
      - 'the artefact/blogpost_entity/test_blogpost_entity.py'
      - 'the artefact/blogpost_entity/test_zero_blog_preset.py'
      - 'the artefact/blogpost_entity/test_epistemic_unknown_not_zero.py'
      - 'the artefact/blogpost_entity/test_runtime_fusion_regressions.py'
      - 'tools/clay_profile_pipeline_runtime.py'
      - 'tools/clay_pipeline_study_surface.py'
      - 'tools/claycode_structured_backend.py'
      - '.github/workflows/mini-entity-structured-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structured-mini-entity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check pytest lark
      - name: Run structured Mini Entity falsifiers
        # The current go's one unusual-experiment slot was already consumed on canonical main
        # by the Same-Version Artifact Identity Collision Audit. Keep the new preset-amputation
        # discriminator as a future promotion gate, but do not execute it in this macro-cycle.
        # Fusion regressions are ordinary deterministic regression/fault-injection gates.
        run: >-
          python -m pytest -q -k 'not preset_amputation'
          'the artefact/blogpost_entity/test_blogpost_entity.py'
          'the artefact/blogpost_entity/test_zero_blog_preset.py'
          'the artefact/blogpost_entity/test_epistemic_unknown_not_zero.py'
          'the artefact/blogpost_entity/test_runtime_fusion_regressions.py'
