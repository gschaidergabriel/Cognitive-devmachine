name: ClayCode BASE sealed-capability application proxy v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_application_proxy_suite_v2.py'
      - 'tools/claycode_base_runtime.py'
      - 'tools/claycode_base_stdlib_extensions.py'
      - 'tools/claycode_base_pure_toolchain.py'
      - 'research_entity/harness/reference/active_assembly.py'
      - '.github/workflows/claycode-base-application-proxy-v2.yml'
permissions:
  contents: write
jobs:
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - run: cc --version
      - run: python -m py_compile tools/claycode_base_runtime.py tools/claycode_base_stdlib_extensions.py tools/claycode_base_pure_toolchain.py tools/claycode_base_application_proxy_suite_v2.py
      - run: python tools/claycode_base_application_proxy_suite_v2.py
      - name: Preserve receipt
        run: |
          git config user.name 'claycode-app-proxy-v2'
          git config user.email 'claycode-app-proxy-v2@users.noreply.github.com'
          git add research_entity/claycode/autonomous/BASE_APPLICATION_PROXY_SUITE_V2_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record sealed-capability application proxy receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
