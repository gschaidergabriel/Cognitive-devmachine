name: ClayCog 0.5B admission and OOD gates

on:
  pull_request:
    paths:
      - 'the artefact/blogpost_entity/mini_cognition/**'
      - '.github/workflows/claycog-05b-admission-ood.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile cognition sources
        run: |
          python3 -m py_compile \
            'the artefact/blogpost_entity/mini_cognition/generate_sft_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/validate_sft_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/generate_eval_ood_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/eval_outputs_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/launch_together_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/test_launch_together_safety_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/test_eval_outputs_gate_v1.py'
      - name: Together safety regressions
        run: python3 'the artefact/blogpost_entity/mini_cognition/test_launch_together_safety_v1.py'
      - name: Regenerate and validate SFT corpus
        run: |
          python3 'the artefact/blogpost_entity/mini_cognition/generate_sft_v1.py'
          python3 'the artefact/blogpost_entity/mini_cognition/validate_sft_v1.py' 'the artefact/blogpost_entity/mini_cognition/train_v1.jsonl'
          python3 'the artefact/blogpost_entity/mini_cognition/validate_sft_v1.py' 'the artefact/blogpost_entity/mini_cognition/validation_v1.jsonl'
      - name: Generate structural OOD
        run: python3 'the artefact/blogpost_entity/mini_cognition/generate_eval_ood_v1.py'
      - name: Verify unusual experiment definition
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('the artefact/blogpost_entity/mini_cognition')
          rows=[json.loads(x) for x in (root/'eval_ood_v1.jsonl').read_text().splitlines() if x.strip()]
          assert len(rows)==240, len(rows)
          amp=[x for x in rows if x['family']=='tool_vocabulary_amputation_ood']
          assert len(amp)==40, len(amp)
          seen={'calendar.create','mail.send','db.lookup','http.get','artifact.write','queue.publish'}
          for row in amp:
              must='\n'.join(row['must_contain'])
              assert all(op in row['must_not_contain'] for op in seen)
              assert not any(op in must for op in seen)
              assert 'omega_schema(w,' in must
              assert must.count('omega_arg(w,') >= 2
              assert all(f'omega_validate(w,"{gate}")' in must for gate in ('grammar','types','schema','authority','generation'))
          print(json.dumps({'ood_cases':240,'tool_vocabulary_amputation_cases':40,'sft_seen_overlap':0,'typed_args_required':True}))
          PY
      - name: Prove aggregate score cannot mask amputation failure
        run: python3 'the artefact/blogpost_entity/mini_cognition/test_eval_outputs_gate_v1.py'
      - name: Verify 0.5B template gate precedes network object and upload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('the artefact/blogpost_entity/mini_cognition/launch_together_v1.py').read_text()
          assert 'TEMPLATE=os.environ.get("CLAYCOG_TOGETHER_TEMPLATE","").strip()' in p
          assert 'Qwen/Qwen2.5-7B-Instruct-Turbo' not in p
          gate='\n    require_compatible_template_claim()\n    fingerprint=campaign_fingerprint(hf_model)'
          sdk='\n    from together import Together\n'
          upload='\n    train_file=client.files.upload'
          assert gate in p and sdk in p and upload in p
          assert p.index(gate) < p.index(sdk) < p.index(upload)
          print('0.5B template admission precedes Together SDK object and file upload')
          PY
