SNAPSHOT_MAX_SKEW_SECONDS = 120.0


def _epoch_key(value: Any) -> tuple[int, ...]:
    text = str(value or "").strip()
    if not text:
        return ()
    try:
        return tuple(int(part) for part in text.split("."))
    except ValueError:
        return ()


def _stable_json_source(path: Path) -> tuple[dict[str, Any] | None, str | None, str | None]:
    try:
        first = path.read_bytes()
        second = path.read_bytes()
    except OSError as exc:
        return None, None, f"READ_ERROR:{type(exc).__name__}"
    if first != second:
        return None, None, "INPUT_CHANGED_DURING_SNAPSHOT"
    digest = hashlib.sha256(first).hexdigest()
    try:
        value = json.loads(first.decode("utf-8"))
    except Exception as exc:
        return None, digest, f"JSON_ERROR:{type(exc).__name__}"
    if not isinstance(value, dict):
        return None, digest, "JSON_OBJECT_REQUIRED"
    return value, digest, None


def capture_live_snapshot(repo: Path, max_skew_seconds: float = SNAPSHOT_MAX_SKEW_SECONDS) -> dict[str, Any]:
    paths = {
        "swarm": repo / "free swarm/LIVE_METRICS.json",
        "forge": repo / "free swarm/FORGE_LIVE.json",
        "distillery": repo / "free swarm/DISTILLERY_LIVE.json",
        "authority": repo / "research_entity/claycode/autonomous/SUPERVISOR_INBOX.json",
    }
    values: dict[str, dict[str, Any]] = {}
    hashes: dict[str, str] = {}
    errors: dict[str, str] = {}
    for name, path in paths.items():
        value, digest, error = _stable_json_source(path)
        if digest:
            hashes[name] = digest
        if error:
            errors[name] = error
        elif value is not None:
            values[name] = value

    authority = values.get("authority") or {}
    authority_epoch = str(authority.get("schema_version") or "")
    times: dict[str, str] = {}
    parsed: dict[str, dt.datetime] = {}
    for name in ("swarm", "forge", "distillery"):
        value = values.get(name) or {}
        raw = value.get("generated_at")
        ts = parse_ts(raw)
        if ts is None:
            errors[name] = errors.get(name) or "GENERATED_AT_REQUIRED"
        else:
            times[name] = str(raw)
            parsed[name] = ts
    if not _epoch_key(authority_epoch):
        errors["authority"] = errors.get("authority") or "AUTHORITY_EPOCH_REQUIRED"

    skew = None
    if len(parsed) == 3:
        skew = (max(parsed.values()) - min(parsed.values())).total_seconds()
        if skew > max_skew_seconds:
            errors["snapshot"] = f"SOURCE_SKEW_EXCEEDS_BOUND:{skew:.6f}>{max_skew_seconds:.6f}"

    swarm = values.get("swarm") or {}
    forge = values.get("forge") or {}
    distillery = values.get("distillery") or {}
    workers = swarm.get("workers") if isinstance(swarm.get("workers"), dict) else {}
    metrics = {
        "swarm": {
            "generated_at": times.get("swarm"),
            "worker_records": inum(workers.get("worker_records")),
            "exact_usage_rows": inum(workers.get("exact_usage_rows")),
            "input_tokens": inum(workers.get("input_tokens")),
            "output_tokens": inum(workers.get("output_tokens")),
            "total_tokens": inum(workers.get("total_tokens")),
        },
        "forge": {
            "generated_at": times.get("forge"),
            "discovery_hits": inum(forge.get("discovery_hits")),
            "evaluations": inum(forge.get("evaluations")),
            "accepted_deltas": inum(forge.get("accepted_deltas")),
        },
        "distillery": {
            "generated_at": times.get("distillery"),
            "collected_source_tokens": inum(distillery.get("collected_source_tokens")),
            "accepted_packets": inum(distillery.get("accepted_packets")),
            "accepted_dataset_tokens": inum(distillery.get("accepted_dataset_tokens")),
        },
    }
    identity_payload = {
        "schema": SOURCE_SNAPSHOT_SCHEMA,
        "authority_epoch": authority_epoch,
        "source_sha256": hashes,
        "source_generated_at": times,
        "metrics": metrics,
    }
    snapshot_id = sha256_json(identity_payload)
    return {
        **identity_payload,
        "snapshot_id": snapshot_id,
        "status": "READY" if not errors else "UNMEASURED",
        "errors": errors,
        "max_skew_seconds_allowed": max_skew_seconds,
        "observed_skew_seconds": skew,
    }


def _published_source_times(published: dict[str, Any]) -> dict[str, dt.datetime]:
    snap = published.get("source_snapshot")
    raw: dict[str, Any] = {}
    if isinstance(snap, dict):
        value = snap.get("source_generated_at")
        if isinstance(value, dict):
            raw = value
    if not raw:
        source = published.get("source_metrics")
        if isinstance(source, dict):
            raw = {
                "swarm": source.get("free_swarm_live_metrics_generated_at"),
                "forge": source.get("forge_generated_at"),
                "distillery": source.get("distillery_generated_at"),
            }
    out: dict[str, dt.datetime] = {}
    for name in ("swarm", "forge", "distillery"):
        ts = parse_ts(raw.get(name))
        if ts is not None:
            out[name] = ts
    return out


def publication_decision(existing: dict[str, Any], proposed_snapshot: dict[str, Any]) -> str:
    if proposed_snapshot.get("status") != "READY":
        return "BLOCKED_PROPOSED_SNAPSHOT_UNMEASURED"
    proposed_epoch = _epoch_key(proposed_snapshot.get("authority_epoch"))
    if not proposed_epoch:
        return "BLOCKED_PROPOSED_AUTHORITY_UNKNOWN"
    if not existing:
        return "PUBLISH_NO_EXISTING"
    existing_epoch = _epoch_key(existing.get("authority_epoch"))
    if existing_epoch and existing_epoch > proposed_epoch:
        return "BLOCKED_EXISTING_NEWER_AUTHORITY"
    if not existing_epoch or existing_epoch < proposed_epoch:
        return "PUBLISH_NEWER_AUTHORITY"

    proposed_times = {
        name: parse_ts((proposed_snapshot.get("source_generated_at") or {}).get(name))
        for name in ("swarm", "forge", "distillery")
    }
    existing_times = _published_source_times(existing)
    if any(proposed_times.get(name) is None for name in proposed_times):
        return "BLOCKED_PROPOSED_SOURCE_TIME_UNKNOWN"
    if len(existing_times) != 3:
        return "PUBLISH_FORMAT_UPGRADE_WITH_CURRENT_AUTHORITY"
    older = any(proposed_times[name] < existing_times[name] for name in proposed_times)
    newer = any(proposed_times[name] > existing_times[name] for name in proposed_times)
    if older and newer:
        return "BLOCKED_INCOMPARABLE_PARTIAL_SNAPSHOT"
    if older:
        return "BLOCKED_OLDER_WRITER_CANNOT_REGRESS"
    if newer:
        return "PUBLISH_NEWER_BOUNDED_SNAPSHOT"
    existing_snap = existing.get("source_snapshot")
    existing_id = existing_snap.get("snapshot_id") if isinstance(existing_snap, dict) else None
    if existing_id and existing_id != proposed_snapshot.get("snapshot_id"):
        return "BLOCKED_SAME_WATERMARK_DIFFERENT_SNAPSHOT"
    return "PUBLISH_IDEMPOTENT_SAME_SNAPSHOT"


def assess_published_freshness(published: dict[str, Any], live_snapshot: dict[str, Any]) -> dict[str, Any]:
    if live_snapshot.get("status") != "READY":
        return {"state": "UNMEASURED", "reason": "LIVE_SNAPSHOT_UNMEASURED"}
    if _epoch_key(published.get("authority_epoch")) != _epoch_key(live_snapshot.get("authority_epoch")):
        return {"state": "HISTORICAL", "reason": "AUTHORITY_EPOCH_MISMATCH"}
    published_times = _published_source_times(published)
    live_times = {
        name: parse_ts((live_snapshot.get("source_generated_at") or {}).get(name))
        for name in ("swarm", "forge", "distillery")
    }
    if len(published_times) != 3 or any(ts is None for ts in live_times.values()):
        return {"state": "UNMEASURED", "reason": "BOUND_SOURCE_TIMES_REQUIRED"}
    if any(live_times[name] > published_times[name] for name in live_times):
        return {"state": "STALE", "reason": "NEWER_LIVE_INPUT_THAN_AGGREGATE"}
    if any(live_times[name] < published_times[name] for name in live_times):
        return {"state": "UNMEASURED", "reason": "AGGREGATE_AHEAD_OF_CURRENT_INPUT"}
    snap = published.get("source_snapshot")
    published_id = snap.get("snapshot_id") if isinstance(snap, dict) else None
    if not published_id or published_id != live_snapshot.get("snapshot_id"):
        return {"state": "UNMEASURED", "reason": "SNAPSHOT_ID_MISMATCH_OR_MISSING"}
    return {"state": "FRESH", "reason": "EXACT_BOUNDED_SNAPSHOT_MATCH"}


def stable_result_digest(result: dict[str, Any]) -> str:
    volatile = {"generated_at", "published_at", "measurement_digest_sha256", "publication"}
    def clean(value: Any) -> Any:
        if isinstance(value, dict):
            return {k: clean(v) for k, v in value.items() if k not in volatile}
        if isinstance(value, list):
            return [clean(v) for v in value]
        return value
    return sha256_json(clean(result))


def publish_json_fail_closed(path: Path, result: dict[str, Any], repo: Path) -> dict[str, Any]:
    try:
        import fcntl
    except Exception:
        return {"status": "BLOCKED", "reason": "POSIX_FILE_LOCK_REQUIRED"}
    path.parent.mkdir(parents=True, exist_ok=True)
    lock_path = path.with_name(path.name + ".lock")
    with lock_path.open("a+", encoding="utf-8") as lock:
        fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
        latest = capture_live_snapshot(repo)
        proposed = result.get("source_snapshot")
        if not isinstance(proposed, dict) or latest.get("status") != "READY":
            return {"status": "BLOCKED", "reason": "LIVE_OR_PROPOSED_SNAPSHOT_UNMEASURED"}
        if latest.get("snapshot_id") != proposed.get("snapshot_id"):
            return {"status": "BLOCKED", "reason": "INPUT_ADVANCED_BEFORE_PUBLICATION", "latest_snapshot_id": latest.get("snapshot_id")}
        existing = read_json(path) if path.exists() else {}
        decision = publication_decision(existing, proposed)
        if decision.startswith("BLOCKED_"):
            return {"status": "BLOCKED", "reason": decision}
        if decision == "PUBLISH_IDEMPOTENT_SAME_SNAPSHOT":
            old_digest = existing.get("measurement_digest_sha256")
            new_digest = result.get("measurement_digest_sha256")
            if old_digest == new_digest and old_digest:
                return {"status": "IDEMPOTENT_NO_WRITE", "reason": "SAME_SNAPSHOT_SAME_RESULT_DIGEST"}
            return {"status": "BLOCKED", "reason": "SAME_SNAPSHOT_DIFFERENT_RESULT_DIGEST"}
        tmp = path.with_name(path.name + f".tmp-{os.getpid()}")
        tmp.write_text(json.dumps(result, indent=2, sort_keys=True, ensure_ascii=False) + "\n", encoding="utf-8")
        os.replace(tmp, path)
        return {"status": "PUBLISHED", "reason": decision, "snapshot_id": proposed.get("snapshot_id")}


