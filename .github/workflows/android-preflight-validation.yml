name: Android Secondary Arm Mesh Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-android-mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Android full-mesh interconnect manifest
        run: |
          python tools/android_research_preflight.py \
            --run-id android-20260808T2338p0700-chatgpt-secondary-r1 \
            --output /tmp/android-interconnect.json
      - name: Assert all eight branches retrieve branch-addressed Android feedback
        run: |
          python - <<'PY'
          import json
          p = '/tmp/android-interconnect.json'
          data = json.load(open(p, encoding='utf-8'))
          expected = {'clay','frank','gwt','emergenz','claycode','hyperposition','claygraph','unifieddb'}
          got = set(data['registry_scientific_branches'])
          assert got == expected, (got, expected)
          assert data['secondary_arm']['name'] == 'android'
          suffix = {
              'clay': 'KMP-ANDROID-R1-FEEDBACK-CLAY.md',
              'frank': 'KMP-ANDROID-R1-FEEDBACK-FRANK.md',
              'gwt': 'KMP-ANDROID-R1-FEEDBACK-GWT.md',
              'emergenz': 'KMP-ANDROID-R1-FEEDBACK-EMERGENZ.md',
              'claycode': 'KMP-ANDROID-R1-FEEDBACK-CLAYCODE.md',
              'hyperposition': 'KMP-ANDROID-R1-FEEDBACK-HYPERPOSITION.md',
              'claygraph': 'KMP-ANDROID-R1-FEEDBACK-CLAYGRAPH.md',
              'unifieddb': 'KMP-ANDROID-R1-FEEDBACK-UNIFIEDDB.md',
          }
          missing = []
          for branch in data['branches']:
              packets = branch.get('knowledge_micro_packets', [])
              target = suffix[branch['branch']]
              hits = [x for x in packets if x.endswith(target)]
              print(branch['branch'], hits)
              if not hits:
                  missing.append(branch['branch'])
          assert not missing, f'branch-addressed Android feedback not retrieved for: {missing}'
          print('ANDROID_MESH_RETRIEVAL_PASS')
          print('branches=', sorted(got))
          PY
