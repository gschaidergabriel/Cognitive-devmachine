name: Trigger1 local Qwen3-0.6B runtime proof

# Explicit Trigger-1 research run requested 2026-08-24T21:42+07:00; execute exact-current local zero-cost proof.
# Supervisor 8.72 re-entry: route promotion-bearing evidence away from the terminal
# output-head positive control and into the activation-derived nonterminal mid-layer lane.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger1-local-qwen06-runtime-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  local-qwen-proof:
    if: github.actor == 'gschaidergabriel'
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - name: Checkout trigger source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-enter exact current main and run provider-independent Trigger1
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="/tmp/clay-trigger1-qwen06-${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

          unset \
            GROQ_API_KEY GROQ_API_KEYS GROQ2_API_KEY GROQ3_API_KEY \
            MISTRAL_API_KEY MISTRAL_API_KEYS MISTRAL2_API_KEY MISTRAL3_API_KEY \
            NVIDIA_API_KEY NVIDIA_API_KEYS NVIDIA_NIM_API_KEY NVIDIA2_API_KEY NVIDIA3_API_KEY NGC_API_KEY \
            OPENROUTER_API_KEY OPENROUTER_API_KEYS OPENROUTER2_API_KEY OPENROUTER3_API_KEY \
            TOGETHER_API_KEY TOGETHER_API_KEYS || true
          while IFS= read -r name; do
            case "$name" in
              GROQ*KEY*|MISTRAL*KEY*|NVIDIA*KEY*|NGC*KEY*|OPENROUTER*KEY*|TOGETHER*KEY*) unset "$name" || true ;;
            esac
          done < <(compgen -v)

          git fetch --quiet origin main
          git checkout --detach origin/main
          SOURCE_HEAD="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          printf '%s\n' "$SOURCE_HEAD" > "$OUT/source-head.txt"
          printf '%s\n' "$SOURCE_TREE" > "$OUT/source-tree.txt"
          git status --porcelain=v1 > "$OUT/source-dirty.txt"
          if [[ -s "$OUT/source-dirty.txt" ]]; then
            printf '{"status":"BLOCKED_SOURCE_DIRTY_AFTER_REENTRY"}\n' > "$OUT/preflight.json"
            exit 0
          fi

          avail_kb="$(df -Pk "${HOME:?}" | awk 'NR==2 {print $4}')"
          printf '{"available_kb":%s}\n' "$avail_kb" > "$OUT/disk.json"
          if [[ "$avail_kb" -lt 5000000 ]]; then
            printf '{"status":"BLOCKED_INSUFFICIENT_FREE_DISK","available_kb":%s}\n' "$avail_kb" > "$OUT/preflight.json"
            exit 0
          fi

          # Promotion-bearing runtime route: activation-derived internal mid-layer executor.
          # The terminal final-norm/lm_head path remains only a technical positive control.
          set +e
          bash tools/trigger1_local_qwen06_internal_layer_api.sh "$OUT/runtime" >"$OUT/launcher.log" 2>&1
          RUN_RC=$?
          set -e
          printf '%s\n' "$RUN_RC" > "$OUT/runtime-rc.txt"

          if [[ -s "$OUT/runtime/trigger1_direct_steering_candidate.json" ]]; then
            set +e
            python3 tools/trigger1_jspace_promotion_gate.py \
              --candidate "$OUT/runtime/trigger1_direct_steering_candidate.json" \
              > "$OUT/promotion-gate.json" 2> "$OUT/promotion-gate.err"
            GATE_RC=$?
            set -e
            printf '%s\n' "$GATE_RC" > "$OUT/gate-rc.txt"
          fi

          SOURCE_HEAD="$SOURCE_HEAD" SOURCE_TREE="$SOURCE_TREE" RUN_RC="$RUN_RC" OUT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out=Path(os.environ['OUT'])
          def load(path):
              try:
                  obj=json.loads(Path(path).read_text(encoding='utf-8'))
                  return obj if isinstance(obj,dict) else {}
              except Exception:
                  return {}
          result=load(out/'runtime/trigger1_local_activation_api_result.json')
          cand=load(out/'runtime/trigger1_direct_steering_candidate.json')
          gate=load(out/'promotion-gate.json')
          preflight=load(out/'preflight.json')
          receipt={
              'schema':'CLAY_TRIGGER1_LOCAL_QWEN06_SELFHOSTED_RUNTIME_PROOF/v1',
              'github_run_id':os.environ.get('GITHUB_RUN_ID'),
              'source_head':os.environ['SOURCE_HEAD'],
              'source_tree':os.environ['SOURCE_TREE'],
              'runtime_exit_code':int(os.environ['RUN_RC']),
              'runtime_route':'ACTIVATION_DERIVED_NONTERMINAL_MIDLAYER',
              'launcher':'tools/trigger1_local_qwen06_internal_layer_api.sh',
              'executor':'tools/trigger1_local_qwen06_midlayer_causal_execute.py',
              'preflight':preflight or None,
              'runtime_schema':result.get('schema'),
              'runtime_status':result.get('status'),
              'runtime_result_sha256':result.get('result_sha256'),
              'model':result.get('model'),
              'model_revision':result.get('model_revision'),
              'checkpoint_sha256':result.get('checkpoint_sha256'),
              'tokenizer_sha256':result.get('tokenizer_sha256'),
              'runtime_build_sha256':result.get('runtime_build_sha256'),
              'device':result.get('device'),
              'selected_gain':result.get('selected_gain'),
              'verdict':result.get('verdict'),
              'api_loopback_only':result.get('api_loopback_only'),
              'zero_provider_billing':result.get('zero_provider_billing'),
              'external_provider_credentials_read':result.get('external_provider_credentials_read'),
              'candidate_controls':cand.get('controls'),
              'candidate_intervention':cand.get('intervention'),
              'candidate_holdout':cand.get('holdout'),
              'promotion_gate':gate or None,
              'canonical_credit_minted':False,
              'whole_entityos_hcu_credit_minted':False,
              'training_credit_minted':False,
          }
          raw=json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          receipt['receipt_sha256']=hashlib.sha256(raw).hexdigest()
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False))
          PY

      - name: Publish bounded Trigger1 runtime receipt to main
        if: always()
        uses: actions/github-script@v7
        env:
          OUT: ${{ env.OUT }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const out = process.env.OUT || `/tmp/clay-trigger1-qwen06-${context.runId}`;
            const p = `${out}/receipt.json`;
            let body;
            if (fs.existsSync(p)) {
              body = fs.readFileSync(p, 'utf8');
            } else {
              body = JSON.stringify({
                schema:'CLAY_TRIGGER1_LOCAL_QWEN06_SELFHOSTED_RUNTIME_PROOF/v1',
                github_run_id:String(context.runId),
                runtime_route:'ACTIVATION_DERIVED_NONTERMINAL_MIDLAYER',
                runtime_status:'WORKFLOW_RESULT_MISSING',
                canonical_credit_minted:false,
                whole_entityos_hcu_credit_minted:false,
                training_credit_minted:false
              }, null, 2) + '\n';
            }
            const path = `research_entity/runtime/trigger1_results/${context.runId}.json`;
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `trigger1(runtime): publish local Qwen proof ${context.runId}`,
              content: Buffer.from(body, 'utf8').toString('base64'),
              branch: 'main'
            });

      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger1-local-qwen06-${{ github.run_id }}
          path: |
            ${{ env.OUT }}/receipt.json
            ${{ env.OUT }}/preflight.json
            ${{ env.OUT }}/disk.json
            ${{ env.OUT }}/source-head.txt
            ${{ env.OUT }}/source-tree.txt
            ${{ env.OUT }}/source-dirty.txt
            ${{ env.OUT }}/runtime-rc.txt
            ${{ env.OUT }}/gate-rc.txt
            ${{ env.OUT }}/promotion-gate.json
            ${{ env.OUT }}/promotion-gate.err
            ${{ env.OUT }}/launcher.log
            ${{ env.OUT }}/runtime/trigger1_local_activation_api_result.json
            ${{ env.OUT }}/runtime/trigger1_direct_steering_candidate.json
          if-no-files-found: warn
          retention-days: 7
