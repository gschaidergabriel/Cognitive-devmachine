name: GWT R6 NVIDIA 4B Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  nvidia-r6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute prose/list reader arm
        run: |
          python tools/nvidia_nim.py --request research_entity/runtime/nvidia_requests/gwt-r6-nvidia-rcwc-reader-20260809T0142p0700.json >/tmp/nvidia-summary-a.json
          python - <<'PY'
          import json
          p='research_entity/runtime/tool_results/gwt-r6-nvidia-rcwc-reader-20260809T0142p0700.json'
          d=json.load(open(p,encoding='utf-8'))
          print('NVIDIA_GWT_R6_ARM_A_STATUS', d.get('status'))
          r=d.get('result') or {}
          print('model=', r.get('model'))
          print('usage=', r.get('usage'))
          print('content=', r.get('content'))
          if d.get('status')!='SUCCESS': raise SystemExit(1)
          PY
      - name: Execute typed ID-bound reader arm
        run: |
          python tools/nvidia_nim.py --request research_entity/runtime/nvidia_requests/gwt-r6-nvidia-rcwc-typed-reader-20260809T0155p0700.json >/tmp/nvidia-summary-b.json
          python - <<'PY'
          import json
          p='research_entity/runtime/tool_results/gwt-r6-nvidia-rcwc-typed-reader-20260809T0155p0700.json'
          d=json.load(open(p,encoding='utf-8'))
          print('NVIDIA_GWT_R6_ARM_B_STATUS', d.get('status'))
          r=d.get('result') or {}
          print('model=', r.get('model'))
          print('usage=', r.get('usage'))
          print('content=', r.get('content'))
          if d.get('status')!='SUCCESS': raise SystemExit(1)
          PY
      - name: Execute deterministic-normalized typed reader arm
        run: |
          python tools/nvidia_nim.py --request research_entity/runtime/nvidia_requests/gwt-r6-nvidia-rcwc-normalized-reader-20260809T0158p0700.json >/tmp/nvidia-summary-c.json
          python - <<'PY'
          import json
          p='research_entity/runtime/tool_results/gwt-r6-nvidia-rcwc-normalized-reader-20260809T0158p0700.json'
          d=json.load(open(p,encoding='utf-8'))
          print('NVIDIA_GWT_R6_ARM_C_STATUS', d.get('status'))
          r=d.get('result') or {}
          print('model=', r.get('model'))
          print('usage=', r.get('usage'))
          print('content=', r.get('content'))
          if d.get('status')!='SUCCESS': raise SystemExit(1)
          PY
