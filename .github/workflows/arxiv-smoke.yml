name: arXiv API smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/arxiv_search.py'
      - '.github/workflows/arxiv-smoke.yml'

permissions:
  contents: write

jobs:
  verify-arxiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify arXiv provider
        run: python tools/arxiv_search.py --smoke-test > /tmp/arxiv-smoke.json

      - name: Write verification receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = json.loads(Path('/tmp/arxiv-smoke.json').read_text())
          out = {
              'schema_version': '1.0',
              'provider': src.get('provider'),
              'tool': src.get('tool'),
              'status': src.get('status'),
              'checked_at': src.get('checked_at'),
              'credential_required': False,
              'verification_endpoint_class': src.get('verification_endpoint_class')
          }
          p = Path('research_entity/runtime/arxiv_verification.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(out, indent=2) + '\n')
          PY

      - name: Commit verification receipt
        run: |
          git config user.name 'rae-runtime-verifier'
          git config user.email 'rae-runtime-verifier@users.noreply.github.com'
          git add research_entity/runtime/arxiv_verification.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record arXiv runtime verification'
          git push
