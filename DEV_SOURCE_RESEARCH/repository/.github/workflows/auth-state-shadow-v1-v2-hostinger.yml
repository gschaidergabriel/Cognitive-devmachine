name: UnifiedDB Auth Shadow V1 V2 Hostinger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth-state-shadow-v1-v2-hostinger.yml'
      - 'research_entity/harness/reference/state_auth_shadow.py'
      - 'research_entity/harness/reference/state_auth_shadow_embedded_v2.py'
      - 'research_entity/harness/reference/test_state_auth_shadow_embedded_v2.py'
      - 'research_entity/harness/reference/benchmark_state_auth_shadow_v1_v2.py'
      - 'research_entity/harness/reference/state_ledger.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unifieddb-auth-shadow-v1-v2-hostinger
  cancel-in-progress: false

jobs:
  compare:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout exact Clay commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Run migration falsifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            research_entity.harness.reference.test_state_ledger_streaming_root \
            research_entity.harness.reference.test_state_auth_shadow_embedded_v2

      - name: Run matched V1 V2 benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research_entity.harness.reference.benchmark_state_auth_shadow_v1_v2 \
            --rows 20000 --updates 30 > /tmp/AUTH_SHADOW_V1_V2.json
          python3 - /tmp/AUTH_SHADOW_V1_V2.json <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p['pass'] is True
          assert p['comparison']['both_rebuild_equivalent'] is True
          assert p['comparison']['both_verify_pass'] is True
          assert p['comparison']['both_tamper_detect'] is True
          print(json.dumps({
            'v1_refresh_p50_ms':p['v1']['steady_state']['shadow_refresh']['p50_ms'],
            'v2_refresh_p50_ms':p['v2']['steady_state']['shadow_refresh']['p50_ms'],
            'v1_page_ratio':p['v1']['bootstrap']['page_ratio'],
            'v2_page_ratio':p['v2']['bootstrap']['page_ratio'],
            'v2_page_overhead_reduction_fraction':p['comparison']['v2_page_overhead_reduction_fraction'],
          },sort_keys=True))
          PY

      - name: Persist matched exact-repo receipt
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          src=/tmp/AUTH_SHADOW_V1_V2.json
          dst=research_entity/unifieddb/receipts/AUTH_STATE_SHADOW_V1_V2_HOSTINGER_LATEST.json
          mkdir -p "$(dirname "$dst")"
          python3 - "$src" "$dst" "$RUN_ID" "$SOURCE_SHA" <<'PY'
          import json,sys
          src,dst,run_id,sha=sys.argv[1:]
          p=json.load(open(src,encoding='utf-8'))
          p['evidence_class']='VERIFIED_REMOTE_EXECUTION_EXACT_CLAY_CHECKOUT'
          p['github_run_id']=run_id
          p['source_commit']=sha
          p['runner']='self-hosted Hostinger Ubuntu/Linux'
          open(dst,'w',encoding='utf-8').write(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'clay-hostinger-runner'
          git config user.email 'clay-hostinger-runner@users.noreply.github.com'
          git add "$dst"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(unifieddb): record auth shadow v1 v2 Hostinger ${RUN_ID} [skip ci]"
          for n in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((n * 2))
          done
          exit 1
