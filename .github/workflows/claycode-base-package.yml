name: ClayCode BASE package linker
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_package_compiler.py'
      - 'tools/claycode_base_package_validation.py'
      - 'research_entity/claycode/base/examples/package_demo/**'
      - 'tools/claycode_base_compiler.py'
      - '.github/workflows/claycode-base-package.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - run: cc --version
      - run: python tools/claycode_base_package_validation.py
      - name: Preserve receipt
        run: |
          git config user.name 'claycode-package-gate'
          git config user.email 'claycode-package-gate@users.noreply.github.com'
          git add research_entity/claycode/autonomous/BASE_PACKAGE_LINK_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record package linker receipt'
          for attempt in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((attempt*2)); done
          exit 1
