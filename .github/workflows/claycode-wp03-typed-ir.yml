name: ClayCode WP03 typed IR gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_typed_ir.py'
      - 'tools/claycode_wp03_typed_ir_validation.py'
      - 'tools/claycode_wp03_ci_runner.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
      - '.github/workflows/claycode-wp03-typed-ir.yml'

concurrency:
  group: claycode-wp03-typed-ir-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  typed-ir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Execute gate while preserving failure evidence
        run: python tools/claycode_wp03_ci_runner.py || true
      - name: Commit WP03 execution and produced receipts
        if: always()
        run: |
          git config user.name 'claycode-wp03-ir'
          git config user.email 'claycode-wp03-ir@users.noreply.github.com'
          for p in \
            research_entity/claycode/autonomous/WP03_CI_EXECUTION_RECEIPT.json \
            research_entity/claycode/autonomous/WP03_STRICT_V7_DEPENDENCY_RECEIPT.json \
            research_entity/claycode/autonomous/WP03_TYPED_IR_RECEIPT.json \
            research_entity/claycode/autonomous/BASE_TYPED_IR_V1.json; do
            test -f "$p" && git add "$p"
          done
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record WP03 CI execution receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
      - name: Enforce WP03 gate result
        if: always()
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/WP03_CI_EXECUTION_RECEIPT.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d.get('overall_pass'), [x for x in d.get('stages', []) if not x.get('pass')]
          print('WP03_TYPED_IR_GATE_PASS')
          PY
