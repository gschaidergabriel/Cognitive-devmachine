name: reference-effect-convergence

on:
  push:
    branches:
      - gpt56sol/go-reference-effect-convergence-20260822b
  pull_request:
    paths:
      - 'tools/clay_profile_pipeline_runtime.py'
      - 'the artefact/blogpost_entity/BLOGPOST_ENTITY.clay'
      - 'the artefact/blogpost_entity/test_blogpost_entity.py'
      - 'the artefact/blogpost_entity/test_profile_file_amputation.py'
      - 'the artefact/blogpost_entity/check_structured_contract_sync.py'
      - '.github/workflows/reference-effect-convergence.yml'

permissions:
  contents: read

jobs:
  focused-reference-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest lark
      - name: Compile reference runtime
        run: python -m py_compile tools/clay_profile_pipeline_runtime.py 'the artefact/blogpost_entity/test_blogpost_entity.py' 'the artefact/blogpost_entity/test_profile_file_amputation.py'
      - name: Enforce Clay-reference contract convergence
        run: python 'the artefact/blogpost_entity/check_structured_contract_sync.py'
      - name: Run ordinary reference regressions
        run: python -m pytest 'the artefact/blogpost_entity/test_blogpost_entity.py' -q
      - name: Run single unusual profile-file amputation discriminator
        run: python -m pytest 'the artefact/blogpost_entity/test_profile_file_amputation.py' -q
