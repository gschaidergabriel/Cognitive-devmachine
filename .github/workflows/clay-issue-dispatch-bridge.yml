name: Clay Bounded Issue Dispatch Bridge

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: read

concurrency:
  group: clay-bounded-issue-dispatch-bridge
  cancel-in-progress: false

jobs:
  dispatch-wp02:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] WP02 strict Hostinger probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bounded persistence lane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Dispatch existing WP02 workflow explicitly
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: claycode-vps-wp02-probe.yml
        run: |
          set -euo pipefail
          body='{"ref":"main"}'
          http_code="$(curl -sS --retry 2 --retry-delay 1 \
            -o /tmp/clay_dispatch_body.txt \
            -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            -d "$body")"
          python3 - "$http_code" <<'PY' > /tmp/CLAY_ACTIONS_DISPATCH_BRIDGE.json
          import json, os, platform, sys
          from datetime import datetime, timezone
          code=sys.argv[1]
          payload={
            'schema_version':'1.0',
            'evidence_class':'REAL_GITHUB_HOSTED_ISSUE_TRIGGER_AND_WORKFLOW_DISPATCH',
            'created_at':datetime.now(timezone.utc).isoformat(),
            'github_repository':os.environ.get('GITHUB_REPOSITORY',''),
            'bridge_github_sha':os.environ.get('GITHUB_SHA',''),
            'bridge_run_id':os.environ.get('GITHUB_RUN_ID',''),
            'bridge_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT',''),
            'issue_number':os.environ.get('GITHUB_EVENT_PATH',''),
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),
            'runner_os':os.environ.get('RUNNER_OS','unknown'),
            'platform':platform.platform(),
            'target_workflow':'claycode-vps-wp02-probe.yml',
            'target_ref':'main',
            'dispatch_http_status':code,
            'dispatch_accepted':code=='204',
            'scope_guard':'A 204 proves only explicit workflow-dispatch acceptance. It does not prove that a self-hosted runner claimed the job or that WP02/WP06 passed.',
            'authority_invariant':'model output != execution authority'
          }
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
          test "$http_code" = 204

      - name: Persist bridge receipt without recursive triggering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_entity/state/system/actions_dispatch
          cp /tmp/CLAY_ACTIONS_DISPATCH_BRIDGE.json research_entity/state/system/actions_dispatch/LATEST.json
          cp /tmp/CLAY_ACTIONS_DISPATCH_BRIDGE.json "research_entity/state/system/actions_dispatch/${GITHUB_RUN_ID}.json"
          git config user.name 'clay-dispatch-bridge'
          git config user.email 'clay-dispatch-bridge@users.noreply.github.com'
          git add research_entity/state/system/actions_dispatch/
          git commit -m "evidence(actions): persist explicit WP02 dispatch ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1

  dispatch-mini-entity-0-7:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] Mini Entity native 0.7 exact repro'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout bounded persistence lane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Dispatch canonical Mini Entity 0.7 gate and observe exact run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: mini-entity-native-0-7-repro.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          workflow=os.environ['TARGET_WORKFLOW']
          api=f'https://api.github.com/repos/{repo}'
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {token}',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'clay-mini-entity-dispatch-bridge',
          }
          def request(method,url,data=None):
              body=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(url,data=body,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read()
                      return r.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as e:
                  raw=e.read()
                  try: payload=json.loads(raw) if raw else None
                  except Exception: payload={'raw':raw.decode('utf-8','replace')}
                  return e.code,payload

          before_status,before=request('GET',f'{api}/actions/workflows/{workflow}/runs?event=workflow_dispatch&branch=main&per_page=10')
          before_ids={int(x['id']) for x in (before or {}).get('workflow_runs',[])} if before_status==200 else set()
          dispatch_at=datetime.now(timezone.utc).isoformat()
          dispatch_status,dispatch_body=request('POST',f'{api}/actions/workflows/{workflow}/dispatches',{'ref':'main'})

          observed=None
          if dispatch_status==204:
              for _ in range(90):
                  status,payload=request('GET',f'{api}/actions/workflows/{workflow}/runs?event=workflow_dispatch&branch=main&per_page=20')
                  if status==200:
                      candidates=[x for x in payload.get('workflow_runs',[]) if int(x['id']) not in before_ids]
                      if candidates:
                          observed=max(candidates,key=lambda x:int(x['id']))
                          break
                  time.sleep(2)

          completed=None
          if observed:
              run_id=int(observed['id'])
              for _ in range(300):
                  status,payload=request('GET',f'{api}/actions/runs/{run_id}')
                  if status==200 and payload.get('status')=='completed':
                      completed=payload
                      break
                  time.sleep(3)

          receipt={
              'schema':'MINI_ENTITY_NATIVE_0_7_DISPATCH_BRIDGE/v1',
              'evidence_class':'REAL_GITHUB_HOSTED_ISSUE_TRIGGER_WORKFLOW_DISPATCH_AND_RUN_OBSERVATION',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'dispatch_at':dispatch_at,
              'bridge_github_sha':os.environ.get('GITHUB_SHA',''),
              'bridge_run_id':os.environ.get('GITHUB_RUN_ID',''),
              'bridge_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT',''),
              'runner_name':os.environ.get('RUNNER_NAME','unknown'),
              'runner_os':os.environ.get('RUNNER_OS','unknown'),
              'target_workflow':workflow,
              'target_ref':'main',
              'dispatch_http_status':dispatch_status,
              'dispatch_accepted':dispatch_status==204,
              'target_run_observed':observed is not None,
              'target_run_id':int(observed['id']) if observed else None,
              'target_head_sha':observed.get('head_sha') if observed else None,
              'target_run_status':completed.get('status') if completed else (observed.get('status') if observed else None),
              'target_run_conclusion':completed.get('conclusion') if completed else None,
              'target_html_url':completed.get('html_url') if completed else (observed.get('html_url') if observed else None),
              'scope_guard':'Dispatch acceptance is not runtime PASS. Runtime credit requires target run completion plus persisted machine receipt from its artifact.',
          }
          pathlib.Path('/tmp/MINI_ENTITY_0_7_DISPATCH_BRIDGE.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')

          if completed and completed.get('conclusion')=='success':
              run_id=int(completed['id'])
              status,arts=request('GET',f'{api}/actions/runs/{run_id}/artifacts?per_page=100')
              if status==200:
                  chosen=next((a for a in arts.get('artifacts',[]) if a.get('name')=='mini-entity-native-0.7-repro' and not a.get('expired')),None)
                  if chosen:
                      import io, zipfile
                      req=urllib.request.Request(chosen['archive_download_url'],method='GET',headers=headers)
                      with urllib.request.urlopen(req,timeout=60) as r:
                          z=zipfile.ZipFile(io.BytesIO(r.read()))
                          names=z.namelist()
                          target=next((n for n in names if n.endswith('MINI_ENTITY_NATIVE_0_7_REPRO_RECEIPT.json')),None)
                          if target:
                              data=json.loads(z.read(target))
                              data['github_actions']={
                                  'run_id':run_id,
                                  'run_attempt':completed.get('run_attempt'),
                                  'head_sha':completed.get('head_sha'),
                                  'event':completed.get('event'),
                                  'html_url':completed.get('html_url'),
                                  'conclusion':completed.get('conclusion'),
                              }
                              pathlib.Path('/tmp/MINI_ENTITY_NATIVE_0_7_REPRO_RECEIPT.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY

      - name: Persist dispatch and exact runtime receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_entity/state/system/actions_dispatch research_entity/receipts
          cp /tmp/MINI_ENTITY_0_7_DISPATCH_BRIDGE.json "research_entity/state/system/actions_dispatch/MINI_ENTITY_0_7_${GITHUB_RUN_ID}.json"
          cp /tmp/MINI_ENTITY_0_7_DISPATCH_BRIDGE.json research_entity/state/system/actions_dispatch/MINI_ENTITY_0_7_LATEST.json
          if test -f /tmp/MINI_ENTITY_NATIVE_0_7_REPRO_RECEIPT.json; then
            cp /tmp/MINI_ENTITY_NATIVE_0_7_REPRO_RECEIPT.json "research_entity/receipts/2026-08-22_MINI_ENTITY_NATIVE_0_7_REPRO_GITHUB_${GITHUB_RUN_ID}.json"
          fi
          git config user.name 'clay-dispatch-bridge'
          git config user.email 'clay-dispatch-bridge@users.noreply.github.com'
          git add research_entity/state/system/actions_dispatch/ research_entity/receipts/
          git commit -m "evidence(actions): persist Mini Entity 0.7 dispatch ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1
