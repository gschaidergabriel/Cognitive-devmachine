name: Clay current research index

on:
  push:
    branches: [main]
    paths-ignore:
      - 'research_entity/00_CURRENT/NOW.md'
      - 'research_entity/00_CURRENT/INDEX.tsv'
      - 'research_entity/00_CURRENT/ACTIVE.tsv'
      - 'research_entity/00_CURRENT/RECENT.tsv'
      - 'research_entity/00_CURRENT/MANIFEST.json'
      - 'research_entity/00_CURRENT/latest/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clay-current-index-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh token-efficient current layer
        run: python3 tools/clay_current_refresh_v1.py
      - name: Commit generated cache if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Clay Current Index'
          git config user.email 'clay-current-index@localhost'
          git add research_entity/00_CURRENT/NOW.md \
                  research_entity/00_CURRENT/INDEX.tsv \
                  research_entity/00_CURRENT/ACTIVE.tsv \
                  research_entity/00_CURRENT/RECENT.tsv \
                  research_entity/00_CURRENT/MANIFEST.json \
                  research_entity/00_CURRENT/latest
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'current: refresh token-efficient research state [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            python3 tools/clay_current_refresh_v1.py
            git add research_entity/00_CURRENT/NOW.md \
                    research_entity/00_CURRENT/INDEX.tsv \
                    research_entity/00_CURRENT/ACTIVE.tsv \
                    research_entity/00_CURRENT/RECENT.tsv \
                    research_entity/00_CURRENT/MANIFEST.json \
                    research_entity/00_CURRENT/latest
            git commit --amend --no-edit
          done
          exit 1
