name: ClayCode BASE compiler vertical slice

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_compiler.py'
      - 'tools/claycode_base_compiler_validation.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - '.github/workflows/claycode-base-compiler-slice.yml'

concurrency:
  group: claycode-base-compiler-slice-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compiler-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Run strict V7 identity regression first
        run: python tools/claycode_v7_frontend_identity_regression.py
      - name: Run integrated typed IR evaluator and native lowering validation
        run: python tools/claycode_base_compiler_validation.py
      - name: Commit compiler-slice receipts
        run: |
          git config user.name 'claycode-base-compiler-slice'
          git config user.email 'claycode-base-compiler-slice@users.noreply.github.com'
          git add \
            research_entity/claycode/autonomous/V7_FRONTEND_IDENTITY_RECEIPT.json \
            research_entity/claycode/autonomous/BASE_TYPED_IR_EVAL_NATIVE_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record integrated BASE compiler slice receipts'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
