name: WP04 Explicit Reward Contract V1

on:
  pull_request:
    branches: ['chatgpt/claycode-wp04-nested-call-path-v2-20260810']
    paths:
      - 'research_entity/claycode/g9/CLAYCODE_FRANK_REWARD_CALLABLE_V1_CANDIDATE.clay'
      - 'tools/claycode_wp04_explicit_contract_anchor_v1.py'
      - 'tools/test_claycode_wp04_explicit_contract_anchor_v1.py'
      - '.github/workflows/wp04-explicit-reward-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clay-wp04-explicit-reward-contract-v1
  cancel-in-progress: false

jobs:
  explicit-contract:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Create isolated dependency environment
        shell: bash
        run: |
          set -euo pipefail
          VENV=/tmp/clay-wp04-explicit-contract-${GITHUB_RUN_ID}
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install 'lark==1.3.1' 'interegular==0.3.3'
          echo "VENV=$VENV" >> "$GITHUB_ENV"
      - name: Compile exact candidate and test bytes
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONSAFEPATH=1
          "$VENV/bin/python" -m py_compile tools/claycode_wp04_explicit_contract_anchor_v1.py tools/test_claycode_wp04_explicit_contract_anchor_v1.py
      - name: Execute explicit contract anchor differential
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONSAFEPATH=1 PYTHONPATH="$GITHUB_WORKSPACE/tools"
          "$VENV/bin/python" tools/test_claycode_wp04_explicit_contract_anchor_v1.py | tee /tmp/clay-wp04-explicit-contract-${GITHUB_RUN_ID}.json
          "$VENV/bin/python" - /tmp/clay-wp04-explicit-contract-${GITHUB_RUN_ID}.json <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='PASS',x
          assert x['scope']=='WP04_EXPLICIT_FRANK_REWARD_CALLABLE_ANCHOR_V1',x
          assert x['baseline_exact_declared_matches']==0,x
          assert x['candidate_exact_declared_matches']==1,x
          assert x['candidate_unresolved_signatures']==25,x
          assert x['effect_boundary_missing_signatures']==1,x
          assert x['contract_params']==[{'name':'evidence','type':'RewardOutcomeEvidence'}],x
          assert x['contract_returns']=='RewardPlasticityReceipt',x
          assert x['contract_effect_class']=='DERIVED_STATE',x
          assert x['concrete_anchor_nodes']==2,x
          assert x['conflicting_components']==0,x
          assert x['dynamic_escape']=='REJECTED_FAIL_CLOSED',x
          assert x['execution_without_binding']=='REJECTED_FAIL_CLOSED',x
          assert x['execution_admitted_calls']==0,x
          assert x['effect_authority']==x['truth_authority']=='NONE',x
          assert x['promotion']=='NONE',x
          print('CLAY_WP04_EXPLICIT_REWARD_CONTRACT_V1=PASS')
          print('CONTRACT_SEMANTIC_HASH='+x['contract_semantic_hash'])
          print('ANCHOR_REPORT_SHA256='+x['anchor_report_sha256'])
          print('ANCHORED_COMPONENTS='+str(x['anchored_components']))
          PY
