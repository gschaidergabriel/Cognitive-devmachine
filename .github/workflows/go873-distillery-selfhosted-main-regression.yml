name: GO873 Distillery self-hosted exact-main regression

on:
  push:
    branches: [main]
    paths:
      - "tools/ingest_forge_accepts_into_distillery.py"
      - "tools/forge_evidence_credit_871.py"
      - "tools/promote_forge_distillery_runtime_gate.py"
      - "tests/test_forge_distillery_replay_identity_873.py"
      - "tests/test_forge_distillery_rebuild_stable_packet_873.py"
      - "tests/test_forge_distillery_live_bridge_871.py"
      - "tests/test_forge_distillery_promotion_872.py"
      - "tests/test_forge_distillery_live_semantic_replay_873.py"
      - ".github/workflows/go873-distillery-selfhosted-main-regression.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: go873-distillery-selfhosted-main
  cancel-in-progress: false

jobs:
  exact-main-regression:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering main
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Bind exact source identity
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
      - name: Compile Distillery bridge and live promoter
        id: compile
        run: python3 -m py_compile tools/ingest_forge_accepts_into_distillery.py tools/forge_evidence_credit_871.py tools/promote_forge_distillery_runtime_gate.py
      - name: Replay identity regression
        id: replay_identity
        run: python3 -m unittest -v tests.test_forge_distillery_replay_identity_873
      - name: Fresh rebuild packet stability regression
        id: rebuild_stability
        run: python3 -m unittest -v tests.test_forge_distillery_rebuild_stable_packet_873
      - name: Existing live bridge wiring regression
        id: live_bridge
        run: python3 -m unittest -v tests.test_forge_distillery_live_bridge_871
      - name: Existing live promotion guards
        id: promotion_guards
        run: python3 -m unittest -v tests.test_forge_distillery_promotion_872
      - name: Live semantic replay and measured-conflict regression
        id: live_semantic_replay
        run: python3 -m unittest -v tests.test_forge_distillery_live_semantic_replay_873
      - name: Persist append-only scoped terminal evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          BIND_OUTCOME: ${{ steps.bind.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          REPLAY_IDENTITY_OUTCOME: ${{ steps.replay_identity.outcome }}
          REBUILD_STABILITY_OUTCOME: ${{ steps.rebuild_stability.outcome }}
          LIVE_BRIDGE_OUTCOME: ${{ steps.live_bridge.outcome }}
          PROMOTION_GUARDS_OUTCOME: ${{ steps.promotion_guards.outcome }}
          LIVE_SEMANTIC_REPLAY_OUTCOME: ${{ steps.live_semantic_replay.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "1")
          head_sha = os.environ["GITHUB_SHA"]
          steps = {
              "checkout": os.environ.get("CHECKOUT_OUTCOME", "unknown"),
              "bind_exact_source_identity": os.environ.get("BIND_OUTCOME", "unknown"),
              "compile": os.environ.get("COMPILE_OUTCOME", "unknown"),
              "replay_identity": os.environ.get("REPLAY_IDENTITY_OUTCOME", "unknown"),
              "rebuild_stability": os.environ.get("REBUILD_STABILITY_OUTCOME", "unknown"),
              "live_bridge": os.environ.get("LIVE_BRIDGE_OUTCOME", "unknown"),
              "promotion_guards": os.environ.get("PROMOTION_GUARDS_OUTCOME", "unknown"),
              "live_semantic_replay": os.environ.get("LIVE_SEMANTIC_REPLAY_OUTCOME", "unknown"),
          }
          all_success = all(value == "success" for value in steps.values())
          receipt = {
              "schema": "CLAY_GO873_DISTILLERY_SELFHOSTED_REGRESSION_RECEIPT/v1",
              "created_at": datetime.now(timezone.utc).isoformat(),
              "authority_epoch": "8.73",
              "program": "ENTITYOS_HCU",
              "product": "EntityOS",
              "architecture": "HCU",
              "mode": "FREE_ONLY",
              "workflow": "go873-distillery-selfhosted-main-regression.yml",
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "run_id": run_id,
              "run_attempt": run_attempt,
              "triggering_head_sha": head_sha,
              "source_scope": "EXACT_TRIGGERING_MAIN",
              "runner": {
                  "name": os.environ.get("RUNNER_NAME"),
                  "os": os.environ.get("RUNNER_OS"),
                  "arch": os.environ.get("RUNNER_ARCH"),
              },
              "steps": steps,
              "classification": (
                  "EXACT_MAIN_DETERMINISTIC_REGRESSION_PASS"
                  if all_success
                  else "EXACT_MAIN_DETERMINISTIC_REGRESSION_NONPASS"
              ),
              "evidence_scope": "FORGE_DISTILLERY_REPLAY_REBUILD_LIVE_PROMOTER_REGRESSION_ONLY",
              "real_safe_forge_accept_observed": False,
              "repository_bound_live_accepted_dataset_tokens_gt_zero_observed": False,
              "credit": {
                  "whole_entityos_hcu_runtime_credit": 0,
                  "hcu_full_runtime_credit": 0,
                  "jspace_model_runtime_credit": 0,
                  "training_credit": 0,
                  "whole_product_pass": False,
              },
              "scope_guard": (
                  "A successful receipt proves only exact-head deterministic regression execution. "
                  "It does not by itself prove a real repository-bound Safe-Forge ACCEPT, model/J-Space causality, training, or whole-product PASS."
              ),
          }
          raw = (json.dumps(receipt, sort_keys=True, indent=2) + "\n").encode("utf-8")
          path = f"research_entity/runtime/distillery_selfhosted/run-{run_id}-attempt-{run_attempt}.json"
          url = f"https://api.github.com/repos/{repo}/contents/{path}"
          payload = json.dumps({
              "message": f"evidence(go873): persist self-hosted Distillery regression {run_id}/{run_attempt} [skip ci]",
              "content": base64.b64encode(raw).decode("ascii"),
              "branch": "main",
          }).encode("utf-8")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "clay-go873-distillery-selfhosted-evidence",
              "Content-Type": "application/json",
          }
          last_error = None
          for attempt in range(1, 7):
              req = urllib.request.Request(url, data=payload, method="PUT", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = json.loads(response.read() or b"{}")
                      if response.status in (200, 201):
                          print(json.dumps({
                              "persisted": True,
                              "path": path,
                              "commit_sha": (body.get("commit") or {}).get("sha"),
                              "classification": receipt["classification"],
                          }, sort_keys=True))
                          raise SystemExit(0)
                      last_error = f"HTTP_{response.status}"
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  last_error = f"HTTP_{exc.code}:{body[:500]}"
                  if exc.code not in (409, 422):
                      break
              time.sleep(attempt * 2)
          print(json.dumps({"persisted": False, "path": path, "error": last_error}, sort_keys=True))
          raise SystemExit(1)
          PY
