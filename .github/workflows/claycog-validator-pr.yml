name: claycog-validator-pr

on:
  pull_request:
    paths:
      - 'the artefact/blogpost_entity/mini_cognition/**'
      - '.github/workflows/claycog-validator-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claycog-validator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Record source identity
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$GITHUB_SHA"
          git rev-parse HEAD
          git status --short
      - name: Run strict ClayCode admission regression
        run: |
          set -euo pipefail
          python3 'the artefact/blogpost_entity/mini_cognition/test_validate_sft_v1.py'
      - name: Compile cognition campaign sources
        run: |
          set -euo pipefail
          python3 -m py_compile \
            'the artefact/blogpost_entity/mini_cognition/generate_sft_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/validate_sft_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/generate_eval_ood_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/eval_outputs_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/launch_together_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/test_launch_together_safety_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/test_eval_outputs_gate_v1.py'
      - name: Run Together safety regressions
        run: |
          set -euo pipefail
          python3 'the artefact/blogpost_entity/mini_cognition/test_launch_together_safety_v1.py'
      - name: Regenerate and validate SFT corpus
        run: |
          set -euo pipefail
          python3 'the artefact/blogpost_entity/mini_cognition/generate_sft_v1.py'
          python3 'the artefact/blogpost_entity/mini_cognition/validate_sft_v1.py' 'the artefact/blogpost_entity/mini_cognition/train_v1.jsonl'
          python3 'the artefact/blogpost_entity/mini_cognition/validate_sft_v1.py' 'the artefact/blogpost_entity/mini_cognition/validation_v1.jsonl'
      - name: Generate and inspect structural OOD
        run: |
          set -euo pipefail
          python3 'the artefact/blogpost_entity/mini_cognition/generate_eval_ood_v1.py'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('the artefact/blogpost_entity/mini_cognition/eval_ood_v1.jsonl')
          rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          amp=[x for x in rows if x['family']=='tool_vocabulary_amputation_ood']
          seen={'calendar.create','mail.send','db.lookup','http.get','artifact.write','queue.publish'}
          assert len(rows)==240 and len(amp)==40
          for row in amp:
              must='\n'.join(row['must_contain'])
              assert not any(op in must for op in seen)
              assert all(op in row['must_not_contain'] for op in seen)
              assert must.count('omega_arg(w,')>=2
              assert 'omega_schema(w,' in must
              assert all(f'omega_validate(w,"{g}")' in must for g in ('grammar','types','schema','authority','generation'))
          print(json.dumps({'ood_cases':len(rows),'amputation_cases':len(amp),'sft_seen_overlap':0}))
          PY
      - name: Run anti-Goodhart promotion regression
        run: |
          set -euo pipefail
          python3 'the artefact/blogpost_entity/mini_cognition/test_eval_outputs_gate_v1.py'
      - name: Verify template admission precedes network-capable Together object
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('the artefact/blogpost_entity/mini_cognition/launch_together_v1.py').read_text()
          assert 'TEMPLATE=os.environ.get("CLAYCOG_TOGETHER_TEMPLATE","").strip()' in p
          assert 'Qwen/Qwen2.5-7B-Instruct-Turbo' not in p
          gate='\n    require_compatible_template_claim()\n    fingerprint=campaign_fingerprint(hf_model)'
          sdk='\n    from together import Together\n'
          upload='\n    train_file=client.files.upload'
          assert gate in p and sdk in p and upload in p
          assert p.index(gate)<p.index(sdk)<p.index(upload)
          print('template admission precedes Together SDK construction and upload')
          PY
