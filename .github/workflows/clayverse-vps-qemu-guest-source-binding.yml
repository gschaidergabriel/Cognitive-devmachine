name: ClayVerse VPS QEMU guest source binding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clayverse-vps-qemu-guest-source-binding.yml'

permissions:
  contents: read

concurrency:
  group: clayverse-vps-qemu-guest-source-binding
  cancel-in-progress: false

env:
  CLAYVERSE_RESEARCH_SHA: 9dd7da1c7f1d2acf29142a74effd2b51282661f7
  CLAYVERSE_RESEARCH_TREE: 47c09ff6d661b3da02743435dd8a343ddef85efd
  CLAYVERSE_UBUNTU_IMAGE_SHA256: d1940f7d69d343355e183dff1e08a59852d32e7309baa7a4bad8365b11b005ac

jobs:
  guest-source-binding:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - name: Stage exact immutable ClayVerse candidate bytes only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CLAYVERSE_RESEARCH_SHA }}
          path: immutable-candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source and create immutable candidate archive
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work="/tmp/clayverse-guest-source-${GITHUB_RUN_ID}"
          mkdir -p "$work"
          actual_sha=$(git -C immutable-candidate rev-parse HEAD)
          actual_tree=$(git -C immutable-candidate show -s --format=%T HEAD)
          test "$actual_sha" = "$CLAYVERSE_RESEARCH_SHA"
          test "$actual_tree" = "$CLAYVERSE_RESEARCH_TREE"
          git -C immutable-candidate archive --format=tar.gz --prefix=clayverse-candidate/ \
            -o "$work/clayverse-candidate.tar.gz" HEAD -- 'the artefact'
          payload_sha=$(sha256sum "$work/clayverse-candidate.tar.gz" | awk '{print $1}')
          payload_size=$(stat -c %s "$work/clayverse-candidate.tar.gz")
          printf '%s' "$payload_sha" | grep -Eq '^[0-9a-f]{64}$'
          test "$payload_size" -gt 1024
          {
            printf 'CLAYVERSE_GUEST_SOURCE_WORK=%s\n' "$work"
            printf 'CLAYVERSE_GUEST_SOURCE_PAYLOAD_SHA256=%s\n' "$payload_sha"
            printf 'CLAYVERSE_GUEST_SOURCE_PAYLOAD_BYTES=%s\n' "$payload_size"
          } >> "$GITHUB_ENV"
          printf 'SOURCE_SHA=%s\nSOURCE_TREE=%s\nPAYLOAD_SHA256=%s\nPAYLOAD_BYTES=%s\n' \
            "$actual_sha" "$actual_tree" "$payload_sha" "$payload_size"

      - name: Resolve rootless QEMU and ISO tooling without host mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          root="/tmp/clayverse-qemu-source-root-${GITHUB_RUN_ID}"
          mkdir -p "$root"
          if command -v qemu-system-x86_64 >/dev/null 2>&1; then
            qemu=$(command -v qemu-system-x86_64)
            datadir=''
            libpath=''
            bios=''
            source='HOST_PREINSTALLED_ORCHESTRATION_TOOL'
          else
            debs="$root/debs"
            fsroot="$root/rootfs"
            mkdir -p "$debs" "$fsroot"
            python3 - "$root/packages.txt" <<'PY'
          import re, subprocess, sys
          out=sys.argv[1]
          seeds=['qemu-system-x86','qemu-system-data','seabios']
          seen=set(); queue=list(seeds); needed=[]
          def installed(pkg):
              p=subprocess.run(['dpkg-query','-W','-f=${Status}',pkg],text=True,capture_output=True)
              return p.returncode==0 and p.stdout.strip()=='install ok installed'
          while queue:
              pkg=queue.pop(0).split(':',1)[0]
              if not re.fullmatch(r'[a-z0-9][a-z0-9+.-]+',pkg) or pkg in seen:
                  continue
              seen.add(pkg)
              if pkg not in seeds and installed(pkg):
                  continue
              policy=subprocess.run(['apt-cache','policy',pkg],text=True,capture_output=True)
              if policy.returncode!=0 or 'Candidate: (none)' in policy.stdout:
                  continue
              needed.append(pkg)
              deps=subprocess.run(['apt-cache','depends','--no-recommends','--no-suggests','--no-conflicts','--no-breaks','--no-replaces','--no-enhances',pkg],text=True,capture_output=True,check=True).stdout
              for line in deps.splitlines():
                  m=re.match(r'\s*(?:Pre)?Depends:\s+([^\s]+)',line)
                  if not m: continue
                  dep=m.group(1).strip('<>').split(':',1)[0]
                  if re.fullmatch(r'[a-z0-9][a-z0-9+.-]+',dep): queue.append(dep)
          if not all(seed in needed or installed(seed) for seed in seeds):
              raise SystemExit('ROOTLESS_QEMU_PACKAGE_RESOLUTION_INCOMPLETE')
          open(out,'w').write('\n'.join(needed)+'\n')
          print('ROOTLESS_QEMU_PACKAGES='+str(len(needed)))
          PY
            mapfile -t packages < "$root/packages.txt"
            (
              cd "$debs"
              for pkg in "${packages[@]}"; do apt-get download "$pkg" >/dev/null; done
            )
            shopt -s nullglob
            archives=("$debs"/*.deb)
            test "${#archives[@]}" -gt 0
            for deb in "${archives[@]}"; do dpkg-deb -x "$deb" "$fsroot"; done
            qemu="$fsroot/usr/bin/qemu-system-x86_64"
            test -x "$qemu"
            datadir="$fsroot/usr/share/qemu"
            libpath="$fsroot/usr/lib/x86_64-linux-gnu:$fsroot/lib/x86_64-linux-gnu:$fsroot/usr/lib64:$fsroot/lib64"
            bios="$(find "$fsroot/usr/share" -type f \( -name 'bios-256k.bin' -o -name 'bios.bin' \) -print -quit)"
            test -r "$bios"
            source='ROOTLESS_APT_DOWNLOAD_DPKG_EXTRACT_TO_TMP'
          fi

          if command -v genisoimage >/dev/null 2>&1; then
            iso=$(command -v genisoimage)
            iso_source='HOST_PREINSTALLED_ORCHESTRATION_TOOL'
          else
            iso_root="$root/iso"
            mkdir -p "$iso_root/debs" "$iso_root/rootfs"
            (
              cd "$iso_root/debs"
              apt-get download genisoimage >/dev/null
            )
            deb=$(find "$iso_root/debs" -maxdepth 1 -name 'genisoimage_*.deb' -print -quit)
            test -n "$deb"
            dpkg-deb -x "$deb" "$iso_root/rootfs"
            iso="$iso_root/rootfs/usr/bin/genisoimage"
            test -x "$iso"
            iso_source='ROOTLESS_APT_DOWNLOAD_DPKG_EXTRACT_TO_TMP'
          fi

          {
            printf 'CLAYVERSE_QEMU_BIN=%s\n' "$qemu"
            printf 'CLAYVERSE_QEMU_DATADIR=%s\n' "$datadir"
            printf 'CLAYVERSE_QEMU_LIBPATH=%s\n' "$libpath"
            printf 'CLAYVERSE_QEMU_BIOS=%s\n' "$bios"
            printf 'CLAYVERSE_QEMU_TOOL_SOURCE=%s\n' "$source"
            printf 'CLAYVERSE_GENISOIMAGE_BIN=%s\n' "$iso"
            printf 'CLAYVERSE_GENISOIMAGE_SOURCE=%s\n' "$iso_source"
          } >> "$GITHUB_ENV"
          if [ -n "$libpath" ]; then
            LD_LIBRARY_PATH="$libpath${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              QEMU_MODULE_DIR="$root/rootfs/usr/lib/x86_64-linux-gnu/qemu" "$qemu" --version | head -n1
          else
            "$qemu" --version | head -n1
          fi
          "$iso" --version 2>&1 | head -n2

      - name: Boot networkless guest and verify candidate inside guest only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work="$CLAYVERSE_GUEST_SOURCE_WORK"
          qroot="/tmp/clayverse-qemu-source-root-${GITHUB_RUN_ID}"
          receipt="/tmp/clayverse-qemu-guest-source-${GITHUB_RUN_ID}.json"
          serial="$work/serial.log"
          base="$work/ubuntu-noble-amd64.base.img"
          guest="$work/ubuntu-noble-amd64.guest.img"
          seed="$work/seed"
          seed_iso="$work/cidata.iso"
          base_url='https://cloud-images.ubuntu.com/releases/noble/release-20260725'
          image_name='ubuntu-24.04-server-cloudimg-amd64.img'
          mkdir -p "$seed"

          cat > "$seed/meta-data" <<'META'
          instance-id: clayverse-qemu-source-binding
          local-hostname: clayverse-qemu-source
          META

          python3 - "$seed/user-data" "$CLAYVERSE_GUEST_SOURCE_PAYLOAD_SHA256" "$CLAYVERSE_RESEARCH_SHA" "$CLAYVERSE_RESEARCH_TREE" <<'PY'
          import pathlib, sys
          out,payload_sha,research_sha,research_tree=sys.argv[1:]
          script=f'''#!/bin/bash
          set -Eeuo pipefail
          exec >/dev/ttyS0 2>&1
          echo CLAYVERSE_GUEST_SOURCE_PROBE_BEGIN
          mkdir -p /mnt/cidata /opt/clayverse-probe
          mount -o ro LABEL=cidata /mnt/cidata
          printf '%s  %s\\n' '{payload_sha}' /mnt/cidata/clayverse-candidate.tar.gz | sha256sum -c -
          tar -xzf /mnt/cidata/clayverse-candidate.tar.gz -C /opt/clayverse-probe
          root='/opt/clayverse-probe/clayverse-candidate/the artefact'
          test -f "$root/manifest.json"
          test -f "$root/Dockerfile"
          test -f "$root/SOURCE_LOCK.json"
          python3 -m compileall -q "$root/clayverse"
          python3 - "$root" <<'INNER'
          import ast,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['artifact']=='ClayVerse'
          assert manifest['release_form']=='ONE_OCI_DOCKER_COMPATIBLE_CONTAINER_IMAGE'
          assert manifest['users']==['gabriel','andreas']
          assert manifest['rights']=='equal'
          tree=ast.parse((root/'clayverse'/'identity.py').read_text())
          canonical=None
          for node in tree.body:
              if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='CANONICAL_USERS' for t in node.targets):
                  canonical=ast.literal_eval(node.value)
                  break
          assert canonical==(('gabriel','Gabriel','clayverse-gabriel'),('andreas','Andreas','clayverse-andreas'))
          print('CLAYVERSE_GUEST_MANIFEST_IDENTITY_PASS')
          INNER
          echo 'CLAYVERSE_GUEST_SOURCE_BINDING_PASS research_sha={research_sha} research_tree={research_tree} payload_sha256={payload_sha}'
          sync
          poweroff -f || true
          '''
          pathlib.Path(out).write_text(script)
          PY
          chmod 0600 "$seed/user-data" "$seed/meta-data"
          cp "$work/clayverse-candidate.tar.gz" "$seed/clayverse-candidate.tar.gz"
          "$CLAYVERSE_GENISOIMAGE_BIN" -quiet -output "$seed_iso" -volid cidata -joliet -rock \
            "$seed/user-data" "$seed/meta-data" "$seed/clayverse-candidate.tar.gz"
          seed_sha=$(sha256sum "$seed_iso" | awk '{print $1}')
          printf '%s' "$seed_sha" | grep -Eq '^[0-9a-f]{64}$'

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$base_url/$image_name" -o "$base"
          printf '%s  %s\n' "$CLAYVERSE_UBUNTU_IMAGE_SHA256" "$base" | sha256sum -c -
          chmod 0444 "$base" "$seed_iso"
          cp --reflink=auto "$base" "$guest"
          chmod 0600 "$guest"

          qemu="$CLAYVERSE_QEMU_BIN"
          qemu_pid=''
          cleanup() {
            rc=$?
            if [ -n "$qemu_pid" ]; then
              kill -TERM "$qemu_pid" 2>/dev/null || true
              sleep 1
              kill -KILL "$qemu_pid" 2>/dev/null || true
            fi
            rm -rf "$work" "$qroot"
            exit "$rc"
          }
          trap cleanup EXIT INT TERM

          export LD_LIBRARY_PATH="$CLAYVERSE_QEMU_LIBPATH${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          if [ -n "$CLAYVERSE_QEMU_DATADIR" ]; then
            qemu_data=(-L "$CLAYVERSE_QEMU_DATADIR")
            export QEMU_MODULE_DIR="$qroot/rootfs/usr/lib/x86_64-linux-gnu/qemu"
          else
            qemu_data=()
          fi
          if [ -n "$CLAYVERSE_QEMU_BIOS" ]; then qemu_bios=(-bios "$CLAYVERSE_QEMU_BIOS"); else qemu_bios=(); fi
          qemu_version=$("$qemu" --version | head -n1)
          "$qemu" "${qemu_data[@]}" "${qemu_bios[@]}" -accel tcg,thread=multi -machine q35 -cpu max -smp 2 -m 2048 \
            -drive "file=$guest,if=virtio,format=qcow2,cache=unsafe" \
            -drive "file=$seed_iso,if=virtio,format=raw,readonly=on" \
            -net none -vga none -display none -monitor none -serial "file:$serial" -no-reboot \
            -sandbox on,obsolete=deny,elevateprivileges=deny,spawn=deny,resourcecontrol=deny &
          qemu_pid=$!

          kernel_marker=''
          source_marker=''
          deadline=$((SECONDS+420))
          while kill -0 "$qemu_pid" 2>/dev/null && [ "$SECONDS" -lt "$deadline" ]; do
            if [ -f "$serial" ]; then
              kernel_marker=$(grep -aE 'Linux version [^ ]+' "$serial" | head -n1 || true)
              source_marker=$(grep -aF 'CLAYVERSE_GUEST_SOURCE_BINDING_PASS ' "$serial" | tail -n1 || true)
              if [ -n "$source_marker" ]; then break; fi
            fi
            sleep 2
          done
          source_pass=false
          if [ -n "$source_marker" ]; then source_pass=true; fi
          if [ "$source_pass" = true ]; then
            kill -TERM "$qemu_pid" 2>/dev/null || true
            for _ in $(seq 1 10); do kill -0 "$qemu_pid" 2>/dev/null || break; sleep 1; done
            kill -KILL "$qemu_pid" 2>/dev/null || true
          fi
          qemu_rc=0
          wait "$qemu_pid" 2>/dev/null || qemu_rc=$?
          qemu_pid=''
          test -f "$serial"
          serial_sha=$(sha256sum "$serial" | awk '{print $1}')
          manifest_pass=false
          if grep -aFq 'CLAYVERSE_GUEST_MANIFEST_IDENTITY_PASS' "$serial"; then manifest_pass=true; fi

          python3 - "$receipt" "$seed_sha" "$serial_sha" "$qemu_rc" "$source_pass" "$manifest_pass" "$qemu_version" "$kernel_marker" "$source_marker" <<'PY'
          import json,os,pathlib,sys
          out,seed_sha,serial_sha,qemu_rc,source_pass,manifest_pass,qemu_version,kernel_marker,source_marker=sys.argv[1:]
          payload={
            'schema':'ClayVerseVpsQemuGuestSourceBinding/v1',
            'workflow_sha':os.environ.get('GITHUB_SHA',''),
            'run_id':os.environ.get('GITHUB_RUN_ID',''),
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),
            'research_sha':os.environ['CLAYVERSE_RESEARCH_SHA'],
            'research_tree':os.environ['CLAYVERSE_RESEARCH_TREE'],
            'candidate_archive_sha256':os.environ['CLAYVERSE_GUEST_SOURCE_PAYLOAD_SHA256'],
            'candidate_archive_bytes':int(os.environ['CLAYVERSE_GUEST_SOURCE_PAYLOAD_BYTES']),
            'seed_iso_sha256':seed_sha,
            'guest_base_sha256':os.environ['CLAYVERSE_UBUNTU_IMAGE_SHA256'],
            'guest_kernel_marker':kernel_marker or None,
            'guest_source_marker':source_marker or None,
            'independent_guest_kernel_observed':bool(kernel_marker),
            'guest_source_binding_pass':source_pass=='true',
            'guest_manifest_identity_pass':manifest_pass=='true',
            'guest_python_compileall_pass':source_pass=='true',
            'guest_network_mode':'NONE',
            'product_code_executed_on_host':False,
            'host_docker_used':False,
            'privileged_host_mutation_used':False,
            'qemu_tool_source':os.environ['CLAYVERSE_QEMU_TOOL_SOURCE'],
            'iso_tool_source':os.environ['CLAYVERSE_GENISOIMAGE_SOURCE'],
            'qemu_version':qemu_version,
            'qemu_sandbox':'on,obsolete=deny,elevateprivileges=deny,spawn=deny,resourcecontrol=deny',
            'serial_log_sha256':serial_sha,
            'qemu_exit_status_after_bounded_termination':int(qemu_rc),
            'classification':'GUEST_RESIDENT_EXACT_SOURCE_BINDING_AND_STATIC_COMPILE_ONLY',
            'clayverse_oci_runtime_credit':0,
            'whole_product_credit':0,
            'final_hardware_microvm_credit':0,
            'unusual_experiment_count_added':0,
          }
          pathlib.Path(out).write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,sort_keys=True))
          if not (payload['independent_guest_kernel_observed'] and payload['guest_source_binding_pass'] and payload['guest_manifest_identity_pass']):
              raise SystemExit(43)
          PY

      - name: Upload bounded guest source-binding receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clayverse-vps-qemu-guest-source-${{ github.run_id }}
          path: /tmp/clayverse-qemu-guest-source-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 7
