name: Clay Actions Heartbeat
# GO transport probe 2026-08-10T06:34+07:00 after identity-guard repair
# 2026-08-24 bounded Trigger-1 local Qwen06 runtime discriminator; remove after receipt capture.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clay-actions-heartbeat.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clay-actions-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout constrained hosted lane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Verify Clay repository token and record hosted execution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p research_entity/state/system/actions_heartbeat
          repo_code="$(curl -sS --retry 2 --retry-delay 1 \
            -o /tmp/clay_repo_meta.json \
            -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
          python3 - "$repo_code" <<'PY' > research_entity/state/system/actions_heartbeat/LATEST.json
          import json, os, platform, socket, sys
          from datetime import datetime, timezone
          code=sys.argv[1]
          payload={
            'schema_version':'1.0',
            'evidence_class':'REAL_GITHUB_HOSTED_UBUNTU_EXECUTION',
            'purpose':'Distinguish Clay-repository Actions execution from self-hosted runner availability/scope.',
            'created_at':datetime.now(timezone.utc).isoformat(),
            'github_repository':os.environ.get('GITHUB_REPOSITORY',''),
            'github_sha':os.environ.get('GITHUB_SHA',''),
            'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
            'github_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT',''),
            'event_name':os.environ.get('GITHUB_EVENT_NAME',''),
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),
            'runner_os':os.environ.get('RUNNER_OS','unknown'),
            'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
            'hostname':socket.gethostname(),
            'platform':platform.platform(),
            'repository_api_http_status':code,
            'repository_token_access':code=='200',
            'pass':code=='200',
            'authority_invariant':'model output != execution authority',
            'scope_guard':'A PASS proves only GitHub-hosted Actions execution and caller-repository token visibility. It does not prove Hostinger runner scope, WP02/WP06 correctness, or Andreas target acceptance.'
          }
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
          python3 - <<'PY'
          import json
          p=json.load(open('research_entity/state/system/actions_heartbeat/LATEST.json',encoding='utf-8'))
          assert p['pass'] is True,p
          assert p['github_repository']=='gschaidergabriel/clay-global-research-entity',p
          print('CLAY_ACTIONS_HOSTED_HEARTBEAT=PASS')
          PY

      - name: Persist immutable run receipt and latest pointer
        shell: bash
        run: |
          set -euo pipefail
          cp research_entity/state/system/actions_heartbeat/LATEST.json \
             "research_entity/state/system/actions_heartbeat/${GITHUB_RUN_ID}.json"
          git config user.name 'clay-actions-heartbeat'
          git config user.email 'clay-actions-heartbeat@users.noreply.github.com'
          git add research_entity/state/system/actions_heartbeat/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "evidence(actions): persist Clay hosted heartbeat ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1

  trigger1-local-qwen06:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity'
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout exact Trigger-1 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Guard source identity and storage headroom
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          observed_head="$(git rev-parse HEAD)"
          dirty="$(git status --porcelain=v1)"
          avail_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          status='PASS'
          if [[ "$observed_head" != "$GITHUB_SHA" ]]; then
            status='BLOCKED_SOURCE_HEAD_MISMATCH'
          elif [[ -n "$dirty" ]]; then
            status='BLOCKED_SOURCE_DIRTY_AFTER_CHECKOUT'
          elif [[ "$avail_kib" -lt 6291456 ]]; then
            status='BLOCKED_INSUFFICIENT_FREE_DISK'
          fi
          preflight="${RUNNER_TEMP:-/tmp}/clay-trigger1-qwen06-preflight-${GITHUB_RUN_ID}.json"
          STATUS="$status" OBSERVED_HEAD="$observed_head" AVAILABLE_KIB="$avail_kib" PREFLIGHT="$preflight" python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload={
              'schema':'CLAY_TRIGGER1_LOCAL_QWEN06_PREFLIGHT/v1',
              'github_run_id':os.environ.get('GITHUB_RUN_ID'),
              'github_sha':os.environ.get('GITHUB_SHA'),
              'observed_head':os.environ['OBSERVED_HEAD'],
              'source_dirty':bool(os.popen('git status --porcelain=v1').read().strip()),
              'available_kib':int(os.environ['AVAILABLE_KIB']),
              'required_kib':6291456,
              'status':os.environ['STATUS'],
              'canonical_credit_minted':False,
              'whole_entityos_hcu_credit_minted':False,
              'jspace_model_runtime_credit_minted':False,
              'training_credit_minted':False,
          }
          Path(os.environ['PREFLIGHT']).write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload,sort_keys=True))
          PY
          echo "path=$preflight" >> "$GITHUB_OUTPUT"
          if [[ "$status" == 'PASS' ]]; then
            echo 'admitted=true' >> "$GITHUB_OUTPUT"
            sha256sum tools/trigger1_local_qwen06_activation_api_execute.py
            python3 --version
            echo "CLAY_TRIGGER1_QWEN06_PREFLIGHT=PASS"
          else
            echo 'admitted=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Persist exact blocked preflight receipt
        if: steps.preflight.outputs.admitted != 'true'
        uses: actions/github-script@v7
        env:
          PREFLIGHT_PATH: ${{ steps.preflight.outputs.path }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.PREFLIGHT_PATH, 'utf8');
            const path = `research_entity/runtime/local_qwen06/actions/${context.runId}-preflight.json`;
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `evidence(trigger1): persist blocked Qwen06 preflight ${context.runId} [skip ci]`,
              content: Buffer.from(body, 'utf8').toString('base64'),
              branch: 'main'
            });

      - name: Fail closed when Qwen06 preflight is blocked
        if: steps.preflight.outputs.admitted != 'true'
        shell: bash
        run: exit 1

      - name: Prepare isolated zero-cost Python runtime
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          VENV="${RUNNER_TEMP:-/tmp}/clay-trigger1-qwen06-${GITHUB_RUN_ID}"
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check --no-input --upgrade pip
          "$VENV/bin/python" -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
          "$VENV/bin/python" -m pip install --disable-pip-version-check --no-input \
            'transformers>=4.51,<5' 'huggingface_hub>=0.30,<1' 'safetensors>=0.5,<1'
          "$VENV/bin/python" - <<'PY'
          import torch, transformers, huggingface_hub
          print('torch', torch.__version__)
          print('transformers', transformers.__version__)
          print('huggingface_hub', huggingface_hub.__version__)
          PY
          echo "venv=$VENV" >> "$GITHUB_OUTPUT"

      - name: Execute exact local loopback hidden-state control family
        id: experiment
        shell: bash
        env:
          VENV: ${{ steps.deps.outputs.venv }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP:-/tmp}/clay-trigger1-qwen06-out-${GITHUB_RUN_ID}"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          set +e
          env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u NVIDIA_API_KEY -u OPENROUTER_API_KEY \
              -u GROQ_API_KEY -u TOGETHER_API_KEY -u HF_TOKEN \
              "$VENV/bin/python" tools/trigger1_local_qwen06_activation_api_execute.py \
              --output-dir "$OUT" \
              --cache-dir "${HOME}/.cache/huggingface"
          rc=$?
          set -e
          test -f "$OUT/trigger1_local_activation_api_result.json"
          echo "$rc" > "$OUT/exit_code.txt"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat "$OUT/trigger1_local_activation_api_result.json"

      - name: Bind GitHub runner and exact-source identity into durable receipt
        shell: bash
        env:
          OUT: ${{ steps.experiment.outputs.out }}
          EXPERIMENT_RC: ${{ steps.experiment.outputs.rc }}
        run: |
          set -euo pipefail
          DEST='research_entity/runtime/local_qwen06/actions'
          mkdir -p "$DEST"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          from datetime import datetime, timezone
          out=pathlib.Path(os.environ['OUT'])
          result=json.loads((out/'trigger1_local_activation_api_result.json').read_text())
          candidate_path=out/'trigger1_direct_steering_candidate.json'
          candidate=json.loads(candidate_path.read_text()) if candidate_path.exists() else None
          def sha(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          receipt={
              'schema':'CLAY_TRIGGER1_LOCAL_QWEN06_GITHUB_SELFHOSTED_RECEIPT/v1',
              'evidence_class':'REAL_SELF_HOSTED_LOCAL_QWEN06_HIDDEN_STATE_RUNTIME',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'github_repository':os.environ.get('GITHUB_REPOSITORY'),
              'github_sha':os.environ.get('GITHUB_SHA'),
              'github_run_id':os.environ.get('GITHUB_RUN_ID'),
              'github_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'runner_name':os.environ.get('RUNNER_NAME'),
              'runner_os':os.environ.get('RUNNER_OS'),
              'runner_arch':os.environ.get('RUNNER_ARCH'),
              'platform':platform.platform(),
              'repo_head_observed':git('rev-parse','HEAD'),
              'repo_tree_observed':git('rev-parse','HEAD^{tree}'),
              'repo_dirty_before_persist':bool(git('status','--porcelain=v1')),
              'executor_path':'tools/trigger1_local_qwen06_activation_api_execute.py',
              'executor_sha256':sha('tools/trigger1_local_qwen06_activation_api_execute.py'),
              'workflow_path':'.github/workflows/clay-actions-heartbeat.yml',
              'workflow_sha256':sha('.github/workflows/clay-actions-heartbeat.yml'),
              'experiment_exit_code':int(os.environ['EXPERIMENT_RC']),
              'external_llm_credentials_explicitly_unset':[ 'OPENAI_API_KEY','ANTHROPIC_API_KEY','NVIDIA_API_KEY','OPENROUTER_API_KEY','GROQ_API_KEY','TOGETHER_API_KEY','HF_TOKEN' ],
              'zero_paid_provider_calls_by_experiment_design':True,
              'result':result,
              'promotion_candidate':candidate,
              'scope_guard':'This receipt proves only the exact local Qwen3-0.6B Trigger-1 experiment at the bound GitHub/source/runtime identities. It does not mint whole EntityOS/HCU, full J-Space, or training credit.'
          }
          material=json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          receipt['receipt_sha256']=hashlib.sha256(material).hexdigest()
          dest=pathlib.Path('research_entity/runtime/local_qwen06/actions')
          dest.mkdir(parents=True,exist_ok=True)
          run_id=os.environ['GITHUB_RUN_ID']
          text=json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n'
          (dest/f'{run_id}.json').write_text(text)
          (dest/'LATEST.json').write_text(text)
          print(json.dumps({'status':result.get('status'),'run_id':run_id,'receipt_sha256':receipt['receipt_sha256']},sort_keys=True))
          PY

      - name: Persist exact runtime receipt
        shell: bash
        env:
          EXPERIMENT_RC: ${{ steps.experiment.outputs.rc }}
        run: |
          set -euo pipefail
          git config user.name 'clay-trigger1-qwen06-runner'
          git config user.email 'clay-trigger1-qwen06-runner@users.noreply.github.com'
          git add research_entity/runtime/local_qwen06/actions/
          git commit -m "evidence(trigger1): local Qwen06 runtime ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done
          case "$EXPERIMENT_RC" in
            0|2) exit 0 ;;
            *) exit 1 ;;
          esac

      - name: Clean temporary Python environment
        if: always()
        shell: bash
        env:
          VENV: ${{ steps.deps.outputs.venv }}
          OUT: ${{ steps.experiment.outputs.out }}
        run: |
          rm -rf "${VENV:-}" "${OUT:-}"
