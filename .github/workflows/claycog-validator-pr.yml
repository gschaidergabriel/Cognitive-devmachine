name: claycog-validator-pr

on:
  pull_request:
    paths:
      - 'the artefact/blogpost_entity/mini_cognition/**'
      - '.github/workflows/claycog-validator-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claycog-validator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Record source identity
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$GITHUB_SHA"
          git rev-parse HEAD
          git status --short
      - name: Regenerate and validate ClayCode corpus
        run: |
          set -euo pipefail
          D='the artefact/blogpost_entity/mini_cognition'
          python3 "$D/generate_sft_v1.py"
          python3 "$D/validate_sft_v1.py" "$D/train_v1.jsonl"
          python3 "$D/validate_sft_v1.py" "$D/validation_v1.jsonl"
      - name: Generate held-out OOD specifications
        run: |
          set -euo pipefail
          D='the artefact/blogpost_entity/mini_cognition'
          python3 "$D/generate_eval_ood_v1.py"
          python3 "$D/generate_eval_ood_v2.py"
      - name: Run adversarial evaluator falsifiers
        run: |
          set -euo pipefail
          D='the artefact/blogpost_entity/mini_cognition'
          PYTHONPATH="$D" python3 "$D/test_eval_outputs_v1_adversarial.py"
      - name: Run Together create safety regressions offline
        run: |
          set -euo pipefail
          D='the artefact/blogpost_entity/mini_cognition'
          PYTHONPATH="$D" python3 "$D/test_launch_together_safety_v1.py"
