name: ClayCode strict LALR repair validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_strict_lalr_probe.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V4.lark'
      - '.github/workflows/claycode-strict-lalr-probe.yml'

concurrency:
  group: claycode-strict-lalr-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency with strict regex-collision support
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Run strict repaired-grammar probe
        run: |
          python tools/claycode_strict_lalr_probe.py \
            --grammar research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V4.lark \
            --output research_entity/claycode/autonomous/STRICT_LALR_D_REPAIR_RECEIPT.json
      - name: Require strict construction success
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/STRICT_LALR_D_REPAIR_RECEIPT.json'
          d=json.load(open(p,encoding='utf-8'))
          if not d.get('strict_build_ok'):
              raise SystemExit('strict repaired grammar still fails: '+str(d.get('strict_error')))
          if d.get('conflict_diagnostics'):
              raise SystemExit('strict repaired grammar still reports conflicts: '+str(d['conflict_diagnostics']))
          print('STRICT_REPAIR_PASS')
          PY
      - name: Commit strict repair receipt
        run: |
          git config user.name 'claycode-lalr-probe'
          git config user.email 'claycode-lalr-probe@users.noreply.github.com'
          git add research_entity/claycode/autonomous/STRICT_LALR_D_REPAIR_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record strict D grammar repair validation'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
