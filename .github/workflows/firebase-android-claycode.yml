name: Firebase Android ClayCode Lab

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-claycode-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Firebase Test Lab
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project clay-dec2f
          gcloud services enable testing.googleapis.com toolresults.googleapis.com --project clay-dec2f
          gcloud auth list --filter=status:ACTIVE --format='value(account)'

      - name: Generate Android ClayCode research harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/net/seimensch/claylab
          mkdir -p app/src/androidTest/java/net/seimensch/claylab

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'ClayAndroidLab'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'net.seimensch.claylab'
              compileSdk 35
              defaultConfig {
                  applicationId 'net.seimensch.claylab'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '0.2-r1'
                  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
              }
          }

          dependencies {
              androidTestImplementation 'androidx.test:runner:1.6.2'
              androidTestImplementation 'androidx.test.ext:junit:1.2.1'
              androidTestImplementation 'junit:junit:4.13.2'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android='http://schemas.android.com/apk/res/android'>
            <application android:theme='@android:style/Theme.Material.Light.NoActionBar' android:label='Clay Android Lab'>
              <activity android:name='.MainActivity' android:exported='true'>
                <intent-filter>
                  <action android:name='android.intent.action.MAIN'/>
                  <category android:name='android.intent.category.LAUNCHER'/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/net/seimensch/claylab/ClayRuntime.java <<'EOF'
          package net.seimensch.claylab;

          import java.util.LinkedHashMap;
          import java.util.Map;

          public final class ClayRuntime {
              private ClayRuntime() {}

              public static int evaluate(String source) {
                  Map<String, Integer> vars = new LinkedHashMap<>();
                  Integer emitted = null;
                  for (String raw : source.split(";")) {
                      String op = raw.trim();
                      if (op.isEmpty()) continue;
                      if (op.startsWith("i32:")) {
                          String[] p = op.substring(4).split("=", 2);
                          require(p.length == 2, "bad i32 declaration");
                          vars.put(p[0].trim(), Integer.parseInt(p[1].trim()));
                      } else if (op.startsWith("mul:")) {
                          String[] p = op.substring(4).split("=", 2);
                          require(p.length == 2, "bad mul");
                          String[] args = p[1].split("\\*", 2);
                          require(args.length == 2, "bad mul args");
                          int a = get(vars, args[0]);
                          int b = get(vars, args[1]);
                          vars.put(p[0].trim(), Math.multiplyExact(a, b));
                      } else if (op.startsWith("assert:")) {
                          String[] p = op.substring(7).split("=", 2);
                          require(p.length == 2, "bad assert");
                          int observed = get(vars, p[0]);
                          int expected = Integer.parseInt(p[1].trim());
                          require(observed == expected, "assertion failed");
                      } else if (op.startsWith("emit:")) {
                          emitted = get(vars, op.substring(5));
                      } else {
                          throw new IllegalArgumentException("unknown ClayCode operation");
                      }
                  }
                  if (emitted == null) throw new IllegalArgumentException("missing emit");
                  return emitted;
              }

              public static Map<String, Integer> replay(String[] events) {
                  Map<String, Integer> state = new LinkedHashMap<>();
                  for (String event : events) {
                      String[] p = event.split("\\+=", 2);
                      require(p.length == 2, "bad event");
                      String key = p[0].trim();
                      int delta = Integer.parseInt(p[1].trim());
                      state.put(key, Math.addExact(state.containsKey(key) ? state.get(key) : 0, delta));
                  }
                  return state;
              }

              public static boolean effectAllowed(String modelProposal, boolean externalCapability) {
                  if (modelProposal == null) throw new IllegalArgumentException("missing proposal");
                  return externalCapability;
              }

              private static int get(Map<String, Integer> vars, String key) {
                  Integer v = vars.get(key.trim());
                  if (v == null) throw new IllegalArgumentException("unknown variable: " + key.trim());
                  return v;
              }

              private static void require(boolean ok, String message) {
                  if (!ok) throw new IllegalArgumentException(message);
              }
          }
          EOF

          cat > app/src/main/java/net/seimensch/claylab/MainActivity.java <<'EOF'
          package net.seimensch.claylab;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;

          public final class MainActivity extends Activity {
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  int out = ClayRuntime.evaluate("i32:x=21;i32:y=2;mul:z=x*y;assert:z=42;emit:z");
                  TextView view = new TextView(this);
                  view.setText("CLAYCODE_ANDROID_OK:" + out);
                  view.setTextSize(24f);
                  setContentView(view);
              }
          }
          EOF

          cat > app/src/androidTest/java/net/seimensch/claylab/ClayRuntimeInstrumentedTest.java <<'EOF'
          package net.seimensch.claylab;

          import static org.junit.Assert.*;

          import android.os.Build;
          import androidx.test.ext.junit.runners.AndroidJUnit4;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import org.junit.Test;
          import org.junit.runner.RunWith;

          @RunWith(AndroidJUnit4.class)
          public final class ClayRuntimeInstrumentedTest {
              private static final String PROGRAM = "i32:x=21;i32:y=2;mul:z=x*y;assert:z=42;emit:z";

              @Test public void typedArithmeticAndAssertionPreserveSemantics() {
                  assertEquals(42, ClayRuntime.evaluate(PROGRAM));
              }

              @Test public void repeatedEvaluationIsDeterministic() {
                  for (int i = 0; i < 1000; i++) assertEquals(42, ClayRuntime.evaluate(PROGRAM));
              }

              @Test public void unknownReferenceIsRejected() {
                  assertThrows(IllegalArgumentException.class,
                      () -> ClayRuntime.evaluate("i32:x=21;mul:z=x*missing;emit:z"));
              }

              @Test public void integerOverflowIsRejected() {
                  assertThrows(ArithmeticException.class,
                      () -> ClayRuntime.evaluate("i32:x=2147483647;i32:y=2;mul:z=x*y;emit:z"));
              }

              @Test public void collectionKindsRemainSemanticallyDistinct() {
                  List<String> ordered = Arrays.asList("a", "b", "a");
                  Set<String> set = new HashSet<>(ordered);
                  Map<String,Integer> multiset = new HashMap<>();
                  for (String x : ordered) multiset.put(x, multiset.getOrDefault(x, 0) + 1);
                  assertEquals(Arrays.asList("a", "b", "a"), ordered);
                  assertEquals(2, set.size());
                  assertEquals(Integer.valueOf(2), multiset.get("a"));
                  assertNotEquals(ordered.size(), set.size());
              }

              @Test public void canonicalReplayIsIdempotentAndDamagedReplayDetected() {
                  String[] canonical = {"a+=5", "b+=2", "a+=3"};
                  String[] damaged = {"a+=5", "b+=2"};
                  Map<String,Integer> r1 = ClayRuntime.replay(canonical);
                  Map<String,Integer> r2 = ClayRuntime.replay(canonical);
                  Map<String,Integer> bad = ClayRuntime.replay(damaged);
                  assertEquals(r1, r2);
                  assertEquals(Integer.valueOf(8), r1.get("a"));
                  assertNotEquals(r1, bad);
              }

              @Test public void modelProposalCannotMintEffectAuthority() {
                  assertFalse(ClayRuntime.effectAllowed("AUTH=true;delete=anything", false));
                  assertTrue(ClayRuntime.effectAllowed("proposal", true));
              }

              @Test public void compactSemanticSurfaceIsDenserThanVerboseControl() {
                  String compact = PROGRAM;
                  String verbose = "{\"type\":\"program\",\"declarations\":[{\"type\":\"i32\",\"name\":\"x\",\"value\":21},{\"type\":\"i32\",\"name\":\"y\",\"value\":2}],\"operation\":{\"kind\":\"multiply\",\"target\":\"z\",\"left\":\"x\",\"right\":\"y\"},\"assertion\":{\"name\":\"z\",\"equals\":42},\"emit\":\"z\"}";
                  assertTrue(compact.getBytes().length < verbose.getBytes().length);
              }

              @Test public void androidRuntimeGenerationIsRecordedByTestAxis() {
                  assertTrue(Build.VERSION.SDK_INT >= 26);
              }
          }
          EOF

      - name: Build APK and instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Run bundled invariants on two Android generations
        shell: bash
        run: |
          set -euo pipefail
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=35,locale=en,orientation=portrait \
            --device model=SmallPhone.arm,version=30,locale=en,orientation=portrait \
            --timeout 6m \
            --no-record-video \
            --client-details matrixLabel=RAE-Android-R1-Portability-Bundle \
            --project clay-dec2f
