name: UnifiedDB EAP Issue Dispatch

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: unifieddb-eap-issue-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] UnifiedDB EAP benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch bounded EAP benchmark
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: unifieddb-eap-vps-benchmark.yml
        run: |
          set -euo pipefail
          body='{"ref":"main"}'
          http_code="$(curl -sS --retry 2 --retry-delay 1 \
            -o /tmp/unifieddb_eap_dispatch_body.txt \
            -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            -d "$body")"
          python3 - "$http_code" <<'PY'
          import json, os, sys
          print(json.dumps({
            'schema_version':'1.0',
            'dispatch_http_status':sys.argv[1],
            'dispatch_accepted':sys.argv[1]=='204',
            'target_workflow':'unifieddb-eap-vps-benchmark.yml',
            'target_ref':'main',
            'bridge_sha':os.environ.get('GITHUB_SHA',''),
            'bridge_run_id':os.environ.get('GITHUB_RUN_ID',''),
            'scope_guard':'204 proves workflow-dispatch acceptance only, not VPS execution or benchmark pass.',
          },sort_keys=True))
          PY
          test "$http_code" = 204
