name: GO Meta Learning Current Main 2026-08-17

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta-learning-current-main:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind exact source identity
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

      - name: Install bounded test dependencies
        working-directory: the artefact
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Focused meta-learning and retrieval gates
        working-directory: the artefact
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_method_transfer.py \
            tests/test_method_admission.py \
            tests/test_method_route_policy.py \
            tests/test_terminal_hook_method_context.py \
            tests/test_cognitive_routing.py

      - name: Full source regression suite
        working-directory: the artefact
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Static import and compile gate
        working-directory: the artefact
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m py_compile \
            clayverse/method_transfer.py \
            clayverse/method_admission.py \
            clayverse/method_route_policy.py \
            clayverse/retrieval.py \
            clayverse/turn_lifecycle.py \
            clayverse/terminal_hooks.py

      - name: Exact OCI source build
        working-directory: the artefact
        run: |
          set -euo pipefail
          ENTITYOS_SHA256="$(python -c 'import json; print(json.load(open("entityos.lock.json", encoding="utf-8"))["sha256"])')"
          test -n "$ENTITYOS_SHA256"
          docker build \
            --build-arg TARGETARCH=amd64 \
            --build-arg ENTITYOS_SHA256="$ENTITYOS_SHA256" \
            --tag clayverse-meta-learning:"$(git rev-parse --short=12 HEAD)" \
            .
          docker image inspect clayverse-meta-learning:"$(git rev-parse --short=12 HEAD)" --format '{{.Id}}'
