name: WP04 Explicit Reward Contract V1

on:
  pull_request:
    branches: ['chatgpt/claycode-wp04-nested-call-path-v2-20260810']
    paths:
      - 'research_entity/claycode/g9/CLAYCODE_FRANK_REWARD_CALLABLE_V1_CANDIDATE.clay'
      - 'tools/claycode_wp04_explicit_contract_anchor_v1.py'
      - 'tools/test_claycode_wp04_explicit_contract_anchor_v1.py'
      - '.github/workflows/wp04-explicit-reward-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explicit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: python -m pip install 'lark==1.3.1' 'interegular==0.3.3'
      - run: python -m py_compile tools/claycode_wp04_explicit_contract_anchor_v1.py tools/test_claycode_wp04_explicit_contract_anchor_v1.py
      - run: python tools/test_claycode_wp04_explicit_contract_anchor_v1.py
