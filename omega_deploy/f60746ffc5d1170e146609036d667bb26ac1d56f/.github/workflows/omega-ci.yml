name: OMEGA CI

on:
  pull_request:
  push:
    branches:
      - omega-outer-relay-20260912
      - main

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile package
        run: python -m compileall -q omega tests
      - name: Unit tests
        run: pytest -q
