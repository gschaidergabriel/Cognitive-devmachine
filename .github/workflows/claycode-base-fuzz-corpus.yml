name: ClayCode BASE fuzz and heldout corpus gates
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_fuzz_conformance.py'
      - 'tools/claycode_base_corpus_generator.py'
      - 'tools/claycode_base_pure_toolchain.py'
      - 'tools/claycode_base_runtime.py'
      - '.github/workflows/claycode-base-fuzz-corpus.yml'
permissions:
  contents: write
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - run: cc --version
      - run: python -m py_compile tools/claycode_base_fuzz_conformance.py tools/claycode_base_corpus_generator.py
      - run: python tools/claycode_base_fuzz_conformance.py
      - run: python tools/claycode_base_corpus_generator.py
      - name: Preserve receipts and corpus
        run: |
          git config user.name 'claycode-fuzz-corpus'
          git config user.email 'claycode-fuzz-corpus@users.noreply.github.com'
          git add research_entity/claycode/autonomous/BASE_FUZZ_CONFORMANCE_RECEIPT.json research_entity/claycode/corpus/base_v1/
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record fuzz and leak-audited heldout corpus receipts'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
