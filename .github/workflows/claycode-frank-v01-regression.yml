name: ClayCode Frank v0.1 Regression Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claycode-frank-v01-regression.yml'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_typed_ir.py'
      - 'tools/claycode_base_typed_ir_v18_bridge.py'
      - 'tools/test_claycode_v18_bridge_contract_hash.py'
      - 'tools/research_interconnect_preflight.py'
      - 'tools/research_interconnect_preflight_v2.py'
      - 'tools/test_research_interconnect_preflight_frank_v01_registry.py'
      - 'research_entity/global/RESEARCH_TRIGGER_REGISTRY.json'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V18_REWARD_RELATIONS.lark'

permissions:
  contents: read

concurrency:
  group: claycode-frank-v01-regression
  cancel-in-progress: false

jobs:
  target-vps-regression:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact current main read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Install isolated parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          DEPS_DIR="${RUNNER_TEMP:-/tmp}/claycode-frank-v01-deps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          rm -rf "$DEPS_DIR"
          python3 -m pip install --target "$DEPS_DIR" --disable-pip-version-check --no-input --no-compile \
            'lark==1.3.1' 'interegular==0.3.3'
          echo "DEPS_DIR=$DEPS_DIR" >> "$GITHUB_ENV"

      - name: Execute contract and mesh regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONNOUSERSITE=1
          export PYTHONPATH="$DEPS_DIR:$GITHUB_WORKSPACE/tools"
          python3 -m unittest -v tools/test_claycode_v18_bridge_contract_hash.py
          python3 -m unittest -v tools/test_research_interconnect_preflight_frank_v01_registry.py

          python3 - <<'PY'
          import copy, hashlib, json, os, platform, socket
          from datetime import datetime, timezone
          from pathlib import Path
          import claycode_base_frontend as front
          import claycode_base_typed_ir_v18_bridge as bridge
          import research_interconnect_preflight_v2 as mesh

          root = Path.cwd()
          grammar_path = root / 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V18_REWARD_RELATIONS.lark'
          grammar = grammar_path.read_text(encoding='utf-8')
          grammar_sha = hashlib.sha256(grammar.encode('utf-8')).hexdigest()
          assert grammar_sha == bridge.EXPECTED_GRAMMAR_SHA256, (grammar_sha, bridge.EXPECTED_GRAMMAR_SHA256)

          artifact = front.compile_frontend('record X { a:Int }\n', grammar, strict=True)
          validated = bridge.validate_frontend_artifact(copy.deepcopy(artifact))
          bad = copy.deepcopy(artifact); bad['contract_hash'] = 'f' * 64
          rejected = False
          try:
              bridge.validate_frontend_artifact(bad)
          except bridge.V18BridgeError:
              rejected = True
          assert rejected

          expected_peers = {'clayresearch','frank','q23','gwt','emergenz','claycode','hyperposition','claygraph','unifieddb','harness'}
          assert set(mesh.BRANCHES) == expected_peers, mesh.BRANCHES
          assert all(set(order) == expected_peers and len(order) == 10 for order in mesh.PRIORITY.values())

          payload = {
              'schema_version': '1.0',
              'evidence_class': 'REAL_SELF_HOSTED_TARGET_VPS_REGRESSION',
              'program_target': 'FRANK_V0_1',
              'created_at': datetime.now(timezone.utc).isoformat(),
              'github_sha': os.environ.get('GITHUB_SHA',''),
              'github_run_id': os.environ.get('GITHUB_RUN_ID',''),
              'github_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT',''),
              'hostname': socket.gethostname(),
              'runner_name': os.environ.get('RUNNER_NAME','unknown'),
              'runner_os': os.environ.get('RUNNER_OS','unknown'),
              'runner_arch': os.environ.get('RUNNER_ARCH','unknown'),
              'platform': platform.platform(),
              'python': platform.python_version(),
              'grammar_sha256': grammar_sha,
              'frontend_surface': bridge.EXPECTED_SURFACE,
              'frontend_contract_hash_validated': validated['contract_hash'] == artifact['contract_hash'],
              'contract_hash_tamper_rejected': rejected,
              'mesh_peer_count': len(mesh.BRANCHES),
              'mesh_peers': sorted(mesh.BRANCHES),
              'mesh_priority_exact_permutations': True,
              'unit_contract_binding': 'PASS',
              'unit_registry_v3_mesh': 'PASS',
              'pass': True,
              'scope_guard': 'This receipt closes only these exact regressions on this tested commit. It does not promote F-V01-02 typed_ir/type_effect or finished Frank v0.1 by itself.'
          }
          Path('/tmp/CLAYCODE_FRANK_V01_REGRESSION.json').write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print(json.dumps({'pass': True, 'mesh_peer_count': len(mesh.BRANCHES), 'grammar_sha256': grammar_sha}, sort_keys=True))
          PY

      - name: Remove isolated dependencies
        if: always()
        shell: bash
        run: |
          rm -rf "${DEPS_DIR:-/__missing__}"

      - name: Upload target VPS regression receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claycode-frank-v01-regression-${{ github.run_id }}
          path: /tmp/CLAYCODE_FRANK_V01_REGRESSION.json
          if-no-files-found: error
          retention-days: 30

  persist-receipt:
    if: always()
    needs: target-vps-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout persistence lane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Download target receipt
        uses: actions/download-artifact@v4
        with:
          name: claycode-frank-v01-regression-${{ github.run_id }}
          path: /tmp/claycode-frank-v01-regression

      - name: Validate and persist exact tested receipt
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          src=/tmp/claycode-frank-v01-regression/CLAYCODE_FRANK_V01_REGRESSION.json
          python3 - "$src" "$TESTED_SHA" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p['schema_version']=='1.0'
          assert p['evidence_class']=='REAL_SELF_HOSTED_TARGET_VPS_REGRESSION'
          assert p['github_sha']==sys.argv[2], (p['github_sha'],sys.argv[2])
          assert p['pass'] is True
          assert p['frontend_contract_hash_validated'] is True
          assert p['contract_hash_tamper_rejected'] is True
          assert p['mesh_peer_count']==10
          assert p['mesh_priority_exact_permutations'] is True
          PY
          mkdir -p research_entity/claycode/base/receipts
          cp "$src" "research_entity/claycode/base/receipts/CLAYCODE_FRANK_V01_REGRESSION_${RUN_ID}.json"
          cp "$src" research_entity/claycode/base/receipts/CLAYCODE_FRANK_V01_REGRESSION_LATEST.json

          git config user.name 'clay-ci-receipt-writer'
          git config user.email 'clay-ci-receipt-writer@users.noreply.github.com'
          git add research_entity/claycode/base/receipts/CLAYCODE_FRANK_V01_REGRESSION_${RUN_ID}.json \
                  research_entity/claycode/base/receipts/CLAYCODE_FRANK_V01_REGRESSION_LATEST.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(claycode): persist Frank v0.1 regression receipt ${RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
