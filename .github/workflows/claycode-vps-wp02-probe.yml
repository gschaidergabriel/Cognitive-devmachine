name: ClayCode VPS WP02 Strict Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claycode-vps-wp02-probe.yml'
      - 'tools/claycode_wp02_strict_local_closure_v2.py'
      - 'tools/claycode_strict_lalr_probe.py'
      - 'tools/claycode_v17_declarative_trivia_discriminator.py'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_frontend_validation.py'
      - 'tools/claycode_base_canonicalizer.py'
      - 'tools/claycode_base_canonicalizer_validation.py'
      - 'tools/claycode_base_ir.py'
      - 'research_entity/claycode/base/ANDREAS_UBUNTU_TARGET_RECEIPT_CONTRACT.json'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_*.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'

permissions:
  contents: write

concurrency:
  group: claycode-vps-wp02-strict-probe
  cancel-in-progress: false

jobs:
  wp02-vps:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout current canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Execute strict selected-grammar closure on remote Ubuntu runner
        id: probe
        shell: bash
        run: |
          set -u
          python3 -m pip install --user --disable-pip-version-check 'lark[interegular]==1.3.1'
          set +e
          python3 tools/claycode_wp02_strict_local_closure_v2.py \
            --allow-ci \
            --output /tmp/CLAYCODE_VPS_WP02_STRICT.json
          rc=$?
          set -e

          python3 - "$rc" <<'PY'
          import json, os, platform, socket, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path

          rc=int(sys.argv[1])
          p=Path('/tmp/CLAYCODE_VPS_WP02_STRICT.json')
          try:
              inner=json.loads(p.read_text(encoding='utf-8'))
          except Exception as exc:
              inner={'pass':False,'parse_error':f'{type(exc).__name__}:{exc}'}
          payload={
              'schema_version':'1.0',
              'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
              'scope':'REMOTE_PRELIMINARY_WP02_NOT_ANDREAS_TARGET_ACCEPTANCE',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'github_sha':os.environ.get('GITHUB_SHA',''),
              'hostname':socket.gethostname(),
              'runner_name':os.environ.get('RUNNER_NAME','unknown'),
              'runner_os':os.environ.get('RUNNER_OS','unknown'),
              'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
              'platform':platform.platform(),
              'python':platform.python_version(),
              'command_returncode':rc,
              'wp02_pass':inner.get('pass') is True and rc==0,
              'selected_grammar':inner.get('selected_grammar'),
              'selected_grammar_sha256':inner.get('selected_grammar',{}).get('sha256') if isinstance(inner.get('selected_grammar'),dict) else inner.get('grammar_sha256'),
              'inner_receipt':inner,
              'authority_invariant':'model output != execution authority',
              'final_release_boundary':'This remote VPS receipt cannot substitute for registered Andreas Ubuntu target identity, desktop/application gates or WP14 release acceptance.',
          }
          Path('/tmp/CLAYCODE_VPS_WP02_SUMMARY.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'wp02_pass':payload['wp02_pass'],'hostname':payload['hostname'],'runner_name':payload['runner_name']},sort_keys=True))
          PY

          echo "probe_rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Preserve only remote VPS summary receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/CLAYCODE_VPS_WP02_SUMMARY.json /tmp/CLAYCODE_VPS_WP02_SUMMARY.saved.json
          git reset --hard HEAD
          git clean -fd
          mkdir -p research_entity/claycode/remote_vps
          cp /tmp/CLAYCODE_VPS_WP02_SUMMARY.saved.json research_entity/claycode/remote_vps/LATEST_WP02_STRICT.json

          git config user.name 'claycode-self-hosted-runner'
          git config user.email 'claycode-runner@users.noreply.github.com'
          git add research_entity/claycode/remote_vps/LATEST_WP02_STRICT.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'evidence(vps): persist ClayCode WP02 strict receipt [skip ci]'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce preliminary WP02 result
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('research_entity/claycode/remote_vps/LATEST_WP02_STRICT.json',encoding='utf-8'))
          assert p['scope']=='REMOTE_PRELIMINARY_WP02_NOT_ANDREAS_TARGET_ACCEPTANCE'
          assert p['wp02_pass'] is True, p
          print('CLAYCODE_REMOTE_VPS_WP02_STRICT=PASS')
          PY
