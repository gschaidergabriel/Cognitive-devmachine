name: ClayCode WP13 real FRANK subsystem handoff

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_entity/claycode/apps/frank_active_assembly_packet_score_v1.clay'
      - 'research_entity/harness/reference/active_assembly.py'
      - 'tools/claycode_base_pure_toolchain.py'
      - 'tools/claycode_wp13_frank_handoff_validation.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - '.github/workflows/claycode-wp13-frank-handoff.yml'

permissions:
  contents: write

concurrency:
  group: claycode-wp13-frank-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frank-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Require native compiler
        run: cc --version
      - name: Differentially execute real FRANK subsystem
        run: python tools/claycode_wp13_frank_handoff_validation.py
      - name: Assert bounded evidence cannot self-promote
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/WP13_FRANK_PACKET_SCORE_HANDOFF_RECEIPT.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['pass'] is True
          assert d['semantic_mismatches'] == 0
          assert d['native_mismatches'] == 0
          assert d['counts_as_full_wp13_pass'] is False
          assert d['counts_as_target_acceptance'] is False
          print('WP13_REAL_FRANK_SUBSYSTEM_PROXY_PASS')
          PY
      - name: Commit handoff receipt
        run: |
          git config user.name 'claycode-wp13-frank'
          git config user.email 'claycode-wp13-frank@users.noreply.github.com'
          git add research_entity/claycode/autonomous/WP13_FRANK_PACKET_SCORE_HANDOFF_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record real FRANK subsystem handoff receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
