name: ClayCode VPS WP02 Strict Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claycode-vps-wp02-probe.yml'
      - 'tools/claycode_wp02_strict_local_closure_v2.py'
      - 'tools/claycode_wp02_oob_trivia_metamorphic.py'
      - 'tools/claycode_wp06_current_main_replay.py'
      - 'tools/claycode_strict_lalr_probe.py'
      - 'tools/claycode_v17_declarative_trivia_discriminator.py'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_frontend_validation.py'
      - 'tools/claycode_base_canonicalizer.py'
      - 'tools/claycode_base_canonicalizer_validation.py'
      - 'tools/claycode_base_ir.py'
      - 'tools/claycode_base_compiler.py'
      - 'research_entity/claycode/base/ANDREAS_UBUNTU_TARGET_RECEIPT_CONTRACT.json'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_*.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'

permissions:
  contents: read

concurrency:
  group: claycode-vps-wp02-strict-probe
  cancel-in-progress: false

jobs:
  wp02-vps:
    permissions:
      contents: read
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout current canonical main read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify checkout credential is not persisted
        shell: bash
        run: |
          set -euo pipefail
          extra="$(git config --local --get-all http.https://github.com/.extraheader || true)"
          test -z "$extra"
          printf '%s\n' '{"checkout_persist_credentials":false,"git_extraheader_present":false}' > /tmp/CLAYCODE_VPS_WP02_AUTHORITY.json

      - name: Execute V17 strict closure, bounded OOB discriminator and WP06 replay
        id: probe
        shell: bash
        run: |
          set -u
          DEPS_DIR="${RUNNER_TEMP:-/tmp}/claycode-wp02-deps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          DEPS_LOG=/tmp/CLAYCODE_VPS_WP02_DEPS_INSTALL.log
          DEPS_JSON=/tmp/CLAYCODE_VPS_WP02_DEPS.json
          rm -rf "$DEPS_DIR"
          mkdir -p "$DEPS_DIR"
          export PYTHONNOUSERSITE=1

          set +e
          python3 -m pip install \
            --target "$DEPS_DIR" \
            --disable-pip-version-check \
            --no-input \
            --no-compile \
            'lark==1.3.1' \
            'interegular==0.3.3' \
            >"$DEPS_LOG" 2>&1
          deps_install_rc=$?

          if [ "$deps_install_rc" -eq 0 ]; then
            export PYTHONPATH="$DEPS_DIR${PYTHONPATH:+:$PYTHONPATH}"
            python3 - "$DEPS_DIR" "$DEPS_LOG" "$DEPS_JSON" <<'PY'
          import hashlib, importlib.metadata, json, os, sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          log = Path(sys.argv[2])
          out = Path(sys.argv[3])
          import lark, interegular

          def inside(path):
              try:
                  Path(path).resolve().relative_to(root)
                  return True
              except ValueError:
                  return False

          h = hashlib.sha256()
          files = []
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x: x.relative_to(root).as_posix()):
              rel = p.relative_to(root).as_posix()
              if '__pycache__/' in rel or rel.endswith('.pyc'):
                  continue
              data = p.read_bytes()
              h.update(rel.encode('utf-8'))
              h.update(b'\0')
              h.update(hashlib.sha256(data).digest())
              files.append(rel)

          versions = {
              'lark': importlib.metadata.version('lark'),
              'interegular': importlib.metadata.version('interegular'),
          }
          module_paths = {
              'lark': str(Path(lark.__file__).resolve()),
              'interegular': str(Path(interegular.__file__).resolve()),
          }
          verified = (
              versions == {'lark': '1.3.1', 'interegular': '0.3.3'}
              and all(inside(p) for p in module_paths.values())
          )
          payload = {
              'schema_version': '1.0',
              'install_mode': 'ephemeral_pip_target',
              'isolated_target_install': True,
              'python_no_user_site': os.environ.get('PYTHONNOUSERSITE') == '1',
              'root': str(root),
              'versions': versions,
              'module_paths': module_paths,
              'all_modules_within_ephemeral_root': all(inside(p) for p in module_paths.values()),
              'tree_sha256': h.hexdigest(),
              'tree_file_count': len(files),
              'install_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest() if log.exists() else None,
              'verified': verified,
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'dependency_environment_verified': verified, 'tree_sha256': payload['tree_sha256']}, sort_keys=True))
          raise SystemExit(0 if verified else 4)
          PY
            deps_verify_rc=$?
          else
            deps_verify_rc=98
            python3 - "$DEPS_DIR" "$DEPS_LOG" "$DEPS_JSON" "$deps_install_rc" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root, log, out, rc = Path(sys.argv[1]), Path(sys.argv[2]), Path(sys.argv[3]), int(sys.argv[4])
          payload = {
              'schema_version': '1.0',
              'install_mode': 'ephemeral_pip_target',
              'isolated_target_install': True,
              'root': str(root.resolve()),
              'install_returncode': rc,
              'install_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest() if log.exists() else None,
              'verified': False,
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          fi

          if [ "$deps_install_rc" -eq 0 ] && [ "$deps_verify_rc" -eq 0 ]; then
            python3 tools/claycode_wp02_strict_local_closure_v2.py \
              --allow-ci \
              --output /tmp/CLAYCODE_VPS_WP02_STRICT.json
            rc=$?
            python3 tools/claycode_wp02_oob_trivia_metamorphic.py \
              --output /tmp/CLAYCODE_VPS_WP02_OOB_TRIVIA.json
            oob_rc=$?
            python3 tools/claycode_wp06_current_main_replay.py \
              --output /tmp/CLAYCODE_VPS_WP06_REPLAY.json
            wp06_rc=$?
          else
            rc=97
            oob_rc=97
            wp06_rc=97
          fi

          rm -rf "$DEPS_DIR"
          deps_cleanup_rc=$?
          set -e

          python3 - "$rc" "$oob_rc" "$wp06_rc" "$deps_install_rc" "$deps_verify_rc" "$deps_cleanup_rc" <<'PY'
          import json, os, platform, socket, sys
          from datetime import datetime, timezone
          from pathlib import Path

          rc=int(sys.argv[1]); oob_rc=int(sys.argv[2]); wp06_rc=int(sys.argv[3])
          deps_install_rc=int(sys.argv[4]); deps_verify_rc=int(sys.argv[5]); deps_cleanup_rc=int(sys.argv[6])
          def read(path, fallback):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception as exc:
                  return {**fallback, 'parse_error':f'{type(exc).__name__}:{exc}'}
          inner=read('/tmp/CLAYCODE_VPS_WP02_STRICT.json', {'pass':False})
          oob=read('/tmp/CLAYCODE_VPS_WP02_OOB_TRIVIA.json', {'pass':False})
          wp06=read('/tmp/CLAYCODE_VPS_WP06_REPLAY.json', {'pass':False})
          authority=read('/tmp/CLAYCODE_VPS_WP02_AUTHORITY.json', {'checkout_persist_credentials':None})
          deps=read('/tmp/CLAYCODE_VPS_WP02_DEPS.json', {'verified':False})
          deps_root=Path(str(deps.get('root') or '/__missing__'))
          dependency_cleanup_confirmed=deps_cleanup_rc==0 and not deps_root.exists()
          payload={
              'schema_version':'1.3',
              'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
              'scope':'REMOTE_PRELIMINARY_WP02_PLUS_WP06_REPLAY_NOT_ANDREAS_TARGET_ACCEPTANCE',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'github_sha':os.environ.get('GITHUB_SHA',''),
              'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
              'github_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT',''),
              'hostname':socket.gethostname(),
              'runner_name':os.environ.get('RUNNER_NAME','unknown'),
              'runner_os':os.environ.get('RUNNER_OS','unknown'),
              'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
              'platform':platform.platform(),
              'python':platform.python_version(),
              'dependency_install_returncode':deps_install_rc,
              'dependency_verify_returncode':deps_verify_rc,
              'dependency_environment':deps,
              'dependency_cleanup_returncode':deps_cleanup_rc,
              'dependency_cleanup_confirmed':dependency_cleanup_confirmed,
              'command_returncode':rc,
              'wp02_pass':inner.get('pass') is True and rc==0,
              'selected_grammar':inner.get('selected_grammar'),
              'selected_grammar_sha256':inner.get('selected_grammar',{}).get('sha256') if isinstance(inner.get('selected_grammar'),dict) else inner.get('grammar_sha256'),
              'inner_receipt':inner,
              'oob_experiment_returncode':oob_rc,
              'oob_experiment_pass':oob.get('pass') is True and oob_rc==0,
              'oob_experiment':oob,
              'wp06_replay_returncode':wp06_rc,
              'wp06_replay_pass':wp06.get('pass') is True and wp06_rc==0,
              'wp06_replay':wp06,
              'execution_authority':authority,
              'self_hosted_repository_permission':'contents:read',
              'checkout_persist_credentials':False,
              'authority_invariant':'model output != execution authority',
              'final_release_boundary':'This remote VPS receipt cannot substitute for registered Andreas Ubuntu target identity, desktop/application gates, formal WP06 promotion or WP14 release acceptance.',
          }
          Path('/tmp/CLAYCODE_VPS_WP02_SUMMARY.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({
              'wp02_pass':payload['wp02_pass'],
              'oob_pass':payload['oob_experiment_pass'],
              'wp06_replay_pass':payload['wp06_replay_pass'],
              'dependency_environment_verified':deps.get('verified') is True,
              'dependency_cleanup_confirmed':dependency_cleanup_confirmed,
              'hostname':payload['hostname'],
              'runner_name':payload['runner_name'],
          },sort_keys=True))
          PY

          echo "probe_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "oob_rc=$oob_rc" >> "$GITHUB_OUTPUT"
          echo "wp06_rc=$wp06_rc" >> "$GITHUB_OUTPUT"

      - name: Upload bounded VPS receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claycode-vps-wp02-${{ github.run_id }}
          path: /tmp/CLAYCODE_VPS_WP02_SUMMARY.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce preliminary WP02, OOB and WP06 replay results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/CLAYCODE_VPS_WP02_SUMMARY.json',encoding='utf-8'))
          assert p['schema_version']=='1.3'
          assert p['scope']=='REMOTE_PRELIMINARY_WP02_PLUS_WP06_REPLAY_NOT_ANDREAS_TARGET_ACCEPTANCE'
          assert p['self_hosted_repository_permission']=='contents:read'
          assert p['checkout_persist_credentials'] is False
          assert p['dependency_environment']['install_mode']=='ephemeral_pip_target'
          assert p['dependency_environment']['isolated_target_install'] is True
          assert p['dependency_environment']['verified'] is True, p['dependency_environment']
          assert p['dependency_cleanup_confirmed'] is True
          assert p['wp02_pass'] is True, p
          assert p['oob_experiment_pass'] is True, p
          assert p['wp06_replay_pass'] is True, p
          print('CLAYCODE_REMOTE_VPS_WP02_STRICT=PASS')
          print('CLAYCODE_GO_OOB_TRIVIA_METAMORPHIC=PASS')
          print('CLAYCODE_REMOTE_VPS_WP06_CURRENT_MAIN_REPLAY=PASS')
          print('CLAYCODE_REMOTE_VPS_DEPENDENCY_ISOLATION=PASS')
          PY

  persist-receipt:
    if: always()
    needs: wp02-vps
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout persistence lane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Download VPS receipt artifact
        uses: actions/download-artifact@v4
        with:
          name: claycode-vps-wp02-${{ github.run_id }}
          path: /tmp/claycode-vps-wp02

      - name: Validate transport and bind tested commit
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/claycode-vps-wp02/CLAYCODE_VPS_WP02_SUMMARY.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema_version']=='1.3'
          assert d['evidence_class']=='REAL_SELF_HOSTED_UBUNTU_EXECUTION'
          assert d['scope']=='REMOTE_PRELIMINARY_WP02_PLUS_WP06_REPLAY_NOT_ANDREAS_TARGET_ACCEPTANCE'
          assert d['github_sha']==os.environ['TESTED_SHA'], (d['github_sha'], os.environ['TESTED_SHA'])
          assert d['self_hosted_repository_permission']=='contents:read'
          assert d['checkout_persist_credentials'] is False
          assert d['dependency_environment']['install_mode']=='ephemeral_pip_target'
          assert d['dependency_environment']['isolated_target_install'] is True
          assert d['dependency_environment']['verified'] is True
          assert d['dependency_cleanup_confirmed'] is True
          assert d['authority_invariant']=='model output != execution authority'
          print(json.dumps({
              'transport_valid':True,
              'tested_sha':d['github_sha'],
              'dependency_tree_sha256':d['dependency_environment'].get('tree_sha256'),
              'wp02_pass':d['wp02_pass'],
              'oob_pass':d['oob_experiment_pass'],
              'wp06_replay_pass':d['wp06_replay_pass'],
          },sort_keys=True))
          PY

      - name: Persist receipt from constrained hosted writer
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          src=/tmp/claycode-vps-wp02/CLAYCODE_VPS_WP02_SUMMARY.json
          mkdir -p research_entity/claycode/remote_vps/runs
          cp "$src" "research_entity/claycode/remote_vps/runs/${RUN_ID}.json"
          cp "$src" research_entity/claycode/remote_vps/LATEST_WP02_STRICT.json

          git config user.name 'claycode-receipt-writer'
          git config user.email 'claycode-receipt-writer@users.noreply.github.com'
          git add research_entity/claycode/remote_vps/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "evidence(vps): persist ClayCode WP02/WP06 run ${RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1
