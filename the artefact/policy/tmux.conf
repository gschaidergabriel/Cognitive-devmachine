# ClayVerse managed tmux policy.
# Browser users interact with the Claude pane only; tmux itself must not become
# a command, shell, pane-creation, session-switching, or process-execution surface.
set-option -g prefix None
set-option -g prefix2 None
set-option -g status off
set-option -g mouse off
set-option -g default-shell /opt/clayverse/runtime/deny-shell
unbind-key -a -T prefix
unbind-key -a -T root
