name: QCEP Self Hosted Benchmark

on:
  push:
    branches: ['research/eap-query-conditioned-evidence-20260810']
    paths:
      - 'research_entity/harness/reference/query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/test_query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/benchmark_query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/benchmark_qcep_u15_gap_closure.py'
      - '.github/workflows/qcep-self-hosted-benchmark.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research_entity/harness/reference/query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/test_query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/benchmark_query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/benchmark_qcep_u15_gap_closure.py'
      - '.github/workflows/qcep-self-hosted-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: qcep-self-hosted-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Compile and test
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research_entity/harness/reference/query_conditioned_evidence_projection.py \
            research_entity/harness/reference/benchmark_query_conditioned_evidence_projection.py \
            research_entity/harness/reference/benchmark_qcep_u15_gap_closure.py \
            research_entity/runtime/semantic_gap_controller_v15.py
          python3 -m unittest -v research_entity.harness.reference.test_query_conditioned_evidence_projection
      - name: Run QCEP graph differential
        run: |
          set -euo pipefail
          mkdir -p /tmp/qcep
          python3 -m research_entity.harness.reference.benchmark_query_conditioned_evidence_projection > /tmp/qcep/QCEP_BENCHMARK.json
      - name: Run U15 explicit-gap closure differential
        run: |
          set -euo pipefail
          python3 -m research_entity.harness.reference.benchmark_qcep_u15_gap_closure > /tmp/qcep/QCEP_U15_GAP_CLOSURE.json
      - name: Enforce lesion gates and attach runtime metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, platform, socket
          from datetime import datetime, timezone
          from pathlib import Path
          meta={
            'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
            'created_at':datetime.now(timezone.utc).isoformat(),
            'github_sha':os.environ.get('GITHUB_SHA',''),
            'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),
            'runner_os':os.environ.get('RUNNER_OS','unknown'),
            'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
            'hostname':socket.gethostname(),
            'platform':platform.platform(),
            'python':platform.python_version(),
          }
          checks=[]
          p=Path('/tmp/qcep/QCEP_BENCHMARK.json')
          x=json.loads(p.read_text()); x['execution_metadata']=meta
          p.write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          checks.append(('QCEP graph differential', bool(x['candidate_vs_eap']['promote_for_further_testing']), x['candidate_vs_eap']))
          p=Path('/tmp/qcep/QCEP_U15_GAP_CLOSURE.json')
          y=json.loads(p.read_text()); y['execution_metadata']=meta
          p.write_text(json.dumps(y,indent=2,sort_keys=True)+'\n')
          checks.append(('QCEP U15 gap closure', bool(y['candidate_vs_static']['promote_for_real_corpus_falsifier']), y['candidate_vs_static']))
          for name,ok,gate in checks:
            print(name, json.dumps(gate,indent=2,sort_keys=True))
            if not ok: raise SystemExit(f'{name} lesion gate failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qcep-self-hosted-${{ github.run_id }}
          path: /tmp/qcep/*.json
          if-no-files-found: error

  persist:
    if: ${{ always() && github.event_name == 'push' }}
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: qcep-self-hosted-${{ github.run_id }}
          path: /tmp/qcep
      - name: Persist exact receipts
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          src=Path('/tmp/qcep'); out=Path('research_entity/experiments/unifieddb_qcep'); out.mkdir(parents=True,exist_ok=True)
          files={
            'QCEP_BENCHMARK.json':'LATEST.json',
            'QCEP_U15_GAP_CLOSURE.json':'LATEST_U15_GAP_CLOSURE.json',
          }
          run_id=None
          for source,latest in files.items():
            data=json.loads((src/source).read_text())
            assert data['execution_metadata']['github_sha']==os.environ['TESTED_SHA']
            run_id=data['execution_metadata']['github_run_id']
            (out/latest).write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
            stem=Path(source).stem.lower()
            (out/f'{run_id}_{stem}.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'clay-qcep-benchmark'
          git config user.email 'clay-qcep-benchmark@users.noreply.github.com'
          git add research_entity/experiments/unifieddb_qcep/
          git commit -m "evidence(unifieddb): persist QCEP self-hosted differentials [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((attempt*2))
          done
          exit 1
