name: WP03 Frontend Artifact Contract PR Check

on:
  pull_request:
    paths:
      - '.github/workflows/wp03-frontend-artifact-contract-pr-check.yml'
      - 'tools/claycode_wp03_frontend_artifact_contract.py'
      - 'tools/test_claycode_wp03_frontend_artifact_contract.py'
      - 'tools/claycode_wp03_frontend_artifact_contract_validation.py'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_typed_ir.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'

permissions:
  contents: read

jobs:
  premerge-discriminator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated strict-parser environment
        run: |
          python3 -m venv /tmp/clay-wp03-pr-${GITHUB_RUN_ID}
          /tmp/clay-wp03-pr-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Execute base discriminator
        env:
          PYTHONPATH: tools
          PYTHONSAFEPATH: '1'
        run: |
          /tmp/clay-wp03-pr-${GITHUB_RUN_ID}/bin/python tools/test_claycode_wp03_frontend_artifact_contract.py | tee /tmp/wp03_artifact_base.json
      - name: Execute extended boundary discriminator
        env:
          PYTHONPATH: tools
          PYTHONSAFEPATH: '1'
        run: |
          /tmp/clay-wp03-pr-${GITHUB_RUN_ID}/bin/python tools/claycode_wp03_frontend_artifact_contract_validation.py | tee /tmp/wp03_artifact_extended.json
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp03-frontend-artifact-pr-${{ github.run_id }}
          path: |
            /tmp/wp03_artifact_base.json
            /tmp/wp03_artifact_extended.json
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/clay-wp03-pr-${GITHUB_RUN_ID}
