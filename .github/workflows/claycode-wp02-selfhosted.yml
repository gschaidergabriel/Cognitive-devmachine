name: ClayCode WP02 self-hosted validation

on:
  pull_request:
    paths:
      - "research_entity/claycode/base/**"
      - "research_entity/claycode/g9/**"
      - "tools/claycode_base_frontend_validation.py"
      - "tools/claycode_base_canonical_validation.py"
      - ".github/workflows/claycode-wp02-selfhosted.yml"
  workflow_dispatch:

jobs:
  wp02-v17-canonical:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Capture host and checkout metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=$(git rev-parse HEAD)"
            echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-UNKNOWN}}"
            echo "runner_name=${RUNNER_NAME:-UNKNOWN}"
            echo "runner_os=${RUNNER_OS:-UNKNOWN}"
            echo "runner_arch=${RUNNER_ARCH:-UNKNOWN}"
            uname -a || true
            python3 --version || true
            lscpu || true
            free -b || true
            df -B1 . || true
          } | tee artifacts/host_metadata.txt

      - name: Build isolated parser environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input --upgrade pip
          .venv/bin/python -m pip install --disable-pip-version-check --no-input "lark==1.3.1" "interegular==0.3.3"
          .venv/bin/python - <<'PY'
          import importlib.metadata, sys
          print(sys.version)
          print("lark", importlib.metadata.version("lark"))
          print("interegular", importlib.metadata.version("interegular"))
          PY

      - name: Compile frontend implementation
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m py_compile \
            research_entity/claycode/base/implementation/claycode_frontend.py \
            tools/claycode_base_frontend_validation.py \
            tools/claycode_base_canonical_validation.py

      - name: Run strict V17 full-current frontend validator
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python tools/claycode_base_frontend_validation.py \
            --grammar research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark \
            --output artifacts/wp02_v17_strict_frontend.json

      - name: Run canonical roundtrip and metamorphic validator
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python tools/claycode_base_canonical_validation.py \
            --repetitions 15 \
            --output artifacts/wp02_v17_canonical.json

      - name: Bind receipt hashes
        if: always()
        shell: bash
        run: |
          set -u
          {
            echo "commit=$(git rev-parse HEAD)"
            sha256sum \
              research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark \
              research_entity/claycode/base/implementation/claycode_frontend.py \
              tools/claycode_base_frontend_validation.py \
              tools/claycode_base_canonical_validation.py \
              artifacts/* 2>/dev/null || true
          } | tee artifacts/receipt_sha256.txt

      - name: Upload validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claycode-wp02-v17-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
