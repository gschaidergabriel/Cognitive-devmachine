name: GO878 historical backfill batch identity guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/go878-backfill-batch-identity-guard.yml'
      - 'tools/apply_go878_backfill_batch_identity_guard.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: go878-backfill-batch-identity-guard
  cancel-in-progress: false

jobs:
  guard:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.actor == 'gschaidergabriel'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Execute exact-source patch and regressions inside clay-direct-dev
        shell: bash
        run: |
          set -euo pipefail
          scratch="/tmp/clay-go878-backfill-identity-${GITHUB_RUN_ID}"
          host_tmp="/tmp/clay-go878-backfill-host-${GITHUB_RUN_ID}"
          rm -rf "$host_tmp"
          mkdir -p "$host_tmp"

          runtime=''
          prefix=()
          if command -v docker >/dev/null 2>&1 && docker inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='docker'; prefix=(docker)
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='sudo-docker'; prefix=(sudo -n docker)
          elif command -v podman >/dev/null 2>&1 && podman inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='podman'; prefix=(podman)
          elif command -v sudo >/dev/null 2>&1 && sudo -n podman inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='sudo-podman'; prefix=(sudo -n podman)
          else
            echo 'clay-direct-dev not reachable through docker/podman' >&2
            exit 41
          fi

          "${prefix[@]}" exec clay-direct-dev sh -lc "rm -rf '$scratch'; mkdir -p '$scratch'"
          "${prefix[@]}" cp "$GITHUB_WORKSPACE/." "clay-direct-dev:$scratch"
          "${prefix[@]}" exec clay-direct-dev sh -lc "set -eu; cd '$scratch'; python3 tools/apply_go878_backfill_batch_identity_guard.py --repo .; python3 -m py_compile tools/free_swarm_historical_backfill.py; python3 -m pytest -q tests/test_free_swarm_historical_backfill.py > /tmp/go878-backfill-tests.txt 2>&1"

          "${prefix[@]}" cp "clay-direct-dev:$scratch/tools/free_swarm_historical_backfill.py" "$GITHUB_WORKSPACE/tools/free_swarm_historical_backfill.py"
          "${prefix[@]}" cp "clay-direct-dev:$scratch/tests/test_free_swarm_historical_backfill.py" "$GITHUB_WORKSPACE/tests/test_free_swarm_historical_backfill.py"
          "${prefix[@]}" cp clay-direct-dev:/tmp/go878-backfill-tests.txt "$host_tmp/tests.txt"

          python3 - "$runtime" "$host_tmp" <<'PY'
          import hashlib, json, os, pathlib, sys
          from datetime import datetime, timezone
          runtime=sys.argv[1]
          host_tmp=pathlib.Path(sys.argv[2])
          ws=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          inbox=json.loads((ws/'research_entity/claycode/autonomous/SUPERVISOR_INBOX.json').read_text())
          out={
            'schema':'GO878_HISTORICAL_BACKFILL_BATCH_IDENTITY_RUNTIME/v1',
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'github_run_id':os.environ.get('GITHUB_RUN_ID'),
            'github_sha_checked_out':os.environ.get('GITHUB_SHA'),
            'authority_epoch':inbox.get('schema_version'),
            'sandbox':'clay-direct-dev',
            'container_runtime':runtime,
            'tests_output':(host_tmp/'tests.txt').read_text(errors='replace'),
            'source_sha256':sha(ws/'tools/free_swarm_historical_backfill.py'),
            'tests_sha256':sha(ws/'tests/test_free_swarm_historical_backfill.py'),
            'invariants':[ 
              'BATCH_CHUNK_ID_BINDS_CANONICAL_SOURCE_EVENT_ID',
              'EXTRACTION_PASS_MUST_EQUAL_NEXT_CANONICAL_PASS',
              'FOREIGN_OR_STALE_BATCH_CANNOT_MINT_CANDIDATE_PROVENANCE',
              'NON_EXHAUSTIVE_ZERO_NOVEL_CANNOT_CLAIM_SATURATED',
              'OVERSIZED_BATCH_CANNOT_ADVANCE_PROGRESS'
            ],
            'external_provider_calls_performed':False,
            'secrets_recorded':False,
            'runtime_credit':'COMPONENT_REGRESSION_ONLY',
            'whole_entityos_hcu_runtime_credit_added':0,
            'hcu_full_runtime_credit_added':0,
            'jspace_model_runtime_credit_added':0,
            'training_credit_added':0,
          }
          target=ws/'research_entity/runtime/tool_results'/f"go878-backfill-batch-identity-{os.environ['GITHUB_RUN_ID']}.json"
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

          "${prefix[@]}" exec clay-direct-dev sh -lc "rm -rf '$scratch' /tmp/go878-backfill-tests.txt"
          rm -rf "$host_tmp"

      - name: Persist exact tested delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'clay-go878-backfill-guard'
          git config user.email 'clay-go878-backfill-guard@users.noreply.github.com'
          git add \
            tools/free_swarm_historical_backfill.py \
            tests/test_free_swarm_historical_backfill.py \
            research_entity/runtime/tool_results/
          if git diff --cached --quiet; then
            echo 'No tested delta to persist'
            exit 0
          fi
          git commit -m "fix(go878): bind historical batch progress to causal identity [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
