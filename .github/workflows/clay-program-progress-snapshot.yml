name: Clay Dynamic Program Progress Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clay-program-progress-snapshot.yml'
      - 'tools/program_progress.py'
      - 'tools/doomsday_forecast.py'
      - 'research_entity/rooms/PROGRAM_STATE.json'
      - 'research_entity/rooms/PROGRAM_THROUGHPUT.json'
      - 'research_entity/rooms/CAPACITY_STATE.json'
      - 'research_entity/claycode/CLAYCODE_RELEASE_WORKSPACE.json'
      - 'research_entity/harness/HARNESS_WORKSPACE.json'
      - 'research_entity/forecast/DOOMSDAY_FORECAST_MODEL.json'
      - 'research_entity/forecast/HISTORICAL_EARNED_WORK.json'
      - 'research_entity/forecast/DOOMSDAY_EVENTS.jsonl'
      - 'research_entity/forecast/DOOMSDAY_CAPABILITY_RULES.json'
      - 'research_entity/global/*_RESEARCH_CAPABILITY.json'
      - 'research_entity/global/EXTERNAL_RESEARCH_TOOL_REGISTRY.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve exact current progress
        run: |
          AS_OF=$(TZ=Asia/Phnom_Penh date +%F)
          export AS_OF
          python3 tools/program_progress.py --json --as-of "$AS_OF" > /tmp/clay_program_progress.json
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('/tmp/clay_program_progress.json')
          d=json.loads(p.read_text())
          d['receipt']={
            'truth_class':'VERIFIED_GITHUB_HOSTED_EXECUTION_DYNAMIC_PROGRESS_SNAPSHOT',
            'commit':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'runner_name':os.environ.get('RUNNER_NAME','UNKNOWN'),
            'as_of':os.environ['AS_OF']
          }
          out=pathlib.Path('research_entity/rooms/PROGRAM_PROGRESS_LATEST.json')
          out.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist snapshot if changed
        run: |
          git config user.name 'clay-progress-runner'
          git config user.email 'clay-progress-runner@users.noreply.github.com'
          git add research_entity/rooms/PROGRAM_PROGRESS_LATEST.json
          git commit -m 'evidence(clay): refresh dynamic program progress snapshot' || exit 0
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
