name: ClayCode BASE runtime capability gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_runtime.py'
      - 'tools/claycode_base_runtime_validation.py'
      - '.github/workflows/claycode-base-runtime-gate.yml'

permissions:
  contents: write

concurrency:
  group: claycode-base-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate runtime authority and resource semantics
        run: python tools/claycode_base_runtime_validation.py
      - name: Commit runtime receipt
        run: |
          git config user.name 'claycode-base-runtime-gate'
          git config user.email 'claycode-base-runtime-gate@users.noreply.github.com'
          git add research_entity/claycode/autonomous/BASE_RUNTIME_CAPABILITY_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record runtime capability gate receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
