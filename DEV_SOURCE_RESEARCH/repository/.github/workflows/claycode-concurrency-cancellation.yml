name: ClayCode cancellation and error concurrency gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_runtime.py'
      - 'tools/claycode_base_concurrency_extensions.py'
      - 'tools/claycode_base_concurrency_validation.py'
      - '.github/workflows/claycode-concurrency-cancellation.yml'

concurrency:
  group: claycode-concurrency-cancellation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute deterministic cancellation/error gate
        run: python tools/claycode_base_concurrency_validation.py || true
      - name: Persist pass or failure receipt
        if: always()
        run: |
          test -f research_entity/claycode/autonomous/BASE_CONCURRENCY_CANCELLATION_RECEIPT.json
          git config user.name 'claycode-concurrency-gate'
          git config user.email 'claycode-concurrency-gate@users.noreply.github.com'
          git add research_entity/claycode/autonomous/BASE_CONCURRENCY_CANCELLATION_RECEIPT.json
          git diff --cached --quiet || git commit -m 'ClayCode: record cancellation and error receipt'
          if git log -1 --pretty=%B | grep -q 'record cancellation and error receipt'; then
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((attempt * 2))
            done
          fi
      - name: Enforce gate verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('research_entity/claycode/autonomous/BASE_CONCURRENCY_CANCELLATION_RECEIPT.json', encoding='utf-8'))
          assert d['pass'], d['checks']
          assert d['counts_as_target_acceptance'] is False
          print('CONCURRENCY_CANCELLATION_HOSTED_PASS')
          PY
