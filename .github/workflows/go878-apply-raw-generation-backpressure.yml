name: GO878 apply raw-generation backpressure

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: go878-raw-generation-backpressure
  cancel-in-progress: false

jobs:
  patch-regress-persist:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] GO878 apply raw-generation backpressure' && github.event.issue.user.login == 'gschaidergabriel'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Patch and regress inside clay-direct-dev
        shell: bash
        run: |
          set -euo pipefail
          scratch="/tmp/clay-go878-backpressure-${GITHUB_RUN_ID}"
          host_tmp="/tmp/clay-go878-backpressure-host-${GITHUB_RUN_ID}"
          rm -rf "$host_tmp"
          mkdir -p "$host_tmp"

          runtime=''
          prefix=()
          if command -v docker >/dev/null 2>&1 && docker inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='docker'; prefix=(docker)
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='sudo-docker'; prefix=(sudo -n docker)
          elif command -v podman >/dev/null 2>&1 && podman inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='podman'; prefix=(podman)
          elif command -v sudo >/dev/null 2>&1 && sudo -n podman inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='sudo-podman'; prefix=(sudo -n podman)
          else
            echo 'clay-direct-dev unreachable' >&2
            exit 41
          fi

          "${prefix[@]}" exec clay-direct-dev sh -lc "rm -rf '$scratch'; mkdir -p '$scratch'"
          "${prefix[@]}" cp "$GITHUB_WORKSPACE/." "clay-direct-dev:$scratch"

          "${prefix[@]}" exec clay-direct-dev sh -lc "set -euo pipefail
            cd '$scratch'
            python3 tools/apply_go878_raw_generation_backpressure.py --repo '$scratch'
            bash -n tools/run_6000_free_swarm_supervisor.sh
            python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/run_6000_free_swarm_supervisor.sh')
          s=p.read_text(encoding='utf-8')
          assert s.count('CLAY_SWARM_RAW_GENERATION_BACKPRESSURE/v1') == 1
          assert s.count('raw_generation_allowed(){') == 1
          assert 'if raw_generation_allowed; then\n    start_6000\n  else\n    stop_6000\n  fi' in s
          assert 'reconcile_6000_admission\n  start_6000\n  refresh_root_results' not in s
          assert "external_provider_calls':0" in s
          assert "credentials_read':False" in s
          print('GO878_BACKPRESSURE_STATIC_REGRESSION_PASS')
          PY
          " >"$host_tmp/test.txt" 2>&1

          "${prefix[@]}" cp "clay-direct-dev:$scratch/tools/run_6000_free_swarm_supervisor.sh" "$GITHUB_WORKSPACE/tools/run_6000_free_swarm_supervisor.sh"

          RUNTIME="$runtime" HOST_TMP="$host_tmp" python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          from datetime import datetime,timezone
          ws=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          target=ws/'tools/run_6000_free_swarm_supervisor.sh'
          out={
            'schema':'CLAY_GO878_RAW_GENERATION_BACKPRESSURE_RECEIPT/v1',
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'github_run_id':os.environ.get('GITHUB_RUN_ID'),
            'github_sha_trigger':os.environ.get('GITHUB_SHA'),
            'sandbox':'clay-direct-dev',
            'container_runtime':os.environ.get('RUNTIME'),
            'supervisor_blob_after':subprocess.check_output(['git','hash-object',str(target)],text=True).strip(),
            'supervisor_sha256_after':hashlib.sha256(target.read_bytes()).hexdigest(),
            'test_output':(pathlib.Path(os.environ['HOST_TMP'])/'test.txt').read_text(errors='replace')[-8000:],
            'external_provider_calls_performed':False,
            'credentials_read':False,
            'runtime_credit_added':0,
            'scope':'CONTROL_PLANE_SOURCE_PATCH_AND_STATIC_REGRESSION_ONLY',
          }
          receipt=ws/'research_entity/runtime/tool_results'/f"go878-raw-generation-backpressure-{os.environ['GITHUB_RUN_ID']}.json"
          receipt.parent.mkdir(parents=True,exist_ok=True)
          receipt.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

          "${prefix[@]}" exec clay-direct-dev sh -lc "rm -rf '$scratch'"
          rm -rf "$host_tmp"

      - name: Persist tested control-plane repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'clay-go878-backpressure-runner'
          git config user.email 'clay-go878-backpressure-runner@users.noreply.github.com'
          git add tools/run_6000_free_swarm_supervisor.sh research_entity/runtime/tool_results/
          if git diff --cached --quiet; then
            echo 'No source delta: parallel work already converged.'
            exit 0
          fi
          git commit -m "control(go878): gate raw generation on conversion pressure ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
