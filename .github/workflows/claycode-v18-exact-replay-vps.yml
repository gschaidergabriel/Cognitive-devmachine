name: ClayCode V18 Exact Current Replay VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claycode-v18-exact-replay-vps.yml'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_frontend_validation.py'
      - 'tools/claycode_base_canonicalizer.py'
      - 'tools/claycode_base_canonicalizer_validation.py'
      - 'tools/claycode_strict_lalr_probe.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V18_REWARD_RELATIONS.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'

concurrency:
  group: claycode-v18-exact-current-replay-vps
  cancel-in-progress: false

jobs:
  exact-v18-replay:
    permissions:
      contents: read
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout exact current main read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Execute exact-byte replay and one mixed-epoch canary
        shell: bash
        run: |
          set -euo pipefail
          DEPS_DIR="${RUNNER_TEMP:-/tmp}/claycode-v18-exact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          rm -rf "$DEPS_DIR"
          mkdir -p "$DEPS_DIR"
          export PYTHONNOUSERSITE=1
          python3 -m pip install --target "$DEPS_DIR" --disable-pip-version-check --no-input --no-compile \
            'lark==1.3.1' 'interegular==0.3.3'
          export PYTHONPATH="$DEPS_DIR${PYTHONPATH:+:$PYTHONPATH}"

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, platform, resource, shutil, socket, subprocess, sys, time
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT=Path.cwd()
          GRAMMAR='research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V18_REWARD_RELATIONS.lark'
          PATHS=[
            'tools/claycode_base_frontend.py',
            'tools/claycode_base_frontend_validation.py',
            'tools/claycode_base_canonicalizer.py',
            'tools/claycode_base_canonicalizer_validation.py',
            'tools/claycode_strict_lalr_probe.py',
            GRAMMAR,
            'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay',
            'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay',
          ]

          def sha256(path):
            return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def git(*args):
            return subprocess.check_output(['git',*args], cwd=ROOT, text=True).strip()

          def run(name, argv, output=None):
            before=resource.getrusage(resource.RUSAGE_CHILDREN)
            t0=time.perf_counter_ns()
            cp=subprocess.run([sys.executable,*argv],cwd=ROOT,text=True,capture_output=True,check=False)
            elapsed=time.perf_counter_ns()-t0
            after=resource.getrusage(resource.RUSAGE_CHILDREN)
            doc=None
            if output and Path(output).exists():
              try: doc=json.loads(Path(output).read_text(encoding='utf-8'))
              except Exception: doc=None
            return {
              'name':name,'argv':[sys.executable,*argv],'returncode':cp.returncode,
              'elapsed_ms':round(elapsed/1_000_000,3),
              'child_user_cpu_s_delta':round(max(0.0,after.ru_utime-before.ru_utime),6),
              'child_system_cpu_s_delta':round(max(0.0,after.ru_stime-before.ru_stime),6),
              'child_maxrss_cumulative_platform_units':after.ru_maxrss,
              'stdout_sha256':hashlib.sha256(cp.stdout.encode()).hexdigest(),
              'stderr_sha256':hashlib.sha256(cp.stderr.encode()).hexdigest(),
              'stdout_tail':cp.stdout[-1200:],'stderr_tail':cp.stderr[-1200:],
              'document':doc,
              'pass':cp.returncode==0,
            }

          head=git('rev-parse','HEAD')
          clean_before=(git('status','--porcelain')=='')
          blobs=[]
          exact_binding=True
          for p in PATHS:
            head_blob=git('rev-parse',f'HEAD:{p}')
            worktree_blob=git('hash-object','--path',p,p)
            same=head_blob==worktree_blob
            exact_binding &= same
            blobs.append({'path':p,'head_blob':head_blob,'worktree_blob':worktree_blob,'blob_match':same,'sha256':sha256(p)})

          main=[]
          main.append(run('strict_lalr',['tools/claycode_strict_lalr_probe.py','--grammar',GRAMMAR,'--output','/tmp/V18_STRICT.json'],'/tmp/V18_STRICT.json'))
          main.append(run('frontend_full_corpus',['tools/claycode_base_frontend_validation.py','--grammar',GRAMMAR,'--output','/tmp/V18_FRONTEND.json'],'/tmp/V18_FRONTEND.json'))
          main.append(run('canonical_roundtrip',['tools/claycode_base_canonicalizer.py','--grammar',GRAMMAR,'--output','/tmp/V18_CANONICAL.json'],'/tmp/V18_CANONICAL.json'))
          main.append(run('production_canonicalizer_validation',['tools/claycode_base_canonicalizer_validation.py']))
          scientific_pass=all(x['pass'] for x in main)

          # EXACTLY ONE GO out-of-the-box experiment: mixed-epoch/content-address canary.
          # A comment-only grammar change should preserve parser/canonical semantics while
          # still being rejected as exact-byte evidence by the blob-identity guard.
          mutant=ROOT/'research_entity/claycode/base/__GO_OOB_V18_COMMENT_MUTANT.lark'
          shutil.copyfile(ROOT/GRAMMAR,mutant)
          with mutant.open('a',encoding='utf-8') as f:
            f.write('\n// GO_OOB_MIXED_EPOCH_CONTENT_ADDRESS_CANARY\n')
          mutant_rel=str(mutant.relative_to(ROOT))
          mutant_blob=git('hash-object','--path',GRAMMAR,mutant_rel)
          original_blob=git('rev-parse',f'HEAD:{GRAMMAR}')
          oob_front=run('oob_mutant_frontend',['tools/claycode_base_frontend_validation.py','--grammar',mutant_rel,'--output','/tmp/V18_OOB_FRONTEND.json'],'/tmp/V18_OOB_FRONTEND.json')
          oob_canon=run('oob_mutant_canonical',['tools/claycode_base_canonicalizer.py','--grammar',mutant_rel,'--output','/tmp/V18_OOB_CANONICAL.json'],'/tmp/V18_OOB_CANONICAL.json')
          oob={
            'name':'MIXED_EPOCH_CONTENT_ADDRESS_CANARY',
            'hypothesis':'A semantically harmless grammar-byte change can remain semantic-test green, so exact-byte acceptance needs independent content binding.',
            'strongest_counterhypothesis':'The semantic gates themselves are sufficient and a separate content-address guard adds no discriminating value.',
            'intervention':'append one ignored comment to a temporary uncommitted copy of V18 grammar',
            'semantic_frontend_pass':oob_front['pass'],
            'semantic_canonical_pass':oob_canon['pass'],
            'original_head_blob':original_blob,
            'mutant_blob':mutant_blob,
            'content_guard_rejects':mutant_blob!=original_blob,
            'pass':oob_front['pass'] and oob_canon['pass'] and mutant_blob!=original_blob,
            'promotion':'NONE',
            'rollback':'temporary mutant deleted before receipt finalization',
          }
          mutant.unlink()

          contract=json.loads((ROOT/'research_entity/claycode/base/ANDREAS_UBUNTU_TARGET_RECEIPT_CONTRACT.json').read_text())
          contract_selected=contract.get('wp02_parser_contract',{}).get('selected_grammar_path')
          current_frontend_default='research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V18_REWARD_RELATIONS.lark'
          contract_runtime_mismatch=contract_selected!=current_frontend_default

          payload={
            'schema_version':'1.0',
            'receipt_id':'CLAYCODE_V18_EXACT_CURRENT_REPLAY_VPS',
            'created_at':datetime.now(timezone.utc).isoformat(),
            'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXACT_CURRENT_V18_REPLAY',
            'scope':'NON_PROMOTIONAL_WP02_V18_EXACT_BYTE_FALSIFIER_NOT_ANDREAS_TARGET_ACCEPTANCE',
            'github_sha':os.environ.get('GITHUB_SHA',''),
            'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
            'github_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT',''),
            'repository_head':head,
            'repository_clean_before':clean_before,
            'host':{
              'hostname':socket.gethostname(),'runner_name':os.environ.get('RUNNER_NAME','unknown'),
              'runner_os':os.environ.get('RUNNER_OS','unknown'),'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
              'platform':platform.platform(),'python':platform.python_version(),
            },
            'exact_component_blobs':blobs,
            'exact_checkout_binding_pass':exact_binding and head==os.environ.get('GITHUB_SHA',''),
            'main_replay_components':main,
            'main_semantic_replay_pass':scientific_pass,
            'exact_v18_replay_pass':exact_binding and scientific_pass and head==os.environ.get('GITHUB_SHA',''),
            'exactly_one_out_of_box_experiment':oob,
            'current_acceptance_contract_selected_grammar':contract_selected,
            'current_frontend_selected_grammar':current_frontend_default,
            'contract_runtime_surface_mismatch':contract_runtime_mismatch,
            'adjudication':'EVIDENCE_ONLY_NO_WP02_PROMOTION_WHILE_ACCEPTANCE_CONTRACT_SELECTS_DIFFERENT_SURFACE' if contract_runtime_mismatch else 'ELIGIBLE_FOR_SEPARATE_WP02_ADJUDICATION',
            'authority_invariant':'model output != execution authority',
            'frank_harness_mutation':False,
            'training_authority':False,
          }
          Path('/tmp/CLAYCODE_V18_EXACT_REPLAY.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({
            'github_sha':payload['github_sha'],
            'exact_v18_replay_pass':payload['exact_v18_replay_pass'],
            'oob_pass':oob['pass'],
            'contract_runtime_surface_mismatch':contract_runtime_mismatch,
          },sort_keys=True))
          if not payload['exact_v18_replay_pass'] or not oob['pass']:
            raise SystemExit(1)
          PY

          rm -rf "$DEPS_DIR"

      - name: Upload immutable replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claycode-v18-exact-${{ github.run_id }}
          path: /tmp/CLAYCODE_V18_EXACT_REPLAY.json
          if-no-files-found: error
          retention-days: 30

  persist-receipt:
    if: always()
    needs: exact-v18-replay
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: claycode-v18-exact-${{ github.run_id }}
          path: /tmp/claycode-v18-exact
      - name: Persist content-addressed replay receipt
        env:
          TESTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          src=Path('/tmp/claycode-v18-exact/CLAYCODE_V18_EXACT_REPLAY.json')
          d=json.loads(src.read_text(encoding='utf-8'))
          assert d['github_sha']==os.environ['TESTED_SHA']
          root=Path('research_entity/claycode/remote_vps/v18_exact_replay')
          root.mkdir(parents=True,exist_ok=True)
          (root/'LATEST.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (root/f"{d['github_run_id']}.json").write_text(json.dumps(d,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name 'claycode-v18-exact-replay'
          git config user.email 'claycode-v18-exact-replay@users.noreply.github.com'
          git add research_entity/claycode/remote_vps/v18_exact_replay/
          git commit -m "evidence(wp02): persist exact-current V18 Ubuntu replay ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt*2))
          done
          exit 1
