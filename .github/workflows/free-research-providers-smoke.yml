name: Free research providers smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/crossref_search.py'
      - 'tools/semantic_scholar_search.py'
      - 'tools/ddgs_search.py'
      - '.github/workflows/free-research-providers-smoke.yml'

permissions:
  contents: write

concurrency:
  group: rae-runtime-receipts
  cancel-in-progress: false

jobs:
  verify-free-research-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DDGS client
        run: python -m pip install --upgrade ddgs

      - name: Verify Crossref
        run: python tools/crossref_search.py --smoke-test > /tmp/crossref.json

      - name: Verify Semantic Scholar
        run: python tools/semantic_scholar_search.py --smoke-test > /tmp/semantic-scholar.json

      - name: Verify DDGS
        run: python tools/ddgs_search.py --smoke-test > /tmp/ddgs.json

      - name: Write sanitized receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          specs = {
              'crossref': '/tmp/crossref.json',
              'semantic_scholar': '/tmp/semantic-scholar.json',
              'ddgs': '/tmp/ddgs.json',
          }
          outdir = Path('research_entity/runtime')
          outdir.mkdir(parents=True, exist_ok=True)
          for name, src_path in specs.items():
              src = json.loads(Path(src_path).read_text())
              safe = {k: v for k, v in src.items() if k not in {'credential', 'api_key', 'token'}}
              safe['credential_value_persisted_here'] = False
              (outdir / f'{name}_verification.json').write_text(json.dumps(safe, indent=2) + '\n')
          PY

      - name: Commit verification receipts
        run: |
          git config user.name 'rae-runtime-verifier'
          git config user.email 'rae-runtime-verifier@users.noreply.github.com'
          git add research_entity/runtime/crossref_verification.json research_entity/runtime/semantic_scholar_verification.json research_entity/runtime/ddgs_verification.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record free research provider runtime verification'
          git pull --rebase origin main
          git push origin HEAD:main
