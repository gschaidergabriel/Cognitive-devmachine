# REFERENCE FAIL-CLOSED ADMISSION FENCE FOR THE FINAL KATA PROFILE.
#
# This policy is deployment security infrastructure, not a ClayVerse cognition,
# state, identity, effect, or execution authority. It protects the effective Pod
# specification after mutation by denying unreviewed Kata runtime annotations.
#
# Baseline law: no io.katacontainers.* Pod annotation is admitted for the
# app=clayverse workload. If a future deployment genuinely requires one, the
# exact annotation/value MUST be separately reviewed, encoded into a replacement
# policy, receipt-bound, and exercised on the admitted target before acceptance.
# Merely changing the StatefulSet template is not sufficient.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: clayverse-kata-runtime-annotation-fence.seimensch.net
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !has(object.metadata.annotations) ||
        object.metadata.annotations.all(k, !k.startsWith('io.katacontainers.'))
      message: >-
        ClayVerse Pods must not carry unreviewed io.katacontainers.* runtime annotations.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: clayverse-kata-runtime-annotation-fence.seimensch.net
spec:
  policyName: clayverse-kata-runtime-annotation-fence.seimensch.net
  validationActions:
    - Deny
  matchResources:
    objectSelector:
      matchLabels:
        app: clayverse
