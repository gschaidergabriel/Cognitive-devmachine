name: ClayCode Andreas registered target diagnostic

on:
  workflow_dispatch:

concurrency:
  group: claycode-andreas-target-diagnostic
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  target:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify this is the locally registered Andreas Ubuntu target
        run: python3 tools/claycode_target_host_identity.py verify --json
      - name: Install pinned parser dependency in user environment
        run: python3 -m pip install --user --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Execute full current target diagnostic
        run: python3 tools/claycode_andreas_target_diagnostic.py || true
      - name: Require diagnostic receipt and preserve it
        if: always()
        run: |
          test -f research_entity/claycode/target/ANDREAS_UBUNTU_BASE_DIAGNOSTIC.json
          git config user.name 'claycode-andreas-target'
          git config user.email 'claycode-andreas-target@users.noreply.github.com'
          git add research_entity/claycode/target/ANDREAS_UBUNTU_BASE_DIAGNOSTIC.json
          for p in \
            research_entity/claycode/target/WP02_STRICT_V7.json \
            research_entity/claycode/target/WP04_06_EFFECT_PIPELINE.json \
            research_entity/claycode/target/WP12_HELDOUT_TARGET_RUN.json; do
            test -f "$p" && git add "$p"
          done
          git diff --cached --quiet || git commit -m 'ClayCode: record registered Andreas target diagnostic'
          if git log -1 --pretty=%B | grep -q 'record registered Andreas target diagnostic'; then
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((attempt * 2))
            done
          fi
      - name: Enforce host identity and executed diagnostic stages
        if: always()
        run: |
          python3 - <<'PY'
          import json
          p='research_entity/claycode/target/ANDREAS_UBUNTU_BASE_DIAGNOSTIC.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['target_host_verified'] is True, d.get('host_identity_evidence')
          assert d['all_executed_stages_pass'] is True, [x for x in d['stages'] if not x.get('pass')]
          assert d['overall_pass'] is False
          assert d['counts_as_target_acceptance'] is False
          print('ANDREAS_TARGET_DIAGNOSTIC_COMPLETE_NOT_RELEASE_ACCEPTANCE')
          PY
