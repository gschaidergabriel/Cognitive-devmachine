name: mini-cognition-qwen35-08b-pr

on:
  pull_request:
    paths:
      - 'research_entity/global/MINI_ENTITY_CLAYCOG_05B_TRAINING_DIRECTIVE.md'
      - 'the artefact/blogpost_entity/mini_cognition/**'
      - '.github/workflows/mini-cognition-qwen35-08b-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-cognition-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: the artefact/blogpost_entity/mini_cognition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile touched Python
        run: |
          python -m py_compile \
            generate_sft_v2.py \
            validate_sft_v1.py \
            validate_corpus_v2.py \
            eval_outputs_v1.py \
            generate_eval_ood_v1.py \
            generate_eval_compositional_ood_v1.py \
            launch_together_qwen35_08b_v1.py \
            test_eval_exact_vector_v1.py \
            test_eval_compositional_exact_vector_v1.py \
            test_launch_together_qwen35_08b_v1.py
      - name: Regenerate and validate SFT v2
        run: |
          python generate_sft_v2.py
          python validate_corpus_v2.py train_v2.jsonl validation_v2.jsonl
          python test_validate_corpus_v2.py
      - name: Exact omega evaluation gates
        run: |
          python test_eval_exact_vector_v1.py
          python test_eval_compositional_exact_vector_v1.py
      - name: Direct Together launcher no-network safety
        run: python test_launch_together_qwen35_08b_v1.py
