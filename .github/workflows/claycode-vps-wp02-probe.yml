name: ClayCode VPS WP02 Strict Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claycode-vps-wp02-probe.yml'
      - 'tools/claycode_wp02_strict_local_closure_v2.py'
      - 'tools/claycode_wp02_oob_trivia_metamorphic.py'
      - 'tools/claycode_wp06_current_main_replay.py'
      - 'tools/claycode_strict_lalr_probe.py'
      - 'tools/claycode_v17_declarative_trivia_discriminator.py'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_frontend_validation.py'
      - 'tools/claycode_base_canonicalizer.py'
      - 'tools/claycode_base_canonicalizer_validation.py'
      - 'tools/claycode_base_ir.py'
      - 'tools/claycode_base_compiler.py'
      - 'research_entity/claycode/base/ANDREAS_UBUNTU_TARGET_RECEIPT_CONTRACT.json'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_*.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'

permissions:
  contents: read

concurrency:
  group: claycode-vps-wp02-strict-probe
  cancel-in-progress: false

jobs:
  wp02-vps:
    permissions:
      contents: read
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout current canonical main read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify checkout credential is not persisted
        shell: bash
        run: |
          set -euo pipefail
          extra="$(git config --local --get-all http.https://github.com/.extraheader || true)"
          test -z "$extra"
          printf '%s\n' '{"checkout_persist_credentials":false,"git_extraheader_present":false}' > /tmp/CLAYCODE_VPS_WP02_AUTHORITY.json

      - name: Execute V17 strict closure, bounded OOB discriminator and WP06 replay
        id: probe
        shell: bash
        run: |
          set -u
          python3 -m pip install --user --disable-pip-version-check 'lark==1.3.1' 'interegular==0.3.3'
          set +e
          python3 tools/claycode_wp02_strict_local_closure_v2.py \
            --allow-ci \
            --output /tmp/CLAYCODE_VPS_WP02_STRICT.json
          rc=$?
          python3 tools/claycode_wp02_oob_trivia_metamorphic.py \
            --output /tmp/CLAYCODE_VPS_WP02_OOB_TRIVIA.json
          oob_rc=$?
          python3 tools/claycode_wp06_current_main_replay.py \
            --output /tmp/CLAYCODE_VPS_WP06_REPLAY.json
          wp06_rc=$?
          set -e

          python3 - "$rc" "$oob_rc" "$wp06_rc" <<'PY'
          import json, os, platform, socket, sys
          from datetime import datetime, timezone
          from pathlib import Path

          rc=int(sys.argv[1]); oob_rc=int(sys.argv[2]); wp06_rc=int(sys.argv[3])
          def read(path, fallback):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception as exc:
                  return {**fallback, 'parse_error':f'{type(exc).__name__}:{exc}'}
          inner=read('/tmp/CLAYCODE_VPS_WP02_STRICT.json', {'pass':False})
          oob=read('/tmp/CLAYCODE_VPS_WP02_OOB_TRIVIA.json', {'pass':False})
          wp06=read('/tmp/CLAYCODE_VPS_WP06_REPLAY.json', {'pass':False})
          authority=read('/tmp/CLAYCODE_VPS_WP02_AUTHORITY.json', {'checkout_persist_credentials':None})
          payload={
              'schema_version':'1.2',
              'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
              'scope':'REMOTE_PRELIMINARY_WP02_PLUS_WP06_REPLAY_NOT_ANDREAS_TARGET_ACCEPTANCE',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'github_sha':os.environ.get('GITHUB_SHA',''),
              'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
              'hostname':socket.gethostname(),
              'runner_name':os.environ.get('RUNNER_NAME','unknown'),
              'runner_os':os.environ.get('RUNNER_OS','unknown'),
              'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
              'platform':platform.platform(),
              'python':platform.python_version(),
              'command_returncode':rc,
              'wp02_pass':inner.get('pass') is True and rc==0,
              'selected_grammar':inner.get('selected_grammar'),
              'selected_grammar_sha256':inner.get('selected_grammar',{}).get('sha256') if isinstance(inner.get('selected_grammar'),dict) else inner.get('grammar_sha256'),
              'inner_receipt':inner,
              'oob_experiment_returncode':oob_rc,
              'oob_experiment_pass':oob.get('pass') is True and oob_rc==0,
              'oob_experiment':oob,
              'wp06_replay_returncode':wp06_rc,
              'wp06_replay_pass':wp06.get('pass') is True and wp06_rc==0,
              'wp06_replay':wp06,
              'execution_authority':authority,
              'self_hosted_repository_permission':'contents:read',
              'checkout_persist_credentials':False,
              'authority_invariant':'model output != execution authority',
              'final_release_boundary':'This remote VPS receipt cannot substitute for registered Andreas Ubuntu target identity, desktop/application gates, formal WP06 promotion or WP14 release acceptance.',
          }
          Path('/tmp/CLAYCODE_VPS_WP02_SUMMARY.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'wp02_pass':payload['wp02_pass'],'oob_pass':payload['oob_experiment_pass'],'wp06_replay_pass':payload['wp06_replay_pass'],'hostname':payload['hostname'],'runner_name':payload['runner_name']},sort_keys=True))
          PY

          echo "probe_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "oob_rc=$oob_rc" >> "$GITHUB_OUTPUT"
          echo "wp06_rc=$wp06_rc" >> "$GITHUB_OUTPUT"

      - name: Upload bounded VPS receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claycode-vps-wp02-${{ github.run_id }}
          path: /tmp/CLAYCODE_VPS_WP02_SUMMARY.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce preliminary WP02, OOB and WP06 replay results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/CLAYCODE_VPS_WP02_SUMMARY.json',encoding='utf-8'))
          assert p['scope']=='REMOTE_PRELIMINARY_WP02_PLUS_WP06_REPLAY_NOT_ANDREAS_TARGET_ACCEPTANCE'
          assert p['self_hosted_repository_permission']=='contents:read'
          assert p['checkout_persist_credentials'] is False
          assert p['wp02_pass'] is True, p
          assert p['oob_experiment_pass'] is True, p
          assert p['wp06_replay_pass'] is True, p
          print('CLAYCODE_REMOTE_VPS_WP02_STRICT=PASS')
          print('CLAYCODE_GO_OOB_TRIVIA_METAMORPHIC=PASS')
          print('CLAYCODE_REMOTE_VPS_WP06_CURRENT_MAIN_REPLAY=PASS')
          PY

  persist-receipt:
    if: always()
    needs: wp02-vps
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout persistence lane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Download VPS receipt artifact
        uses: actions/download-artifact@v4
        with:
          name: claycode-vps-wp02-${{ github.run_id }}
          path: /tmp/claycode-vps-wp02

      - name: Validate transport and bind tested commit
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/claycode-vps-wp02/CLAYCODE_VPS_WP02_SUMMARY.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema_version']=='1.2'
          assert d['evidence_class']=='REAL_SELF_HOSTED_UBUNTU_EXECUTION'
          assert d['scope']=='REMOTE_PRELIMINARY_WP02_PLUS_WP06_REPLAY_NOT_ANDREAS_TARGET_ACCEPTANCE'
          assert d['github_sha']==os.environ['TESTED_SHA'], (d['github_sha'], os.environ['TESTED_SHA'])
          assert d['self_hosted_repository_permission']=='contents:read'
          assert d['checkout_persist_credentials'] is False
          assert d['authority_invariant']=='model output != execution authority'
          print(json.dumps({'transport_valid':True,'tested_sha':d['github_sha'],'wp02_pass':d['wp02_pass'],'oob_pass':d['oob_experiment_pass'],'wp06_replay_pass':d['wp06_replay_pass']},sort_keys=True))
          PY

      - name: Persist receipt from constrained hosted writer
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          src=/tmp/claycode-vps-wp02/CLAYCODE_VPS_WP02_SUMMARY.json
          mkdir -p research_entity/claycode/remote_vps/runs
          cp "$src" "research_entity/claycode/remote_vps/runs/${RUN_ID}.json"
          cp "$src" research_entity/claycode/remote_vps/LATEST_WP02_STRICT.json

          git config user.name 'claycode-receipt-writer'
          git config user.email 'claycode-receipt-writer@users.noreply.github.com'
          git add research_entity/claycode/remote_vps/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "evidence(vps): persist ClayCode WP02/WP06 run ${RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1
