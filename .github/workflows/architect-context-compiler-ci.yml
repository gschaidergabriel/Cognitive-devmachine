name: Architect Context Compiler CI

on:
  pull_request:
    paths:
      - "tools/architect_context_compiler.py"
      - "tests/test_architect_context_compiler.py"
      - ".github/workflows/architect-context-compiler-ci.yml"
  push:
    branches:
      - "chatgpt/grid10-cognitive-envelope-control-20260828"
    paths:
      - "tools/architect_context_compiler.py"
      - "tests/test_architect_context_compiler.py"
      - ".github/workflows/architect-context-compiler-ci.yml"

permissions:
  contents: read

jobs:
  context-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile tools/architect_context_compiler.py tests/test_architect_context_compiler.py
      - name: Regression tests
        run: python -m pytest -q tests/test_architect_context_compiler.py
