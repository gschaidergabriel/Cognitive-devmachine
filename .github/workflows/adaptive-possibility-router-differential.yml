name: Adaptive Possibility Router Differential

on:
  pull_request:
    branches: [main]
    paths:
      - 'rae_core/adaptive_possibility_router.py'
      - 'rae_core/possibility_preprocessor.py'
      - 'tools/adaptive_possibility_router_benchmark.py'
      - 'benchmarks/possibility_preprocessor/**'
      - '.github/workflows/adaptive-possibility-router-differential.yml'
  push:
    branches: ['research/unifieddb-adaptive-preprocessor-20260810-v2']
    paths:
      - 'rae_core/adaptive_possibility_router.py'
      - 'tools/adaptive_possibility_router_benchmark.py'
      - '.github/workflows/adaptive-possibility-router-differential.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile candidate
        run: python -m py_compile rae_core/possibility_preprocessor.py rae_core/adaptive_possibility_router.py tools/adaptive_possibility_router_benchmark.py tools/claygraph_query.py tools/claygraph_build.py
      - name: Build derived source database
        run: python tools/build_source_db.py --db research_sources/sources.db
      - name: Run adaptive differential
        run: |
          mkdir -p /tmp/clay-bench
          python tools/adaptive_possibility_router_benchmark.py --repeat 7 --output /tmp/clay-bench/adaptive.json
      - name: Enforce lesion gate
        run: |
          python - <<'PY'
          import json
          p='/tmp/clay-bench/adaptive.json'
          x=json.load(open(p))
          gate=x['adaptive_vs_always_on']
          print(json.dumps(gate,indent=2))
          if not gate['quality_non_degraded']:
              raise SystemExit('FAIL: adaptive routing degraded retrieval quality; lesion candidate')
          PY
      - name: Attach runtime metadata
        run: |
          python - <<'PY'
          import json, os, pathlib, platform, sqlite3, sys
          p=pathlib.Path('/tmp/clay-bench/adaptive.json')
          x=json.loads(p.read_text())
          x['execution_metadata']={
            'git_sha':os.environ.get('GITHUB_SHA'),
            'run_id':os.environ.get('GITHUB_RUN_ID'),
            'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'runner_os':os.environ.get('RUNNER_OS'),
            'runner_arch':os.environ.get('RUNNER_ARCH'),
            'runner_name':os.environ.get('RUNNER_NAME'),
            'python':sys.version,
            'sqlite':sqlite3.sqlite_version,
            'platform':platform.platform(),
            'machine':platform.machine(),
          }
          p.write_text(json.dumps(x,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-possibility-router-differential
          path: /tmp/clay-bench/adaptive.json
