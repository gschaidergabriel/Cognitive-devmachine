name: ClayVerse Hosted Sandbox Sentinel

on:
  push:
    branches:
      - gpt56sol/go-clayverse-oci-hosted-sandbox-20260817

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind isolated runner and source
        shell: bash
        run: |
          set -euo pipefail
          echo "CLAYVERSE_EXECUTION_SURFACE=GITHUB_HOSTED_EPHEMERAL"
          echo "CLAYVERSE_SELF_HOSTED=false"
          echo "CLAYVERSE_VPS=false"
          echo "CLAYVERSE_UNUSUAL_EXPERIMENT_ADDED=0"
          echo "commit=$GITHUB_SHA"
          git rev-parse "$GITHUB_SHA:the artefact"
          docker version
