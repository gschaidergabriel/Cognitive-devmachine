name: ClayCode frozen FRANK score handoff
on:
  workflow_dispatch:
  push:
    paths:
      - 'research_entity/claycode/base/examples/FRANK_ACTIVE_ASSEMBLY_SCORE_V1.clay'
      - 'research_entity/harness/reference/active_assembly.py'
      - 'tools/claycode_frank_score_handoff_validation.py'
      - 'tools/claycode_base_pure_toolchain.py'
      - '.github/workflows/claycode-frank-score-handoff.yml'
permissions:
  contents: write
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - run: cc --version
      - run: python tools/claycode_frank_score_handoff_validation.py
      - name: Preserve receipt
        run: |
          git config user.name 'claycode-frank-handoff'
          git config user.email 'claycode-frank-handoff@users.noreply.github.com'
          git add research_entity/claycode/autonomous/FRANK_ACTIVE_ASSEMBLY_SCORE_HANDOFF_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record frozen FRANK score handoff receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
