name: RAE research tool bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_entity/runtime/tool_requests/*.json'
      - 'tools/research_tool_bridge.py'
      - 'tools/groq_inference.py'
      - 'tools/mistral_inference.py'
      - 'tools/frank_dynamic_research_fusion.py'
      - 'tools/rae_secret_loader.py'
      - 'research_entity/private/GROQ_API.env'
      - 'research_entity/private/API_TOKENS.env'
      - '.github/workflows/research-tool-bridge.yml'

concurrency:
  group: rae-research-tool-bridge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute-requests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install optional provider SDKs
        run: python -m pip install --disable-pip-version-check --quiet ddgs e2b

      - name: Validate bridge and worker adapters
        run: python -m py_compile tools/research_tool_bridge.py tools/mistral_inference.py tools/frank_dynamic_research_fusion.py

      - name: Refresh dynamic FRANK research input
        run: python tools/frank_dynamic_research_fusion.py --write > /tmp/frank-fusion-summary.json

      - name: Process pending allowlisted requests
        run: python tools/research_tool_bridge.py --all-pending > /tmp/bridge-summary.json

      - name: Commit sanitized tool results, quota state and FRANK fusion input
        run: |
          git config user.name 'rae-tool-bridge'
          git config user.email 'rae-tool-bridge@users.noreply.github.com'
          git add research_entity/runtime/tool_results/ research_entity/runtime/TOOL_QUOTA_STATE.json research_entity/runtime/MISTRAL_KEY_POOL_STATE.json research_entity/runtime/frank_fusion/CURRENT_RESEARCH_INPUT.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Record research tool results and refresh FRANK fusion input'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
