name: GO877 clay-direct-dev Forge backfill refresh

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: go877-clay-direct-dev-forge-backfill-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] activate backlog-first forge' && github.event.issue.user.login == 'gschaidergabriel'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Activate current backlog-first Forge inside clay-direct-dev
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/clay-forge-backfill-refresh

          runtime=''
          exec_prefix=()
          found='false'
          try_runtime() {
            local rt="$1"
            if ! command -v "$rt" >/dev/null 2>&1; then return 1; fi
            if "$rt" inspect clay-direct-dev >/dev/null 2>&1; then
              runtime="$rt"; exec_prefix=("$rt" exec clay-direct-dev); found='true'; return 0
            fi
            if command -v sudo >/dev/null 2>&1 && sudo -n "$rt" inspect clay-direct-dev >/dev/null 2>&1; then
              runtime="sudo-$rt"; exec_prefix=(sudo -n "$rt" exec clay-direct-dev); found='true'; return 0
            fi
            return 1
          }
          try_runtime docker || try_runtime podman || true
          if [[ "$found" != true ]] && command -v incus >/dev/null 2>&1 && incus info clay-direct-dev >/dev/null 2>&1; then
            runtime='incus'; exec_prefix=(incus exec clay-direct-dev --); found='true'
          fi
          if [[ "$found" != true ]] && command -v lxc >/dev/null 2>&1 && lxc info clay-direct-dev >/dev/null 2>&1; then
            runtime='lxc'; exec_prefix=(lxc exec clay-direct-dev --); found='true'
          fi
          if [[ "$found" != true ]]; then
            printf '{"schema":"CLAY_FORGE_BACKFILL_RUNTIME_REFRESH/v1","status":"BLOCKED_SANDBOX_NOT_DISCOVERED","sandbox":"clay-direct-dev"}\n' > /tmp/clay-forge-backfill-refresh/receipt.json
            exit 1
          fi

          "${exec_prefix[@]}" sh -lc 'cat > /tmp/clay-forge-backfill-refresh-inner.sh <<"INNER"
          set -eu
          ART=/artifacts/clay-entityos-swarm
          FORGE_STATUS="$ART/forge/STATUS.json"
          REQUIRED_COMMIT=8044b5c8eec56ceafb632a28f09350d013281d94

          old_pids="$(pgrep -f "[r]un_free_evidence_forge_safe.py" || true)"
          repo=""
          for pid in $old_pids; do
            cwd="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
            if [ -n "$cwd" ] && [ -d "$cwd/.git" ]; then repo="$cwd"; break; fi
          done
          if [ -z "$repo" ]; then
            for root in /workspace /workspaces /srv /opt /home /root; do
              [ -d "$root" ] || continue
              gitdir="$(find "$root" -maxdepth 4 -type d -name .git 2>/dev/null | head -n 1 || true)"
              if [ -n "$gitdir" ]; then
                candidate="${gitdir%/.git}"
                remote="$(git -C "$candidate" remote get-url origin 2>/dev/null || true)"
                case "$remote" in *clay-global-research-entity*) repo="$candidate"; break ;; esac
              fi
            done
          fi
          if [ -z "$repo" ] || [ ! -d "$repo/.git" ]; then
            printf "%s\n" "{\"schema\":\"CLAY_FORGE_BACKFILL_RUNTIME_REFRESH/v1\",\"status\":\"BLOCKED_REPO_NOT_FOUND\"}" > /tmp/clay-forge-backfill-receipt.json
            exit 2
          fi

          git -C "$repo" fetch -q origin main
          local_head="$(git -C "$repo" rev-parse HEAD)"
          remote_head="$(git -C "$repo" rev-parse origin/main)"
          dirty="$(git -C "$repo" status --porcelain=v1)"
          if ! git -C "$repo" merge-base --is-ancestor "$REQUIRED_COMMIT" "$local_head" 2>/dev/null; then
            if [ -n "$dirty" ]; then
              REPO="$repo" LOCAL_HEAD="$local_head" REMOTE_HEAD="$remote_head" python3 - <<"PY" > /tmp/clay-forge-backfill-receipt.json
          import json, os
          print(json.dumps({"schema":"CLAY_FORGE_BACKFILL_RUNTIME_REFRESH/v1","status":"BLOCKED_DIRTY_STALE_CHECKOUT","repo":os.environ["REPO"],"local_head":os.environ["LOCAL_HEAD"],"remote_head":os.environ["REMOTE_HEAD"]}, sort_keys=True))
          PY
              exit 3
            fi
            git -C "$repo" merge --ff-only -q origin/main
            local_head="$(git -C "$repo" rev-parse HEAD)"
          fi
          grep -q "run_free_evidence_forge_backfill" "$repo/tools/run_free_evidence_forge_safe.py" || {
            printf "%s\n" "{\"schema\":\"CLAY_FORGE_BACKFILL_RUNTIME_REFRESH/v1\",\"status\":\"BLOCKED_BACKFILL_ALIAS_NOT_PRESENT\"}" > /tmp/clay-forge-backfill-receipt.json
            exit 4
          }

          for pid in $old_pids; do kill "$pid" 2>/dev/null || true; done
          i=0
          while [ $i -lt 20 ]; do
            alive="$(pgrep -f "[r]un_free_evidence_forge_safe.py" || true)"
            [ -z "$alive" ] && break
            sleep 1
            i=$((i+1))
          done
          for pid in $(pgrep -f "[r]un_free_evidence_forge_safe.py" || true); do kill -9 "$pid" 2>/dev/null || true; done

          supervisor="$(pgrep -f "[r]un_24h_entityos_swarm_supervisor.sh" || true)"
          if [ -z "$supervisor" ]; then
            mkdir -p "$ART"
            cd "$repo"
            nohup python3 tools/run_free_evidence_forge_safe.py --hours 24 --sleep-seconds 20 --discovery-parallel 8 --local-parallel 4 --e2b-parallel 20 >"$ART/forge.log" 2>&1 </dev/null &
            echo $! > "$ART/forge.pid"
          fi

          new_pids=""
          i=0
          while [ $i -lt 75 ]; do
            new_pids="$(pgrep -f "[r]un_free_evidence_forge_safe.py" || true)"
            if [ -n "$new_pids" ] && [ -s "$FORGE_STATUS" ]; then
              if python3 - "$FORGE_STATUS" <<"PY"
          import json, sys
          try: x=json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception: raise SystemExit(1)
          raise SystemExit(0 if isinstance(x.get("historical_backfill"), dict) else 1)
          PY
              then break; fi
            fi
            sleep 1
            i=$((i+1))
          done

          if [ -z "$new_pids" ] || [ ! -s "$FORGE_STATUS" ]; then
            REPO="$repo" HEAD="$local_head" OLD_PIDS="$old_pids" python3 - <<"PY" > /tmp/clay-forge-backfill-receipt.json
          import json, os
          print(json.dumps({"schema":"CLAY_FORGE_BACKFILL_RUNTIME_REFRESH/v1","status":"BLOCKED_RESTART_NOT_OBSERVED","repo":os.environ["REPO"],"repo_head":os.environ["HEAD"],"old_pids":os.environ.get("OLD_PIDS","").split()}, sort_keys=True))
          PY
            exit 5
          fi

          REPO="$repo" HEAD="$local_head" REMOTE_HEAD="$remote_head" OLD_PIDS="$old_pids" NEW_PIDS="$new_pids" STATUS_PATH="$FORGE_STATUS" python3 - <<"PY" > /tmp/clay-forge-backfill-receipt.json
          import datetime, hashlib, json, os, pathlib
          p=pathlib.Path(os.environ["STATUS_PATH"])
          raw=p.read_bytes()
          status=json.loads(raw)
          backfill=status.get("historical_backfill") or {}
          out={
            "schema":"CLAY_FORGE_BACKFILL_RUNTIME_REFRESH/v1",
            "created_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "status":"PASS_BACKLOG_FIRST_RUNTIME_OBSERVED" if isinstance(status.get("historical_backfill"),dict) else "BLOCKED_BACKFILL_STATUS_UNOBSERVED",
            "program":"ENTITYOS_HCU","product":"EntityOS","architecture":"HCU","mode":"FREE_ONLY",
            "sandbox":"clay-direct-dev","repo":os.environ["REPO"],"repo_head":os.environ["HEAD"],"remote_main_observed":os.environ["REMOTE_HEAD"],
            "required_alias_commit":"8044b5c8eec56ceafb632a28f09350d013281d94",
            "old_pids":os.environ.get("OLD_PIDS","").split(),"new_pids":os.environ.get("NEW_PIDS","").split(),
            "forge_status_sha256":hashlib.sha256(raw).hexdigest(),
            "historical_backfill":backfill,
            "ready_backlog":status.get("ready_backlog"),"implementation_backlog":status.get("implementation_backlog"),"deduplicated_backlog":status.get("deduplicated_backlog"),
            "evaluations":status.get("evaluations"),"accepted_deltas":status.get("accepted_deltas"),
            "provider_or_model_call_added_by_refresh":False,"unusual_experiment":False,
            "scope":"runtime activation/observation of already-authorized backlog-first Safe Forge only; no whole-product/model/training credit"
          }
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
          INNER
          sh /tmp/clay-forge-backfill-refresh-inner.sh'
          "${exec_prefix[@]}" cat /tmp/clay-forge-backfill-receipt.json > /tmp/clay-forge-backfill-refresh/receipt.json
          python3 -m json.tool /tmp/clay-forge-backfill-refresh/receipt.json >/dev/null

      - name: Persist bounded runtime receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/clay-forge-backfill-refresh/receipt.json || printf '{"schema":"CLAY_FORGE_BACKFILL_RUNTIME_REFRESH/v1","status":"BLOCKED_NO_RECEIPT"}\n' > /tmp/clay-forge-backfill-refresh/receipt.json
          mkdir -p research_entity/runtime/tool_results
          target="research_entity/runtime/tool_results/clay-forge-backfill-refresh-${GITHUB_RUN_ID}.json"
          cp /tmp/clay-forge-backfill-refresh/receipt.json "$target"
          git config user.name 'clay-direct-dev-runner'
          git config user.email 'clay-direct-dev-runner@users.noreply.github.com'
          git add "$target"
          git commit -m "evidence(vps): Forge backlog-first refresh ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
