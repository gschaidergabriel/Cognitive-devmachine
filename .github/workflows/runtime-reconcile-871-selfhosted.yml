name: EntityOS GO runtime authority + monitoring audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-reconcile-871-selfhosted.yml'
      - 'tools/free_provider_admission.py'
      - 'tools/free_swarm_restart_authority_attribution_v1.py'
      - 'tools/free_swarm_restart_authority_attribution_v3.py'
      - 'tools/free_swarm_restart_authority_attribution_v4.py'
      - 'free swarm/update_system_analysis_v4.py'
      - 'free swarm/update_system_analysis_v5.py'
      - 'free swarm/update_system_analysis_v6.py'
      - 'tools/system_analysis_current_reader_v1.py'
      - 'tools/system_analysis_authority_consumer_audit_v1.py'
      - 'tests/test_free_swarm_restart_authority_attribution_v3.py'
      - 'tests/test_free_swarm_restart_authority_attribution_v4.py'
      - 'tests/test_update_system_analysis_v4.py'
      - 'tests/test_update_system_analysis_v5.py'
      - 'tests/test_update_system_analysis_v6_publication_set.py'
      - 'tests/test_system_analysis_current_reader_v1.py'
      - 'tests/test_system_analysis_authority_consumer_audit_v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entityos-go-runtime-authority-current-main
  cancel-in-progress: true

jobs:
  audit-runtime-authority:
    if: github.actor == 'gschaidergabriel'
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository-bound source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/clay-go-runtime-audit
          rm -rf "$OUT"
          mkdir -p "$OUT"
          test -z "$(git status --porcelain=v1)"
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "TREE=$(git rev-parse 'HEAD^{tree}')"
            echo "PYTHON=$(python3 --version 2>&1)"
          } > "$OUT/source-identity.txt"
          sha256sum \
            tools/free_provider_admission.py \
            tools/free_swarm_restart_authority_attribution_v1.py \
            tools/free_swarm_restart_authority_attribution_v3.py \
            tools/free_swarm_restart_authority_attribution_v4.py \
            'free swarm/update_system_analysis_v4.py' \
            'free swarm/update_system_analysis_v5.py' \
            'free swarm/update_system_analysis_v6.py' \
            tools/system_analysis_current_reader_v1.py \
            tools/system_analysis_authority_consumer_audit_v1.py \
            > "$OUT/source-sha256.txt"

      - name: Resolve current provider authority without provider calls
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/clay-go-runtime-audit
          python3 tools/free_provider_admission.py --json > "$OUT/provider-admission.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/clay-go-runtime-audit/provider-admission.json')
          x=json.loads(p.read_text())
          providers=x.get('providers') or x.get('provider_admission') or {}
          admitted=[]
          if isinstance(providers,dict):
              for name,val in providers.items():
                  if isinstance(val,dict):
                      on=bool(val.get('admitted') or val.get('enabled') or val.get('allowed'))
                  else:
                      on=bool(val)
                  if on: admitted.append(name)
          epoch=str(x.get('authority_epoch') or '')
          if not epoch:
              raise SystemExit('provider admission missing authority_epoch')
          if admitted:
              raise SystemExit('provider authority is not HARD_OFF: '+','.join(admitted))
          print(json.dumps({'state':'PASS_HARD_OFF','authority_epoch':epoch,'admitted_providers':admitted,
                            'provider_calls':0,'secret_lookups':0},sort_keys=True))
          PY

      - name: Execute repository-bound P0 regression stack
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/clay-go-runtime-audit
          python3 -m pytest -q \
            tests/test_free_swarm_restart_authority_attribution_v3.py \
            tests/test_free_swarm_restart_authority_attribution_v4.py \
            tests/test_update_system_analysis_v4.py \
            tests/test_update_system_analysis_v5.py \
            tests/test_update_system_analysis_v6_publication_set.py \
            tests/test_system_analysis_current_reader_v1.py \
            tests/test_system_analysis_authority_consumer_audit_v1.py \
            > "$OUT/p0-tests.stdout" 2> "$OUT/p0-tests.stderr"

      - name: Audit production monitoring consumers
        id: consumer_audit
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/clay-go-runtime-audit
          python3 tools/system_analysis_authority_consumer_audit_v1.py --repo . \
            > "$OUT/consumer-audit.json" 2> "$OUT/consumer-audit.stderr"

      - name: Read-only live restart-authority attribution
        id: restart_attribution
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/clay-go-runtime-audit
          python3 tools/free_swarm_restart_authority_attribution_v4.py \
            --output "$OUT/restart-authority-v4.json" \
            > "$OUT/restart-authority-v4.stdout" 2> "$OUT/restart-authority-v4.stderr"

      - name: Verified CURRENT publication readback if present
        id: current_read
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/clay-go-runtime-audit
          if [[ -f 'free swarm/SYSTEM_ANALYSIS_CURRENT.json' ]]; then
            python3 tools/system_analysis_current_reader_v1.py --repo . --json \
              > "$OUT/current-read.json" 2> "$OUT/current-read.stderr"
          else
            printf '%s\n' '{"state":"NOT_YET_PUBLISHED","runtime_credit":0}' > "$OUT/current-read.json"
            exit 2
          fi

      - name: Build fail-closed audit result
        if: always()
        shell: bash
        run: |
          OUT=/tmp/clay-go-runtime-audit
          python3 - <<'PY' > "$OUT/result.json"
          import hashlib, json
          from pathlib import Path
          out=Path('/tmp/clay-go-runtime-audit')
          def load(name):
              try:
                  x=json.loads((out/name).read_text()); return x if isinstance(x,dict) else {}
              except Exception:return {}
          def digest(name):
              p=out/name
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          adm=load('provider-admission.json')
          audit=load('consumer-audit.json')
          attr=load('restart-authority-v4.json')
          cur=load('current-read.json')
          repository_tests_ok=(out/'p0-tests.stdout').exists() and not (out/'p0-tests.stderr').read_text(errors='replace').strip()
          hard_off=not bool(adm.get('provider_routes_admitted', False))
          state='SOURCE_STACK_EXECUTED_RUNTIME_QUIESCENCE_PENDING'
          if audit.get('state')!='PASS': state='BLOCKED_AUTHORITY_CONSUMER_MIGRATION_REQUIRED'
          print(json.dumps({
              'schema':'ENTITYOS_GO_RUNTIME_AUTHORITY_AUDIT/v1',
              'state':state,
              'provider_authority_epoch':adm.get('authority_epoch'),
              'provider_routes_admitted':adm.get('provider_routes_admitted'),
              'hard_off_observed':hard_off,
              'consumer_audit_state':audit.get('state'),
              'consumer_violations':audit.get('violations'),
              'consumer_review':audit.get('review_non_authority_direct_mirror_refs'),
              'restart_attribution_decision':attr.get('decision'),
              'restart_matched_count':attr.get('matched_count'),
              'restart_actionable_count':attr.get('actionable_count'),
              'safe_to_kill_from_restart_receipt':False,
              'current_monitor_read_state':cur.get('state'),
              'current_publication_generation':cur.get('publication_generation'),
              'provider_calls':0,
              'secret_values_inspected':False,
              'processes_killed':0,
              'processes_started':0,
              'publisher_switched':False,
              'runtime_quiescence_credit':0,
              'physical_grid10_credit':0,
              'hcu_credit':0,
              'training_credit':0,
              'artifact_sha256':{
                  'source_identity':digest('source-identity.txt'),
                  'source_sha256':digest('source-sha256.txt'),
                  'provider_admission':digest('provider-admission.json'),
                  'p0_tests_stdout':digest('p0-tests.stdout'),
                  'p0_tests_stderr':digest('p0-tests.stderr'),
                  'consumer_audit':digest('consumer-audit.json'),
                  'restart_authority_v4':digest('restart-authority-v4.json'),
                  'current_read':digest('current-read.json'),
              },
              'next_exact_action':'If consumer audit reports violations, migrate those authority/runtime-credit consumers to read_current_publication before any retained v6 publisher switch. Restart attribution remains read-only; no kill is authorized by this workflow.'
          },indent=2,sort_keys=True))
          PY
          cat "$OUT/result.json"

      - name: Upload sanitized audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entityos-go-runtime-authority-audit
          path: |
            /tmp/clay-go-runtime-audit/source-identity.txt
            /tmp/clay-go-runtime-audit/source-sha256.txt
            /tmp/clay-go-runtime-audit/provider-admission.json
            /tmp/clay-go-runtime-audit/p0-tests.stdout
            /tmp/clay-go-runtime-audit/p0-tests.stderr
            /tmp/clay-go-runtime-audit/consumer-audit.json
            /tmp/clay-go-runtime-audit/consumer-audit.stderr
            /tmp/clay-go-runtime-audit/restart-authority-v4.json
            /tmp/clay-go-runtime-audit/restart-authority-v4.stdout
            /tmp/clay-go-runtime-audit/restart-authority-v4.stderr
            /tmp/clay-go-runtime-audit/current-read.json
            /tmp/clay-go-runtime-audit/current-read.stderr
            /tmp/clay-go-runtime-audit/result.json
          if-no-files-found: warn
          retention-days: 7
