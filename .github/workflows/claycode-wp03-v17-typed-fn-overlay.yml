name: ClayCode WP03 V17 Typed-Fn Overlay Ubuntu

on:
  push:
    branches:
      - chatgpt/go-wp03-v17-typed-fn-shadow-20260810
    paths:
      - '.github/workflows/claycode-wp03-v17-typed-fn-overlay.yml'
      - 'tools/claycode_wp03_v17_typed_fn_overlay_validation.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_RESEARCH_V17_WP03_TYPED_FN_OVERLAY.lark'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_typed_ir.py'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hosted-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated strict parser environment
        run: |
          python3 -m venv /tmp/clay-wp03-v17fn-hosted-${GITHUB_RUN_ID}
          /tmp/clay-wp03-v17fn-hosted-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Strict frontend and typed-IR differential
        env:
          PYTHONPATH: tools
          PYTHONSAFEPATH: '1'
        run: |
          VENV=/tmp/clay-wp03-v17fn-hosted-${GITHUB_RUN_ID}
          "$VENV/bin/python" tools/claycode_wp03_v17_typed_fn_overlay_validation.py --output /tmp/clay_wp03_v17fn_hosted.json
          cat /tmp/clay_wp03_v17fn_hosted.json
      - name: Upload bounded hosted receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clay-wp03-v17-typed-fn-hosted-${{ github.sha }}
          path: /tmp/clay_wp03_v17fn_hosted.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove isolated environment
        if: always()
        run: rm -rf /tmp/clay-wp03-v17fn-hosted-${GITHUB_RUN_ID}

  hostinger-probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build isolated strict parser environment
        run: |
          python3 -m venv /tmp/clay-wp03-v17fn-hostinger-${GITHUB_RUN_ID}
          /tmp/clay-wp03-v17fn-hostinger-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Strict differential and persist exact bounded receipt
        env:
          PYTHONPATH: tools
          PYTHONSAFEPATH: '1'
        run: |
          VENV=/tmp/clay-wp03-v17fn-hostinger-${GITHUB_RUN_ID}
          "$VENV/bin/python" tools/claycode_wp03_v17_typed_fn_overlay_validation.py --output /tmp/clay_wp03_v17fn_hostinger.json
          python3 - <<'PY'
          import json, os, pathlib
          src=pathlib.Path('/tmp/clay_wp03_v17fn_hostinger.json')
          d=json.loads(src.read_text(encoding='utf-8'))
          d['receipt_id']='CLAYCODE-WP03-V17-TYPED-FN-HOSTINGER-'+os.environ['GITHUB_RUN_ID']
          d['commit']=os.environ['GITHUB_SHA']
          d['run_id']=os.environ['GITHUB_RUN_ID']
          d['runner_name']=os.environ.get('RUNNER_NAME','UNKNOWN')
          d['truth_class']='VERIFIED_REMOTE_EXECUTION_BOUNDED_WP03_SHADOW_SCOPE'
          d['promotion']='CANDIDATE_ONLY'
          out=pathlib.Path('research_entity/claycode/base/receipts/WP03_V17_TYPED_FN_OVERLAY_HOSTINGER_LATEST.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name 'clay-hostinger-runner'
          git config user.email 'clay-hostinger-runner@users.noreply.github.com'
          git add research_entity/claycode/base/receipts/WP03_V17_TYPED_FN_OVERLAY_HOSTINGER_LATEST.json
          git commit -m 'evidence(claycode): record WP03 V17 typed-fn Hostinger shadow' || exit 0
          branch="${GITHUB_REF_NAME}"
          for n in 1 2 3 4 5; do
            git fetch origin "$branch"
            git rebase "origin/$branch" && git push origin "HEAD:$branch" && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
      - name: Remove isolated environment
        if: always()
        run: rm -rf /tmp/clay-wp03-v17fn-hostinger-${GITHUB_RUN_ID}
