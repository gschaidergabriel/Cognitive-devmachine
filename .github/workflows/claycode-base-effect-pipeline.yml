name: ClayCode BASE effect pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_compiler.py'
      - 'tools/claycode_base_effect_pipeline.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - '.github/workflows/claycode-base-effect-pipeline.yml'

concurrency:
  group: claycode-base-effect-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  effect-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Execute integrated effect pipeline self-test
        run: |
          python tools/claycode_base_effect_pipeline.py --self-test \
            --output research_entity/claycode/autonomous/BASE_EFFECT_PIPELINE_RECEIPT.json
      - name: Fail closed on promotion or differential regression
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/BASE_EFFECT_PIPELINE_RECEIPT.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['pass'] is True
          assert d['translation_output_mismatches'] == 0
          assert d['translation_trace_mismatches'] == 0
          assert d['missing_capability_rejected'] is True
          assert d['textual_capability_not_authority'] is True
          assert d['counts_as_work_package_pass'] is False
          assert d['counts_as_target_acceptance'] is False
          print('BASE_EFFECT_PIPELINE_PROXY_PASS')
          PY
      - name: Commit integration receipt
        run: |
          git config user.name 'claycode-base-effect-pipeline'
          git config user.email 'claycode-base-effect-pipeline@users.noreply.github.com'
          git add research_entity/claycode/autonomous/BASE_EFFECT_PIPELINE_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record integrated BASE effect pipeline receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
