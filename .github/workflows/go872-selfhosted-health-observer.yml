name: GO872 self-hosted health observer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/go872-selfhosted-health-observer.yml'
      - '.github/workflows/go872-selfhosted-health-worker.yml'
      - 'tools/go872_selfhosted_health_receipt.py'
      - 'tests/test_go872_selfhosted_health_receipt.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: go872-selfhosted-health-observer
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout persistence lane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Dispatch worker and observe claim/completion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: go872-selfhosted-health-worker.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          workflow=os.environ['TARGET_WORKFLOW']
          api=f'https://api.github.com/repos/{repo}'
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {token}',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'clay-go872-health-observer',
          }

          def request(method,url,data=None):
              body=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(url,data=body,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read()
                      try: payload=json.loads(raw) if raw else None
                      except Exception: payload={'raw':raw.decode('utf-8','replace')}
                      return r.status,payload
              except urllib.error.HTTPError as e:
                  raw=e.read()
                  try: payload=json.loads(raw) if raw else None
                  except Exception: payload={'raw':raw.decode('utf-8','replace')}
                  return e.code,payload

          before_status,before=request('GET',f'{api}/actions/workflows/{workflow}/runs?event=workflow_dispatch&branch=main&per_page=20')
          before_ids={int(x['id']) for x in (before or {}).get('workflow_runs',[])} if before_status==200 else set()
          dispatch_at=datetime.now(timezone.utc).isoformat()
          dispatch_status,dispatch_body=request('POST',f'{api}/actions/workflows/{workflow}/dispatches',{'ref':'main'})

          target_run_id=None
          target=None
          if dispatch_status in (200,204):
              if isinstance(dispatch_body,dict) and dispatch_body.get('workflow_run_id'):
                  target_run_id=int(dispatch_body['workflow_run_id'])
              for _ in range(45):
                  if target_run_id is not None:
                      status,payload=request('GET',f'{api}/actions/runs/{target_run_id}')
                      if status==200:
                          target=payload
                          break
                  status,payload=request('GET',f'{api}/actions/workflows/{workflow}/runs?event=workflow_dispatch&branch=main&per_page=30')
                  if status==200:
                      candidates=[x for x in payload.get('workflow_runs',[]) if int(x['id']) not in before_ids]
                      if candidates:
                          target=max(candidates,key=lambda x:int(x['id']))
                          target_run_id=int(target['id'])
                          break
                  time.sleep(2)

          completed=None
          latest=target
          if target_run_id is not None:
              for _ in range(80):
                  status,payload=request('GET',f'{api}/actions/runs/{target_run_id}')
                  if status==200:
                      latest=payload
                      if payload.get('status')=='completed':
                          completed=payload
                          break
                  time.sleep(3)

          status=(completed or latest or {}).get('status')
          conclusion=(completed or latest or {}).get('conclusion')
          if dispatch_status not in (200,204):
              classification='DISPATCH_REJECTED'
          elif target_run_id is None:
              classification='TARGET_RUN_NOT_OBSERVED'
          elif status=='completed' and conclusion=='success':
              classification='SELFHOSTED_HEALTH_WORKER_COMPLETED_SUCCESS'
          elif status=='completed':
              classification='SELFHOSTED_HEALTH_WORKER_COMPLETED_NON_SUCCESS'
          elif status=='in_progress':
              classification='SELFHOSTED_RUNNER_CLAIMED_NOT_TERMINAL_WITHIN_OBSERVER_WINDOW'
          elif status in ('queued','waiting','pending','requested'):
              classification='SELFHOSTED_RUNNER_NOT_CLAIMED_WITHIN_OBSERVER_WINDOW'
          else:
              classification='SELFHOSTED_TARGET_STATUS_UNRESOLVED'

          receipt={
              'schema':'CLAY_GO872_SELFHOSTED_HEALTH_OBSERVER/v1',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'dispatch_at':dispatch_at,
              'program':'ENTITYOS_HCU',
              'product':'EntityOS',
              'compute_architecture':'HCU',
              'authority_epoch_expected':'8.72',
              'execution_mode':'FREE_ONLY',
              'observer_run_id':os.environ.get('GITHUB_RUN_ID'),
              'observer_head_sha':os.environ.get('GITHUB_SHA'),
              'target_workflow':workflow,
              'target_ref':'main',
              'before_list_status':before_status,
              'dispatch_http_status':dispatch_status,
              'dispatch_accepted':dispatch_status in (200,204),
              'target_run_observed':target_run_id is not None,
              'target_run_id':target_run_id,
              'target_head_sha':(completed or latest or {}).get('head_sha'),
              'target_status':status,
              'target_conclusion':conclusion,
              'target_html_url':(completed or latest or {}).get('html_url'),
              'classification':classification,
              'credit':{
                  'runtime_credit_minted':0,
                  'entityos_whole_credit':0,
                  'hcu_full_credit':0,
                  'jspace_model_credit':0,
                  'training_credit':0,
              },
              'scope_guard':'Observer evidence distinguishes dispatch acceptance, runner claim and workflow completion. It does not itself prove bridge internals, Forge->Distillery success, model execution, J-Space causality, training readiness or whole-product PASS.'
          }
          pathlib.Path('/tmp/CLAY_GO872_SELFHOSTED_HEALTH_OBSERVER.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,sort_keys=True))
          if dispatch_status not in (200,204):
              raise SystemExit(2)
          PY

      - name: Persist observer receipt to main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          outdir="research_entity/runtime/selfhosted_health"
          mkdir -p "$outdir"
          target="$outdir/observer-${GITHUB_RUN_ID}.json"
          if [[ -s /tmp/CLAY_GO872_SELFHOSTED_HEALTH_OBSERVER.json ]]; then
            cp /tmp/CLAY_GO872_SELFHOSTED_HEALTH_OBSERVER.json "$target"
          else
            printf '%s\n' '{"schema":"CLAY_GO872_SELFHOSTED_HEALTH_OBSERVER/v1","classification":"OBSERVER_RECEIPT_MISSING","credit":{"runtime_credit_minted":0,"entityos_whole_credit":0,"hcu_full_credit":0,"jspace_model_credit":0,"training_credit":0}}' > "$target"
          fi
          cp "$target" "$outdir/OBSERVER_LATEST.json"
          git config user.name 'clay-go872-health-observer'
          git config user.email 'clay-go872-health-observer@users.noreply.github.com'
          git add "$outdir/"
          git commit -m "evidence(go872): persist self-hosted observer ${GITHUB_RUN_ID} [skip ci]" || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
