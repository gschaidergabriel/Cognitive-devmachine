name: ClayCode WP03 Selected V17 Semantics Differential

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claycode-wp03-selected-v17-semantics-differential.yml'
      - 'tools/claycode_wp03_selected_v17_semantics_differential.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_RESEARCH_V7_TYPED_FN_V17_RELATION_MEMBRANE.lark'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_typed_ir.py'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
  pull_request:
    paths:
      - '.github/workflows/claycode-wp03-selected-v17-semantics-differential.yml'
      - 'tools/claycode_wp03_selected_v17_semantics_differential.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_RESEARCH_V7_TYPED_FN_V17_RELATION_MEMBRANE.lark'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_typed_ir.py'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hosted-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build isolated strict parser environment
        run: |
          python3 -m venv /tmp/clay-wp03-selected-v17-hosted-${GITHUB_RUN_ID}
          /tmp/clay-wp03-selected-v17-hosted-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Execute selected-semantics differential
        env:
          PYTHONPATH: tools
          PYTHONSAFEPATH: '1'
        run: |
          VENV=/tmp/clay-wp03-selected-v17-hosted-${GITHUB_RUN_ID}
          "$VENV/bin/python" tools/claycode_wp03_selected_v17_semantics_differential.py > /tmp/wp03_selected_v17_hosted.json
          cat /tmp/wp03_selected_v17_hosted.json
      - name: Upload hosted receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clay-wp03-selected-v17-${{ github.sha }}
          path: /tmp/wp03_selected_v17_hosted.json
          if-no-files-found: warn
          retention-days: 30
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/clay-wp03-selected-v17-hosted-${GITHUB_RUN_ID}

  hostinger-probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build isolated strict parser environment
        run: |
          python3 -m venv /tmp/clay-wp03-selected-v17-hostinger-${GITHUB_RUN_ID}
          /tmp/clay-wp03-selected-v17-hostinger-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Execute exact bounded differential
        env:
          PYTHONPATH: tools
          PYTHONSAFEPATH: '1'
        run: |
          VENV=/tmp/clay-wp03-selected-v17-hostinger-${GITHUB_RUN_ID}
          "$VENV/bin/python" tools/claycode_wp03_selected_v17_semantics_differential.py > /tmp/wp03_selected_v17_hostinger.json
          cat /tmp/wp03_selected_v17_hostinger.json
      - name: Persist exact bounded receipt on main push only
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          d=json.loads(pathlib.Path('/tmp/wp03_selected_v17_hostinger.json').read_text(encoding='utf-8'))
          d['receipt_id']='CLAYCODE-WP03-SELECTED-V17-SEMANTICS-HOSTINGER-'+os.environ['GITHUB_RUN_ID']
          d['commit']=os.environ['GITHUB_SHA']
          d['run_id']=os.environ['GITHUB_RUN_ID']
          d['runner_name']=os.environ.get('RUNNER_NAME','UNKNOWN')
          d['truth_class']='VERIFIED_REMOTE_EXECUTION_BOUNDED_WP03_SELECTED_SEMANTICS_SCOPE'
          out=pathlib.Path('research_entity/claycode/base/receipts/WP03_SELECTED_V17_SEMANTICS_HOSTINGER_LATEST.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name 'clay-hostinger-runner'
          git config user.email 'clay-hostinger-runner@users.noreply.github.com'
          git add research_entity/claycode/base/receipts/WP03_SELECTED_V17_SEMANTICS_HOSTINGER_LATEST.json
          git commit -m 'evidence(wp03): record selected V17 semantics differential' || exit 0
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/clay-wp03-selected-v17-hostinger-${GITHUB_RUN_ID}
