name: UnifiedDB Pulse S2 ABA-safe Shadow

on:
  push:
    branches: [chatgpt/go-pulse-s2-aba-safe-20260810]
    paths:
      - '.github/workflows/unifieddb-pulse-s2-aba-safe-shadow.yml'
      - 'research_entity/runtime/semantic_pulse_effectivizer_s2.py'
      - 'research_entity/runtime/test_semantic_pulse_effectivizer_s2.py'
      - 'research_entity/runtime/benchmark_semantic_pulse_effectivizer_s2.py'
  pull_request:
    paths:
      - '.github/workflows/unifieddb-pulse-s2-aba-safe-shadow.yml'
      - 'research_entity/runtime/semantic_pulse_effectivizer_s2.py'
      - 'research_entity/runtime/test_semantic_pulse_effectivizer_s2.py'
      - 'research_entity/runtime/benchmark_semantic_pulse_effectivizer_s2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact candidate identity
        run: |
          git rev-parse HEAD
          sha256sum research_entity/runtime/semantic_pulse_effectivizer_s2.py
          sha256sum research_entity/runtime/test_semantic_pulse_effectivizer_s2.py
      - name: S2 + SPM ABA regression tests
        working-directory: research_entity/runtime
        run: python3 -m unittest -v test_semantic_pulse_effectivizer_s2.PulseEffectivizerS2Tests
      - name: Bounded proxy benchmark
        working-directory: research_entity/runtime
        run: python3 benchmark_semantic_pulse_effectivizer_s2.py --reps 3 --batch-size 10

  hostinger-shadow:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Exact candidate identity
        run: |
          git rev-parse HEAD
          sha256sum research_entity/runtime/semantic_pulse_effectivizer_s2.py
          sha256sum research_entity/runtime/test_semantic_pulse_effectivizer_s2.py
          python3 - <<'PY'
          import json,os,platform,sqlite3,sys
          print(json.dumps({
            'runner_name':os.environ.get('RUNNER_NAME','UNKNOWN'),
            'platform':platform.platform(),
            'python':sys.version,
            'sqlite':sqlite3.sqlite_version,
          },sort_keys=True))
          PY
      - name: S2 + SPM ABA regression tests
        working-directory: research_entity/runtime
        run: python3 -m unittest -v test_semantic_pulse_effectivizer_s2.PulseEffectivizerS2Tests
      - name: Bounded proxy benchmark
        working-directory: research_entity/runtime
        run: python3 benchmark_semantic_pulse_effectivizer_s2.py --reps 3 --batch-size 10
