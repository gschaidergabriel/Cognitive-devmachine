name: Trigger4 PR430 UNKNOWN_OUTCOME on clay-direct-dev

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: trigger4-pr430-unknown-outcome-v1
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      github.repository == 'gschaidergabriel/clay-global-research-entity' &&
      github.event.issue.title == '[CLAY-DISPATCH] Trigger4 PR430 UNKNOWN_OUTCOME acceptance' &&
      github.event.issue.user.login == 'gschaidergabriel' &&
      contains(github.event.issue.body || '', 'dispatch_schema: CLAY_ORDINARY_DISPATCH/v1')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact event main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Validate singleton dispatch
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          body=str((event.get('issue') or {}).get('body') or '')
          fields={}
          for line in body.splitlines():
              if ':' in line:
                  k,v=line.split(':',1); k=k.strip()
                  if k in {'dispatch_schema','dispatch_key'} and k not in fields:
                      fields[k]=v.strip()
          if fields.get('dispatch_schema')!='CLAY_ORDINARY_DISPATCH/v1':
              raise SystemExit('invalid dispatch_schema')
          key=fields.get('dispatch_key','')
          if not re.fullmatch(r'trigger4-pr430-unknown-outcome-v1-g[0-9]{4}',key):
              raise SystemExit('invalid dispatch_key')
          spec_path=pathlib.Path('research_entity/continuity/ordinary_dispatch_specs/trigger4-pr430-unknown-outcome-v1.json')
          spec=json.loads(spec_path.read_text())
          expected=f"{spec['dispatch_class']}-g{int(spec['retry_generation']):04d}"
          if spec.get('current_dispatch_key')!=expected or key!=expected:
              raise SystemExit('stale/noncanonical dispatch key')
          if spec.get('authority_epoch')!='8.78':
              raise SystemExit('unexpected authority epoch')
          claim_path=pathlib.Path(f'research_entity/continuity/ordinary_dispatch_claims/{key}.json')
          if not claim_path.is_file():
              raise SystemExit('create-only claim missing')
          claim=json.loads(claim_path.read_text())
          if claim.get('dispatch_key')!=key or claim.get('dispatch_class')!=spec.get('dispatch_class'):
              raise SystemExit('claim mismatch')
          if claim.get('candidate_head_sha')!=spec.get('candidate_head_sha'):
              raise SystemExit('candidate-head claim mismatch')
          if claim.get('new_issue_authorized_by_this_claim') is not True:
              raise SystemExit('claim does not authorize issue')
          result=pathlib.Path(f'research_entity/continuity/ordinary_dispatch_results/{key}.json')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'dispatch_key={key}\n')
              out.write(f'candidate_head={spec["candidate_head_sha"]}\n')
              out.write(f'skip={str(result.is_file()).lower()}\n')
          print('ALREADY_SATISFIED' if result.is_file() else 'ADMITTED_SINGLETON',key)
          PY

      - name: Execute exact PR430 probe inside clay-direct-dev
        if: steps.dispatch.outputs.skip != 'true'
        shell: bash
        env:
          DISPATCH_KEY: ${{ steps.dispatch.outputs.dispatch_key }}
          EXPECTED_CANDIDATE: ${{ steps.dispatch.outputs.candidate_head }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          scratch='/tmp/trigger4-pr430-unknown-outcome'
          rm -rf "$scratch"
          mkdir -p "$scratch"

          runtime=''; found='false'; exec_prefix=()
          try_runtime() {
            local rt="$1"
            command -v "$rt" >/dev/null 2>&1 || return 1
            if "$rt" inspect clay-direct-dev >/dev/null 2>&1; then
              runtime="$rt"; exec_prefix=("$rt" exec clay-direct-dev); found='true'; return 0
            fi
            if command -v sudo >/dev/null 2>&1 && sudo -n "$rt" inspect clay-direct-dev >/dev/null 2>&1; then
              runtime="sudo-$rt"; exec_prefix=(sudo -n "$rt" exec clay-direct-dev); found='true'; return 0
            fi
            return 1
          }
          try_runtime docker || try_runtime podman || true
          if [[ "$found" != true ]] && command -v incus >/dev/null 2>&1 && incus info clay-direct-dev >/dev/null 2>&1; then
            runtime='incus'; exec_prefix=(incus exec clay-direct-dev --); found='true'
          fi
          if [[ "$found" != true ]] && command -v lxc >/dev/null 2>&1 && lxc info clay-direct-dev >/dev/null 2>&1; then
            runtime='lxc'; exec_prefix=(lxc exec clay-direct-dev --); found='true'
          fi

          runner_rc=20
          inner_present='false'
          if [[ "$found" == true ]]; then
            workdir="/tmp/clay-trigger4-pr430-${GITHUB_RUN_ID}"
            repo='https://github.com/gschaidergabriel/clay-global-research-entity.git'
            set +e
            "${exec_prefix[@]}" sh -lc "set -eu; rm -rf '$workdir'; git clone --no-checkout '$repo' '$workdir'; cd '$workdir'; git fetch --no-tags origin '$TARGET_SHA'; git checkout --detach '$TARGET_SHA'; test -z \"\$(git status --porcelain)\"; test \"\$(git rev-parse HEAD)\" = '$TARGET_SHA'; python3 tools/run_trigger4_pr430_unknown_outcome_acceptance_v1.py" > "$scratch/runner.stdout" 2> "$scratch/runner.stderr"
            runner_rc=$?
            set -e
            if "${exec_prefix[@]}" sh -lc "test -f '$workdir/artifacts/pr430-unknown-outcome-acceptance/receipt.json'"; then
              "${exec_prefix[@]}" sh -lc "cat '$workdir/artifacts/pr430-unknown-outcome-acceptance/receipt.json'" > "$scratch/inner.json"
              inner_present='true'
            fi
          else
            printf '%s\n' 'clay-direct-dev not discoverable on self-hosted runner' > "$scratch/runner.stderr"
            : > "$scratch/runner.stdout"
          fi

          if [[ "$inner_present" != true ]]; then
            RUNNER_RC="$runner_rc" python3 - <<'PY' > "$scratch/inner.json"
          import json, os
          print(json.dumps({
            'schema':'TRIGGER4_PR430_UNKNOWN_OUTCOME_DISPATCH_FAILURE/v1',
            'dispatch_head':os.environ['TARGET_SHA'],
            'candidate_expected_head':os.environ['EXPECTED_CANDIDATE'],
            'runner_exit_code':int(os.environ['RUNNER_RC']),
            'runner_receipt_present':False,
            'tests_started':False,
            'status':'BLOCKED',
            'bundle_pass':False,
            'real_external_effect':False,
            'canonical_effect_authority_promotion':False,
            'runtime_credit_scope':0},indent=2,sort_keys=True))
          PY
          fi

          RUNNER_RC="$runner_rc" INNER_PRESENT="$inner_present" RUNTIME="$runtime" python3 - <<'PY' > "$scratch/result.json"
          import json, os, pathlib
          inner=json.loads(pathlib.Path('/tmp/trigger4-pr430-unknown-outcome/inner.json').read_text())
          target=os.environ['TARGET_SHA']; candidate=os.environ['EXPECTED_CANDIDATE']
          present=os.environ['INNER_PRESENT']=='true'; rc=int(os.environ['RUNNER_RC'])
          status=inner.get('status') if inner.get('status') in {'PASS','FAIL','BLOCKED'} else 'BLOCKED'
          identity_ok=(inner.get('dispatch_head')==target and (inner.get('candidate_head') in {None,candidate}))
          passed=bool(present and identity_ok and rc==0 and status=='PASS' and inner.get('bundle_pass') is True)
          if not identity_ok:
              status='BLOCKED'; passed=False
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          out={
            'schema':'CLAY_ORDINARY_DISPATCH_RESULT/v1',
            'dispatch_key':os.environ['DISPATCH_KEY'],
            'dispatch_class':'trigger4-pr430-unknown-outcome-v1',
            'status':'PASS' if passed else status,
            'issue_number':(event.get('issue') or {}).get('number'),
            'run_id':os.environ.get('GITHUB_RUN_ID'),
            'event_sha':os.environ.get('GITHUB_SHA'),
            'checkout_head':target,
            'candidate_expected_head':candidate,
            'candidate_observed_head':inner.get('candidate_head'),
            'sandbox':'clay-direct-dev',
            'transport':'SELF_HOSTED_LINUX_X64',
            'container_runtime':os.environ.get('RUNTIME') or None,
            'runner_exit_code':rc,
            'runner_receipt_present':present,
            'tests_started':bool(inner.get('tests_started')),
            'runtime_credit':'EXACT_PR430_UNKNOWN_OUTCOME_COMPONENT_RUNTIME_ONLY' if passed else 0,
            'canonical_effect_authority_promotion':False,
            'physical_grid10_runtime_credit':0,
            'whole_hcu_runtime_credit':0,
            'whole_entityos_runtime_credit':0,
            'training_credit':0,
            'retry_requires_generation_advance':True}
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Persist singleton receipts
        if: steps.dispatch.outputs.skip != 'true'
        shell: bash
        env:
          DISPATCH_KEY: ${{ steps.dispatch.outputs.dispatch_key }}
        run: |
          set -euo pipefail
          scratch='/tmp/trigger4-pr430-unknown-outcome'
          mkdir -p research_entity/runtime/tool_results research_entity/continuity/ordinary_dispatch_results
          target="research_entity/runtime/tool_results/trigger4-pr430-unknown-outcome-${DISPATCH_KEY}.json"
          result="research_entity/continuity/ordinary_dispatch_results/${DISPATCH_KEY}.json"
          git fetch origin main
          if git show "origin/main:${result}" >/dev/null 2>&1; then
            echo "ALREADY_SATISFIED_REMOTE ${DISPATCH_KEY}"
            exit 0
          fi
          cp "$scratch/inner.json" "$target"
          cp "$scratch/result.json" "$result"
          git config user.name 'clay-direct-dev-runner'
          git config user.email 'clay-direct-dev-runner@users.noreply.github.com'
          git add "$target" "$result"
          git commit -m "evidence(vps): PR430 UNKNOWN_OUTCOME ${DISPATCH_KEY} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
