name: Research Entity Verify
on:
  push:
    branches: [main, rae-vnext-runtime]
    paths:
      - 'rae.py'
      - 'rae_core/**'
      - 'tools/**'
      - '.claude/**'
      - 'research_entity/continuity/**'
      - 'research_entity/global/**'
      - 'research_entity/ledgers/**'
      - 'research_entity/events/**'
      - 'research_entity/schemas/**'
      - 'benchmarks/**'
      - '.github/workflows/research-entity-verify.yml'
  pull_request:
    paths:
      - 'rae.py'
      - 'rae_core/**'
      - 'tools/**'
      - '.claude/**'
      - 'research_entity/continuity/**'
      - 'research_entity/global/**'
      - 'research_entity/ledgers/**'
      - 'research_entity/events/**'
      - 'research_entity/schemas/**'
      - 'benchmarks/**'
      - '.github/workflows/research-entity-verify.yml'
  workflow_dispatch:

concurrency:
  group: research-entity-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation runtime
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5'
      - name: Compile Python entrypoints
        run: python -m py_compile rae.py rae_core/*.py .claude/hooks/rae_hook.py tools/*.py
      - name: Validate Claude hook settings JSON
        run: python -m json.tool .claude/settings.json >/dev/null
      - name: Validate project research triggers
        run: python tools/validate_triggers.py
      - name: Refresh minimal bootstrap from canonical
        run: python tools/materialize_bootstrap.py
      - name: Worker boot preflight
        run: python tools/session_preflight.py --task 'CI verification'
      - name: Unified RAE status
        run: python rae.py status
      - name: Strict schema validation
        run: python tools/validate_research_entity.py
      - name: Multi-researcher provenance validation
        run: python tools/check_provenance.py
      - name: Materialize claim views
        run: python tools/materialize_research_views.py
      - name: Materialize surgical knowledge micro-packets
        run: python tools/materialize_micro_packets.py
      - name: Topicize archived source text and derivatives
        run: python tools/topicize_sources.py
      - name: Build embedded research graph database
        run: python tools/build_source_db.py --db research_sources/sources.db
      - name: Verify micro-packets reached searchable source materialization
        run: >-
          python -c "import sqlite3; c=sqlite3.connect('research_sources/sources.db'); n=c.execute(\"select count(*) from sources where path like '%knowledge_micro_packets%'\").fetchone()[0]; assert n>=1,n; print('micro-packet source projection indexed',n)"
      - name: Compile task-specific context
        run: python rae.py boot --actor claude-code-lead --task 'CI verify GWT XENO Clay Android research context' --max-claims 8 --max-packets 4 --max-chunks 2 >/tmp/context.json
      - name: Exercise relational query broker
        run: |
          python rae.py query 'hyperposition backend' --experiment EXP-LIVE-HYPERPOSITION-BACKEND --limit 8 >/tmp/query.json
          python -m json.tool /tmp/query.json >/dev/null
      - name: Run RAE retrieval benchmark
        run: |
          python rae.py benchmark --cases benchmarks/rae_vnext/cases.json >/tmp/benchmark.json
          cat /tmp/benchmark.json
      - name: Gate retrieval regression
        run: >-
          python -c "import json; x=json.load(open('/tmp/benchmark.json')); assert x['mean_recall'] >= 0.95, x; assert x['mean_precision'] >= 0.50, x; print('retrieval gate ok',x['mean_precision'],x['mean_recall'])"
      - name: Test transactional writer in isolated copy
        run: |
          rm -rf /tmp/rae-writer-test
          cp -a . /tmp/rae-writer-test
          cd /tmp/rae-writer-test
          python rae.py claim add C-CI-WRITER-001 --actor chatgpt-secondary --status OPEN --scope 'CI isolated write test' --proposition 'Transactional writer can append and materialize a scoped claim.' --domain research_infrastructure --packet research-entity-backend --reason 'CI only'
          python rae.py claim transition C-CI-WRITER-001 --actor chatgpt-secondary --to REFUTED --reason 'CI cleanup/falsification test'
          python rae.py query 'Transactional writer append materialize' --status REFUTED --limit 5 >/tmp/writer-query.json
          python -c "import json; x=json.load(open('/tmp/writer-query.json')); assert any(c['claim_id']=='C-CI-WRITER-001' and c['status']=='REFUTED' for c in x['claims']), x"
          python rae.py event RESULT_OBSERVED --actor chatgpt-secondary --summary 'CI isolated event writer works.' --capture-level L1 --status LOCAL_ONLY --domain research_infrastructure
      - name: Test dump freeze verify and archive in isolated copy
        run: |
          rm -rf /tmp/rae-dump-test
          cp -a . /tmp/rae-dump-test
          cd /tmp/rae-dump-test
          printf 'CI dump payload\nmechanism=test\n' > dump/ci_payload.txt
          python tools/dump_queue.py prepare --actor chatgpt-secondary --session-id ci-dump >/tmp/dump-prepare.json
          export BATCH=$(python -c "import json; print(json.load(open('/tmp/dump-prepare.json'))['batch_id'])")
          python tools/dump_queue.py verify "$BATCH"
          python -c "import json,os; b=os.environ['BATCH']; json.dump({'batch_id':b,'pipeline_complete':True,'ci_only':True},open('/tmp/DUMP_RESULT.json','w'))"
          printf '# CI Research Delta\n\nIsolated dump lifecycle smoke test.\n' >/tmp/RESEARCH_DELTA.md
          python tools/dump_queue.py finalize "$BATCH" --result /tmp/DUMP_RESULT.json --delta /tmp/RESEARCH_DELTA.md >/tmp/dump-finalize.json
          test ! -e dump/ci_payload.txt
          test -e "dump archive/$BATCH/original/ci_payload.txt"
          python -c "import json; x=json.load(open('/tmp/dump-finalize.json')); assert x['ok'] and x['inbox_payload_remaining']==0, x"
      - name: Validate canonical/bootstrap agreement and trigger registry exposure
        run: >-
          python -c "import json,pathlib; c=json.loads(pathlib.Path('research_entity/continuity/RESEARCH_ENTITY_CANONICAL.json').read_text()); b=json.loads(pathlib.Path('research_entity/continuity/BOOTSTRAP_MINIMAL.json').read_text()); r=json.loads(pathlib.Path('research_entity/global/RESEARCH_TRIGGER_REGISTRY.json').read_text()); assert c['revision']==b['expected_revision']; assert c['state_hash']==b['expected_state_hash']; assert c['entity_version']==b['expected_entity_version']; assert b['research_team']['lead_researcher']=='claude-code-lead'; assert b['research_team']['secondary_researcher']=='chatgpt-secondary'; assert set(['dump','clay','gwt','frank','emergenz','claycode','hyperposition']) <= set(r['triggers']); print('canonical/bootstrap/research-team/trigger agreement ok',c['revision'],c['state_hash'])"
      - name: Ensure derived indexes are reproducible
        run: git diff --exit-code -- research_entity/continuity/BOOTSTRAP_MINIMAL.json research_sources/status research_sources/topics research_sources/derived/knowledge_micro_packets || (echo 'Derived indexes/views are stale; regenerate and commit them.' && exit 1)
      - name: Archive runtime diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: rae-vnext-diagnostics
          path: |
            research_sources/sources.db
            research_sources/derived/knowledge_micro_packets/INDEX.json
            /tmp/context.json
            /tmp/query.json
            /tmp/benchmark.json
            /tmp/writer-query.json
            /tmp/dump-prepare.json
            /tmp/dump-finalize.json
