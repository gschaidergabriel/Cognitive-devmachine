name: WP03 PR145 Alias Integrity Candidate Autofix

on:
  push:
    branches: [go-wp03-keyword-ident-20260810]
    paths:
      - '.github/workflows/wp03-pr145-alias-integrity-autofix.yml'
      - 'tools/claycode_base_typed_ir.py'
      - 'tools/test_claycode_wp03_identifier_alias_integrity.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: go-wp03-keyword-ident-20260810
          fetch-depth: 0

      - name: Apply exact fail-closed alias guard if needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/claycode_base_typed_ir.py')
          text = p.read_text(encoding='utf-8')
          old = '''        k = kind(child)\n        if k is not None and k.startswith("ident_"):\n            vals = token_values(child)\n            if len(vals) == 1:\n                return vals[0]\n    return None\n'''
          new = '''        k = kind(child)\n        if k is not None and k.startswith("ident_"):\n            vals = token_values(child)\n            expected = k.removeprefix("ident_")\n            if len(vals) != 1:\n                raise TypedIRError(f"malformed {k} identifier node: expected one token, got {vals!r}")\n            if vals[0] != expected:\n                raise TypedIRError(\n                    f"identifier alias/token mismatch: {k} requires {expected!r}, got {vals[0]!r}"\n                )\n            return vals[0]\n    return None\n'''
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('patched')
          elif new in text:
              print('already_patched')
          else:
              raise SystemExit('CAS_FAIL: direct_identifier block changed; refusing blind rewrite')
          PY

      - name: Execute alias integrity regression
        working-directory: tools
        run: python3 test_claycode_wp03_identifier_alias_integrity.py

      - name: Commit candidate-only hardening
        run: |
          if git diff --quiet -- tools/claycode_base_typed_ir.py; then
            echo 'No candidate code delta to commit.'
            exit 0
          fi
          git config user.name 'clay-wp03-candidate-runner'
          git config user.email 'clay-wp03-candidate-runner@users.noreply.github.com'
          git add tools/claycode_base_typed_ir.py
          git commit -m 'fix(wp03): fail closed on identifier alias-token mismatch'
          git push origin HEAD:go-wp03-keyword-ident-20260810
