name: ClayCode FRANK block-body V8 gate
on:
  pull_request:
    paths:
      - 'tools/claycode_base_frank_block_toolchain.py'
      - 'research_entity/claycode/base/examples/FRANK_GRT_FRAME_V1.clay'
      - '.github/workflows/claycode-frank-block-v8-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frank-grt-block-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet 'lark==1.3.1'
      - name: Execute real frozen FRANK GRT block-body differential
        run: python tools/claycode_base_frank_block_toolchain.py
      - name: Fail closed on scope or semantic mismatch
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/FRANK_GRT_BLOCK_TOOLCHAIN_RECEIPT.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['pass'] is True
          assert d['trace_equivalent'] is True
          assert d['reference_result'] == d['lowered_result']
          assert d['reference_result']['source_status'] == 'THINKING_FRAMEWORK_NOT_WORLD_FACT'
          assert d['counts_as_target_acceptance'] is False
          assert d['counts_as_wp13_pass'] is False
          print('FRANK_GRT_BLOCK_SLICE_PROXY=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frank-grt-block-toolchain-receipt
          path: research_entity/claycode/autonomous/FRANK_GRT_BLOCK_TOOLCHAIN_RECEIPT.json
          if-no-files-found: error
