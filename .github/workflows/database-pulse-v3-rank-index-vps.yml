name: UnifiedDB Pulse Runtime V3 Hostinger Falsifier

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_entity/runtime/database_pulse_rank_index_v3.py'
      - 'research_entity/runtime/test_database_pulse_rank_index_v3.py'
      - 'research_entity/runtime/database_pulse_runtime_v3.py'
      - 'research_entity/runtime/test_database_pulse_runtime_v3.py'
      - 'tools/database_pulse_rank_index_v3_benchmark.py'
      - 'tools/database_pulse_rank_index_v3_randomized_falsifier.py'
      - '.github/workflows/database-pulse-v3-rank-index-vps.yml'

permissions:
  contents: write

concurrency:
  group: unifieddb-pulse-runtime-v3-vps-main
  cancel-in-progress: true

jobs:
  runtime-v3-falsifier:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Verify SQLite capability surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect(':memory:')
          assert con.execute("SELECT json_extract('{\"x\":1}','$.x')").fetchone()[0] == 1
          con.execute('CREATE TABLE t(x TEXT,status TEXT,epistemic TEXT)')
          con.execute("CREATE INDEX ix ON t(json_extract(x,'$.p')) WHERE status='CURRENT' AND epistemic='KNOWN'")
          print('sqlite',sqlite3.sqlite_version)
          print('compile_options', [r[0] for r in con.execute('PRAGMA compile_options')])
          print('SQLITE_JSON_EXPRESSION_INDEX=PASS')
          PY

      - name: Compile V3 stack
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research_entity/runtime/database_pulse_rank_index_v3.py \
            research_entity/runtime/test_database_pulse_rank_index_v3.py \
            research_entity/runtime/database_pulse_runtime_v3.py \
            research_entity/runtime/test_database_pulse_runtime_v3.py \
            tools/database_pulse_rank_index_v3_benchmark.py \
            tools/database_pulse_rank_index_v3_randomized_falsifier.py

      - name: Run V3 rank-index and runtime falsifiers
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            research_entity.runtime.test_database_pulse_rank_index_v3 \
            research_entity.runtime.test_database_pulse_runtime_v3

      - name: Run randomized differential falsifier
        run: |
          set -euo pipefail
          mkdir -p research_entity/benchmarks/database_pulse
          python3 tools/database_pulse_rank_index_v3_randomized_falsifier.py \
            --seeds 12 --initial-keys 180 --steps 120 --budget 64 \
            --output research_entity/benchmarks/database_pulse/rank_index_v3_randomized_vps.json

      - name: Run matched V2 versus V3 benchmark
        run: |
          set -euo pipefail
          python3 tools/database_pulse_rank_index_v3_benchmark.py \
            --rows 3000 --budget 64 --repeats 200 --updates 100 \
            --output research_entity/benchmarks/database_pulse/rank_index_v3_vps.json

      - name: Resolve current program status
        run: |
          set -euo pipefail
          python3 tools/program_progress.py --json > /tmp/program-progress.json
          cat /tmp/program-progress.json

      - name: Attach Hostinger metadata
        env:
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, platform, resource, socket, sqlite3, subprocess, sys
          from datetime import datetime, timezone
          base=pathlib.Path('research_entity/benchmarks/database_pulse')
          def cmd(args):
              try: return subprocess.check_output(args,text=True,stderr=subprocess.STDOUT,timeout=5).strip()
              except Exception as exc: return f'UNKNOWN:{type(exc).__name__}'
          cpu='UNKNOWN'; mem='UNKNOWN'
          try:
              for line in pathlib.Path('/proc/cpuinfo').read_text(errors='replace').splitlines():
                  if line.lower().startswith('model name'):
                      cpu=line.split(':',1)[1].strip(); break
          except Exception: pass
          try:
              for line in pathlib.Path('/proc/meminfo').read_text(errors='replace').splitlines():
                  if line.startswith('MemTotal:'):
                      mem=line.split(':',1)[1].strip(); break
          except Exception: pass
          meta={
              'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
              'scope':'REMOTE_PRELIMINARY_DATABASE_PULSE_NOT_ANDREAS_TARGET_ACCEPTANCE',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'git_sha':os.environ.get('GIT_SHA',''),
              'github_run_id':os.environ.get('RUN_ID',''),
              'github_run_attempt':os.environ.get('RUN_ATTEMPT',''),
              'hostname':socket.gethostname(),
              'runner_name':os.environ.get('RUNNER_NAME','UNKNOWN'),
              'runner_os':os.environ.get('RUNNER_OS','UNKNOWN'),
              'runner_arch':os.environ.get('RUNNER_ARCH','UNKNOWN'),
              'platform':platform.platform(),
              'python':sys.version,
              'sqlite':sqlite3.sqlite_version,
              'cpu_model':cpu,
              'mem_total':mem,
              'maxrss':resource.getrusage(resource.RUSAGE_SELF).ru_maxrss,
              'kernel':cmd(['uname','-a']),
              'filesystem':cmd(['df','-T','.']),
          }
          for name in ('rank_index_v3_randomized_vps.json','rank_index_v3_vps.json'):
              p=base/name; x=json.loads(p.read_text(encoding='utf-8')); x['execution_metadata']=meta
              x['program_progress']=json.loads(pathlib.Path('/tmp/program-progress.json').read_text())
              x['release_boundary']='Remote Hostinger evidence only; not final Andreas Ubuntu target acceptance.'
              p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Enforce V3 decision gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          base='research_entity/benchmarks/database_pulse/'
          rnd=json.load(open(base+'rank_index_v3_randomized_vps.json',encoding='utf-8'))
          p=json.load(open(base+'rank_index_v3_vps.json',encoding='utf-8'))
          c=p['correctness']
          assert rnd['pass'] is True,rnd
          assert c['wide_reference_focus']==c['expected_focus'],p
          assert c['active_field_correct'] is True,p
          assert c['rank_index_correct'] is True,p
          assert c['rank_query_plan_uses_index'] is True,p
          assert c['active_projection_verify']['pass'] is True,p
          assert c['rank_index_verify_initial']['pass'] is True,p
          assert c['rank_index_verify_final']['pass'] is True,p
          assert p['execution_metadata']['scope']=='REMOTE_PRELIMINARY_DATABASE_PULSE_NOT_ANDREAS_TARGET_ACCEPTANCE'
          print('PULSE_RUNTIME_V3_HOSTINGER=PASS')
          PY

      - name: Persist Hostinger receipts
        run: |
          set -euo pipefail
          base=research_entity/benchmarks/database_pulse
          cp "$base/rank_index_v3_randomized_vps.json" /tmp/
          cp "$base/rank_index_v3_vps.json" /tmp/
          git reset --hard HEAD
          git clean -fd
          mkdir -p "$base"
          cp /tmp/rank_index_v3_randomized_vps.json "$base/"
          cp /tmp/rank_index_v3_vps.json "$base/"
          git config user.name 'clay-pulse-runtime-v3-runner'
          git config user.email 'clay-pulse-v3-runner@users.noreply.github.com'
          git add "$base/rank_index_v3_randomized_vps.json" "$base/rank_index_v3_vps.json"
          git commit -m 'evidence(frank): persist Pulse Runtime V3 Hostinger falsifier [skip ci]' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt*3))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frank-pulse-runtime-v3-hostinger
          path: research_entity/benchmarks/database_pulse/*v3*vps.json
