name: ClayCode strict LALR conflict probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_strict_lalr_probe.py'
      - 'research_entity/trigger_runs/claycode/claycode-20260809T1717p0700-all-workers-production-parser/D_LALR_GRAMMAR_CANDIDATE_V3.lark'
      - '.github/workflows/claycode-strict-lalr-probe.yml'

concurrency:
  group: claycode-strict-lalr-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark==1.3.1'
      - name: Run strict conflict probe
        run: |
          python tools/claycode_strict_lalr_probe.py \
            --output research_entity/claycode/autonomous/STRICT_LALR_D_CONFLICT_RECEIPT.json
      - name: Commit diagnostic receipt
        run: |
          git config user.name 'claycode-lalr-probe'
          git config user.email 'claycode-lalr-probe@users.noreply.github.com'
          git add research_entity/claycode/autonomous/STRICT_LALR_D_CONFLICT_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record strict D LALR conflict diagnostic'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
