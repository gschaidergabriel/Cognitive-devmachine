# ClayVerse uses tmux only as a durable PTY/session transport.
# Browser users must never receive tmux's own process/control command surface.
# Raw browser keystrokes therefore pass to the one managed Claude pane while
# tmux prefix/command bindings are absent.
set-option -g prefix None
set-option -g prefix2 None
unbind-key -a
set-option -g mouse off
set-option -g status off

# Defense in depth: if a future regression reintroduces a bare new-window or
# split-window path without an explicit command, fail closed instead of opening
# the container user's login shell.
set-option -g default-command /opt/clayverse/runtime/deny-shell
