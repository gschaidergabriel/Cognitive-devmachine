name: UnifiedDB EAP Compact Cache VPS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research_entity/harness/reference/unifieddb_emergent_compact.py'
      - 'research_entity/harness/reference/test_unifieddb_emergent_compact.py'
      - 'research_entity/harness/reference/benchmark_unifieddb_compact_cache.py'
      - 'research_entity/harness/reference/unifieddb_emergent_preprocessor.py'
      - 'research_entity/harness/reference/unifieddb_emergent_incremental.py'
      - 'research_entity/harness/reference/state_ledger.py'

permissions:
  contents: read

jobs:
  compact-cache:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v research_entity.harness.reference.test_unifieddb_emergent_compact
      - name: Memory and latency benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research_entity.harness.reference.benchmark_unifieddb_compact_cache > /tmp/eap-compact.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/eap-compact.json').read_text(encoding='utf-8'))
          summary={
            'selected_equivalent':data['equivalence']['selected_signatures_exact_all_queries'],
            'cache_fraction_saved':data['delta']['cache_fraction_saved'],
            'cache_bytes_saved':data['delta']['cache_bytes_saved'],
            'hot_p50_speedup':data['delta']['hot_p50_speedup'],
            'cold_speedup':data['delta']['cold_speedup'],
          }
          print(json.dumps(summary,sort_keys=True))
          assert summary['selected_equivalent']
          assert summary['cache_fraction_saved']>0.0
          PY
      - name: Upload compact-cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unifieddb-eap-compact-${{ github.run_id }}
          path: /tmp/eap-compact.json
          if-no-files-found: warn
          retention-days: 30
