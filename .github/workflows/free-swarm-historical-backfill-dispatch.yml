name: Free-Swarm historical backfill singleton dispatch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: free-swarm-historical-backfill-v1
  cancel-in-progress: false

jobs:
  historical-backfill:
    if: >-
      github.repository == 'gschaidergabriel/clay-global-research-entity' &&
      github.event.issue.user.login == 'gschaidergabriel' &&
      github.event.issue.title == '[CLAY-DISPATCH] GO878 historical backfill' &&
      contains(github.event.issue.body, 'dispatch_schema: CLAY_ORDINARY_DISPATCH/v1') &&
      contains(github.event.issue.body, 'dispatch_key: free-swarm-historical-backfill-v1-g0001')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Admit typed singleton generation
        id: admit
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path

          dispatch_key = 'free-swarm-historical-backfill-v1-g0001'
          spec_path = Path('research_entity/continuity/ordinary_dispatch_specs/free-swarm-historical-backfill-v1.json')
          claim_path = Path(f'research_entity/continuity/ordinary_dispatch_claims/{dispatch_key}.json')
          result_path = Path(f'research_entity/continuity/ordinary_dispatch_results/{dispatch_key}.json')
          body = os.environ.get('ISSUE_BODY', '')

          if 'dispatch_schema: CLAY_ORDINARY_DISPATCH/v1' not in body:
              raise SystemExit('DISPATCH_SCHEMA_MISMATCH')
          if f'dispatch_key: {dispatch_key}' not in body:
              raise SystemExit('DISPATCH_KEY_BODY_MISMATCH')
          spec = json.loads(spec_path.read_text())
          if spec.get('current_dispatch_key') != dispatch_key or int(spec.get('retry_generation', -1)) != 1:
              raise SystemExit('DISPATCH_SPEC_NOT_CURRENT_GENERATION')
          if spec.get('active_trigger_authorized') is not True:
              raise SystemExit('DISPATCH_TRIGGER_NOT_AUTHORIZED')
          if not claim_path.is_file():
              raise SystemExit('DISPATCH_CLAIM_REQUIRED')
          claim = json.loads(claim_path.read_text())
          if claim.get('dispatch_key') != dispatch_key or int(claim.get('retry_generation', -1)) != 1:
              raise SystemExit('DISPATCH_CLAIM_MISMATCH')
          if claim.get('active_trigger_authorized') is not True:
              raise SystemExit('DISPATCH_CLAIM_NOT_AUTHORIZED')
          if result_path.exists():
              print('run=false')
              print('already_satisfied=true')
          else:
              print('run=true')
              print('already_satisfied=false')
          PY

      - name: Execute provider-free exact-current capsule in clay-direct-dev
        if: steps.admit.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dispatch_key='free-swarm-historical-backfill-v1-g0001'
          result_rel="research_entity/continuity/ordinary_dispatch_results/${dispatch_key}.json"
          mkdir -p "$(dirname "$result_rel")"
          scratch="/tmp/clay-${dispatch_key}-${GITHUB_RUN_ID}"
          capsule_host="/tmp/${dispatch_key}-capsule-${GITHUB_RUN_ID}.json"
          tests_host="/tmp/${dispatch_key}-tests-${GITHUB_RUN_ID}.txt"
          runtime=''
          prefix=()

          if command -v docker >/dev/null 2>&1 && docker inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='docker'; prefix=(docker)
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='sudo-docker'; prefix=(sudo -n docker)
          elif command -v podman >/dev/null 2>&1 && podman inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='podman'; prefix=(podman)
          elif command -v sudo >/dev/null 2>&1 && sudo -n podman inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='sudo-podman'; prefix=(sudo -n podman)
          fi

          if [[ -z "$runtime" ]]; then
            RUNTIME_STATE='NO_CLAY_DIRECT_DEV_TRANSPORT' RESULT_STATE='BLOCKED' python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          key='free-swarm-historical-backfill-v1-g0001'
          out={
            'schema':'CLAY_ORDINARY_DISPATCH_RESULT/v1',
            'dispatch_class':'free-swarm-historical-backfill-v1',
            'dispatch_key':key,
            'retry_generation':1,
            'terminal':True,
            'state':os.environ['RESULT_STATE'],
            'observed_at':datetime.now(timezone.utc).isoformat(),
            'event_sha':os.environ.get('GITHUB_SHA'),
            'actual_checkout_head':os.popen('git rev-parse HEAD').read().strip(),
            'transport_state':os.environ['RUNTIME_STATE'],
            'runtime_probe_performed':False,
            'provider_model_network_io':False,
            'paid_provider_io':False,
            'together_io':False,
            'whole_entityos_hcu_runtime_credit':0,
            'hcu_full_runtime_credit':0,
            'jspace_model_runtime_credit':0,
            'training_credit':0,
          }
          p=Path(f'research_entity/continuity/ordinary_dispatch_results/{key}.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          else
            "${prefix[@]}" exec clay-direct-dev sh -lc "rm -rf '$scratch'; mkdir -p '$scratch'"
            "${prefix[@]}" cp "$GITHUB_WORKSPACE/." "clay-direct-dev:$scratch"

            if ! "${prefix[@]}" exec clay-direct-dev sh -lc "test -d /artifacts/clay-entityos-swarm && test -f /artifacts/clay-entityos-swarm/forge/forge.sqlite3 && find /artifacts/clay-entityos-swarm -name workers.jsonl -type f -print -quit | grep -q ."; then
              RUNTIME_STATE='ARTIFACT_CORPUS_OR_FORGE_DB_UNAVAILABLE' RESULT_STATE='BLOCKED' python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          key='free-swarm-historical-backfill-v1-g0001'
          out={
            'schema':'CLAY_ORDINARY_DISPATCH_RESULT/v1',
            'dispatch_class':'free-swarm-historical-backfill-v1',
            'dispatch_key':key,
            'retry_generation':1,
            'terminal':True,
            'state':os.environ['RESULT_STATE'],
            'observed_at':datetime.now(timezone.utc).isoformat(),
            'event_sha':os.environ.get('GITHUB_SHA'),
            'actual_checkout_head':os.popen('git rev-parse HEAD').read().strip(),
            'transport_state':os.environ['RUNTIME_STATE'],
            'sandbox':'clay-direct-dev',
            'runtime_probe_performed':False,
            'provider_model_network_io':False,
            'paid_provider_io':False,
            'together_io':False,
            'whole_entityos_hcu_runtime_credit':0,
            'hcu_full_runtime_credit':0,
            'jspace_model_runtime_credit':0,
            'training_credit':0,
          }
          Path(f'research_entity/continuity/ordinary_dispatch_results/{key}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
            else
              head="$(git rev-parse HEAD)"
              tree="$(git rev-parse 'HEAD^{tree}')"
              dirty='CLEAN'
              [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || dirty='DIRTY'

              set +e
              "${prefix[@]}" exec clay-direct-dev sh -lc "set -eu; cd '$scratch'; export PYTHONDONTWRITEBYTECODE=1; python3 -m pytest -p no:cacheprovider tests/test_free_swarm_historical_backfill.py tests/test_free_swarm_backfill_exhaustiveness_878.py tests/test_go878_backfill_capsule_exhaustiveness_binding.py -q > /tmp/${dispatch_key}-tests.txt 2>&1"
              test_rc=$?
              set -e
              "${prefix[@]}" cp "clay-direct-dev:/tmp/${dispatch_key}-tests.txt" "$tests_host" 2>/dev/null || true

              capsule_rc=99
              if [[ "$test_rc" -eq 0 ]]; then
                set +e
                "${prefix[@]}" exec clay-direct-dev sh -lc "set -eu; cd '$scratch'; export PYTHONDONTWRITEBYTECODE=1 CLAY_SWARM_ARTIFACT_ROOT=/artifacts/clay-entityos-swarm CLAY_GO878_SOURCE_SHA='$head' CLAY_GO878_SOURCE_TREE='$tree' CLAY_GO878_DIRTY_STATE='$dirty' CLAY_GO878_TRANSPORT='SELF_HOSTED_LINUX_X64' CLAY_GO878_SANDBOX='clay-direct-dev' CLAY_GO878_RUN_ID='$GITHUB_RUN_ID'; env -u GROQ_API_KEY -u GROQ_API_KEYS -u MISTRAL_API_KEY -u MISTRAL_API_KEYS -u NVIDIA_API_KEY -u NVIDIA_API_KEYS -u NVIDIA_NIM_API_KEY -u NGC_API_KEY -u OPENROUTER_API_KEY -u OPENROUTER_API_KEYS -u TOGETHER_API_KEY python3 tools/run_free_swarm_historical_backfill_capsule_878.py --artifact-root /artifacts/clay-entityos-swarm --max-lines-per-pass 50000 --max-passes 64 --receipt /tmp/${dispatch_key}-capsule.json"
                capsule_rc=$?
                set -e
                "${prefix[@]}" cp "clay-direct-dev:/tmp/${dispatch_key}-capsule.json" "$capsule_host" 2>/dev/null || true
              fi

              TEST_RC="$test_rc" CAPSULE_RC="$capsule_rc" RUNTIME="$runtime" CAPSULE_HOST="$capsule_host" TESTS_HOST="$tests_host" python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          key='free-swarm-historical-backfill-v1-g0001'
          test_rc=int(os.environ['TEST_RC']); capsule_rc=int(os.environ['CAPSULE_RC'])
          capsule_path=Path(os.environ['CAPSULE_HOST'])
          capsule=None
          if capsule_path.is_file():
              try: capsule=json.loads(capsule_path.read_text())
              except Exception: capsule=None
          state='PASS' if test_rc==0 and capsule_rc==0 and isinstance(capsule,dict) and capsule.get('status')=='PASS_SATURATED_SCAN_SET' else 'FAIL'
          tests=''
          tp=Path(os.environ['TESTS_HOST'])
          if tp.is_file(): tests=tp.read_text(errors='replace')[-16000:]
          out={
            'schema':'CLAY_ORDINARY_DISPATCH_RESULT/v1',
            'dispatch_class':'free-swarm-historical-backfill-v1',
            'dispatch_key':key,
            'retry_generation':1,
            'terminal':True,
            'state':state,
            'observed_at':datetime.now(timezone.utc).isoformat(),
            'event_sha':os.environ.get('GITHUB_SHA'),
            'actual_checkout_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'actual_checkout_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'sandbox':'clay-direct-dev',
            'container_runtime':os.environ['RUNTIME'],
            'runtime_probe_performed':True,
            'test_exit_code':test_rc,
            'capsule_exit_code':capsule_rc,
            'tests_tail':tests,
            'capsule_receipt':capsule,
            'provider_model_network_io':False,
            'paid_provider_io':False,
            'together_io':False,
            'whole_entityos_hcu_runtime_credit':0,
            'hcu_full_runtime_credit':0,
            'jspace_model_runtime_credit':0,
            'training_credit':0,
          }
          Path(f'research_entity/continuity/ordinary_dispatch_results/{key}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
            fi

            "${prefix[@]}" exec clay-direct-dev sh -lc "rm -rf '$scratch' /tmp/${dispatch_key}-tests.txt /tmp/${dispatch_key}-capsule.json" 2>/dev/null || true
          fi
          rm -f "$capsule_host" "$tests_host"

      - name: Persist semantic generation result
        if: steps.admit.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          key='free-swarm-historical-backfill-v1-g0001'
          result="research_entity/continuity/ordinary_dispatch_results/${key}.json"
          test -f "$result"
          git diff --check
          git config user.name 'clay-ordinary-dispatch-runner'
          git config user.email 'clay-ordinary-dispatch-runner@users.noreply.github.com'
          git add "$result"
          git commit -m "evidence(go878): historical backfill ${key} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
