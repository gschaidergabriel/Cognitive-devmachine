name: QCEP Current Main Self Hosted

on:
  push:
    branches: ['research/qcep-u15-currentmain-20260810']
    paths:
      - 'research_entity/harness/reference/query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/test_query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/benchmark_query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/benchmark_qcep_u15_gap_closure.py'
      - 'research_entity/experiments/unifieddb_qcep/**'
      - 'research_entity/experiments/unifieddb_model_input_preprocessor/**'
      - '.github/workflows/qcep-currentmain-self-hosted.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research_entity/harness/reference/query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/test_query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/benchmark_query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/benchmark_qcep_u15_gap_closure.py'
      - '.github/workflows/qcep-currentmain-self-hosted.yml'
  workflow_dispatch:

concurrency:
  group: qcep-currentmain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Compile exact current-main candidate
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research_entity/harness/reference/query_conditioned_evidence_projection.py \
            research_entity/harness/reference/test_query_conditioned_evidence_projection.py \
            research_entity/harness/reference/benchmark_query_conditioned_evidence_projection.py \
            research_entity/harness/reference/benchmark_qcep_u15_gap_closure.py \
            research_entity/harness/reference/unifieddb_emergent_preprocessor.py \
            research_entity/runtime/semantic_gap_controller_v15.py
      - name: Run QCEP invariants
        run: |
          set -euo pipefail
          python3 -m unittest -v research_entity.harness.reference.test_query_conditioned_evidence_projection
      - name: Run current-EAP graph differential
        run: |
          set -euo pipefail
          mkdir -p /tmp/qcep-current
          python3 -m research_entity.harness.reference.benchmark_query_conditioned_evidence_projection > /tmp/qcep-current/QCEP_GRAPH.json
      - name: Run current-U15 gap closure differential
        run: |
          set -euo pipefail
          python3 -m research_entity.harness.reference.benchmark_qcep_u15_gap_closure > /tmp/qcep-current/QCEP_U15.json
      - name: Enforce lesion gates and attach runtime metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, platform, socket
          from datetime import datetime, timezone
          from pathlib import Path
          meta={
            'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
            'created_at':datetime.now(timezone.utc).isoformat(),
            'github_sha':os.environ.get('GITHUB_SHA',''),
            'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),
            'runner_os':os.environ.get('RUNNER_OS','unknown'),
            'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
            'hostname':socket.gethostname(),
            'platform':platform.platform(),
            'python':platform.python_version(),
          }
          graphp=Path('/tmp/qcep-current/QCEP_GRAPH.json')
          graph=json.loads(graphp.read_text()); graph['execution_metadata']=meta
          graphp.write_text(json.dumps(graph,indent=2,sort_keys=True)+'\n')
          u15p=Path('/tmp/qcep-current/QCEP_U15.json')
          u15=json.loads(u15p.read_text()); u15['execution_metadata']=meta
          u15p.write_text(json.dumps(u15,indent=2,sort_keys=True)+'\n')
          print('GRAPH',json.dumps(graph['candidate_vs_eap'],indent=2,sort_keys=True))
          print('U15',json.dumps(u15['candidate_vs_static'],indent=2,sort_keys=True))
          if not graph['candidate_vs_eap']['promote_for_further_testing']:
              raise SystemExit('FAIL: QCEP graph lesion gate')
          if not u15['candidate_vs_static']['promote_for_real_corpus_falsifier']:
              raise SystemExit('FAIL: QCEP U15 sufficiency lesion gate')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qcep-currentmain-${{ github.run_id }}
          path: /tmp/qcep-current/*.json
          if-no-files-found: error

  persist:
    if: ${{ always() && github.event_name == 'push' }}
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: qcep-currentmain-${{ github.run_id }}
          path: /tmp/qcep-current
      - name: Persist exact tested receipts
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          src=Path('/tmp/qcep-current')
          out=Path('research_entity/experiments/unifieddb_qcep_currentmain')
          out.mkdir(parents=True,exist_ok=True)
          mapping={'QCEP_GRAPH.json':'LATEST_GRAPH.json','QCEP_U15.json':'LATEST_U15.json'}
          run_id=None
          for source,latest in mapping.items():
            data=json.loads((src/source).read_text())
            assert data['execution_metadata']['github_sha']==os.environ['TESTED_SHA']
            run_id=data['execution_metadata']['github_run_id']
            (out/latest).write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
            (out/f'{run_id}_{Path(source).stem.lower()}.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'clay-qcep-benchmark'
          git config user.email 'clay-qcep-benchmark@users.noreply.github.com'
          git add research_entity/experiments/unifieddb_qcep_currentmain/
          git commit -m "evidence(unifieddb): persist current-main QCEP self-hosted receipts [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((attempt*2))
          done
          exit 1
