name: QCEP Self Hosted Benchmark

on:
  push:
    branches: ['research/eap-query-conditioned-evidence-20260810']
    paths:
      - 'research_entity/harness/reference/query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/test_query_conditioned_evidence_projection.py'
      - 'research_entity/harness/reference/benchmark_query_conditioned_evidence_projection.py'
      - '.github/workflows/qcep-self-hosted-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: qcep-self-hosted-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Compile and test
        run: |
          set -euo pipefail
          python3 -m py_compile research_entity/harness/reference/query_conditioned_evidence_projection.py research_entity/harness/reference/benchmark_query_conditioned_evidence_projection.py
          python3 -m unittest -v research_entity.harness.reference.test_query_conditioned_evidence_projection
      - name: Run differential benchmark
        run: |
          set -euo pipefail
          python3 -m research_entity.harness.reference.benchmark_query_conditioned_evidence_projection > /tmp/QCEP_BENCHMARK.json
          python3 - <<'PY'
          import json, os, platform, socket
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('/tmp/QCEP_BENCHMARK.json')
          data=json.loads(p.read_text())
          gate=data['candidate_vs_eap']
          data['execution_metadata']={
            'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
            'created_at':datetime.now(timezone.utc).isoformat(),
            'github_sha':os.environ.get('GITHUB_SHA',''),
            'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),
            'runner_os':os.environ.get('RUNNER_OS','unknown'),
            'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
            'hostname':socket.gethostname(),
            'platform':platform.platform(),
            'python':platform.python_version(),
          }
          p.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          print(json.dumps(gate,indent=2,sort_keys=True))
          if not gate['promote_for_further_testing']:
            raise SystemExit('QCEP lesion gate failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qcep-self-hosted-${{ github.run_id }}
          path: /tmp/QCEP_BENCHMARK.json
          if-no-files-found: error

  persist:
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: qcep-self-hosted-${{ github.run_id }}
          path: /tmp/qcep
      - name: Persist exact receipt
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          src=Path('/tmp/qcep/QCEP_BENCHMARK.json'); data=json.loads(src.read_text())
          assert data['execution_metadata']['github_sha']==os.environ['TESTED_SHA']
          out=Path('research_entity/experiments/unifieddb_qcep'); out.mkdir(parents=True,exist_ok=True)
          (out/'LATEST.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          (out/(data['execution_metadata']['github_run_id']+'.json')).write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'clay-qcep-benchmark'
          git config user.email 'clay-qcep-benchmark@users.noreply.github.com'
          git add research_entity/experiments/unifieddb_qcep/
          git commit -m "evidence(unifieddb): persist QCEP self-hosted differential [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((attempt*2))
          done
          exit 1
