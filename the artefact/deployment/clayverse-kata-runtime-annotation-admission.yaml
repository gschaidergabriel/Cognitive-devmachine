# Fail-closed admission fence for the canonical ClayVerse Kata workload.
#
# Baseline law: an admitted ClayVerse Pod must use the exact reviewed Kata
# RuntimeClass and must carry no io.katacontainers.* workload annotation.
# A future exception must be an explicit, separately reviewed, receipt-bound
# policy change; do not weaken this baseline with wildcards.
#
# Apply BOTH documents before admitting the ClayVerse StatefulSet. Static YAML
# presence is supporting source evidence only; final acceptance must prove the
# policy and binding are installed and reject negative CREATE/UPDATE probes on
# the admitted cluster after all mutation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: clayverse-kata-runtime-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    # `request.name` is an AdmissionRequest attribute, not a mutable field of the
    # post-mutation object. The canonical one-replica StatefulSet is named
    # `clayverse`, so its admitted Pod request identity is `clayverse-0`.
    # This keeps CREATE fenced even if a mutating admission component rewrites
    # every Pod-internal ClayVerse label/container marker before validation.
    - name: requestClayVerse
      expression: request.name == "clayverse-0"
    - name: currentClayVerse
      expression: >-
        (has(object.metadata.labels) &&
         "app" in object.metadata.labels &&
         object.metadata.labels["app"] == "clayverse") ||
        object.spec.containers.exists(c, c.name == "clayverse")
    - name: previousClayVerse
      expression: >-
        oldObject != null &&
        ((has(oldObject.metadata.labels) &&
          "app" in oldObject.metadata.labels &&
          oldObject.metadata.labels["app"] == "clayverse") ||
         oldObject.spec.containers.exists(c, c.name == "clayverse"))
  validations:
    - expression: >-
        !variables.requestClayVerse ||
        object.metadata.name == request.name
      message: >-
        The reserved ClayVerse StatefulSet Pod request identity clayverse-0 must not be renamed by admission mutation.
      reason: Forbidden
    - expression: >-
        !(variables.requestClayVerse || variables.currentClayVerse || variables.previousClayVerse) ||
        (has(object.spec.runtimeClassName) &&
         object.spec.runtimeClassName == "kata-qemu-runtime-rs")
      message: >-
        ClayVerse Pods must execute through the exact reviewed kata-qemu-runtime-rs RuntimeClass;
        host-kernel fallback or runtime-class mutation is forbidden.
      reason: Forbidden
    - expression: >-
        !(variables.requestClayVerse || variables.currentClayVerse || variables.previousClayVerse) ||
        !has(object.metadata.annotations) ||
        object.metadata.annotations.all(k, !k.startsWith("io.katacontainers."))
      message: >-
        ClayVerse Pods must not carry unreviewed io.katacontainers.* runtime annotations;
        bind any required exception as a separate explicitly reviewed and receipt-bound policy delta.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: clayverse-kata-runtime-boundary
spec:
  policyName: clayverse-kata-runtime-boundary
  validationActions: [Deny]
