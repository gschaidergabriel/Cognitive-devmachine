name: Trigger6 Research DB Mirror

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_entity/frankenstein2_tool_intelligence/SEED_MANIFEST_2026-08-29.json'
      - 'research_entity/frankenstein2_tool_intelligence/materialize_pending_research_db.py'
      - '.github/workflows/trigger6-research-db-mirror.yml'

permissions:
  contents: write

concurrency:
  group: trigger6-research-db-mirror
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify SQLite mirror
        run: |
          set -euo pipefail
          python3 research_entity/frankenstein2_tool_intelligence/materialize_pending_research_db.py
          sqlite3 research_entity/frankenstein2_tool_intelligence/pending_research.sqlite 'PRAGMA quick_check; SELECT seed_id,repo,status,priority FROM seeds ORDER BY priority DESC;'
      - name: Persist database if changed
        run: |
          set -euo pipefail
          db='research_entity/frankenstein2_tool_intelligence/pending_research.sqlite'
          if git diff --quiet -- "$db" && git ls-files --error-unmatch "$db" >/dev/null 2>&1; then
            echo 'DB unchanged'
            exit 0
          fi
          git config user.name 'trigger6-research-db-mirror'
          git config user.email 'trigger6-research-db-mirror@users.noreply.github.com'
          git add "$db"
          git commit -m 'trigger6: materialize pending research database mirror [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
