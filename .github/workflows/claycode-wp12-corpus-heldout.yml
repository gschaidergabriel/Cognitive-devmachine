name: ClayCode WP12 corpus heldout audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_wp12_corpus_heldout_v1.py'
      - 'tools/claycode_base_pure_toolchain.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - '.github/workflows/claycode-wp12-corpus-heldout.yml'

permissions:
  contents: write

concurrency:
  group: claycode-wp12-corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corpus-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Generate and audit train/heldout corpus
        run: python tools/claycode_wp12_corpus_heldout_v1.py
      - name: Require zero split leakage
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/WP12_CORPUS_HELDOUT_RECEIPT.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['pass'] is True
          assert d['leak_free'] is True
          assert not any(d['overlaps'].values()), d['overlaps']
          assert d['counts_as_full_wp12_pass'] is False
          print('WP12_PURE_CORE_CORPUS_LEAK_AUDIT_PASS')
          PY
      - name: Commit corpus and audit receipt
        run: |
          git config user.name 'claycode-wp12-corpus'
          git config user.email 'claycode-wp12-corpus@users.noreply.github.com'
          git add \
            research_entity/claycode/corpus/base_train_v1.jsonl \
            research_entity/claycode/corpus/base_heldout_v1.jsonl \
            research_entity/claycode/autonomous/WP12_CORPUS_HELDOUT_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record WP12 leak-audited corpus'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
