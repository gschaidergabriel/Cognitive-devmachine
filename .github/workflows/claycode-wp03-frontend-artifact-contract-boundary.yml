name: ClayCode WP03 Frontend Artifact Contract Boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claycode-wp03-frontend-artifact-contract-boundary.yml'
      - 'tools/claycode_wp03_frontend_artifact_contract_validation.py'
      - 'tools/claycode_wp03_frontend_artifact_contract.py'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_typed_ir.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Isolated strict parser environment
        run: |
          python3 -m venv /tmp/clay-wp03-fac-${GITHUB_RUN_ID}
          /tmp/clay-wp03-fac-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Execute boundary differential
        env:
          PYTHONPATH: tools
          PYTHONSAFEPATH: '1'
        run: |
          /tmp/clay-wp03-fac-${GITHUB_RUN_ID}/bin/python tools/claycode_wp03_frontend_artifact_contract_validation.py | tee /tmp/wp03_fac.json
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp03-frontend-artifact-contract-hosted-${{ github.run_id }}
          path: /tmp/wp03_fac.json
          if-no-files-found: warn
          retention-days: 30
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/clay-wp03-fac-${GITHUB_RUN_ID}

  hostinger-probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Isolated strict parser environment
        run: |
          python3 -m venv /tmp/clay-wp03-fac-${GITHUB_RUN_ID}
          /tmp/clay-wp03-fac-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Execute boundary differential
        env:
          PYTHONPATH: tools
          PYTHONSAFEPATH: '1'
        run: |
          /tmp/clay-wp03-fac-${GITHUB_RUN_ID}/bin/python tools/claycode_wp03_frontend_artifact_contract_validation.py | tee /tmp/wp03_fac.json
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp03-frontend-artifact-contract-hostinger-${{ github.run_id }}
          path: /tmp/wp03_fac.json
          if-no-files-found: warn
          retention-days: 30
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/clay-wp03-fac-${GITHUB_RUN_ID}
