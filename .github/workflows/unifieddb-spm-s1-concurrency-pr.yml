name: UnifiedDB SPM-S1 Concurrency Guard

on:
  push:
    branches: ['chatgpt/spm-s1-concurrency-cas-current-20260810']
    paths:
      - 'research_entity/runtime/semantic_access_segmented_maintenance_s1.py'
      - 'research_entity/runtime/test_semantic_access_segmented_maintenance_s1.py'
      - '.github/workflows/unifieddb-spm-s1-concurrency-pr.yml'
  pull_request:
    paths:
      - 'research_entity/runtime/semantic_access_segmented_maintenance_s1.py'
      - 'research_entity/runtime/test_semantic_access_segmented_maintenance_s1.py'

permissions:
  contents: read

concurrency:
  group: spm-s1-concurrency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hostinger-concurrency-replication:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Verify read-only checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - name: Compile and run inherited plus concurrency matrix
        working-directory: research_entity/runtime
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile semantic_access_segmented_maintenance_s1.py test_semantic_access_segmented_maintenance_s1.py
          python3 -m unittest -v test_semantic_access_segmented_maintenance_s1.SegmentedPulseMaintenanceS1Tests
      - name: Run bounded SPM differential benchmark
        working-directory: research_entity/runtime
        shell: bash
        run: |
          set -euxo pipefail
          python3 benchmark_semantic_access_segmented_maintenance_s1.py \
            --seeds 240 --clusters 24 --paths 12 --events 4 --query-repeats 80 \
            --output /tmp/spm-s1-concurrency-benchmark.json
      - name: Capture evidence scope
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,platform,socket,sqlite3
          from pathlib import Path
          Path('/tmp/spm-s1-concurrency-env.json').write_text(json.dumps({
            'github_sha':os.environ.get('GITHUB_SHA'),
            'github_run_id':os.environ.get('GITHUB_RUN_ID'),
            'runner_name':os.environ.get('RUNNER_NAME'),
            'runner_os':os.environ.get('RUNNER_OS'),
            'runner_arch':os.environ.get('RUNNER_ARCH'),
            'hostname':socket.gethostname(),
            'platform':platform.platform(),
            'python':platform.python_version(),
            'sqlite':sqlite3.sqlite_version,
            'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION_SYNTHETIC_ENGINEERING_SCOPE_ONLY',
            'scope':'SPM-S1 concurrency/recovery candidate; not Andreas target acceptance',
            'authority':'NON_AUTHORITATIVE_REBUILDABLE_ACCESS_PROJECTION'
          },indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spm-s1-concurrency-${{ github.run_id }}
          path: |
            /tmp/spm-s1-concurrency-benchmark.json
            /tmp/spm-s1-concurrency-env.json
          if-no-files-found: warn
