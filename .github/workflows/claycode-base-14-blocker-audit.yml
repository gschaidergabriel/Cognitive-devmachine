name: ClayCode BASE 14-blocker evidence audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_14_blocker_probe.py'
      - '.github/workflows/claycode-base-14-blocker-audit.yml'
      - 'research_entity/claycode/CLAYCODE_RELEASE_WORKSPACE.json'
      - 'research_entity/claycode/base/**'
      - 'tools/claycode*.py'

permissions:
  contents: write

concurrency:
  group: claycode-base-14-blocker-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned audit dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1' pytest
      - name: Run 14-blocker evidence audit
        run: python tools/claycode_base_14_blocker_probe.py
      - name: Commit audit receipt
        run: |
          git config user.name 'claycode-base-audit'
          git config user.email 'claycode-base-audit@users.noreply.github.com'
          git add research_entity/claycode/autonomous/BASE_14_BLOCKER_AUDIT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record BASE 14-blocker evidence audit'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
