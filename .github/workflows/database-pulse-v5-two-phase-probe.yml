name: FRANK Database Pulse V5 Two Phase Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_entity/runtime/database_pulse_rank_path_v5.py'
      - 'research_entity/runtime/test_database_pulse_rank_path_v5.py'
      - 'research_entity/runtime/test_database_pulse_rank_path_v5_atomic.py'
      - 'research_entity/runtime/database_pulse_runtime_v5.py'
      - 'research_entity/runtime/test_database_pulse_runtime_v5.py'
      - 'research_entity/runtime/test_database_pulse_runtime_v5_adversarial.py'
      - 'tools/database_pulse_rank_path_v5_benchmark.py'
      - '.github/workflows/database-pulse-v5-two-phase-probe.yml'

permissions:
  contents: write

concurrency:
  group: frank-database-pulse-v5-two-phase-main
  cancel-in-progress: true

jobs:
  hosted-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, clean: true}
      - name: Compile V5 stack
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research_entity/runtime/database_pulse_rank_path_v5.py \
            research_entity/runtime/test_database_pulse_rank_path_v5.py \
            research_entity/runtime/test_database_pulse_rank_path_v5_atomic.py \
            research_entity/runtime/database_pulse_runtime_v5.py \
            research_entity/runtime/test_database_pulse_runtime_v5.py \
            research_entity/runtime/test_database_pulse_runtime_v5_adversarial.py \
            tools/database_pulse_rank_path_v5_benchmark.py
      - name: Run V5 lifecycle, atomic-maintenance and Runtime falsifiers
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            research_entity.runtime.test_database_pulse_rank_path_v5 \
            research_entity.runtime.test_database_pulse_rank_path_v5_atomic \
            research_entity.runtime.test_database_pulse_runtime_v5 \
            research_entity.runtime.test_database_pulse_runtime_v5_adversarial
      - name: Benchmark V4 inline versus V5 two-phase lifecycle
        run: |
          set -euo pipefail
          mkdir -p research_entity/benchmarks/database_pulse
          python3 tools/database_pulse_rank_path_v5_benchmark.py \
            --rows 5000 --repeats 150 \
            --output research_entity/benchmarks/database_pulse/rank_path_v5_hosted.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frank-database-pulse-v5-hosted
          path: research_entity/benchmarks/database_pulse/rank_path_v5_hosted.json

  hostinger-v5:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, clean: true, persist-credentials: true}
      - name: Compile V5 stack
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research_entity/runtime/database_pulse_rank_path_v5.py \
            research_entity/runtime/test_database_pulse_rank_path_v5.py \
            research_entity/runtime/test_database_pulse_rank_path_v5_atomic.py \
            research_entity/runtime/database_pulse_runtime_v5.py \
            research_entity/runtime/test_database_pulse_runtime_v5.py \
            research_entity/runtime/test_database_pulse_runtime_v5_adversarial.py \
            tools/database_pulse_rank_path_v5_benchmark.py
      - name: Run V5 lifecycle, atomic-maintenance and Runtime falsifiers
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            research_entity.runtime.test_database_pulse_rank_path_v5 \
            research_entity.runtime.test_database_pulse_rank_path_v5_atomic \
            research_entity.runtime.test_database_pulse_runtime_v5 \
            research_entity.runtime.test_database_pulse_runtime_v5_adversarial
      - name: Benchmark V4 inline versus V5 two-phase lifecycle
        run: |
          set -euo pipefail
          mkdir -p research_entity/benchmarks/database_pulse
          python3 tools/database_pulse_rank_path_v5_benchmark.py \
            --rows 5000 --repeats 150 \
            --output research_entity/benchmarks/database_pulse/rank_path_v5_vps.json
      - name: Attach exact Hostinger and program metadata
        env:
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 tools/program_progress.py --json > /tmp/program-progress.json
          python3 - <<'PY'
          import json,os,pathlib,platform,resource,socket,sqlite3,subprocess,sys
          from datetime import datetime,timezone
          p=pathlib.Path('research_entity/benchmarks/database_pulse/rank_path_v5_vps.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          def cmd(args):
              try:return subprocess.check_output(args,text=True,stderr=subprocess.STDOUT,timeout=5).strip()
              except Exception as exc:return f'UNKNOWN:{type(exc).__name__}'
          cpu='UNKNOWN';mem='UNKNOWN'
          try:
              for line in pathlib.Path('/proc/cpuinfo').read_text(errors='replace').splitlines():
                  if line.lower().startswith('model name'):
                      cpu=line.split(':',1)[1].strip();break
          except Exception:pass
          try:
              for line in pathlib.Path('/proc/meminfo').read_text(errors='replace').splitlines():
                  if line.startswith('MemTotal:'):
                      mem=line.split(':',1)[1].strip();break
          except Exception:pass
          x['execution_metadata']={
              'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
              'scope':'REMOTE_PRELIMINARY_DATABASE_PULSE_NOT_ANDREAS_TARGET_ACCEPTANCE',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'git_sha':os.environ.get('GIT_SHA',''),
              'github_run_id':os.environ.get('RUN_ID',''),
              'github_run_attempt':os.environ.get('RUN_ATTEMPT',''),
              'hostname':socket.gethostname(),
              'runner_name':os.environ.get('RUNNER_NAME','UNKNOWN'),
              'runner_os':os.environ.get('RUNNER_OS','UNKNOWN'),
              'runner_arch':os.environ.get('RUNNER_ARCH','UNKNOWN'),
              'platform':platform.platform(),
              'python':sys.version,
              'sqlite':sqlite3.sqlite_version,
              'cpu_model':cpu,
              'mem_total':mem,
              'maxrss':resource.getrusage(resource.RUSAGE_SELF).ru_maxrss,
              'kernel':cmd(['uname','-a']),
              'filesystem':cmd(['df','-T','.']),
          }
          x['program_progress']=json.loads(pathlib.Path('/tmp/program-progress.json').read_text())
          x['release_boundary']='Remote Hostinger Ubuntu preliminary evidence only; not final Andreas Ubuntu target acceptance.'
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert all(x['correctness'].values()),x
          assert all(x['falsifier'].values()),x
          PY
      - name: Persist Hostinger V5 receipt
        run: |
          set -euo pipefail
          cp research_entity/benchmarks/database_pulse/rank_path_v5_vps.json /tmp/rank_path_v5_vps.json
          git reset --hard HEAD
          git clean -fd
          mkdir -p research_entity/benchmarks/database_pulse
          cp /tmp/rank_path_v5_vps.json research_entity/benchmarks/database_pulse/rank_path_v5_vps.json
          git config user.name 'clay-pulse-v5-runner'
          git config user.email 'clay-pulse-v5@users.noreply.github.com'
          git add research_entity/benchmarks/database_pulse/rank_path_v5_vps.json
          git commit -m 'evidence(frank): persist Database Pulse V5 Hostinger receipt [skip ci]' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt*3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frank-database-pulse-v5-hostinger
          path: research_entity/benchmarks/database_pulse/rank_path_v5_vps.json
