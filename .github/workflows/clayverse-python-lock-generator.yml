name: clayverse-python-lock-generator

on:
  pull_request:
    paths:
      - '.github/workflows/clayverse-python-lock-generator.yml'
      - 'the artefact/requirements.txt'
      - 'the artefact/requirements.lock.txt'
      - 'the artefact/Dockerfile'
      - 'the artefact/SOURCE_LOCK.json'
      - 'the artefact/tests/test_python_dependency_lock.py'
      - 'the artefact/tests/test_python_lock_generator_source_binding.py'

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Generate and verify exact Python hash lock
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DOCKERFILE='the artefact/Dockerfile'
          PRODUCT_REQUIREMENTS='the artefact/requirements.txt'
          PRODUCT_SOURCE_LOCK='the artefact/SOURCE_LOCK.json'
          test -f "$PRODUCT_DOCKERFILE"
          test -f "$PRODUCT_REQUIREMENTS"
          test -f "$PRODUCT_SOURCE_LOCK"

          BASE_IMAGE="$(sed -n -E 's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]+([^[:space:]]+).*/\1/p' "$PRODUCT_DOCKERFILE" | head -n1)"
          if ! printf '%s\n' "$BASE_IMAGE" | grep -Eq '^python:[^[:space:]]+@sha256:[0-9a-f]{64}$'; then
            echo "Product first FROM is not an exact digest-pinned Python image: $BASE_IMAGE" >&2
            exit 1
          fi
          SOURCE_LOCK_BASE_IMAGE="$(python3 - "$PRODUCT_SOURCE_LOCK" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          lock = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          base = lock.get('base_image')
          if not isinstance(base, dict):
              raise SystemExit('SOURCE_LOCK_BASE_IMAGE_MISSING')
          reference = base.get('reference')
          digest = base.get('index_digest')
          if not isinstance(reference, str) or re.fullmatch(r'python:[^\s@]+', reference) is None:
              raise SystemExit(f'SOURCE_LOCK_BASE_REFERENCE_INVALID:{reference!r}')
          if not isinstance(digest, str) or re.fullmatch(r'sha256:[0-9a-f]{64}', digest) is None:
              raise SystemExit(f'SOURCE_LOCK_BASE_DIGEST_INVALID:{digest!r}')
          print(f'{reference}@{digest}')
          PY
          )"
          if [ "$BASE_IMAGE" != "$SOURCE_LOCK_BASE_IMAGE" ]; then
            echo "Dockerfile/SOURCE_LOCK base image drift: dockerfile=$BASE_IMAGE source_lock=$SOURCE_LOCK_BASE_IMAGE" >&2
            exit 1
          fi
          REQUIREMENTS_SHA256="$(sha256sum "$PRODUCT_REQUIREMENTS" | awk '{print $1}')"
          SOURCE_LOCK_SHA256="$(sha256sum "$PRODUCT_SOURCE_LOCK" | awk '{print $1}')"
          echo "PRODUCT_BASE_IMAGE=$BASE_IMAGE"
          echo "SOURCE_LOCK_BASE_IMAGE=$SOURCE_LOCK_BASE_IMAGE"
          echo "PRODUCT_REQUIREMENTS_SHA256=$REQUIREMENTS_SHA256"
          echo "PRODUCT_SOURCE_LOCK_SHA256=$SOURCE_LOCK_SHA256"

          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -e EXPECTED_REQUIREMENTS_SHA256="$REQUIREMENTS_SHA256" \
            -e EXPECTED_SOURCE_LOCK_SHA256="$SOURCE_LOCK_SHA256" \
            "$BASE_IMAGE" bash -s <<'INNER'
          set -euo pipefail
          PRODUCT_REQUIREMENTS='/workspace/the artefact/requirements.txt'
          PRODUCT_SOURCE_LOCK='/workspace/the artefact/SOURCE_LOCK.json'
          test "$(sha256sum "$PRODUCT_REQUIREMENTS" | awk '{print $1}')" = "$EXPECTED_REQUIREMENTS_SHA256"
          test "$(sha256sum "$PRODUCT_SOURCE_LOCK" | awk '{print $1}')" = "$EXPECTED_SOURCE_LOCK_SHA256"
          cp "$PRODUCT_REQUIREMENTS" /tmp/requirements.in

          python --version
          python -m pip --version
          python -m pip freeze --all | LC_ALL=C sort > /tmp/generator.base.freeze
          echo -n 'GENERATOR_BASE_FREEZE_SHA256='; sha256sum /tmp/generator.base.freeze | awk '{print $1}'
          echo 'GENERATOR_BASE_ENVIRONMENT_BEGIN'
          cat /tmp/generator.base.freeze
          echo 'GENERATOR_BASE_ENVIRONMENT_END'

          # Source-lock the complete Linux/Python-3.13 pip-tools bootstrap set.
          # Hash-checking mode rejects any undeclared transitive package; the install
          # then runs offline from exactly the verified wheelhouse.
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          lock = json.loads(Path('/workspace/the artefact/SOURCE_LOCK.json').read_text(encoding='utf-8'))
          generator = lock['python_lock_generator']
          pip_tools = generator['pip_tools']
          entries = [{
              'requirement': f"pip-tools=={pip_tools['version']}",
              'wheel': pip_tools['wheel'],
              'sha256': pip_tools['sha256'],
          }, *generator['bootstrap_dependencies']]

          expected_names = {
              'build', 'click', 'packaging', 'pip', 'pip-tools',
              'pyproject-hooks', 'setuptools', 'wheel',
          }
          seen = []
          for entry in entries:
              requirement = entry['requirement']
              match = re.fullmatch(r'([A-Za-z0-9_.-]+)==([^\s]+)', requirement)
              if match is None:
                  raise SystemExit(f'GENERATOR_REQUIREMENT_INVALID:{requirement}')
              seen.append(match.group(1).lower().replace('_', '-'))
              wheel = entry['wheel']
              sha256 = entry['sha256']
              if not wheel.endswith('.whl') or '/' in wheel or '\\' in wheel:
                  raise SystemExit(f'GENERATOR_WHEEL_INVALID:{requirement}:{wheel}')
              if re.fullmatch(r'[0-9a-f]{64}', sha256) is None:
                  raise SystemExit(f'GENERATOR_SHA256_INVALID:{requirement}:{sha256}')
          if set(seen) != expected_names or len(seen) != len(expected_names):
              raise SystemExit(f'GENERATOR_BOOTSTRAP_CLOSURE_MISMATCH:{sorted(seen)}')

          Path('/tmp/generator-bootstrap.requirements').write_text(
              ''.join(f"{entry['requirement']} --hash=sha256:{entry['sha256']}\n" for entry in entries),
              encoding='utf-8',
          )
          Path('/tmp/generator-bootstrap.expected').write_text(
              ''.join(
                  f"{entry['sha256']}  {entry['wheel']}\n"
                  for entry in sorted(entries, key=lambda item: item['wheel'])
              ),
              encoding='utf-8',
          )
          print(f'GENERATOR_BOOTSTRAP_EXPECTED_COUNT={len(entries)}')
          PY

          rm -rf /tmp/pip-tools-bootstrap && mkdir -p /tmp/pip-tools-bootstrap
          python -m pip download --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --require-hashes \
            -r /tmp/generator-bootstrap.requirements \
            -d /tmp/pip-tools-bootstrap

          test "$(find /tmp/pip-tools-bootstrap -maxdepth 1 -type f | wc -l)" -eq "$(wc -l < /tmp/generator-bootstrap.expected)"
          (
            cd /tmp/pip-tools-bootstrap
            sha256sum -c /tmp/generator-bootstrap.expected
          )
          echo 'GENERATOR_BOOTSTRAP_SHA256_BEGIN'
          cat /tmp/generator-bootstrap.expected
          echo 'GENERATOR_BOOTSTRAP_SHA256_END'

          python -m pip install --disable-pip-version-check --no-cache-dir \
            --no-index --find-links=/tmp/pip-tools-bootstrap \
            --only-binary=:all: --require-hashes \
            -r /tmp/generator-bootstrap.requirements
          python -m pip --version | grep -F 'pip 26.1.2 '
          pip-compile --version | grep -F 'version 7.5.3'

          python -m pip freeze --all | LC_ALL=C sort > /tmp/generator.freeze
          echo -n 'GENERATOR_FREEZE_SHA256='; sha256sum /tmp/generator.freeze | awk '{print $1}'
          echo 'GENERATOR_ENVIRONMENT_BEGIN'
          cat /tmp/generator.freeze
          echo 'GENERATOR_ENVIRONMENT_END'

          # Both independent compilations must target the same output path. pip-tools
          # records the compile command/output path in the generated header, so using
          # .lock.1 and .lock.2 as output names would create a deterministic false
          # reproducibility failure before dependency bytes are even compared.
          LOCK_PATH='/tmp/requirements.lock'
          LOCK_FIRST='/tmp/requirements.lock.first'
          rm -f "$LOCK_PATH" "$LOCK_FIRST"
          pip-compile --generate-hashes --strip-extras --allow-unsafe --resolver=backtracking \
            -o "$LOCK_PATH" /tmp/requirements.in
          cp "$LOCK_PATH" "$LOCK_FIRST"
          rm -f "$LOCK_PATH"
          pip-compile --generate-hashes --strip-extras --allow-unsafe --resolver=backtracking \
            -o "$LOCK_PATH" /tmp/requirements.in
          diff -u "$LOCK_FIRST" "$LOCK_PATH"

          echo -n 'LOCK_SHA256='; sha256sum "$LOCK_PATH" | awk '{print $1}'
          rm -rf /tmp/wheelhouse && mkdir /tmp/wheelhouse
          python -m pip download --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --require-hashes \
            -r "$LOCK_PATH" -d /tmp/wheelhouse
          echo -n 'WHEELHOUSE_FILE_COUNT='; find /tmp/wheelhouse -maxdepth 1 -type f | wc -l
          echo 'WHEELHOUSE_SHA256_BEGIN'
          while IFS= read -r wheel; do
            printf '%s  %s\n' "$(sha256sum "$wheel" | awk '{print $1}')" "${wheel##*/}"
          done < <(find /tmp/wheelhouse -maxdepth 1 -type f -print | LC_ALL=C sort)
          echo 'WHEELHOUSE_SHA256_END'
          printf 'LOCK_GZIP_B64='; gzip -n -c "$LOCK_PATH" | base64 -w0; printf '\n'
          INNER