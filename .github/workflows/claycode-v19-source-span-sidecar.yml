name: ClayCode V19 Source Span Sidecar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claycode-v19-source-span-sidecar.yml'
      - 'tools/claycode_v19_source_span_sidecar_probe.py'
      - 'tools/claycode_v19_delimiter_normalization_probe.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V19_DELIMITER_NORMALIZABLE.lark'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hosted-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated parser environment
        run: |
          python3 -m venv /tmp/clay-v19-span-preflight-${GITHUB_RUN_ID}
          /tmp/clay-v19-span-preflight-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Run semantic-hash vs source-span discriminator
        env:
          PYTHONPATH: tools
          PYTHONSAFEPATH: '1'
        run: /tmp/clay-v19-span-preflight-${GITHUB_RUN_ID}/bin/python tools/claycode_v19_source_span_sidecar_probe.py
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/clay-v19-span-preflight-${GITHUB_RUN_ID}

  hostinger-replication:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build isolated parser environment
        run: |
          python3 -m venv /tmp/clay-v19-span-hostinger-${GITHUB_RUN_ID}
          /tmp/clay-v19-span-hostinger-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Run and persist bounded receipt
        env:
          PYTHONPATH: tools
          PYTHONSAFEPATH: '1'
        run: |
          VENV=/tmp/clay-v19-span-hostinger-${GITHUB_RUN_ID}
          "$VENV/bin/python" tools/claycode_v19_source_span_sidecar_probe.py > /tmp/clay_v19_source_span.json
          python3 - <<'PY'
          import json, os, pathlib
          src=pathlib.Path('/tmp/clay_v19_source_span.json')
          d=json.loads(src.read_text())
          d['receipt_id']='CLAYCODE-V19-SOURCE-SPAN-HOSTINGER-'+os.environ['GITHUB_RUN_ID']
          d['commit']=os.environ['GITHUB_SHA']
          d['run_id']=os.environ['GITHUB_RUN_ID']
          d['runner_name']=os.environ.get('RUNNER_NAME','UNKNOWN')
          d['truth_class']='VERIFIED_REMOTE_EXECUTION_BOUNDED_SOURCE_SPAN_SHADOW_SCOPE'
          d['promotion']='NONE'
          out=pathlib.Path('research_entity/claycode/base/receipts/V19_SOURCE_SPAN_SIDECAR_HOSTINGER_LATEST.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'clay-hostinger-runner'
          git config user.email 'clay-hostinger-runner@users.noreply.github.com'
          git add research_entity/claycode/base/receipts/V19_SOURCE_SPAN_SIDECAR_HOSTINGER_LATEST.json
          git commit -m 'evidence(claycode): record V19 source-span sidecar probe' || exit 0
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/clay-v19-span-hostinger-${GITHUB_RUN_ID}
