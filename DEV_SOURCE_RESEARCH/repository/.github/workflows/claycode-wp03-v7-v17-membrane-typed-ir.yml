name: ClayCode WP03 V7-V17 Membrane Typed IR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claycode-wp03-v7-v17-membrane-typed-ir.yml'
      - 'tools/claycode_wp03_v7_v17_membrane_typed_ir_differential.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_RESEARCH_V7_TYPED_FN_V17_RELATION_MEMBRANE.lark'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_typed_ir.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hosted-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize existing typed-IR candidate without merging it
        run: |
          git fetch origin go-wp03-keyword-ident-20260810 --depth=1
          git show FETCH_HEAD:tools/claycode_base_typed_ir.py > /tmp/claycode_base_typed_ir_candidate.py
      - name: Isolated strict parser environment
        run: |
          python3 -m venv /tmp/clay-wp03-membrane-${GITHUB_RUN_ID}
          /tmp/clay-wp03-membrane-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Execute composed causal differential
        env:
          PYTHONPATH: tools
          PYTHONSAFEPATH: '1'
        run: /tmp/clay-wp03-membrane-${GITHUB_RUN_ID}/bin/python tools/claycode_wp03_v7_v17_membrane_typed_ir_differential.py --typed-ir-candidate /tmp/claycode_base_typed_ir_candidate.py
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/clay-wp03-membrane-${GITHUB_RUN_ID} /tmp/claycode_base_typed_ir_candidate.py

  hostinger-probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize existing typed-IR candidate without merging it
        run: |
          git fetch origin go-wp03-keyword-ident-20260810 --depth=1
          git show FETCH_HEAD:tools/claycode_base_typed_ir.py > /tmp/claycode_base_typed_ir_candidate-${GITHUB_RUN_ID}.py
      - name: Isolated strict parser environment
        run: |
          python3 -m venv /tmp/clay-wp03-membrane-${GITHUB_RUN_ID}
          /tmp/clay-wp03-membrane-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Execute and persist exact bounded receipt
        env:
          PYTHONPATH: tools
          PYTHONSAFEPATH: '1'
        run: |
          VENV=/tmp/clay-wp03-membrane-${GITHUB_RUN_ID}
          CAND=/tmp/claycode_base_typed_ir_candidate-${GITHUB_RUN_ID}.py
          "$VENV/bin/python" tools/claycode_wp03_v7_v17_membrane_typed_ir_differential.py --typed-ir-candidate "$CAND" > /tmp/wp03_v7_v17_membrane.json
          python3 - <<'PY'
          import json, os, pathlib
          d=json.loads(pathlib.Path('/tmp/wp03_v7_v17_membrane.json').read_text())
          d['receipt_id']='CLAYCODE-WP03-V7-V17-MEMBRANE-HOSTINGER-'+os.environ['GITHUB_RUN_ID']
          d['commit']=os.environ['GITHUB_SHA']
          d['run_id']=os.environ['GITHUB_RUN_ID']
          d['runner_name']=os.environ.get('RUNNER_NAME','UNKNOWN')
          d['truth_class']='VERIFIED_REMOTE_EXECUTION_BOUNDED_WP03_COMPOSED_RESEARCH_SCOPE'
          out=pathlib.Path('research_entity/claycode/base/receipts/WP03_V7_V17_MEMBRANE_TYPED_IR_HOSTINGER_LATEST.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'clay-hostinger-runner'
          git config user.email 'clay-hostinger-runner@users.noreply.github.com'
          git add research_entity/claycode/base/receipts/WP03_V7_V17_MEMBRANE_TYPED_IR_HOSTINGER_LATEST.json
          git commit -m 'evidence(wp03): record V7-V17 membrane typed IR Hostinger' || exit 0
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/clay-wp03-membrane-${GITHUB_RUN_ID} /tmp/claycode_base_typed_ir_candidate-${GITHUB_RUN_ID}.py
