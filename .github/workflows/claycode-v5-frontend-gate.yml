name: ClayCode V5 full-corpus frontend gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_strict_lalr_probe.py'
      - 'tools/claycode_base_frontend_validation.py'
      - 'tools/claycode_v5_frontend_regression.py'
      - 'tools/claycode_base_canonicalizer.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V5.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
      - '.github/workflows/claycode-v5-frontend-gate.yml'

concurrency:
  group: claycode-v5-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  v5-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned strict parser dependencies
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Strict-build V5 and record conflict diagnostics
        run: |
          python tools/claycode_strict_lalr_probe.py \
            --grammar research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V5.lark \
            --output research_entity/claycode/autonomous/STRICT_LALR_D_V5_RECEIPT.json
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/STRICT_LALR_D_V5_RECEIPT.json'
          d=json.load(open(p,encoding='utf-8'))
          if not d.get('strict_build_ok'):
              raise SystemExit('V5 strict build failed: '+str(d.get('strict_error')))
          if d.get('conflict_diagnostics'):
              raise SystemExit('V5 strict conflicts: '+str(d['conflict_diagnostics']))
          print('V5_STRICT_BUILD_PASS')
          PY
      - name: Run V5 focused regression surface
        run: python tools/claycode_v5_frontend_regression.py
      - name: Run exact current G9 and Dialect full-corpus validation
        run: |
          python tools/claycode_base_frontend_validation.py \
            --grammar research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V5.lark \
            --output research_entity/claycode/autonomous/BASE_FRONTEND_V5_VALIDATION_RECEIPT.json
      - name: Prove deterministic literal-safe canonical syntax identity
        run: |
          python tools/claycode_base_canonicalizer.py \
            --grammar research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V5.lark \
            --output research_entity/claycode/autonomous/BASE_CANONICAL_SYNTAX_V5_RECEIPT.json
      - name: Commit V5 validation receipts
        run: |
          git config user.name 'claycode-v5-gate'
          git config user.email 'claycode-v5-gate@users.noreply.github.com'
          git add \
            research_entity/claycode/autonomous/STRICT_LALR_D_V5_RECEIPT.json \
            research_entity/claycode/autonomous/V5_FRONTEND_REGRESSION_RECEIPT.json \
            research_entity/claycode/autonomous/BASE_FRONTEND_V5_VALIDATION_RECEIPT.json \
            research_entity/claycode/autonomous/BASE_CANONICAL_SYNTAX_V5_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record V5 full-corpus frontend receipts'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
