name: ClayCode FRANK packet-score handoff proxy

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_frank_packet_score_handoff.py'
      - 'tools/claycode_base_pure_toolchain.py'
      - 'research_entity/harness/reference/active_assembly.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - '.github/workflows/claycode-frank-packet-score-handoff.yml'

permissions:
  contents: write

concurrency:
  group: claycode-frank-packet-score-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frank-packet-score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Confirm native compiler
        run: cc --version
      - name: Compile and differential-test real frozen FRANK subsystem
        run: python tools/claycode_frank_packet_score_handoff.py
      - name: Preserve handoff receipt
        run: |
          git config user.name 'claycode-frank-handoff'
          git config user.email 'claycode-frank-handoff@users.noreply.github.com'
          git add research_entity/claycode/autonomous/FRANK_PACKET_SCORE_CLAY_HANDOFF_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record FRANK packet-score handoff receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
