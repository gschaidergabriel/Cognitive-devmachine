name: claycog-validator-pr

on:
  pull_request:
    paths:
      - 'the artefact/blogpost_entity/mini_cognition/**'
      - '.github/workflows/claycog-validator-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claycog-validator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Record source identity
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$GITHUB_SHA"
          git rev-parse HEAD
          git status --short
      - name: Compile cognition admission boundary
        run: |
          set -euo pipefail
          python3 -m py_compile \
            'the artefact/blogpost_entity/mini_cognition/claycode_syntax_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/claycode_calls_v2.py' \
            'the artefact/blogpost_entity/mini_cognition/eval_outputs_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/validate_sft_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/test_semantic_call_admission_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/launch_together_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/describe_campaign_offline_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/test_describe_campaign_offline_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/audit_together_byom_template_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/test_audit_together_byom_template_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/test_launch_together_safety_v1.py' \
            'the artefact/blogpost_entity/mini_cognition/test_together_provider_contract_v2.py'
      - name: Run strict ClayCode and paid-create safety regressions
        run: |
          set -euo pipefail
          python3 'the artefact/blogpost_entity/mini_cognition/test_validate_sft_v1.py'
          python3 'the artefact/blogpost_entity/mini_cognition/test_validate_corpus_v2.py'
          python3 'the artefact/blogpost_entity/mini_cognition/test_describe_campaign_offline_v1.py'
          python3 'the artefact/blogpost_entity/mini_cognition/test_audit_together_byom_template_v1.py'
          python3 'the artefact/blogpost_entity/mini_cognition/test_launch_together_safety_v1.py'
          python3 'the artefact/blogpost_entity/mini_cognition/test_together_provider_contract_v2.py'
      - name: Regenerate and validate exact SFT v2 corpus
        run: |
          set -euo pipefail
          cd 'the artefact/blogpost_entity/mini_cognition'
          python3 generate_sft_v2.py
          python3 validate_corpus_v2.py train_v2.jsonl validation_v2.jsonl
          git diff --exit-code -- corpus_manifest_v2.json
      - name: Run exact omega OOD promotion regression
        run: |
          set -euo pipefail
          python3 'the artefact/blogpost_entity/mini_cognition/test_eval_exact_vector_v1.py'
      - name: Run shared semantic-call admission regression
        run: |
          set -euo pipefail
          python3 'the artefact/blogpost_entity/mini_cognition/test_semantic_call_admission_v1.py'
      - name: Materialize evaluation-only compositional OOD lesion
        run: |
          set -euo pipefail
          cd 'the artefact/blogpost_entity/mini_cognition'
          python3 generate_eval_compositional_ood_v1.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(line) for line in Path('eval_compositional_ood_v1.jsonl').read_text().splitlines() if line.strip()]
          assert len(rows)==320, len(rows)
          assert len({x['id'] for x in rows})==320
          families={x['family'] for x in rows}
          assert len(families)==6, families
          print({'cases':len(rows),'unique_ids':320,'families':sorted(families),'role':'evaluation_only'})
          PY
