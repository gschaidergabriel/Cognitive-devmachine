name: GO878 active backlog Forge wiring

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: go878-active-backlog-forge
  cancel-in-progress: false

jobs:
  wire-active-forge:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] GO878 active backlog Forge' && github.event.issue.user.login == 'gschaidergabriel'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          clean: true
          persist-credentials: true

      - name: Patch and regression-test inside clay-direct-dev
        shell: bash
        run: |
          set -euo pipefail
          scratch="/tmp/clay-go878-forge-${GITHUB_RUN_ID}"
          host_tmp="/tmp/clay-go878-host-${GITHUB_RUN_ID}"
          rm -rf "$host_tmp"
          mkdir -p "$host_tmp"

          runtime=''
          prefix=()
          if command -v docker >/dev/null 2>&1 && docker inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='docker'; prefix=(docker)
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='sudo-docker'; prefix=(sudo -n docker)
          elif command -v podman >/dev/null 2>&1 && podman inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='podman'; prefix=(podman)
          elif command -v sudo >/dev/null 2>&1 && sudo -n podman inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='sudo-podman'; prefix=(sudo -n podman)
          else
            echo 'clay-direct-dev not reachable through docker/podman' >&2
            exit 41
          fi

          source_head="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1)"
          "${prefix[@]}" exec clay-direct-dev sh -lc "rm -rf '$scratch'; mkdir -p '$scratch'"
          "${prefix[@]}" cp "$GITHUB_WORKSPACE/." "clay-direct-dev:$scratch"

          "${prefix[@]}" exec clay-direct-dev sh -lc "set -eu; cd '$scratch'; python3 tools/apply_go878_active_backlog_forge.py --repo . > /tmp/go878-patch.txt 2>&1; python3 -m pytest -q tests/test_free_swarm_historical_backfill.py > /tmp/go878-tests.txt 2>&1; bash -n tools/run_6000_free_swarm_supervisor.sh; python3 -m py_compile tools/run_free_evidence_forge_backfill.py tools/free_swarm_historical_backfill.py tools/free_swarm_backfill_scheduler.py"

          "${prefix[@]}" cp "clay-direct-dev:$scratch/tools/run_6000_free_swarm_supervisor.sh" "$GITHUB_WORKSPACE/tools/run_6000_free_swarm_supervisor.sh"
          "${prefix[@]}" cp clay-direct-dev:/tmp/go878-patch.txt "$host_tmp/patch.txt"
          "${prefix[@]}" cp clay-direct-dev:/tmp/go878-tests.txt "$host_tmp/tests.txt"

          SOURCE_HEAD="$source_head" RUNTIME="$runtime" HOST_TMP="$host_tmp" python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          from datetime import datetime, timezone

          ws = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          host_tmp = pathlib.Path(os.environ['HOST_TMP'])
          supervisor = ws / 'tools/run_6000_free_swarm_supervisor.sh'
          patcher = ws / 'tools/apply_go878_active_backlog_forge.py'
          backfill = ws / 'tools/run_free_evidence_forge_backfill.py'
          text = supervisor.read_text(encoding='utf-8')
          assert 'local x="$ROOT/tools/run_free_evidence_forge_backfill.py"' in text
          assert 'local x="$ROOT/tools/run_free_evidence_forge_safe.py"' not in text
          assert "'forge_running':running('run_free_evidence_forge_backfill.py')" in text
          assert "'superseded_safe_forge_running':running('run_free_evidence_forge_safe.py')" in text

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          receipt = {
              'schema': 'CLAY_GO878_ACTIVE_BACKLOG_FORGE_WIRING_RECEIPT/v1',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'authority_epoch': '8.78',
              'program': 'ENTITYOS_HCU',
              'product': 'EntityOS',
              'architecture': 'HCU',
              'mode': 'FREE_ONLY',
              'github_run_id': os.environ.get('GITHUB_RUN_ID'),
              'source_main_head_before_patch': os.environ['SOURCE_HEAD'],
              'source_supervisor_git_blob_required': '35550943dd829a3f9e7072a91cd018a76d17f185',
              'patched_supervisor_sha256': sha(supervisor),
              'patcher_sha256': sha(patcher),
              'backlog_first_forge_sha256': sha(backfill),
              'sandbox': 'clay-direct-dev',
              'container_runtime': os.environ['RUNTIME'],
              'patch_output': (host_tmp / 'patch.txt').read_text(errors='replace'),
              'historical_backfill_test_output': (host_tmp / 'tests.txt').read_text(errors='replace'),
              'active_forge_entrypoint': 'tools/run_free_evidence_forge_backfill.py',
              'delegated_safe_forge_authority': 'run_free_evidence_forge_safe_871',
              'second_forge_authority_created': False,
              'provider_calls_performed': False,
              'provider_credentials_read': False,
              'paid_fallback_used': False,
              'together_used': False,
              'runtime_credit_added': 0,
              'scope': 'ACTIVE_FORGE_SUPERVISOR_WIRING_PLUS_DETERMINISTIC_BACKFILL_REGRESSION_ONLY',
              'next_runtime_gate': 'runtime-reconcile-871-selfhosted push trigger on this supervisor-file commit; then require historical saturation receipt before scale-up',
          }
          target = ws / 'research_entity/runtime/tool_results' / f"go878-active-backlog-forge-{os.environ['GITHUB_RUN_ID']}.json"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          "${prefix[@]}" exec clay-direct-dev sh -lc "rm -rf '$scratch' /tmp/go878-patch.txt /tmp/go878-tests.txt"
          rm -rf "$host_tmp"

      - name: Persist exact tested active-path delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'clay-go878-backfill-runner'
          git config user.email 'clay-go878-backfill-runner@users.noreply.github.com'
          git add tools/run_6000_free_swarm_supervisor.sh research_entity/runtime/tool_results/
          git commit -m "free swarm: activate backlog-first Forge under supervisor 8.78 [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
