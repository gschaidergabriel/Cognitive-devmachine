name: WP03 rule invariant legality v1

on:
  pull_request:
    paths:
      - 'tools/claycode_wp04_rule_invariant_legality_v1.py'
      - 'tools/test_claycode_wp04_rule_invariant_legality_v1.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V18_REWARD_RELATIONS.lark'
      - 'tools/claycode_base_frontend.py'
      - '.github/workflows/wp03-rule-invariant-legality-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legality-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install 'lark==1.3.1'
      - name: Execute class-specific legality discriminator
        run: python tools/test_claycode_wp04_rule_invariant_legality_v1.py
