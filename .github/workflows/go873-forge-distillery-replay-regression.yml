name: GO873 Forge Distillery replay regression

on:
  pull_request:
    paths:
      - "tools/ingest_forge_accepts_into_distillery.py"
      - "tools/forge_evidence_credit_871.py"
      - "tests/test_forge_distillery_replay_identity_873.py"
      - "tests/test_forge_distillery_live_bridge_871.py"
      - ".github/workflows/go873-forge-distillery-replay-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile bridge
        run: python3 -m py_compile tools/ingest_forge_accepts_into_distillery.py tools/forge_evidence_credit_871.py
      - name: Replay identity regression
        run: python3 -m unittest -q tests.test_forge_distillery_replay_identity_873
      - name: Live bridge wiring regression
        run: python3 -m unittest -q tests.test_forge_distillery_live_bridge_871
