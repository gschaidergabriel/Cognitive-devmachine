# TEMPLATE: final ClayVerse deployment profile.
# Replace image and secret/PVC details only after exact artifact acceptance.
# The installed Kata RuntimeClass name MUST be verified on the target cluster.
# The cluster network plugin MUST enforce networking.k8s.io/v1 NetworkPolicy.
apiVersion: v1
kind: Service
metadata:
  name: clayverse
spec:
  selector:
    app: clayverse
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Fail closed at L3/L4: ordinary Kubernetes pods are non-isolated until a
# selecting NetworkPolicy applies. This policy intentionally grants no traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clayverse-default-deny
spec:
  podSelector:
    matchLabels:
      app: clayverse
  policyTypes:
    - Ingress
    - Egress
---
# Browser/API ingress must come through an explicitly admitted in-cluster
# gateway. Both its namespace and pod require this label; no wildcard source is
# admitted by the reference profile. The gateway remains outside ClayVerse
# cognition/state authority and may only reach the authenticated port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clayverse-allow-ingress-gateway
spec:
  podSelector:
    matchLabels:
      app: clayverse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              clayverse.network/ingress: "true"
          podSelector:
            matchLabels:
              clayverse.network/ingress: "true"
      ports:
        - protocol: TCP
          port: 3000
---
# DNS is the only generic egress admitted by this portable template. The
# kube-system/CoreDNS labels below MUST be verified on the deployment cluster;
# clusters using node-local DNS or different labels require an explicit bounded
# replacement policy.
#
# External Clerk / Claude / GLM HTTPS egress is intentionally NOT opened to
# 0.0.0.0/0 or ::/0. Final deployment must add separately reviewed endpoint-
# specific CNI/egress-gateway/proxy policy after those destinations are bound.
# Until then provider calls fail closed instead of gaining arbitrary Internet
# egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clayverse-allow-dns
spec:
  podSelector:
    matchLabels:
      app: clayverse
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clayverse
spec:
  serviceName: clayverse
  replicas: 1
  selector:
    matchLabels:
      app: clayverse
  template:
    metadata:
      labels:
        app: clayverse
    spec:
      # Final acceptance requires a Kata VM-backed RuntimeClass.
      # Current Kata runtime-rs quick-start example uses kata-qemu-runtime-rs.
      runtimeClassName: kata-qemu-runtime-rs
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clayverse
          # MUST be replaced by the exact accepted immutable image digest.
          image: registry.example.invalid/clayverse@sha256:REPLACE_WITH_ACCEPTED_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: CLAYVERSE_STATE_ROOT
              value: /var/lib/clayverse
            - name: CLAYVERSE_WORKSPACE
              value: /workspace
            - name: CLAYVERSE_REQUIRE_CLAUDE
              value: "1"
            - name: CLAYVERSE_ENABLE_ENTITYOS_EXEC
              value: "1"
            - name: CLAYVERSE_ENTITYOS_PATH
              value: /opt/entityos/EntityOS
            - name: CLAYVERSE_ENTITYOS_SHA256
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: entityos-sha256
            - name: CLAYVERSE_CLERK_MAP_JSON
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-map-json
            - name: CLERK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-issuer
            - name: CLERK_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-jwks-url
            - name: CLERK_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-audience
            - name: CLERK_AUTHORIZED_PARTIES
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-authorized-parties
            - name: CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-publishable-key
            - name: CLERK_FRONTEND_API_URL
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: clerk-frontend-api-url
            # GLM is inference-only. Token is injected as a secret and must never
            # enter UnifiedDB, snapshots, receipts or logs.
            - name: GLM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clayverse-runtime-secrets
                  key: glm-api-token
                  optional: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: clayverse-state
              mountPath: /var/lib/clayverse
            - name: clayverse-workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: clayverse-state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: clayverse-workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
