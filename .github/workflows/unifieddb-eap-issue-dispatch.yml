name: UnifiedDB EAP Issue Dispatch

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: read

concurrency:
  group: unifieddb-eap-issue-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] UnifiedDB EAP benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout persistence lane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Dispatch bounded EAP benchmark gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body='{"ref":"main"}'
          dispatch_one() {
            local workflow="$1"
            curl -sS --retry 2 --retry-delay 1 \
              -o "/tmp/${workflow}.body" \
              -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d "$body"
          }
          code_model="$(dispatch_one unifieddb-eap-vps-benchmark.yml)"
          code_incremental="$(dispatch_one unifieddb-eap-incremental-vps.yml)"
          code_exact_topk="$(dispatch_one unifieddb-eap-exact-topk-vps.yml)"
          python3 - "$code_model" "$code_incremental" "$code_exact_topk" <<'PY' > /tmp/UNIFIEDDB_EAP_DISPATCH.json
          import json, os, sys
          from datetime import datetime, timezone
          event=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8'))
          model_code, incremental_code, exact_topk_code=sys.argv[1:4]
          dispatches=[
            {'workflow':'unifieddb-eap-vps-benchmark.yml','http_status':model_code,'accepted':model_code=='204'},
            {'workflow':'unifieddb-eap-incremental-vps.yml','http_status':incremental_code,'accepted':incremental_code=='204'},
            {'workflow':'unifieddb-eap-exact-topk-vps.yml','http_status':exact_topk_code,'accepted':exact_topk_code=='204'},
          ]
          print(json.dumps({
            'schema_version':'1.3',
            'evidence_class':'REAL_GITHUB_ISSUE_TRIGGER_AND_WORKFLOW_DISPATCH',
            'created_at':datetime.now(timezone.utc).isoformat(),
            'dispatches':dispatches,
            'all_dispatches_accepted':all(item['accepted'] for item in dispatches),
            'target_ref':'main',
            'bridge_sha':os.environ.get('GITHUB_SHA',''),
            'bridge_run_id':os.environ.get('GITHUB_RUN_ID',''),
            'issue_number':event.get('issue',{}).get('number'),
            'scope_guard':'204 proves workflow-dispatch acceptance only, not self-hosted runner execution or benchmark pass.',
          },indent=2,sort_keys=True))
          PY
          cat /tmp/UNIFIEDDB_EAP_DISPATCH.json
          test "$code_model" = 204
          test "$code_incremental" = 204
          test "$code_exact_topk" = 204

      - name: Persist dispatch receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_entity/state/system/unifieddb_eap_dispatch
          cp /tmp/UNIFIEDDB_EAP_DISPATCH.json research_entity/state/system/unifieddb_eap_dispatch/LATEST.json
          run_id="$(python3 -c "import json;print(json.load(open('/tmp/UNIFIEDDB_EAP_DISPATCH.json'))['bridge_run_id'])")"
          cp /tmp/UNIFIEDDB_EAP_DISPATCH.json "research_entity/state/system/unifieddb_eap_dispatch/${run_id}.json"
          git config user.name 'clay-eap-dispatch'
          git config user.email 'clay-eap-dispatch@users.noreply.github.com'
          git add research_entity/state/system/unifieddb_eap_dispatch/
          git commit -m "evidence(unifieddb): persist EAP dispatch ${run_id} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
