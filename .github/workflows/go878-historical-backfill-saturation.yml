name: GO878 historical Free-Swarm backfill saturation

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: go878-historical-backfill-saturation
  cancel-in-progress: false

jobs:
  backfill:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] GO878 historical backfill saturation' && github.event.issue.user.login == 'gschaidergabriel'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Run exact-current local historical replay in clay-direct-dev
        shell: bash
        run: |
          set -euo pipefail
          scratch="/tmp/clay-go878-backfill-${GITHUB_RUN_ID}"
          runtime=''
          prefix=()
          if command -v docker >/dev/null 2>&1 && docker inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='docker'; prefix=(docker)
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='sudo-docker'; prefix=(sudo -n docker)
          elif command -v podman >/dev/null 2>&1 && podman inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='podman'; prefix=(podman)
          elif command -v sudo >/dev/null 2>&1 && sudo -n podman inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='sudo-podman'; prefix=(sudo -n podman)
          else
            echo 'clay-direct-dev not reachable through docker/podman' >&2
            exit 41
          fi

          "${prefix[@]}" exec clay-direct-dev sh -lc "rm -rf '$scratch'; mkdir -p '$scratch'"
          "${prefix[@]}" cp "$GITHUB_WORKSPACE/." "clay-direct-dev:$scratch"

          # Fail closed if the designated persistent artifact corpus/Forge DB is not
          # available inside the owned sandbox. No host fallback is used here.
          "${prefix[@]}" exec clay-direct-dev sh -lc "set -eu; test -d /artifacts/clay-entityos-swarm; test -f /artifacts/clay-entityos-swarm/forge/forge.sqlite3; find /artifacts/clay-entityos-swarm -name workers.jsonl -type f -print -quit | grep -q ."

          "${prefix[@]}" exec clay-direct-dev sh -lc "set -eu; cd '$scratch'; export PYTHONDONTWRITEBYTECODE=1; python3 -m pytest -p no:cacheprovider tests/test_free_swarm_historical_backfill.py -q > /tmp/go878-backfill-tests.txt 2>&1"

          "${prefix[@]}" exec clay-direct-dev sh -lc "set -eu; cd '$scratch'; export PYTHONDONTWRITEBYTECODE=1; env -u GROQ_API_KEY -u GROQ_API_KEYS -u MISTRAL_API_KEY -u MISTRAL_API_KEYS -u NVIDIA_API_KEY -u NVIDIA_API_KEYS -u NVIDIA_NIM_API_KEY -u NGC_API_KEY -u OPENROUTER_API_KEY -u OPENROUTER_API_KEYS -u TOGETHER_API_KEY python3 tools/run_free_swarm_historical_backfill_receipt.py --artifact-root /artifacts/clay-entityos-swarm --db /artifacts/clay-entityos-swarm/forge/forge.sqlite3 --max-lines-per-pass 50000 --max-passes 64 --stable-zero-rounds 2 --receipt '/tmp/FREE_SWARM_HISTORICAL_BACKFILL_RECEIPT.json' > /tmp/go878-backfill-run.txt 2>&1"

          mkdir -p "$GITHUB_WORKSPACE/research_entity/runtime/tool_results"
          "${prefix[@]}" cp clay-direct-dev:/tmp/FREE_SWARM_HISTORICAL_BACKFILL_RECEIPT.json "$GITHUB_WORKSPACE/research_entity/runtime/tool_results/free-swarm-historical-backfill-${GITHUB_RUN_ID}.json"
          "${prefix[@]}" cp clay-direct-dev:/tmp/go878-backfill-tests.txt "/tmp/go878-backfill-tests-${GITHUB_RUN_ID}.txt"
          "${prefix[@]}" cp clay-direct-dev:/tmp/go878-backfill-run.txt "/tmp/go878-backfill-run-${GITHUB_RUN_ID}.txt"

          python3 - "$runtime" "/tmp/go878-backfill-tests-${GITHUB_RUN_ID}.txt" "/tmp/go878-backfill-run-${GITHUB_RUN_ID}.txt" <<'PY'
          import json, os, pathlib, sys
          from datetime import datetime, timezone
          runtime, test_path, run_path = sys.argv[1:]
          ws = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          target = ws / 'research_entity/runtime/tool_results' / f"free-swarm-historical-backfill-{os.environ['GITHUB_RUN_ID']}.json"
          receipt = json.loads(target.read_text())
          if receipt.get('schema') != 'FREE_SWARM_HISTORICAL_BACKFILL_RECEIPT/v1' or receipt.get('status') != 'PASS_STABLE_EOF':
              raise SystemExit('BACKFILL_RECEIPT_PASS_REQUIRED')
          receipt['github_actions'] = {
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'checkout_head': os.environ.get('GITHUB_SHA'),
              'runner_name': os.environ.get('RUNNER_NAME'),
              'runner_os': os.environ.get('RUNNER_OS'),
              'sandbox': 'clay-direct-dev',
              'container_runtime': runtime,
          }
          receipt['test_output'] = pathlib.Path(test_path).read_text(errors='replace')[-12000:]
          receipt['runner_output'] = pathlib.Path(run_path).read_text(errors='replace')[-12000:]
          receipt['external_provider_calls'] = 0
          receipt['runtime_credit_added'] = 0
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

          "${prefix[@]}" exec clay-direct-dev sh -lc "rm -rf '$scratch' /tmp/FREE_SWARM_HISTORICAL_BACKFILL_RECEIPT.json /tmp/go878-backfill-tests.txt /tmp/go878-backfill-run.txt"
          rm -f "/tmp/go878-backfill-tests-${GITHUB_RUN_ID}.txt" "/tmp/go878-backfill-run-${GITHUB_RUN_ID}.txt"

      - name: Persist bounded receipt
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'clay-go878-backfill-runner'
          git config user.email 'clay-go878-backfill-runner@users.noreply.github.com'
          git add research_entity/runtime/tool_results/
          git commit -m "evidence(free-swarm): historical backfill saturation ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
