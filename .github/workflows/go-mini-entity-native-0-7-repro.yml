name: mini-entity-native-0.7-repro

on:
  pull_request:
    paths:
      - 'the artefact/blogpost_entity/native/**'
      - '.github/workflows/go-mini-entity-native-0-7-repro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bound-native-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev libcurl4-openssl-dev libjson-c-dev sqlite3 strace

      - name: Run source-closure falsifiers
        run: |
          python3 -m unittest -v 'the artefact/blogpost_entity/native/test_build_native_bound.py'

      - name: Repeat-build exact native source closure
        shell: bash
        run: |
          set -euo pipefail
          NATIVE='the artefact/blogpost_entity/native'
          python3 "$NATIVE/build_native_bound.py" \
            --source "$NATIVE/mini_entity.c" \
            --output /tmp/mini_entity.clay \
            --receipt /tmp/native_build_provenance.json \
            --version-label mini-entity/0.7.0-dev1 \
            --source-date-epoch 1787371200 \
            --repeat 2 \
            > /tmp/native_build_stdout.json
          chmod +x /tmp/mini_entity.clay
          test "$(/tmp/mini_entity.clay --version)" = 'mini-entity/0.7.0-dev1'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/native_build_provenance.json').read_text())
          assert p['schema'] == 'mini-entity-native-build-provenance/v2'
          src = p['build_definition']['source']
          assert src['identity_scope'] == 'RECURSIVE_REPOSITORY_LOCAL_QUOTED_INCLUDE_CLOSURE'
          assert src['file_count'] == 6, src
          expected = {
              'mini_entity.c',
              'mini_entity_part00.inc',
              'mini_entity_part01.inc',
              'mini_entity_part02.inc',
              'mini_entity_part03.inc',
              'mini_entity_part04.inc',
          }
          assert {x['path'] for x in src['files']} == expected, src['files']
          assert p['build_definition']['repeat_byte_identity'] is True
          assert len(set(p['build_definition']['repeat_hashes'])) == 1
          PY

      - name: Local-exec fixture uses zero key files and zero network
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fixture_runner.py <<'PY'
          import json
          print(json.dumps({'fixture': 'local_exec', 'longitudinal_self_report': {}}))
          PY
          printf 'fixture-model-bytes\n' > /tmp/model.gguf
          printf 'MUST_NOT_BE_READ\n' > /tmp/should-not-be-opened.secret

          /tmp/mini_entity.clay init /tmp/entity.db
          /tmp/mini_entity.clay source-init /tmp/source.db
          /tmp/mini_entity.clay source-add /tmp/source.db evidence event-1 '{"observed":"fixture"}'
          /tmp/mini_entity.clay preset-apply /tmp/entity.db 'the artefact/blogpost_entity/presets/zero_blog.json'
          /tmp/mini_entity.clay state-box-apply /tmp/entity.db 'the artefact/blogpost_entity/presets/zero_blog_state_box.json'
          /tmp/mini_entity.clay set-local-model /tmp/entity.db /tmp/model.gguf
          /tmp/mini_entity.clay set-local-runner-json /tmp/entity.db '["python3","/tmp/fixture_runner.py","{{PROMPT_FILE}}"]'

          strace -f -e trace=openat,network -o /tmp/local_exec.trace \
            /tmp/mini_entity.clay run /tmp/entity.db /tmp/source.db /tmp/should-not-be-opened.secret \
            > /tmp/local_exec_result.json

          test "$(sqlite3 /tmp/entity.db 'select generation from entity_state where id=1;')" = '1'
          test "$(sqlite3 /tmp/entity.db 'select count(*) from outputs;')" = '1'
          test "$(sqlite3 /tmp/entity.db 'select count(*) from study_rows;')" = '1'
          test "$(sqlite3 /tmp/source.db 'select count(*) from mini_entity_events where consumed_generation is null;')" = '0'
          test "$(sqlite3 /tmp/entity.db 'pragma integrity_check;')" = 'ok'

          KEY_LOOKUP_COUNT=$(grep -F -c '/tmp/should-not-be-opened.secret' /tmp/local_exec.trace || true)
          NETWORK_ATTEMPT_COUNT=$(grep -E -c 'socket\(|connect\(|sendto\(|sendmsg\(|recvfrom\(|recvmsg\(' /tmp/local_exec.trace || true)
          test "$KEY_LOOKUP_COUNT" = '0'
          test "$NETWORK_ATTEMPT_COUNT" = '0'
          printf '{"key_file_lookup_count":%s,"network_attempt_count":%s}\n' "$KEY_LOOKUP_COUNT" "$NETWORK_ATTEMPT_COUNT" > /tmp/local_exec_io_counts.json

      - name: Fault-injected study insert rolls back entity and source atomically
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mini_entity.clay init /tmp/fault-entity.db
          /tmp/mini_entity.clay source-init /tmp/fault-source.db
          /tmp/mini_entity.clay source-add /tmp/fault-source.db evidence fault-event-1 '{"observed":"fault-fixture"}'
          /tmp/mini_entity.clay preset-apply /tmp/fault-entity.db 'the artefact/blogpost_entity/presets/zero_blog.json'
          /tmp/mini_entity.clay set-local-model /tmp/fault-entity.db /tmp/model.gguf
          /tmp/mini_entity.clay set-local-runner-json /tmp/fault-entity.db '["python3","/tmp/fixture_runner.py","{{PROMPT_FILE}}"]'
          sqlite3 /tmp/fault-entity.db "CREATE TRIGGER fail_study_insert BEFORE INSERT ON study_rows BEGIN SELECT RAISE(ABORT, 'GO_FAULT_INJECT_STUDY'); END;"

          set +e
          /tmp/mini_entity.clay run /tmp/fault-entity.db /tmp/fault-source.db > /tmp/fault_run.out 2> /tmp/fault_run.err
          RC=$?
          set -e
          test "$RC" -ne 0
          test "$(sqlite3 /tmp/fault-entity.db 'select generation from entity_state where id=1;')" = '0'
          test "$(sqlite3 /tmp/fault-entity.db 'select count(*) from outputs;')" = '0'
          test "$(sqlite3 /tmp/fault-entity.db 'select count(*) from study_rows;')" = '0'
          test "$(sqlite3 /tmp/fault-source.db 'select count(*) from mini_entity_events where consumed_generation is null;')" = '1'
          test "$(sqlite3 /tmp/fault-entity.db 'pragma integrity_check;')" = 'ok'

      - name: Write bounded machine receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          prov = json.loads(Path('/tmp/native_build_provenance.json').read_text())
          io = json.loads(Path('/tmp/local_exec_io_counts.json').read_text())
          def q(db, sql):
              return subprocess.check_output(['sqlite3', db, sql], text=True).strip()
          receipt = {
              'schema': 'MINI_ENTITY_NATIVE_0_7_REPRO_RECEIPT/v1',
              'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'source_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(),
              'native_source_identity': prov['build_definition']['source'],
              'binary': prov['subject'],
              'repeat_hashes': prov['build_definition']['repeat_hashes'],
              'repeat_byte_identity': prov['build_definition']['repeat_byte_identity'],
              'compiler': prov['build_definition']['compiler'],
              'pkg_config_packages': prov['build_definition']['pkg_config_packages'],
              'fixture_local_exec': {
                  **io,
                  'generation': int(q('/tmp/entity.db', 'select generation from entity_state where id=1;')),
                  'outputs': int(q('/tmp/entity.db', 'select count(*) from outputs;')),
                  'study_rows': int(q('/tmp/entity.db', 'select count(*) from study_rows;')),
                  'pending_events': int(q('/tmp/source.db', 'select count(*) from mini_entity_events where consumed_generation is null;')),
                  'sqlite_integrity_check': q('/tmp/entity.db', 'pragma integrity_check;'),
                  'model_quality_credit': False,
              },
              'fault_injected_atomic_rollback': {
                  'intervention': 'BEFORE INSERT trigger abort on study_rows',
                  'generation': int(q('/tmp/fault-entity.db', 'select generation from entity_state where id=1;')),
                  'outputs': int(q('/tmp/fault-entity.db', 'select count(*) from outputs;')),
                  'study_rows': int(q('/tmp/fault-entity.db', 'select count(*) from study_rows;')),
                  'pending_events': int(q('/tmp/fault-source.db', 'select count(*) from mini_entity_events where consumed_generation is null;')),
                  'sqlite_integrity_check': q('/tmp/fault-entity.db', 'pragma integrity_check;'),
              },
              'acceptance_scope': 'SOURCE_CLOSURE_BOUND_REPEAT_BUILD_PLUS_FIXTURE_LOCAL_EXEC_AND_ONE_FAULT_ROLLBACK_ON_GITHUB_UBUNTU',
              'not_claimed': [
                  'real local model quality',
                  'real remote provider acceptance',
                  'cross-environment reproducibility',
                  'whole Mini Entity final acceptance',
              ],
          }
          Path('/tmp/MINI_ENTITY_NATIVE_0_7_REPRO_RECEIPT.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload bounded evidence
        uses: actions/upload-artifact@v4
        with:
          name: mini-entity-native-0.7-repro
          path: |
            /tmp/mini_entity.clay
            /tmp/native_build_provenance.json
            /tmp/local_exec_result.json
            /tmp/local_exec.trace
            /tmp/local_exec_io_counts.json
            /tmp/fault_run.out
            /tmp/fault_run.err
            /tmp/MINI_ENTITY_NATIVE_0_7_REPRO_RECEIPT.json
          if-no-files-found: error
