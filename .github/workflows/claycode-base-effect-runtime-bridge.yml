name: ClayCode BASE effect to mainline runtime bridge
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_effect_runtime_bridge.py'
      - 'tools/claycode_base_effect_pipeline.py'
      - 'tools/claycode_base_runtime.py'
      - 'tools/claycode_base_stdlib_extensions.py'
      - '.github/workflows/claycode-base-effect-runtime-bridge.yml'
permissions:
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - run: python -m py_compile tools/claycode_base_effect_runtime_bridge.py tools/claycode_base_effect_pipeline.py tools/claycode_base_runtime.py tools/claycode_base_stdlib_extensions.py
      - run: python tools/claycode_base_effect_runtime_bridge.py
      - name: Preserve bridge receipt
        run: |
          git config user.name 'claycode-effect-runtime-bridge'
          git config user.email 'claycode-effect-runtime-bridge@users.noreply.github.com'
          git add research_entity/claycode/autonomous/BASE_EFFECT_MAINLINE_RUNTIME_BRIDGE_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record effect mainline runtime bridge receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
