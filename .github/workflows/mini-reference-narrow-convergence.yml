name: mini-reference-narrow-convergence

on:
  push:
    branches:
      - gpt56sol/go-reference-narrow-secure-20260822-1950
  pull_request:
    paths:
      - 'tools/clay_profile_pipeline_runtime.py'
      - 'tools/claycode_structured_backend.py'
      - 'the artefact/blogpost_entity/BLOGPOST_ENTITY.clay'
      - 'the artefact/blogpost_entity/test_blogpost_entity.py'
      - 'the artefact/blogpost_entity/test_reference_narrow_convergence.py'
      - '.github/workflows/mini-reference-narrow-convergence.yml'

permissions:
  contents: read

jobs:
  narrow-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest lark
      - name: Compile reference surfaces
        run: python -m py_compile tools/clay_profile_pipeline_runtime.py tools/claycode_structured_backend.py
      - name: Run focused structured convergence regressions
        run: >-
          python -m pytest
          'the artefact/blogpost_entity/test_blogpost_entity.py'
          'the artefact/blogpost_entity/test_reference_narrow_convergence.py'
          -q
