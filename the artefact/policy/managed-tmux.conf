# ClayVerse browser-attached tmux clients are transport-only.
# Persistent tmux owns process lifetime, but authenticated browser input must reach
# the managed Claude pane rather than tmux's own command language. Otherwise the
# default prefix/command prompt can spawn shells or programs outside EffectGate.
set-option -g prefix None
set-option -g prefix2 None
unbind-key -a
# This marker is intentionally last: its presence proves this managed policy reached
# the end of execution in the server that a browser client is about to reuse.
set-option -s @clayverse_managed_policy clayverse-browser-transport-v1
