name: GO873 Distillery replay restart regression

on:
  pull_request:
    paths:
      - "tools/ingest_forge_accepts_into_distillery.py"
      - "tools/forge_evidence_credit_871.py"
      - "tests/test_forge_distillery_replay_identity_873.py"
      - "tests/test_forge_distillery_replay_restart_873.py"
      - ".github/workflows/go873-distillery-replay-restart-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-restart-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile bridge and regressions
        run: python3 -m py_compile tools/ingest_forge_accepts_into_distillery.py tools/forge_evidence_credit_871.py tests/test_forge_distillery_replay_identity_873.py tests/test_forge_distillery_replay_restart_873.py
      - name: Replay identity regression
        run: python3 -m unittest -q tests.test_forge_distillery_replay_identity_873
      - name: Process restart semantic replay regression
        run: python3 -m unittest -q tests.test_forge_distillery_replay_restart_873
