name: UnifiedDB EAP PR Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'research_entity/harness/reference/**'
      - 'research_entity/runtime/semantic_entity_resolver_v12.py'
      - 'research_entity/runtime/RAE_UNIFIEDDB_V12_ENTITY_RESOLUTION.sql'
      - '.github/workflows/unifieddb-eap-pr-probe.yml'
      - 'research_entity/state/system/unifieddb_eap_pr_probe/**'

permissions:
  contents: read

concurrency:
  group: unifieddb-eap-pr-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eap-pr-probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout PR merge tree read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Runner and tree identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, platform, socket
          print(json.dumps({
            'github_sha':os.environ.get('GITHUB_SHA',''),
            'github_head_ref':os.environ.get('GITHUB_HEAD_REF',''),
            'github_base_ref':os.environ.get('GITHUB_BASE_REF',''),
            'runner_name':os.environ.get('RUNNER_NAME',''),
            'runner_os':os.environ.get('RUNNER_OS',''),
            'runner_arch':os.environ.get('RUNNER_ARCH',''),
            'hostname':socket.gethostname(),
            'platform':platform.platform(),
            'python':platform.python_version(),
          },sort_keys=True))
          PY
          git status --short
          git rev-parse HEAD

      - name: Run UnifiedDB EAP regression suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            research_entity.harness.reference.test_unifieddb_query_plane \
            research_entity.harness.reference.test_unifieddb_emergent_assembly \
            research_entity.harness.reference.test_unifieddb_emergent_cascade \
            research_entity.harness.reference.test_unifieddb_emergent_incremental \
            research_entity.harness.reference.test_unifieddb_emergent_exact_topk

      - name: Run all current EAP benchmarks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research_entity.harness.reference.benchmark_unifieddb_emergent_assembly > /tmp/eap-model.json
          python3 -m research_entity.harness.reference.benchmark_unifieddb_emergent_cascade > /tmp/eap-cascade.json
          python3 -m research_entity.harness.reference.benchmark_unifieddb_incremental_updates > /tmp/eap-incremental.json
          python3 -m research_entity.harness.reference.benchmark_unifieddb_incremental_end_to_end > /tmp/eap-e2e.json
          python3 -m research_entity.harness.reference.benchmark_unifieddb_exact_topk > /tmp/eap-exact-topk.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          files={
            'model':'/tmp/eap-model.json',
            'cascade':'/tmp/eap-cascade.json',
            'incremental':'/tmp/eap-incremental.json',
            'e2e':'/tmp/eap-e2e.json',
            'exact_topk':'/tmp/eap-exact-topk.json',
          }
          data={name:json.loads(Path(path).read_text(encoding='utf-8')) for name,path in files.items()}
          model=data['model']; cascade=data['cascade']; inc=data['incremental']; e2e=data['e2e']; topk=data['exact_topk']
          by_name={row['name']:row for row in cascade['results']}
          summary={
            'model_quality':{
              'eap_recall_at_12':model['methods']['eap_hot_assembly']['recall_at_12'],
              'eap_precision_at_12':model['methods']['eap_hot_assembly']['precision_at_12'],
              'eap_ndcg_at_12':model['methods']['eap_hot_assembly']['ndcg_at_12'],
              'eap_vs_staged_sql_p50_speedup':model['methods']['eap_hot_assembly']['speedup_vs_recursive_sql_staged_p50'],
            },
            'seed_accuracy':{
              'direct':by_name['direct_canonical_lexical_plus_eap']['decision_accuracy'],
              'u12_eap':by_name['u12_fail_closed_resolver_plus_eap']['decision_accuracy'],
              'u12_false_open':by_name['u12_fail_closed_resolver_plus_eap']['false_open_rate_on_abstention_cases'],
            },
            'incremental':{
              'selection_equivalent':inc['equivalence']['selected_refs_exact_all_iterations'],
              'topology_p50_speedup':inc['delta']['p50_speedup'],
              'e2e_selection_equivalent':e2e['equivalence']['selected_refs_exact_all_iterations'],
              'e2e_state_equal':e2e['equivalence']['final_semantic_state_hash_equal'],
              'e2e_trace_equal':e2e['equivalence']['final_trace_root_hash_equal'],
              'e2e_p50_speedup':e2e['delta']['end_to_end_p50_speedup'],
            },
            'exact_topk':{
              'selected_equivalent':topk['equivalence']['selected_signatures_exact_all_queries'],
              'p50_latency_speedup':topk['delta']['p50_latency_speedup'],
              'frontier_reduction':topk['delta']['p50_frontier_expansion_reduction_fraction'],
            },
          }
          Path('/tmp/eap-pr-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(summary,sort_keys=True))
          assert summary['model_quality']['eap_recall_at_12']==1.0
          assert summary['model_quality']['eap_precision_at_12']==1.0
          assert summary['model_quality']['eap_ndcg_at_12']==1.0
          assert summary['seed_accuracy']['u12_eap'] > summary['seed_accuracy']['direct']
          assert summary['seed_accuracy']['u12_false_open']==0.0
          assert summary['incremental']['selection_equivalent']
          assert summary['incremental']['e2e_selection_equivalent']
          assert summary['incremental']['e2e_state_equal']
          assert summary['incremental']['e2e_trace_equal']
          assert summary['exact_topk']['selected_equivalent']
          assert summary['exact_topk']['frontier_reduction']>0.0
          PY

      - name: Upload PR probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unifieddb-eap-pr-probe-${{ github.run_id }}
          path: |
            /tmp/eap-model.json
            /tmp/eap-cascade.json
            /tmp/eap-incremental.json
            /tmp/eap-e2e.json
            /tmp/eap-exact-topk.json
            /tmp/eap-pr-summary.json
          if-no-files-found: warn
          retention-days: 30
