name: Database Pulse Semantic Cycle VPS Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_entity/runtime/RAE_UNIFIEDDB_V10_SEMANTIC_ACCESS_FABRIC.sql'
      - 'research_entity/runtime/RAE_UNIFIEDDB_V11_COHERENT_ACCESS_GENERATIONS.sql'
      - 'research_entity/runtime/RAE_UNIFIEDDB_V12_DATABASE_PULSE.sql'
      - 'research_entity/runtime/RAE_UNIFIEDDB_V13_CYCLE_PINNED_FLAT_ACCESS.sql'
      - 'research_entity/runtime/database_pulse_v0.py'
      - 'research_entity/runtime/semantic_retrieval_runtime_v13.py'
      - 'research_entity/runtime/adaptive_semantic_read_plane_v14.py'
      - 'research_entity/runtime/test_semantic_access_v13.py'
      - 'research_entity/runtime/test_adaptive_semantic_read_plane_v14.py'
      - 'research_entity/runtime/test_database_pulse_semantic_cycle_integration.py'
      - '.github/workflows/database-pulse-semantic-cycle-vps.yml'

permissions:
  contents: write

concurrency:
  group: database-pulse-semantic-cycle-vps-main
  cancel-in-progress: true

jobs:
  semantic-cycle-vps:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Compile integrated Pulse semantic-cycle path
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research_entity/runtime/database_pulse_v0.py \
            research_entity/runtime/semantic_retrieval_runtime_v13.py \
            research_entity/runtime/adaptive_semantic_read_plane_v14.py \
            research_entity/runtime/test_semantic_access_v13.py \
            research_entity/runtime/test_adaptive_semantic_read_plane_v14.py \
            research_entity/runtime/test_database_pulse_semantic_cycle_integration.py

      - name: Run U13 snapshot consistency tests
        working-directory: research_entity/runtime
        run: python3 -m unittest -v test_semantic_access_v13.py

      - name: Run V14 epoch-bound adaptive-read tests
        working-directory: research_entity/runtime
        run: python3 -m unittest -v test_adaptive_semantic_read_plane_v14.py

      - name: Run Pulse to semantic-cycle causal integration tests
        working-directory: research_entity/runtime
        run: python3 -m unittest -v test_database_pulse_semantic_cycle_integration.py

      - name: Materialize real Ubuntu receipt
        env:
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p research_entity/benchmarks/database_pulse
          python3 - <<'PY'
          import json, os, pathlib, platform, socket, sqlite3, subprocess, sys
          from datetime import datetime, timezone
          def cmd(xs):
              try: return subprocess.check_output(xs,text=True,stderr=subprocess.STDOUT,timeout=5).strip()
              except Exception as exc: return f'UNKNOWN:{type(exc).__name__}'
          cpu='UNKNOWN'; mem='UNKNOWN'
          try:
              for line in pathlib.Path('/proc/cpuinfo').read_text(errors='replace').splitlines():
                  if line.lower().startswith('model name'):
                      cpu=line.split(':',1)[1].strip(); break
          except Exception: pass
          try:
              for line in pathlib.Path('/proc/meminfo').read_text(errors='replace').splitlines():
                  if line.startswith('MemTotal:'):
                      mem=line.split(':',1)[1].strip(); break
          except Exception: pass
          out={
            'schema_version':'1.0',
            'gate':'DATABASE_PULSE_TO_U13_U14_CAUSAL_SEMANTIC_CYCLE',
            'status':'PASS',
            'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
            'scope':'REMOTE_PRELIMINARY_NOT_ANDREAS_TARGET_ACCEPTANCE',
            'tests':{
              'u13_cycle_snapshot_consistency':'PASS',
              'v14_verified_basis_and_stale_fastpath':'PASS',
              'pulse_epoch_to_semantic_generation_causal_integration':'PASS'
            },
            'invariants':[
              'Pulse epoch change invalidates stale compiled semantic generation',
              'Exact and compiled V14 fastpaths require verified matching read basis before lookup',
              'Pinned cycle remains immutable across concurrent head swap',
              'New semantic generation becomes visible only after matching epoch publication and next cycle pin',
              'Entity lineage remains constant across the tested Pulse transition',
              'Retrieval/read receipts grant context authority only, never external effect authority'
            ],
            'execution_metadata':{
              'created_at':datetime.now(timezone.utc).isoformat(),
              'git_sha':os.environ.get('GIT_SHA',''),
              'github_run_id':os.environ.get('RUN_ID',''),
              'github_run_attempt':os.environ.get('RUN_ATTEMPT',''),
              'hostname':socket.gethostname(),
              'runner_name':os.environ.get('RUNNER_NAME','UNKNOWN'),
              'runner_os':os.environ.get('RUNNER_OS','UNKNOWN'),
              'runner_arch':os.environ.get('RUNNER_ARCH','UNKNOWN'),
              'platform':platform.platform(),
              'python':sys.version,
              'sqlite':sqlite3.sqlite_version,
              'cpu_model':cpu,
              'mem_total':mem,
              'kernel':cmd(['uname','-a']),
              'filesystem':cmd(['df','-T','.'])
            },
            'limitations':[
              'Component/integration evidence on Hostinger self-hosted Ubuntu, not final Andreas target acceptance.',
              'This test establishes causal epoch gating of later retrieval context; it does not establish phenomenal consciousness.',
              'Model-replacement identity continuity and real downstream task/action effect remain separate promotion tests.'
            ]
          }
          pathlib.Path('research_entity/benchmarks/database_pulse/semantic_cycle_integration_vps.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Persist verified receipt
        run: |
          set -euo pipefail
          cp research_entity/benchmarks/database_pulse/semantic_cycle_integration_vps.json /tmp/semantic-cycle-integration-vps.json
          git reset --hard HEAD
          git clean -fd
          mkdir -p research_entity/benchmarks/database_pulse
          cp /tmp/semantic-cycle-integration-vps.json research_entity/benchmarks/database_pulse/semantic_cycle_integration_vps.json
          git config user.name 'clay-pulse-semantic-cycle-runner'
          git config user.email 'clay-pulse-semantic-cycle-runner@users.noreply.github.com'
          git add research_entity/benchmarks/database_pulse/semantic_cycle_integration_vps.json
          git commit -m 'evidence(unifieddb): persist Pulse semantic-cycle VPS receipt [skip ci]' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-pulse-semantic-cycle-vps
          path: research_entity/benchmarks/database_pulse/semantic_cycle_integration_vps.json
