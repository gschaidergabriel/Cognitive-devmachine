name: ClayCode WP13 ActiveAssembly H2 differential

# Proof rerun marker 2026-08-09T20:17+07:00: no gate/semantic change.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_record_selection.py'
      - 'tools/claycode_wp13_active_assembly_h2.py'
      - 'tools/claycode_wp13_h2_ci_runner.py'
      - 'tools/claycode_base_effect_pipeline.py'
      - 'tools/claycode_base_runtime.py'
      - 'research_entity/harness/reference/active_assembly.py'
      - 'research_entity/claycode/base/examples/FRANK_ACTIVE_ASSEMBLY_H2_V1.clay'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - '.github/workflows/claycode-wp13-active-assembly-h2.yml'

concurrency:
  group: claycode-wp13-active-assembly-h2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  h2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Execute H1/H2 exact differential while preserving failure evidence
        run: python tools/claycode_wp13_h2_ci_runner.py || true
      - name: Commit execution evidence
        if: always()
        run: |
          test -f research_entity/claycode/autonomous/FRANK_ACTIVE_ASSEMBLY_H2_CI_EXECUTION.json
          git config user.name 'claycode-wp13-h2'
          git config user.email 'claycode-wp13-h2@users.noreply.github.com'
          for p in \
            research_entity/claycode/autonomous/FRANK_ACTIVE_ASSEMBLY_H2_CI_EXECUTION.json \
            research_entity/claycode/autonomous/FRANK_ACTIVE_ASSEMBLY_H2_RECEIPT.json; do
            test -f "$p" && git add "$p"
          done
          git diff --cached --quiet || git commit -m 'ClayCode: record generic H2 ActiveAssembly differential'
          if git log -1 --pretty=%B | grep -q 'record generic H2 ActiveAssembly differential'; then
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((attempt * 2))
            done
          fi
      - name: Enforce H2 verdict without target promotion
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('research_entity/claycode/autonomous/FRANK_ACTIVE_ASSEMBLY_H2_CI_EXECUTION.json',encoding='utf-8'))
          assert d['pass'] is True, d
          h=json.load(open('research_entity/claycode/autonomous/FRANK_ACTIVE_ASSEMBLY_H2_RECEIPT.json',encoding='utf-8'))
          assert h['pass'] is True, h['checks']
          assert h['counterexample_disposition']=='IMPLEMENTABLE_VIA_GENERIC_TYPED_FFI_RUNTIME_COLLECTION'
          assert h['language_change_required_by_this_counterexample'] is False
          assert h['counts_as_target_acceptance'] is False
          assert h['counts_as_wp13_pass'] is False
          print('WP13_H2_GENERIC_COLLECTION_DIFFERENTIAL_PASS')
          PY
