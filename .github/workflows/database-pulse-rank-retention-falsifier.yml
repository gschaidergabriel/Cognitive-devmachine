name: Database Pulse Rank Retention Falsifier

on:
  push:
    branches: ['chatgpt/pulse-rank-retention-falsifier-20260810']
    paths:
      - 'tools/database_pulse_rank_retention_falsifier_v4.py'
      - 'research_entity/runtime/test_database_pulse_rank_retention_v4.py'
      - '.github/workflows/database-pulse-rank-retention-falsifier.yml'

permissions:
  contents: read

jobs:
  hostinger-retention-falsifier:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Verify read-only checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - name: Prove V4 stable-to-churn retention behavior
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m unittest -v research_entity.runtime.test_database_pulse_rank_retention_v4
      - name: Measure matched StateLedger write cost
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/database_pulse_rank_retention_falsifier_v4.py \
            --rows 5000 --updates 250 \
            --output /tmp/database-pulse-rank-retention-v4.json
      - name: Record environment
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,platform,socket,sqlite3
          from pathlib import Path
          Path('/tmp/database-pulse-rank-retention-v4-env.json').write_text(json.dumps({
            'github_sha':os.environ.get('GITHUB_SHA'),
            'github_run_id':os.environ.get('GITHUB_RUN_ID'),
            'runner_name':os.environ.get('RUNNER_NAME'),
            'runner_os':os.environ.get('RUNNER_OS'),
            'runner_arch':os.environ.get('RUNNER_ARCH'),
            'hostname':socket.gethostname(),
            'platform':platform.platform(),
            'python':platform.python_version(),
            'sqlite':sqlite3.sqlite_version,
            'evidence_class':'REAL_SELF_HOSTED_UBUNTU_SYNTHETIC_PERFORMANCE_FALSIFIER',
            'scope':'Pulse rank physical retention economics only; not target acceptance',
            'authority':'NO_SEMANTIC_OR_EFFECT_AUTHORITY'
          },indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-pulse-rank-retention-${{ github.run_id }}
          path: |
            /tmp/database-pulse-rank-retention-v4.json
            /tmp/database-pulse-rank-retention-v4-env.json
          if-no-files-found: warn
