name: Database Pulse Rank V5.1 Maintenance Concurrency

on:
  push:
    branches: ['chatgpt/pulse-rank-v5-maintenance-cas-20260810']
    paths:
      - 'research_entity/runtime/database_pulse_rank_path_v5_1.py'
      - 'research_entity/runtime/test_database_pulse_rank_path_v5_1.py'
      - '.github/workflows/database-pulse-rank-v5-1-concurrency.yml'
  pull_request:
    paths:
      - 'research_entity/runtime/database_pulse_rank_path_v5_1.py'
      - 'research_entity/runtime/test_database_pulse_rank_path_v5_1.py'

permissions:
  contents: read

jobs:
  hostinger-v5-1-concurrency:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Verify read-only checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - name: Compile V5.1 and run current V5 plus race matrix
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            research_entity/runtime/database_pulse_rank_path_v5_1.py \
            research_entity/runtime/test_database_pulse_rank_path_v5_1.py
          python3 -m unittest -v research_entity.runtime.test_database_pulse_rank_path_v5
          python3 -m unittest -v research_entity.runtime.test_database_pulse_rank_path_v5_1
      - name: Capture environment
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,platform,socket,sqlite3
          from pathlib import Path
          Path('/tmp/database-pulse-rank-v5-1-env.json').write_text(json.dumps({
            'github_sha':os.environ.get('GITHUB_SHA'),
            'github_run_id':os.environ.get('GITHUB_RUN_ID'),
            'runner_name':os.environ.get('RUNNER_NAME'),
            'runner_os':os.environ.get('RUNNER_OS'),
            'runner_arch':os.environ.get('RUNNER_ARCH'),
            'hostname':socket.gethostname(),
            'platform':platform.platform(),
            'python':platform.python_version(),
            'sqlite':sqlite3.sqlite_version,
            'evidence_class':'REAL_SELF_HOSTED_UBUNTU_CONCURRENCY_FALSIFIER',
            'scope':'V5 physical rank maintenance concurrency only; not Andreas target acceptance',
            'authority':'PHYSICAL_MAINTENANCE_ONLY_NO_SEMANTIC_OR_EFFECT_AUTHORITY'
          },indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-pulse-rank-v5-1-${{ github.run_id }}
          path: /tmp/database-pulse-rank-v5-1-env.json
          if-no-files-found: warn
