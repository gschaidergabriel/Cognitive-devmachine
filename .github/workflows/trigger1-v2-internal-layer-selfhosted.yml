name: Trigger1 V2 nonterminal internal-layer vector proof

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: trigger1-v2-internal-layer-vector-proof
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.repository == 'gschaidergabriel/clay-global-research-entity' &&
      github.event.issue.title == '[CLAY-DISPATCH] Trigger1 V2 internal-layer vector fastpath' &&
      github.event.issue.user.login == 'gschaidergabriel'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Verify nonterminal source and promotion guard
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          python3 -m py_compile tools/trigger1_local_qwen06_internal_layer_api_execute.py
          bash -n tools/trigger1_local_qwen06_internal_layer_api.sh
          python3 -m unittest -v tests.test_trigger1_jspace_promotion_gate

      - name: Execute nonterminal local hidden-state control family
        id: experiment
        shell: bash
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -u
          out="${RUNNER_TEMP}/clay-trigger1-internal-${GITHUB_RUN_ID}"
          mkdir -p "$out"
          set +e
          bash tools/trigger1_local_qwen06_internal_layer_api.sh "$out" >"$out/launcher.log" 2>&1
          rc=$?
          set -e
          echo "experiment_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "experiment_dir=$out" >> "$GITHUB_OUTPUT"
          if [[ ! -s "$out/trigger1_local_activation_api_result.json" ]]; then
            python3 - "$out/trigger1_local_activation_api_result.json" "$rc" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              'schema':'CLAY_TRIGGER1_LOCAL_QWEN06_INTERNAL_LAYER_API_EXPERIMENT/v1',
              'status':'BLOCKED_BEFORE_RESULT',
              'process_exit_code':int(sys.argv[2]),
              'zero_provider_billing':True,
              'external_provider_credentials_read':False,
              'next_action':'REPAIR_NOW_OR_ROUTE_AROUND'
          }, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
          fi

      - name: Adjudicate candidate when present
        id: gate
        shell: bash
        env:
          EXPERIMENT_DIR: ${{ steps.experiment.outputs.experiment_dir }}
        run: |
          set -euo pipefail
          candidate="$EXPERIMENT_DIR/trigger1_direct_steering_candidate.json"
          gate="$EXPERIMENT_DIR/promotion_gate.json"
          if [[ -s "$candidate" ]]; then
            set +e
            python3 tools/trigger1_jspace_promotion_gate.py --candidate "$candidate" > "$gate" 2> "$EXPERIMENT_DIR/promotion_gate.err"
            gate_rc=$?
            set -e
            printf '%s\n' "$gate_rc" > "$EXPERIMENT_DIR/promotion_gate.rc"
          else
            printf '%s\n' '{"schema":"CLAY_TRIGGER1_JSPACE_PROMOTION_GATE/v2","owner_trigger1_goal_credit_candidate":false,"mechanism_runtime_vector_credit_candidate":false,"failures":["NO_INTERNAL_LAYER_PROMOTION_CANDIDATE"]}' > "$gate"
            printf '%s\n' '0' > "$EXPERIMENT_DIR/promotion_gate.rc"
          fi

      - name: Persist bounded exact-source internal-layer receipt
        shell: bash
        env:
          EXPERIMENT_DIR: ${{ steps.experiment.outputs.experiment_dir }}
          EXPERIMENT_RC: ${{ steps.experiment.outputs.experiment_rc }}
        run: |
          set -euo pipefail
          issue="${{ github.event.issue.number }}"
          run="${GITHUB_RUN_ID}"
          outdir="research_entity/runtime/tool_results"
          mkdir -p "$outdir"
          target="$outdir/trigger1-v2-internal-layer-issue${issue}-run${run}.json"
          python3 - "$EXPERIMENT_DIR/trigger1_local_activation_api_result.json" "$EXPERIMENT_DIR/promotion_gate.json" "$target" "$EXPERIMENT_RC" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          result=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          gate=json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          candidate_path=pathlib.Path(sys.argv[1]).with_name('trigger1_direct_steering_candidate.json')
          candidate=json.loads(candidate_path.read_text(encoding='utf-8')) if candidate_path.is_file() else None
          runtime=result.get('runtime_manifest') if isinstance(result.get('runtime_manifest'),dict) else {}
          runtime.pop('python_executable',None)
          result.pop('snapshot_path',None)
          result['runtime_manifest']=runtime
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          payload={
              'schema':'CLAY_TRIGGER1_V2_INTERNAL_LAYER_SELFHOSTED_RUNTIME_RECEIPT/v1',
              'source_result':result,
              'promotion_candidate':candidate,
              'promotion_gate':gate,
              'github_actions':{
                  'run_id':os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'event_sha':os.environ.get('GITHUB_SHA'),
                  'checked_out_head':git('rev-parse','HEAD'),
                  'checked_out_tree':git('rev-parse','HEAD^{tree}'),
                  'issue_number':int('${{ github.event.issue.number }}'),
                  'process_exit_code':int(sys.argv[4]),
                  'runner_environment':'SELF_HOSTED_LINUX_X64',
              },
              'scientific_discriminator':'NONTERMINAL_MIDDLE_LAYER_INPUT_EMBEDDING_BASIS_WITH_DOWNSTREAM_TRANSFORMER_COMPUTATION',
              'terminal_output_projection_shortcut_allowed':False,
              'external_provider_credentials_required':False,
              'zero_provider_billing':True,
              'canonical_credit_minted':False,
              'whole_entityos_hcu_credit_minted':False,
              'training_credit_minted':False,
          }
          material=json.dumps(payload,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          payload['receipt_sha256']=hashlib.sha256(material).hexdigest()
          pathlib.Path(sys.argv[3]).write_text(json.dumps(payload,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'runtime_status':result.get('status'),'gate_goal_candidate':gate.get('owner_trigger1_goal_credit_candidate'),'receipt_sha256':payload['receipt_sha256']},sort_keys=True))
          PY
          git config user.name 'clay-trigger1-internal-runner'
          git config user.email 'clay-trigger1-internal-runner@users.noreply.github.com'
          git add "$target"
          git commit -m "evidence(trigger1): persist internal-layer vector run ${run} [skip ci]" || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && break
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done
          case "$EXPERIMENT_RC" in
            0|2) exit 0 ;;
            *) exit 1 ;;
          esac
