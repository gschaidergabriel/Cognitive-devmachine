name: ClayCode V20 Word-Boundary Rule-Priority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claycode-v20-word-boundary-priority.yml'
      - 'tools/claycode_v20_word_boundary_priority_probe.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V20_WORD_BOUNDARY_RULE_PRIORITY.lark'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hosted-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated strict parser environment
        run: |
          python3 -m venv /tmp/clay-v20-preflight-${GITHUB_RUN_ID}
          /tmp/clay-v20-preflight-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Strict frozen semantic discriminator
        run: /tmp/clay-v20-preflight-${GITHUB_RUN_ID}/bin/python tools/claycode_v20_word_boundary_priority_probe.py
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/clay-v20-preflight-${GITHUB_RUN_ID}

  hostinger-probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build isolated strict parser environment
        run: |
          python3 -m venv /tmp/clay-v20-hostinger-${GITHUB_RUN_ID}
          /tmp/clay-v20-hostinger-${GITHUB_RUN_ID}/bin/pip install --disable-pip-version-check 'lark[interegular]==1.3.1'
      - name: Execute discriminator and persist bounded receipt
        run: |
          VENV=/tmp/clay-v20-hostinger-${GITHUB_RUN_ID}
          if "$VENV/bin/python" tools/claycode_v20_word_boundary_priority_probe.py > /tmp/clay_v20.json; then
            rc=0
          else
            rc=$?
          fi
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('/tmp/clay_v20.json')
          d=json.loads(p.read_text())
          d['receipt_id']='CLAYCODE-V20-WORD-BOUNDARY-HOSTINGER-'+os.environ['GITHUB_RUN_ID']
          d['commit']=os.environ['GITHUB_SHA']
          d['run_id']=os.environ['GITHUB_RUN_ID']
          d['runner_name']=os.environ.get('RUNNER_NAME','UNKNOWN')
          d['truth_class']='VERIFIED_REMOTE_EXECUTION_BOUNDED_PARSER_CANDIDATE_SCOPE'
          d['promotion']='NONE'
          out=pathlib.Path('research_entity/claycode/base/receipts/V20_WORD_BOUNDARY_HOSTINGER_LATEST.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'clay-hostinger-runner'
          git config user.email 'clay-hostinger-runner@users.noreply.github.com'
          git add research_entity/claycode/base/receipts/V20_WORD_BOUNDARY_HOSTINGER_LATEST.json
          git commit -m 'evidence(claycode): record V20 Hostinger discriminator' || true
          for n in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit "$rc"
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/clay-v20-hostinger-${GITHUB_RUN_ID}
