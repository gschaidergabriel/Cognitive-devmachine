name: EntityOS GO fail-closed legacy quiescence attribution

on:
  push:
    branches: [main]
    paths:
      - 'tools/free_swarm_quiescence_action_v1.py'
      - 'tools/free_swarm_restart_authority_attribution_v4.py'
      - '.github/workflows/go-quiescence-action-selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entityos-go-quiescence-attribution
  cancel-in-progress: false

jobs:
  attribute-clay-legacy:
    if: github.actor == 'gschaidergabriel'
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/entityos-go-quiescence
          rm -rf "$OUT"; mkdir -p "$OUT"
          test -z "$(git status --porcelain=v1)"
          printf 'HEAD=%s\nTREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" > "$OUT/source.txt"
          sha256sum \
            tools/free_swarm_quiescence_action_v1.py \
            tools/free_swarm_restart_authority_attribution_v4.py \
            tools/free_provider_admission.py > "$OUT/source.sha256"

      - name: Require current HARD_OFF authority
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/entityos-go-quiescence
          python3 tools/free_provider_admission.py --json > "$OUT/provider-admission.json"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/entityos-go-quiescence/provider-admission.json'))
          if bool(x.get('provider_routes_admitted')):
              raise SystemExit('FAIL: provider routes admitted')
          if not str(x.get('authority_epoch') or '').strip():
              raise SystemExit('FAIL: missing authority epoch')
          print('PASS_HARD_OFF',x.get('authority_epoch'))
          PY

      - name: Read-only root-specific restart-authority attribution v4
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/entityos-go-quiescence
          set +e
          python3 tools/free_swarm_restart_authority_attribution_v4.py --output "$OUT/restart-authority-v4.json"
          RC=$?
          set -e
          cat "$OUT/restart-authority-v4.json" || true
          python3 - "$RC" <<'PY'
          import json,sys
          rc=int(sys.argv[1])
          p='/tmp/entityos-go-quiescence/restart-authority-v4.json'
          x=json.load(open(p))
          # v4 is deliberately read-only and never itself authorizes a kill.
          assert x.get('safe_to_kill_from_this_receipt') is False, x
          assert x.get('network_or_provider_calls_performed') is False, x
          assert x.get('secret_values_exposed') is False, x
          if int(x.get('matched_count') or 0) == 0:
              print('ALREADY_NO_MATCHED_LEGACY_ROOTS')
              raise SystemExit(0)
          if rc != 0 or not x.get('all_matched_roots_actionable'):
              raise SystemExit('FAIL_CLOSED: restart authority is not uniquely root-bound')
          print('ATTRIBUTION_COMPLETE_BUT_MUTATION_NOT_AUTHORIZED')
          PY

      - name: Dry-run exact Clay legacy process matches only
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/entityos-go-quiescence
          python3 tools/free_swarm_quiescence_action_v1.py --window-seconds 2 --output "$OUT/dry-run.json"
          cat "$OUT/dry-run.json"

      - name: Enforce no mutation from attribution-only evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/entityos-go-quiescence
          python3 - <<'PY'
          import json, pathlib
          attr=json.load(open('/tmp/entityos-go-quiescence/restart-authority-v4.json'))
          dry=json.load(open('/tmp/entityos-go-quiescence/dry-run.json'))
          result={
            'schema':'GO_QUIESCENCE_ATTRIBUTION_GATE/v1',
            'restart_authority_decision':attr.get('decision'),
            'matched_roots':attr.get('matched_count'),
            'dry_run_matches':dry.get('before_matched_count'),
            'mutation_performed':False,
            'provider_calls':0,
            'secret_values_read':False,
            'next_required_evidence':'EXECUTABLY_DISABLE_EXACT_ROOT_SPECIFIC_RESTART_AUTHORITY_THEN_REVALIDATE_IMMEDIATELY_BEFORE_KILL',
          }
          pathlib.Path('/tmp/entityos-go-quiescence/gate.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps(result,sort_keys=True))
          # Presence of legacy roots is a current quiescence failure, not permission to kill.
          if int(dry.get('before_matched_count') or 0) > 0:
              raise SystemExit(2)
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entityos-go-quiescence-attribution
          path: |
            /tmp/entityos-go-quiescence/source.txt
            /tmp/entityos-go-quiescence/source.sha256
            /tmp/entityos-go-quiescence/provider-admission.json
            /tmp/entityos-go-quiescence/restart-authority-v4.json
            /tmp/entityos-go-quiescence/dry-run.json
            /tmp/entityos-go-quiescence/gate.json
          if-no-files-found: warn
          retention-days: 7
