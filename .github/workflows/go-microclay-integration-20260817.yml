name: GO MicroClay + Stage-B Integration 2026-08-17

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microclay-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source identity
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          git status --short
      - name: Install bounded test dependencies
        working-directory: the artefact
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused MicroClay and Stage-B regressions
        working-directory: the artefact
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_microclay_retrieval_budget_parity.py \
            tests/test_microclay_replay_full_identity.py \
            tests/test_microclay_replay_identity.py \
            tests/test_microclay_replay_integration.py \
            tests/test_microclay_receipt_context.py \
            tests/test_context_bound_fail_closed.py \
            tests/test_method_memory_stageb.py \
            tests/test_container_healthcheck.py

      # The user-triggered GO's single unusual-experiment slot is already consumed by
      # ANALOGICAL_LEXICAL_DECOY. Do not add another unusual intervention to this lane.
