name: GO872 self-hosted health worker

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: go872-selfhosted-health-worker
  cancel-in-progress: false

jobs:
  health:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Run health-receipt contract tests
        id: tests
        shell: bash
        run: |
          set +e
          python3 -m unittest -v tests.test_go872_selfhosted_health_receipt \
            > "${RUNNER_TEMP}/go872-selfhosted-health-tests.log" 2>&1
          rc=$?
          echo "test_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Observe exact-source self-hosted health
        id: probe
        shell: bash
        run: |
          set +e
          out="${RUNNER_TEMP}/go872-selfhosted-health-${GITHUB_RUN_ID}.json"
          python3 tools/go872_selfhosted_health_receipt.py --repo . --output "$out" \
            > "${RUNNER_TEMP}/go872-selfhosted-health-stdout.log" 2>&1
          rc=$?
          echo "probe_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "receipt=$out" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist sanitized health receipt to main
        if: always()
        shell: bash
        env:
          RECEIPT: ${{ steps.probe.outputs.receipt }}
          PROBE_RC: ${{ steps.probe.outputs.probe_rc }}
          TEST_RC: ${{ steps.tests.outputs.test_rc }}
        run: |
          set -euo pipefail
          outdir="research_entity/runtime/selfhosted_health"
          mkdir -p "$outdir"
          target="$outdir/${GITHUB_RUN_ID}.json"
          if [[ -n "${RECEIPT:-}" && -s "$RECEIPT" ]]; then
            cp "$RECEIPT" "$target"
          else
            python3 - "$target" <<'PY'
          import json, os, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              'schema':'CLAY_GO872_SELFHOSTED_HEALTH_RECEIPT/v1',
              'created_at':None,
              'probe_class':'ORDINARY_NON_EXPERIMENTAL_SELFHOSTED_HEALTH_OBSERVATION',
              'status':'PROBE_RESULT_MISSING',
              'readiness':{'bridge_health_pass':False,'qwen_preflight_ready':False,'forge_preflight_ready':False,'current_frontier_any_lane_ready':False},
              'credit':{'runtime_credit_minted':0,'entityos_whole_credit':0,'hcu_full_credit':0,'jspace_model_credit':0,'training_credit':0},
              'scope_guard':'Missing health receipt grants zero runtime/product/model/training credit.'
          }, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
          fi
          python3 - "$target" "${PROBE_RC:-99}" "${TEST_RC:-99}" <<'PY'
          import json, os, pathlib, sys
          p=pathlib.Path(sys.argv[1]); data=json.loads(p.read_text(encoding='utf-8'))
          data['github_actions']={
              'run_id':os.environ.get('GITHUB_RUN_ID'),
              'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'event_name':os.environ.get('GITHUB_EVENT_NAME'),
              'workflow_head_sha':os.environ.get('GITHUB_SHA'),
              'probe_exit_code':int(sys.argv[2]),
              'contract_test_exit_code':int(sys.argv[3]),
              'runner_environment':'SELF_HOSTED_LINUX_X64',
          }
          p.write_text(json.dumps(data,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          cp "$target" "$outdir/LATEST.json"
          git config user.name 'clay-go872-health-runner'
          git config user.email 'clay-go872-health-runner@users.noreply.github.com'
          git add "$outdir/"
          git commit -m "evidence(go872): persist self-hosted health ${GITHUB_RUN_ID} [skip ci]" || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce health and contract result
        if: always()
        shell: bash
        run: |
          test "${{ steps.tests.outputs.test_rc }}" = "0"
          test "${{ steps.probe.outputs.probe_rc }}" = "0"
