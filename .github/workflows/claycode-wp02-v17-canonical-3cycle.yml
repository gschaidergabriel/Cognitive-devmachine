name: ClayCode WP02 V17 canonical self-hosted evidence

on:
  pull_request:
    paths:
      - 'tools/claycode_base_canonical_ir_validation.py'
      - 'tools/claycode_base_frontend_validation.py'
      - 'tools/claycode_strict_lalr_probe.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
      - '.github/workflows/claycode-wp02-v17-canonical-3cycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp02-v17-selfhosted:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Capture host metadata
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p research_entity/claycode/base/receipts/wp02-v17-3cycle
          {
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            uname -a
            cat /etc/os-release || true
            lscpu || true
            free -b || true
            python3 --version
          } > research_entity/claycode/base/receipts/wp02-v17-3cycle/host_metadata.txt

      - name: Create pinned validation environment
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv .venv-wp02
          . .venv-wp02/bin/activate
          python -m pip install --upgrade pip
          python -m pip install 'lark==1.3.1' 'interegular==0.3.3'
          python -m pip freeze > research_entity/claycode/base/receipts/wp02-v17-3cycle/python_freeze.txt

      - name: Strict LALR probe
        shell: bash
        run: |
          set -euxo pipefail
          . .venv-wp02/bin/activate
          python tools/claycode_strict_lalr_probe.py \
            --grammar research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark \
            --output research_entity/claycode/base/receipts/wp02-v17-3cycle/strict_lalr.json
          python - <<'PY'
          import json
          p='research_entity/claycode/base/receipts/wp02-v17-3cycle/strict_lalr.json'
          d=json.load(open(p))
          assert d['strict_evidence_state']=='PASS_STRICT_CONSTRUCTION', d
          PY

      - name: Full current frontend gate
        shell: bash
        run: |
          set -euxo pipefail
          . .venv-wp02/bin/activate
          python tools/claycode_base_frontend_validation.py \
            --grammar research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark \
            --output research_entity/claycode/base/receipts/wp02-v17-3cycle/frontend.json

      - name: Canonical IR/hash gate repeated
        shell: bash
        run: |
          set -euxo pipefail
          . .venv-wp02/bin/activate
          for i in 1 2 3; do
            python tools/claycode_base_canonical_ir_validation.py \
              --output research_entity/claycode/base/receipts/wp02-v17-3cycle/canonical-$i.json
          done
          python - <<'PY'
          import json
          base='research_entity/claycode/base/receipts/wp02-v17-3cycle'
          docs=[json.load(open(f'{base}/canonical-{i}.json')) for i in (1,2,3)]
          assert all(d['pass'] for d in docs)
          hashes=[[s['canonical_sha256'] for s in d['sources']] for d in docs]
          assert hashes[0]==hashes[1]==hashes[2], hashes
          print('THREE_RUN_CANONICAL_HASH_STABILITY=PASS')
          PY

      - name: Python syntax compilation
        shell: bash
        run: |
          set -euxo pipefail
          . .venv-wp02/bin/activate
          python -m py_compile tools/claycode_strict_lalr_probe.py tools/claycode_base_frontend_validation.py tools/claycode_base_canonical_ir_validation.py

      - name: Upload evidence receipts
        uses: actions/upload-artifact@v4
        with:
          name: claycode-wp02-v17-canonical-${{ github.run_id }}
          path: research_entity/claycode/base/receipts/wp02-v17-3cycle/
          if-no-files-found: error
