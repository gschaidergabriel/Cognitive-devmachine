name: ClayCode WP03 typed IR gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_typed_ir.py'
      - 'tools/claycode_wp03_typed_ir_validation.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
      - '.github/workflows/claycode-wp03-typed-ir.yml'

concurrency:
  group: claycode-wp03-typed-ir-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  typed-ir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Validate strict V7 construction first
        run: |
          python tools/claycode_strict_lalr_probe.py \
            --grammar research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark \
            --output research_entity/claycode/autonomous/WP03_STRICT_V7_DEPENDENCY_RECEIPT.json
          python - <<'PY'
          import json
          d=json.load(open('research_entity/claycode/autonomous/WP03_STRICT_V7_DEPENDENCY_RECEIPT.json', encoding='utf-8'))
          assert d.get('strict_build_ok'), d.get('strict_error')
          assert not d.get('conflict_diagnostics'), d.get('conflict_diagnostics')
          PY
      - name: Run typed canonical IR negative and mutation suite
        run: python tools/claycode_wp03_typed_ir_validation.py
      - name: Materialize full frozen-source typed IR
        run: |
          python tools/claycode_base_typed_ir.py \
            --grammar research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark \
            --output research_entity/claycode/autonomous/BASE_TYPED_IR_V1.json
      - name: Commit typed IR receipts
        run: |
          git config user.name 'claycode-wp03-ir'
          git config user.email 'claycode-wp03-ir@users.noreply.github.com'
          git add \
            research_entity/claycode/autonomous/WP03_STRICT_V7_DEPENDENCY_RECEIPT.json \
            research_entity/claycode/autonomous/WP03_TYPED_IR_RECEIPT.json \
            research_entity/claycode/autonomous/BASE_TYPED_IR_V1.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record WP03 typed IR receipts'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
