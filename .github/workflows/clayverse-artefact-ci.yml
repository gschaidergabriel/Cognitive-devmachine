name: ClayVerse artefact CI

# Manual until GitHub-hosted runners are available again. The first automatic
# run (31995291479) was rejected before any step because of account billing /
# spending-limit state, so push-triggered runs would only create false-red noise.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 'the artefact'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'the artefact/requirements.txt'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run full candidate tests
        run: python -m pytest -q
      - name: Build exact OCI candidate
        run: docker build --pull=false -t clayverse:${GITHUB_SHA} .
      - name: Verify packaged runtimes and non-root image
        run: |
          docker run --rm --entrypoint python clayverse:${GITHUB_SHA} --version
          docker run --rm --entrypoint node clayverse:${GITHUB_SHA} --version
          docker run --rm --entrypoint claude clayverse:${GITHUB_SHA} --version
          test "$(docker image inspect clayverse:${GITHUB_SHA} --format '{{.Config.User}}')" = "clayverse"
      - name: Run packaged state self-check
        run: docker run --rm clayverse:${GITHUB_SHA} --once
      - name: Verify production startup fails closed without identity and Clerk config
        run: |
          set +e
          docker run --rm clayverse:${GITHUB_SHA} >/tmp/clayverse-no-config.log 2>&1
          rc=$?
          set -e
          cat /tmp/clayverse-no-config.log
          test "$rc" -ne 0
          grep -q 'CLAYVERSE_CLERK_MAP_JSON is required' /tmp/clayverse-no-config.log
      - name: Capture exact image identity
        run: |
          docker image inspect clayverse:${GITHUB_SHA} --format 'repo_digest={{json .RepoDigests}} image_id={{.Id}} user={{.Config.User}}' | tee /tmp/clayverse-image-receipt.txt
