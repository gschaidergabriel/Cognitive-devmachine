name: mini-entity-structured-convergence

on:
  push:
    branches:
      - go-reference-runtime-fusion-20260822
  pull_request:
    paths:
      - 'the artefact/blogpost_entity/BLOGPOST_ENTITY.clay'
      - 'the artefact/blogpost_entity/test_blogpost_entity.py'
      - 'the artefact/blogpost_entity/test_state_box_atomic.py'
      - 'the artefact/blogpost_entity/test_runtime_stream_integrity.py'
      - 'the artefact/blogpost_entity/test_runtime_schema_migration.py'
      - 'the artefact/blogpost_entity/test_runtime_truth_boundary.py'
      - 'the artefact/blogpost_entity/test_reference_local_exec_env_isolation.py'
      - 'the artefact/blogpost_entity/test_structured_contract_sync.py'
      - 'the artefact/blogpost_entity/state_box_reference.py'
      - 'the artefact/blogpost_entity/check_structured_contract_sync.py'
      - 'the artefact/blogpost_entity/native/NATIVE_PROFILE_V2_PARITY_CONTRACT.json'
      - 'the artefact/blogpost_entity/native/test_native_v2_parity_contract.py'
      - 'tools/clay_profile_pipeline_runtime.py'
      - 'tools/claycode_structured_backend.py'
      - 'tools/mini_entity_profile_import.py'
      - '.github/workflows/mini-entity-structured-convergence.yml'

permissions:
  contents: read

jobs:
  structured-mini-entity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest lark
      - name: Compile structured reference surfaces
        run: >-
          python -m py_compile
          tools/clay_profile_pipeline_runtime.py
          tools/claycode_structured_backend.py
          tools/mini_entity_profile_import.py
          'the artefact/blogpost_entity/state_box_reference.py'
          'the artefact/blogpost_entity/check_structured_contract_sync.py'
          'the artefact/blogpost_entity/test_structured_contract_sync.py'
          'the artefact/blogpost_entity/test_runtime_truth_boundary.py'
          'the artefact/blogpost_entity/test_reference_local_exec_env_isolation.py'
          'the artefact/blogpost_entity/native/test_native_v2_parity_contract.py'
      - name: Enforce Clay reference-contract convergence
        run: python 'the artefact/blogpost_entity/check_structured_contract_sync.py'
      - name: Run structured Mini Entity convergence tests
        run: >-
          python -m pytest
          'the artefact/blogpost_entity/test_blogpost_entity.py'
          'the artefact/blogpost_entity/test_state_box_atomic.py'
          'the artefact/blogpost_entity/test_runtime_stream_integrity.py'
          'the artefact/blogpost_entity/test_runtime_schema_migration.py'
          'the artefact/blogpost_entity/test_runtime_truth_boundary.py'
          'the artefact/blogpost_entity/test_reference_local_exec_env_isolation.py'
          'the artefact/blogpost_entity/test_structured_contract_sync.py'
          'the artefact/blogpost_entity/native/test_native_v2_parity_contract.py'
          -q
