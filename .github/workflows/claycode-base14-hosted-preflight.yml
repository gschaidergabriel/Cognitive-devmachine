name: ClayCode BASE14 hosted Ubuntu preflight

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base14_hosted_preflight.py'
      - 'tools/claycode_strict_lalr_probe.py'
      - 'tools/claycode_base_frontend_validation.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V4.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
      - 'research_entity/trigger_runs/spawn/spawn_20260809T111551Z/EXPERIMENT_ATOMIC_CAS.py'
      - 'research_entity/trigger_runs/spawn/spawn_20260809T1813p0700_claycode_module_init/EXPERIMENT_MODULE_INIT.py'
      - 'research_entity/trigger_runs/spawn/spawn_20260809T1751p0700_claycode_async_replay/EXPERIMENT_ASYNC_REPLAY_CONTRACT.py'
      - 'research_entity/trigger_runs/spawn/spawn-20260809T1814p0700-claycode-http-sqlite-0a7066/http_sqlite_vertical_probe.py'
      - '.github/workflows/claycode-base14-hosted-preflight.yml'

concurrency:
  group: claycode-base14-hosted-preflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned strict parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Execute composed BASE14 hosted preflight
        run: |
          python tools/claycode_base14_hosted_preflight.py \
            --output research_entity/claycode/autonomous/BASE14_HOSTED_PREFLIGHT_RECEIPT.json
      - name: Require composed preflight PASS
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/BASE14_HOSTED_PREFLIGHT_RECEIPT.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['counts_as_target_acceptance'] is False
          assert d['counts_as_work_package_pass'] is False
          if not d.get('overall_pass'):
              raise SystemExit('BASE14 hosted preflight failed')
          print(f"BASE14_HOSTED_PREFLIGHT_PASS {d['checks_passed']}/{d['checks_total']}")
          PY
      - name: Commit hosted preflight receipt
        run: |
          git config user.name 'claycode-base14-preflight'
          git config user.email 'claycode-base14-preflight@users.noreply.github.com'
          git add research_entity/claycode/autonomous/BASE14_HOSTED_PREFLIGHT_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record BASE14 hosted preflight receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
