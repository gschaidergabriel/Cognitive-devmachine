name: GO MicroClay Integration 2026-08-17

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microclay-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source identity
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          git status --short
      - name: Install bounded test dependencies
        working-directory: the artefact
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused MicroClay fusion regressions
        working-directory: the artefact
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_microclay_retrieval_budget_parity.py \
            tests/test_microclay_replay_full_identity.py \
            tests/test_microclay_replay_identity.py \
            tests/test_microclay_replay_integration.py \
            tests/test_microclay_receipt_context.py
      - name: Unusual experiment - durable receipt budget tamper must fail closed
        working-directory: the artefact
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import tempfile, uuid
          from pathlib import Path
          from clayverse.identity import IdentityRouter
          from clayverse.microclay_retrieval import MicroClayRetrieval
          from clayverse.store import StaleGeneration, UnifiedDB

          with tempfile.TemporaryDirectory() as td:
              db = UnifiedDB(Path(td) / 'unified.db')
              try:
                  IdentityRouter(db, {})
                  db.add_memory('fact','memory','alpha memory',None,'gabriel',{'experiment':'DURABLE_RECEIPT_BUDGET_TAMPER'})
                  session_id='session:gabriel'
                  turn_id=db.append_turn(session_id,'gabriel','user','alpha')
                  episode_id=str(uuid.uuid4())
                  db.db.execute('INSERT INTO workspace_episodes VALUES(?,?,?,?,?,?,?,?)',(episode_id,session_id,1.0,turn_id,0.5,'[]',None,'OPEN'))
                  causal_id=str(uuid.uuid4())
                  organ=MicroClayRetrieval(db)
                  req=dict(query='alpha',user_id='gabriel',session_id=session_id,turn_id=turn_id,episode_id=episode_id,causal_id=causal_id,generation=db.entity_generation(),budget_chars=1200,limit=24)
                  first=organ.retrieve(**req)
                  db.db.execute('UPDATE retrieval_episodes SET budget_chars=1199 WHERE causal_id=?',(causal_id,))
                  try:
                      organ.retrieve(**req)
                  except StaleGeneration as exc:
                      assert 'retrieval_identity' in str(exc)
                      print('UNUSUAL_EXPERIMENT=DURABLE_RECEIPT_BUDGET_TAMPER RESULT=FAIL_CLOSED')
                  else:
                      raise AssertionError('tampered durable retrieval receipt replay was admitted')
                  assert first['receipt']['budget_chars'] == 1200
              finally:
                  db.close()
          PY
