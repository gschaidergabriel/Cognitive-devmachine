name: WP04 Constructor False Friend V1

on:
  pull_request:
    branches:
      - chatgpt/claycode-wp04-nested-call-path-v2-20260810
    paths:
      - 'tools/test_claycode_wp04_constructor_false_friend_v1.py'
      - 'tools/claycode_wp04_call_constraint_inference_v1.py'
      - 'tools/claycode_wp03_cycle_ir_v1.py'
      - 'tools/claycode_wp03_typed_ir_v2_state_identity.py'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V18_REWARD_RELATIONS.lark'
      - '.github/workflows/wp04-constructor-false-friend-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constructor-false-friend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: python -m pip install 'lark==1.3.1' 'interegular==0.3.3'
      - run: python -m py_compile tools/test_claycode_wp04_constructor_false_friend_v1.py
      - run: python tools/test_claycode_wp04_constructor_false_friend_v1.py
