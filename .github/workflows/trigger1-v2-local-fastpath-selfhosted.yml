name: Trigger1 V2 local zero-cost vector fastpath

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: trigger1-v2-local-fastpath
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.repository == 'gschaidergabriel/clay-global-research-entity' &&
      github.event.issue.title == '[CLAY-DISPATCH] Trigger1 V2 local vector fastpath' &&
      github.event.issue.user.login == 'gschaidergabriel'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Require canonical go atomic lease and bind source
        id: lease
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          lease_result="${RUNNER_TEMP}/trigger1-lease-${GITHUB_RUN_ID}.json"
          python3 tools/trigger1_atomic_lease_gate.py \
            --issue-body "$ISSUE_BODY" \
            --output "$lease_result"

          SOURCE_HEAD="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo 'BLOCKED_SOURCE_DIRTY_BEFORE_INTERVENTION' >&2
            exit 2
          fi

          claim_main="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["observed_canonical_main"])' "$lease_result")"
          git cat-file -e "$claim_main^{commit}"
          git merge-base --is-ancestor "$claim_main" "$SOURCE_HEAD" || {
            echo 'BLOCKED_CLAIM_MAIN_NOT_ANCESTOR_OF_EXECUTED_SOURCE' >&2
            exit 2
          }

          python3 - "$lease_result" "$GITHUB_ENV" "$SOURCE_HEAD" "$SOURCE_TREE" <<'PY'
          import json, pathlib, sys
          result=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          if result.get('pass') is not True:
              raise SystemExit('ATOMIC_LEASE_NOT_ADMITTED')
          values={
              'TRIGGER1_TRIGGER_KEY':result['trigger_key'],
              'TRIGGER1_CLAIM_PATH':result['claim_path'],
              'TRIGGER1_CLAIM_SHA256':result['claim_sha256'],
              'TRIGGER1_CLAIM_OBSERVED_MAIN':result['observed_canonical_main'],
              'TRIGGER1_CLAIMANT_ORGAN':str(result['claimant_organ']),
              'TRIGGER1_EXPERIMENT_NAME':result['experiment_name'],
              'TRIGGER1_SOURCE_HEAD':sys.argv[3],
              'TRIGGER1_SOURCE_TREE':sys.argv[4],
              'TRIGGER1_LEASE_ADMITTED':'true',
          }
          with pathlib.Path(sys.argv[2]).open('a',encoding='utf-8') as f:
              for key,value in values.items():
                  if '\n' in value or '\r' in value:
                      raise SystemExit('UNSAFE_ENV_VALUE')
                  f.write(f'{key}={value}\n')
          PY

      - name: Verify Trigger1 V2 promotion and lease gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_trigger1_atomic_lease_gate tests.test_trigger1_jspace_promotion_gate

      - name: Execute nonterminal contrastive hidden-state API discriminator
        id: experiment
        shell: bash
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -u
          out="${RUNNER_TEMP}/clay-trigger1-v2-${GITHUB_RUN_ID}"
          mkdir -p "$out"
          set +e
          bash tools/trigger1_local_qwen06_intermediate_api.sh "$out" >"$out/launcher.log" 2>&1
          rc=$?
          set -e
          echo "experiment_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "experiment_dir=$out" >> "$GITHUB_OUTPUT"
          test -s "$out/trigger1_local_activation_api_result.json" || {
            python3 - "$out/trigger1_local_activation_api_result.json" "$rc" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              'schema':'CLAY_TRIGGER1_LOCAL_QWEN06_INTERMEDIATE_ACTIVATION_API_EXPERIMENT/v1',
              'status':'BLOCKED_BEFORE_RESULT',
              'process_exit_code':int(sys.argv[2]),
              'zero_provider_billing':True,
              'external_provider_credentials_read':False,
              'terminal_output_projection_shortcut':False,
              'next_action':'REPAIR_NOW_OR_ROUTE_AROUND'
          }, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
          }

      - name: Adjudicate local candidate when present
        id: gate
        shell: bash
        env:
          EXPERIMENT_DIR: ${{ steps.experiment.outputs.experiment_dir }}
        run: |
          set -euo pipefail
          candidate="$EXPERIMENT_DIR/trigger1_direct_steering_candidate.json"
          gate="$EXPERIMENT_DIR/promotion_gate.json"
          if [[ -s "$candidate" ]]; then
            python3 tools/trigger1_jspace_promotion_gate.py --candidate "$candidate" > "$gate"
          else
            printf '%s\n' '{"schema":"CLAY_TRIGGER1_JSPACE_PROMOTION_GATE/v2","owner_trigger1_goal_credit_candidate":false,"mechanism_runtime_vector_credit_candidate":false,"failures":["NO_LOCAL_PROMOTION_CANDIDATE"]}' > "$gate"
          fi

      - name: Persist sanitized exact-source result and lease result
        shell: bash
        env:
          EXPERIMENT_DIR: ${{ steps.experiment.outputs.experiment_dir }}
          EXPERIMENT_RC: ${{ steps.experiment.outputs.experiment_rc }}
        run: |
          set -euo pipefail
          issue="${{ github.event.issue.number }}"
          run="${GITHUB_RUN_ID}"
          outdir="research_entity/runtime/tool_results"
          mkdir -p "$outdir"
          target="$outdir/trigger1-v2-local-fastpath-issue${issue}-run${run}.json"
          claim_result="research_entity/continuity/go_experiment_claims/${TRIGGER1_TRIGGER_KEY}.result.json"

          git fetch --quiet origin main
          if git cat-file -e "origin/main:${claim_result}" 2>/dev/null || [[ -e "$claim_result" ]]; then
            echo 'EXPERIMENT_RESULT_ALREADY_EXISTS_AFTER_EXECUTION_RACE' >&2
            exit 2
          fi

          python3 - "$EXPERIMENT_DIR/trigger1_local_activation_api_result.json" "$EXPERIMENT_DIR/promotion_gate.json" "$target" "$claim_result" "$EXPERIMENT_RC" <<'PY'
          import json, os, pathlib, sys
          result=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          gate=json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          runtime=result.get('runtime_manifest') if isinstance(result.get('runtime_manifest'),dict) else {}
          runtime.pop('python_executable',None)
          result.pop('snapshot_path',None)
          result['runtime_manifest']=runtime
          payload={
              'schema':'CLAY_TRIGGER1_V2_SELFHOSTED_RUNTIME_RECEIPT/v2',
              'source_head':os.environ['TRIGGER1_SOURCE_HEAD'],
              'source_tree':os.environ['TRIGGER1_SOURCE_TREE'],
              'source_dirty':False,
              'atomic_lease':{
                  'trigger_key':os.environ['TRIGGER1_TRIGGER_KEY'],
                  'claim_path':os.environ['TRIGGER1_CLAIM_PATH'],
                  'claim_sha256':os.environ['TRIGGER1_CLAIM_SHA256'],
                  'claim_observed_canonical_main':os.environ['TRIGGER1_CLAIM_OBSERVED_MAIN'],
                  'claimant_organ':os.environ['TRIGGER1_CLAIMANT_ORGAN'],
                  'experiment_name':os.environ['TRIGGER1_EXPERIMENT_NAME'],
              },
              'source_result':result,
              'promotion_gate':gate,
              'github_actions':{
                  'run_id':os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'event_sha':os.environ.get('GITHUB_SHA'),
                  'issue_number':int('${{ github.event.issue.number }}'),
                  'process_exit_code':int(sys.argv[5]),
                  'runner_environment':'SELF_HOSTED_LINUX_X64',
              },
              'external_provider_credentials_required':False,
              'zero_provider_billing':True,
              'canonical_credit_minted':False,
              'whole_entityos_hcu_credit_minted':False,
              'training_credit_minted':False,
          }
          target=pathlib.Path(sys.argv[3])
          target.write_text(json.dumps(payload,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          status=str(result.get('status') or '')
          if status.startswith('BLOCKED'):
              classification='BLOCKED'
          elif int(sys.argv[5]) == 0:
              classification='PASS' if gate.get('mechanism_runtime_vector_credit_candidate') is True else 'FAIL'
          else:
              classification='FAIL'
          lease_result={
              'schema':'clay-go-experiment-result/v1',
              'trigger_key':os.environ['TRIGGER1_TRIGGER_KEY'],
              'claim_path':os.environ['TRIGGER1_CLAIM_PATH'],
              'claim_sha256':os.environ['TRIGGER1_CLAIM_SHA256'],
              'experiment_name':os.environ['TRIGGER1_EXPERIMENT_NAME'],
              'intervention_identity':result.get('result_sha256'),
              'source_identity':{'head':os.environ['TRIGGER1_SOURCE_HEAD'],'tree':os.environ['TRIGGER1_SOURCE_TREE'],'dirty':False},
              'execution_surface':'SELF_HOSTED_LINUX_X64_ZERO_PROVIDER_BILLING',
              'observed_result':{'runtime_status':result.get('status'),'runtime_verdict':result.get('verdict'),'promotion_gate':gate},
              'classification':classification,
              'whole_product_evidence_established':False,
              'runtime_receipt_path':str(target),
          }
          pathlib.Path(sys.argv[4]).write_text(json.dumps(lease_result,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

          git config user.name 'clay-trigger1-v2-runner'
          git config user.email 'clay-trigger1-v2-runner@users.noreply.github.com'
          git add "$target" "$claim_result"
          git commit -m "evidence(trigger1): persist leased V2 midlayer run ${run} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Finalize admitted lease if later workflow stage blocked
        if: always() && env.TRIGGER1_LEASE_ADMITTED == 'true'
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          claim_result="research_entity/continuity/go_experiment_claims/${TRIGGER1_TRIGGER_KEY}.result.json"
          git fetch --quiet origin main
          if git cat-file -e "origin/main:${claim_result}" 2>/dev/null || [[ -e "$claim_result" ]]; then
            exit 0
          fi
          python3 - "$claim_result" <<'PY'
          import json, os, pathlib, sys
          payload={
              'schema':'clay-go-experiment-result/v1',
              'trigger_key':os.environ['TRIGGER1_TRIGGER_KEY'],
              'claim_path':os.environ['TRIGGER1_CLAIM_PATH'],
              'claim_sha256':os.environ['TRIGGER1_CLAIM_SHA256'],
              'experiment_name':os.environ['TRIGGER1_EXPERIMENT_NAME'],
              'intervention_identity':None,
              'source_identity':{'head':os.environ['TRIGGER1_SOURCE_HEAD'],'tree':os.environ['TRIGGER1_SOURCE_TREE'],'dirty':False},
              'execution_surface':'SELF_HOSTED_LINUX_X64_ZERO_PROVIDER_BILLING',
              'observed_result':{'workflow_job_status':os.environ.get('JOB_STATUS'),'reason':'ADMITTED_LEASE_WITHOUT_PRIMARY_RESULT_RECORD'},
              'classification':'BLOCKED',
              'whole_product_evidence_established':False,
              'runtime_receipt_path':None,
          }
          p=pathlib.Path(sys.argv[1]); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git config user.name 'clay-trigger1-v2-runner'
          git config user.email 'clay-trigger1-v2-runner@users.noreply.github.com'
          git add "$claim_result"
          git commit -m "evidence(trigger1): close blocked leased V2 midlayer run ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
