name: UnifiedDB EAP Exact TopK VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unifieddb-eap-exact-topk-vps.yml'
      - 'research_entity/harness/reference/unifieddb_emergent_preprocessor.py'
      - 'research_entity/harness/reference/unifieddb_emergent_incremental.py'
      - 'research_entity/harness/reference/unifieddb_emergent_exact_topk.py'
      - 'research_entity/harness/reference/test_unifieddb_emergent_exact_topk.py'
      - 'research_entity/harness/reference/benchmark_unifieddb_exact_topk.py'
      - 'research_entity/harness/reference/state_ledger.py'
      - 'research_entity/harness/reference/unifieddb_query_plane.py'

permissions:
  contents: read

concurrency:
  group: unifieddb-eap-exact-topk-vps
  cancel-in-progress: false

jobs:
  exact-topk-vps:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout tested tree read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Run exact Top-K regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            research_entity.harness.reference.test_unifieddb_emergent_exact_topk

      - name: Benchmark exact Top-K score-bound stop
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research_entity.harness.reference.benchmark_unifieddb_exact_topk \
            > /tmp/UNIFIEDDB_EAP_EXACT_TOPK_BENCHMARK.json
          python3 - <<'PY'
          import json, os, platform, socket
          from datetime import datetime, timezone
          from pathlib import Path
          bench=json.loads(Path('/tmp/UNIFIEDDB_EAP_EXACT_TOPK_BENCHMARK.json').read_text(encoding='utf-8'))
          payload={
              'schema_version':'1.0',
              'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
              'scope':'EAP_EXACT_TOPK_PRELIMINARY',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'github_sha':os.environ.get('GITHUB_SHA',''),
              'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
              'github_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT',''),
              'runner_name':os.environ.get('RUNNER_NAME','unknown'),
              'runner_os':os.environ.get('RUNNER_OS','unknown'),
              'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
              'hostname':socket.gethostname(),
              'platform':platform.platform(),
              'python':platform.python_version(),
              'benchmark':bench,
              'acceptance':{
                  'selected_signatures_exact_all_queries':bench['equivalence']['selected_signatures_exact_all_queries'],
                  'p50_latency_speedup':bench['delta']['p50_latency_speedup'],
                  'p50_frontier_expansion_reduction_fraction':bench['delta']['p50_frontier_expansion_reduction_fraction'],
                  'faster_p50':bench['delta']['p50_latency_speedup']>1.0,
                  'reduced_frontier_p50':bench['delta']['p50_frontier_expansion_reduction_fraction']>0.0,
              },
              'scope_guard':'Pass/fail applies only to exact selected Top-K equivalence and latency/frontier behavior on this deterministic reference-harness workload; it does not imply universal retrieval or answer-quality superiority.',
              'authority_invariant':'retrieval ranking != truth or effect authority',
          }
          Path('/tmp/UNIFIEDDB_EAP_EXACT_TOPK_VPS_RECEIPT.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload['acceptance'],sort_keys=True))
          assert payload['acceptance']['selected_signatures_exact_all_queries']
          assert payload['acceptance']['reduced_frontier_p50']
          assert payload['acceptance']['faster_p50']
          PY

      - name: Upload exact Top-K receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unifieddb-eap-exact-topk-${{ github.run_id }}
          path: /tmp/UNIFIEDDB_EAP_EXACT_TOPK_VPS_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

  persist-receipt:
    if: always()
    needs: exact-topk-vps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: unifieddb-eap-exact-topk-${{ github.run_id }}
          path: /tmp/unifieddb-eap-exact-topk
      - name: Validate and persist runner receipt
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source=Path('/tmp/unifieddb-eap-exact-topk/UNIFIEDDB_EAP_EXACT_TOPK_VPS_RECEIPT.json')
          data=json.loads(source.read_text(encoding='utf-8'))
          assert data['evidence_class']=='REAL_SELF_HOSTED_UBUNTU_EXECUTION'
          assert data['github_sha']==os.environ['TESTED_SHA']
          assert data['authority_invariant']=='retrieval ranking != truth or effect authority'
          root=Path('research_entity/state/system/unifieddb_eap_exact_topk')
          root.mkdir(parents=True,exist_ok=True)
          (root/'LATEST.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (root/f"{data['github_run_id']}.json").write_text(json.dumps(data,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name 'clay-eap-exact-topk'
          git config user.email 'clay-eap-exact-topk@users.noreply.github.com'
          git add research_entity/state/system/unifieddb_eap_exact_topk/
          git commit -m "evidence(unifieddb): persist exact Top-K EAP VPS ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
