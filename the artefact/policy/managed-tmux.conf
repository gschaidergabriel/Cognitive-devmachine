# ClayVerse browser-attached tmux clients are transport-only.
# Persistent tmux owns process lifetime, but authenticated browser input must reach
# the managed Claude pane rather than tmux's own command language. Otherwise tmux
# key bindings can execute commands outside the ClayVerse effect boundary.
set-option -g prefix None
set-option -g prefix2 None
set-option -g status off
set-option -g mouse off
set-option -g default-shell /opt/clayverse/runtime/deny-shell
# `unbind-key -a` without -T removes only the prefix table. Remove every tmux
# default key table explicitly so root (-n), prefix and copy-mode bindings cannot
# intercept browser input or open tmux command surfaces.
unbind-key -a -T prefix
unbind-key -a -T root
unbind-key -a -T copy-mode
unbind-key -a -T copy-mode-vi
# This versioned marker is intentionally last. v3 means all four default key tables
# were processed and status/mouse/default-shell were fail-closed as transport-only.
set-option -s @clayverse_managed_policy clayverse-browser-transport-v3
