name: Qwen3-0.6B hidden steering on clay-direct-dev

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen06-hidden-steering-clay-direct-dev.yml'
      - 'tools/qwen06_hidden_steering_sandbox.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qwen06-hidden-steering-clay-direct-dev
  cancel-in-progress: false

jobs:
  qwen06-steering:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - name: Checkout exact Clay source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Verify clay-direct-dev runtime and resource headroom
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /artifacts/clay-qwen06-jspace
          {
            echo "hostname=$(hostname)"
            echo "user=$(id -un)"
            echo "pwd=$(pwd)"
            echo "github_sha=$GITHUB_SHA"
            echo "repo_head=$(git rev-parse HEAD)"
            echo "python=$(python3 --version 2>&1)"
            echo "nproc=$(nproc)"
            free -h || true
            df -h / /artifacts /workspace 2>/dev/null || df -h
            test -d /workspace/clay-global-research-entity && echo 'live_workspace=present' || echo 'live_workspace=absent'
            test -d /artifacts/clay-entityos-swarm && echo 'runtime_artifacts=present' || echo 'runtime_artifacts=absent'
          } | tee /artifacts/clay-qwen06-jspace/preflight-${GITHUB_RUN_ID}.txt

      - name: Prepare persistent Qwen experiment environment
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/artifacts/clay-qwen06-jspace
          VENV="$ROOT/venv"
          mkdir -p "$ROOT/hf" "$ROOT/results"
          if [[ ! -x "$VENV/bin/python" ]]; then
            python3 -m venv "$VENV"
          fi
          "$VENV/bin/python" -m pip install --upgrade pip wheel setuptools
          if ! "$VENV/bin/python" - <<'PY'
          import torch, transformers, huggingface_hub, safetensors
          print(torch.__version__, transformers.__version__, huggingface_hub.__version__, safetensors.__version__)
          PY
          then
            "$VENV/bin/python" -m pip install --upgrade torch transformers huggingface_hub safetensors accelerate
          fi
          "$VENV/bin/python" -m pip freeze | sort > "$ROOT/pip-freeze-${GITHUB_RUN_ID}.txt"

      - name: Execute exact Qwen3-0.6B hidden-state steering discriminator
        shell: bash
        env:
          HF_HOME: /artifacts/clay-qwen06-jspace/hf
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          ROOT=/artifacts/clay-qwen06-jspace
          OUT="$ROOT/results/${GITHUB_RUN_ID}.json"
          LOG="$ROOT/results/${GITHUB_RUN_ID}.log"
          "$ROOT/venv/bin/python" tools/qwen06_hidden_steering_sandbox.py \
            --output "$OUT" \
            --model-id Qwen/Qwen3-0.6B \
            --hf-cache "$ROOT/hf" \
            --max-new-tokens 28 \
            --threads "$(nproc)" 2>&1 | tee "$LOG"
          test -s "$OUT"
          cp "$OUT" "$ROOT/results/LATEST.json"
          echo "CLAY_QWEN_RESULT=$OUT" >> "$GITHUB_ENV"
          echo "CLAY_QWEN_LOG=$LOG" >> "$GITHUB_ENV"

      - name: Publish immutable runtime receipt to repository
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ env.CLAY_QWEN_RESULT }}
          PREFLIGHT: /artifacts/clay-qwen06-jspace/preflight-${{ github.run_id }}.txt
          PIP_FREEZE: /artifacts/clay-qwen06-jspace/pip-freeze-${{ github.run_id }}.txt
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const runId = String(context.runId);
            let body;
            if (process.env.RESULT && fs.existsSync(process.env.RESULT)) {
              body = fs.readFileSync(process.env.RESULT, 'utf8');
            } else {
              const diag = {
                schema: 'CLAY_QWEN06_HIDDEN_STEERING_SANDBOX_RECEIPT/v1',
                status: 'WORKFLOW_RESULT_MISSING',
                github_run_id: runId,
                github_sha: context.sha,
                execution_surface: 'clay-direct-dev self-hosted runner',
                direct_reproducible_hidden_state_steering_demonstrated: false,
                provider_runtime_credit: 0,
                whole_hcu_runtime_credit: 0,
                jspace_model_runtime_credit: 0,
                training_credit: 0
              };
              body = JSON.stringify(diag, null, 2) + '\n';
            }
            const path = `research_entity/runtime/qwen06_hidden_steering/${runId}.json`;
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `runtime(qwen06): publish hidden steering receipt ${runId} [skip ci]`,
              content: Buffer.from(body, 'utf8').toString('base64'),
              branch: 'main'
            });

      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen06-hidden-steering-${{ github.run_id }}
          path: |
            ${{ env.CLAY_QWEN_RESULT }}
            ${{ env.CLAY_QWEN_LOG }}
            /artifacts/clay-qwen06-jspace/preflight-${{ github.run_id }}.txt
            /artifacts/clay-qwen06-jspace/pip-freeze-${{ github.run_id }}.txt
          if-no-files-found: warn
          retention-days: 14
