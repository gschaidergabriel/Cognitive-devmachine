name: ClayCode V7 V16 V17 Fusion Discriminator

on:
  push:
    branches: [main]
    paths:
      - 'tools/claycode_v7_v16_v17_fusion_discriminator.py'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_typed_ir.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V16_GENERIC_DOTTED_LINEAR_LOOKAHEAD.lark'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
      - '.github/workflows/claycode-v7-v16-v17-fusion-discriminator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discriminate:
    # Hosted preflight only; successful results still require exact-source Ubuntu replay.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install strict parser dependencies
        run: |
          python3 -m venv /tmp/clay-v7-v16-v17
          /tmp/clay-v7-v16-v17/bin/python -m pip install --disable-pip-version-check 'lark==1.3.1' 'interegular==0.3.3'
      - name: Execute discriminator
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          /tmp/clay-v7-v16-v17/bin/python tools/claycode_v7_v16_v17_fusion_discriminator.py \
            --output /tmp/CC_BASE_V7_V16_V17_FUSION_DISCRIMINATOR.json
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clay-v7-v16-v17-fusion-${{ github.sha }}
          path: /tmp/CC_BASE_V7_V16_V17_FUSION_DISCRIMINATOR.json
          if-no-files-found: warn
          retention-days: 14
