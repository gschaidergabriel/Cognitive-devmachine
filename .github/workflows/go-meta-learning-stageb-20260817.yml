name: GO Meta-Learning Stage-B 2026-08-17

on:
  pull_request:
    paths:
      - 'the artefact/clayverse/method_memory.py'
      - 'the artefact/clayverse/method_stage_b.py'
      - 'the artefact/clayverse/microclay_retrieval.py'
      - 'the artefact/clayverse/retrieval.py'
      - 'the artefact/tests/test_meta_learning_method_memory.py'
      - '.github/workflows/go-meta-learning-stageb-20260817.yml'

permissions:
  contents: read

jobs:
  focused-method-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 'the artefact'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check 'pytest==8.4.1'
      - name: Compile changed Python modules
        run: >-
          python -m py_compile
          clayverse/method_memory.py
          clayverse/method_stage_b.py
          clayverse/microclay_retrieval.py
          clayverse/retrieval.py
      - name: Run focused meta-learning regressions
        run: python -m pytest -q tests/test_meta_learning_method_memory.py
