name: Mini Entity 0.7 verified-empty quiet regression

on:
  push:
    branches:
      - chatgpt/go-mini-entity-0-7-runtime-gate-20260822
  pull_request:
    paths:
      - 'the artefact/blogpost_entity/native/**'
      - 'the artefact/blogpost_entity/presets/**'
      - '.github/workflows/mini-entity-0-7-quiet-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiet-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libsqlite3-dev libcurl4-openssl-dev libjson-c-dev sqlite3

      - name: Build exact transitive source closure
        shell: bash
        run: |
          set -euo pipefail
          NATIVE='the artefact/blogpost_entity/native'
          python3 "$NATIVE/build_native_bound.py" \
            --source "$NATIVE/mini_entity.c" \
            --output "$RUNNER_TEMP/mini_entity.clay" \
            --receipt "$RUNNER_TEMP/native_build_provenance.json" \
            --version-label mini-entity/0.7.0-dev1 \
            --source-date-epoch 1787371200 \
            --repeat 2 > "$RUNNER_TEMP/native_build_stdout.json"
          chmod +x "$RUNNER_TEMP/mini_entity.clay"
          test "$("$RUNNER_TEMP/mini_entity.clay" --version)" = 'mini-entity/0.7.0-dev1'
          python3 - "$RUNNER_TEMP/native_build_provenance.json" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1], encoding='utf-8'))
          assert p['schema'] == 'mini-entity-native-build-provenance/v2'
          assert p['build_definition']['repeat_byte_identity'] is True
          assert len(set(p['build_definition']['repeat_hashes'])) == 1
          closure = p['build_definition']['source_closure']
          assert closure['sha256'] == p['build_definition']['source_identity_sha256']
          assert [x['path'] for x in closure['files']] == [
              'mini_entity.c',
              'mini_entity_part00.inc',
              'mini_entity_part01.inc',
              'mini_entity_part02.inc',
              'mini_entity_part03.inc',
              'mini_entity_part04.inc',
          ]
          PY

      - name: One event runs once; verified-empty second run stays quiet
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/mini_entity.clay"
          DB="$RUNNER_TEMP/entity.db"
          SRC="$RUNNER_TEMP/source.db"
          MODEL="$RUNNER_TEMP/fixture-model.gguf"
          RUNNER="$RUNNER_TEMP/fixture_runner.py"
          CALLS="$RUNNER_TEMP/runner_calls.txt"
          PRESET='the artefact/blogpost_entity/presets/zero_blog.json'
          STATEBOX='the artefact/blogpost_entity/presets/zero_blog_state_box.json'

          printf 'fixture weights only; no model-quality credit\n' > "$MODEL"
          cat > "$RUNNER" <<'PY'
          import json, os, sys
          calls = os.environ['MINI_ENTITY_FIXTURE_CALLS']
          with open(calls, 'a', encoding='utf-8') as fh:
              fh.write('call\n')
          prompt = open(sys.argv[1], encoding='utf-8').read()
          assert 'evidence_packet_json=' in prompt
          print(json.dumps({
              'ueberschrift': 'fixture',
              'einleitung': 'fixture',
              'abschnitte': [],
              'longitudinal_self_report': {}
          }))
          PY
          export MINI_ENTITY_FIXTURE_CALLS="$CALLS"
          RUNNER_JSON="$(python3 - "$RUNNER" <<'PY'
          import json, sys
          print(json.dumps(['/usr/bin/python3', sys.argv[1], '{{PROMPT_FILE}}']))
          PY
          )"

          "$BIN" init "$DB"
          "$BIN" source-init "$SRC"
          "$BIN" preset-apply "$DB" "$PRESET"
          "$BIN" state-box-apply "$DB" "$STATEBOX"
          "$BIN" set-local-model "$DB" "$MODEL"
          "$BIN" set-local-runner-json "$DB" "$RUNNER_JSON"
          "$BIN" source-add "$SRC" observation ev-quiet-1 '{"measured":"fixture","value":1}'

          "$BIN" run "$DB" "$SRC" > "$RUNNER_TEMP/first.json"
          test "$(wc -l < "$CALLS")" = '1'
          test "$(sqlite3 "$DB" 'select generation from entity_state where id=1;')" = '1'
          test "$(sqlite3 "$DB" 'select count(*) from outputs;')" = '1'
          test "$(sqlite3 "$DB" 'select count(*) from study_rows;')" = '1'
          test "$(sqlite3 "$SRC" 'select count(*) from mini_entity_events where consumed_generation is null;')" = '0'

          "$BIN" run "$DB" "$SRC" > "$RUNNER_TEMP/quiet.json"
          python3 - "$RUNNER_TEMP/quiet.json" <<'PY'
          import json, sys
          x = json.load(open(sys.argv[1], encoding='utf-8'))
          assert x == {
              'ok': True,
              'quiet': True,
              'generation': 1,
              'source_count': 0,
              'sensor_health': 'VERIFIED',
          }, x
          PY
          test "$(wc -l < "$CALLS")" = '1'
          test "$(sqlite3 "$DB" 'select generation from entity_state where id=1;')" = '1'
          test "$(sqlite3 "$DB" 'select count(*) from outputs;')" = '1'
          test "$(sqlite3 "$DB" 'select count(*) from study_rows;')" = '1'
          test "$(sqlite3 "$SRC" 'select count(*) from mini_entity_events where consumed_generation is null;')" = '0'
          test "$(sqlite3 "$DB" 'pragma integrity_check;')" = 'ok'

      - name: Broken source remains UNKNOWN/error, never quiet
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/mini_entity.clay"
          DB="$RUNNER_TEMP/entity.db"
          CALLS="$RUNNER_TEMP/runner_calls.txt"
          BROKEN="$RUNNER_TEMP/broken-source.db"
          : > "$BROKEN"
          set +e
          "$BIN" run "$DB" "$BROKEN" > "$RUNNER_TEMP/broken.out" 2> "$RUNNER_TEMP/broken.err"
          RC=$?
          set -e
          test "$RC" -ne 0
          grep -q 'SOURCE_SENSOR_UNKNOWN' "$RUNNER_TEMP/broken.err"
          ! grep -q '"quiet":true' "$RUNNER_TEMP/broken.out"
          test "$(wc -l < "$CALLS")" = '1'
          test "$(sqlite3 "$DB" 'select generation from entity_state where id=1;')" = '1'
          test "$(sqlite3 "$DB" 'select count(*) from outputs;')" = '1'
          test "$(sqlite3 "$DB" 'select count(*) from study_rows;')" = '1'
          test "$(sqlite3 "$DB" 'pragma integrity_check;')" = 'ok'

      - name: Emit bounded result
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'MINI_ENTITY_NATIVE_0_7_QUIET_REGRESSION=PASS' \
            "SOURCE_HEAD=$(git rev-parse HEAD)" \
            "SOURCE_TREE=$(git rev-parse HEAD^{tree})" \
            'FIRST_RUN_GENERATION=1' \
            'VERIFIED_EMPTY_GENERATION=1' \
            'VERIFIED_EMPTY_INFERENCE_CALLS_ADDED=0' \
            'VERIFIED_EMPTY_OUTPUTS_ADDED=0' \
            'VERIFIED_EMPTY_STUDY_ROWS_ADDED=0' \
            'BROKEN_SOURCE=SOURCE_SENSOR_UNKNOWN' \
            'BROKEN_SOURCE_QUIET=false' \
            'REAL_MODEL_QUALITY=NOT_CREDITED_FIXTURE_ONLY' \
            'EXTERNAL_PROVIDER_EXECUTION=NOT_ATTEMPTED' \
            'UNUSUAL_EXPERIMENT=NOT_EXECUTED_ALREADY_CONSUMED_BY_CANONICAL_GO_RECEIPT' \
            'TOGETHER=FORBIDDEN_NOT_USED'
