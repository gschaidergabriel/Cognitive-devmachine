name: mini-entity-native-0.7-contract-gates

on:
  push:
    branches:
      - gpt56sol/go-native-0-7-contract-gates-r2-20260822-1311
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-contract-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libsqlite3-dev libjson-c-dev libcurl4-openssl-dev sqlite3
      - name: Reproducibly build transitive source closure
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          python3 "the artefact/blogpost_entity/native/build_native_bound.py" \
            --source "the artefact/blogpost_entity/native/mini_entity.c" \
            --output /tmp/mini_entity.clay \
            --receipt /tmp/native_build_provenance.json \
            --version-label mini-entity/0.7.0-dev1-contract-gates \
            --source-date-epoch "$epoch" \
            --repeat 2
          /tmp/mini_entity.clay --version | tee /tmp/version.txt
          sha256sum /tmp/mini_entity.clay | tee /tmp/binary.sha256
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/native_build_provenance.json'))
          assert r['schema']=='mini-entity-native-build-provenance/v2'
          assert r['build_definition']['repeat_byte_identity'] is True
          paths={x['path'] for x in r['build_definition']['source_closure']['files']}
          assert 'mini_entity_contract_gate.inc' in paths, paths
          print('PASS: contract gate bytes are transitively bound into reproducible native source identity')
          PY
      - name: Verify contract boundaries fail closed before persistence
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/profile.json <<'JSON'
          {
            "schema":"clay-pipeline-profile/v2",
            "profile_id":"contract_probe",
            "identity":{"task":"Return strict JSON only","language":"en"},
            "personality":{
              "system_prompt":"Return strict JSON only.",
              "output_contract":{
                "title_field":"title",
                "intro_field":"intro",
                "sections_field":"sections",
                "section_text_field":"text",
                "section_evidence_field":"evidence_refs",
                "continuity_field":"continuity",
                "autobiographical_hypotheses_field":"hypotheses"
              }
            },
            "inference":{"kind":"local_exec","max_tokens":64,"temperature":0.0},
            "gate":{"require_evidence_per_section":false,"require_hash_echo":true,"leak_patterns":["FORBIDDEN_LEAK"]}
          }
          JSON
          printf 'fixture-model\n' >/tmp/model.gguf
          cat >/tmp/runner <<'PY'
          #!/usr/bin/env python3
          print("THIS_IS_NOT_JSON")
          PY
          chmod 0755 /tmp/runner

          /tmp/mini_entity.clay init /tmp/entity.db
          /tmp/mini_entity.clay source-init /tmp/source.db
          /tmp/mini_entity.clay preset-apply /tmp/entity.db /tmp/profile.json
          /tmp/mini_entity.clay set-local-model /tmp/entity.db /tmp/model.gguf
          /tmp/mini_entity.clay set-local-runner-json /tmp/entity.db '["/tmp/runner","{{PROMPT_FILE}}"]'
          /tmp/mini_entity.clay source-add /tmp/source.db observation ev-1 '{"measured":1}'

          set +e
          /tmp/mini_entity.clay run /tmp/entity.db /tmp/source.db >/tmp/bad.out 2>/tmp/bad.err
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'OUTPUT_CONTRACT_GATE_REJECTED_NO_COMMIT' /tmp/bad.err
          python3 - <<'PY'
          import sqlite3
          e=sqlite3.connect('/tmp/entity.db'); s=sqlite3.connect('/tmp/source.db')
          assert e.execute('select generation from entity_state where id=1').fetchone()[0] == 0
          assert e.execute('select count(*) from outputs').fetchone()[0] == 0
          assert s.execute("select consumed_generation from mini_entity_events where source_id='ev-1'").fetchone()[0] is None
          print('PASS: malformed output rejected before commit')
          PY

          cat >/tmp/runner <<'PY'
          #!/usr/bin/env python3
          import json,re,sys
          prompt=open(sys.argv[1],encoding='utf-8').read()
          def take(name):
              m=re.search(r'^'+re.escape(name)+r'=([0-9a-f]{64})$',prompt,re.M)
              assert m, name
              return m.group(1)
          print(json.dumps({
              'title':'ok','intro':'ok','sections':[{'text':'ok','evidence_refs':[]}],
              'continuity':'continue','hypotheses':[],
              'packet_hash_seen':take('packet_hash_expected'),
              'canonical_state_hash_seen':take('canonical_state_hash_expected')
          },separators=(',',':')))
          PY
          chmod 0755 /tmp/runner
          /tmp/mini_entity.clay run /tmp/entity.db /tmp/source.db | tee /tmp/good.json
          python3 - <<'PY'
          import sqlite3
          e=sqlite3.connect('/tmp/entity.db'); s=sqlite3.connect('/tmp/source.db')
          assert e.execute('select generation from entity_state where id=1').fetchone()[0] == 1
          assert e.execute('select count(*) from outputs').fetchone()[0] == 1
          assert e.execute('select count(*) from study_rows').fetchone()[0] == 1
          assert s.execute("select consumed_generation from mini_entity_events where source_id='ev-1'").fetchone()[0] == 1
          print('PASS: valid output committed exactly once')
          PY

          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/profile.json'))
          p['inference']['api_token']='DO_NOT_STORE_THIS'
          json.dump(p,open('/tmp/bad-profile.json','w'))
          PY
          set +e
          /tmp/mini_entity.clay preset-apply /tmp/entity.db /tmp/bad-profile.json >/tmp/secret.out 2>/tmp/secret.err
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'PROFILE_CONTRACT_REJECTED' /tmp/secret.err
          python3 - <<'PY'
          import sqlite3
          raw=sqlite3.connect('/tmp/entity.db').execute("select profile_json from profiles where profile_id='contract_probe'").fetchone()[0]
          assert 'DO_NOT_STORE_THIS' not in raw
          print('PASS: secret-valued profile rejected before persistence')
          PY

          /tmp/mini_entity.clay source-add /tmp/source.db observation ev-2 '{"measured":2}'
          python3 - <<'PY'
          import sqlite3
          db=sqlite3.connect('/tmp/entity.db')
          raw,stored=db.execute("select profile_json,profile_sha256 from profiles where profile_id='contract_probe'").fetchone()
          tampered=raw.replace('Return strict JSON only','TAMPERED PROFILE BYTES',1)
          assert tampered != raw
          db.execute("update profiles set profile_json=? where profile_id='contract_probe'",(tampered,)); db.commit()
          print('stored_hash_left_unchanged=',stored)
          PY
          set +e
          /tmp/mini_entity.clay run /tmp/entity.db /tmp/source.db >/tmp/tamper.out 2>/tmp/tamper.err
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'PROFILE_HASH_MISMATCH' /tmp/tamper.err
          python3 - <<'PY'
          import hashlib,sqlite3
          e=sqlite3.connect('/tmp/entity.db'); s=sqlite3.connect('/tmp/source.db')
          raw,stored=e.execute("select profile_json,profile_sha256 from profiles where profile_id='contract_probe'").fetchone()
          assert hashlib.sha256(raw.encode()).hexdigest()!=stored
          assert e.execute('select generation from entity_state where id=1').fetchone()[0] == 1
          assert e.execute('select count(*) from outputs').fetchone()[0] == 1
          assert s.execute("select consumed_generation from mini_entity_events where source_id='ev-2'").fetchone()[0] is None
          print('PASS: profile digest mismatch rejected without mutation')
          PY

          sqlite3 /tmp/entity.db 'PRAGMA integrity_check;' | grep -qx ok
          sqlite3 /tmp/source.db 'PRAGMA integrity_check;' | grep -qx ok
