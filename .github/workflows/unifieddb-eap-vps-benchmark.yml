name: UnifiedDB EAP VPS Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unifieddb-eap-vps-benchmark.yml'
      - 'research_entity/harness/reference/unifieddb_emergent_preprocessor.py'
      - 'research_entity/harness/reference/test_unifieddb_emergent_assembly.py'
      - 'research_entity/harness/reference/benchmark_unifieddb_emergent_assembly.py'
      - 'research_entity/harness/reference/unifieddb_query_plane.py'
      - 'research_entity/harness/reference/state_ledger.py'

permissions:
  contents: read

concurrency:
  group: unifieddb-eap-vps-benchmark
  cancel-in-progress: false

jobs:
  eap-vps:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout tested tree read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Run UnifiedDB query and EAP regression suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            research_entity.harness.reference.test_unifieddb_query_plane \
            research_entity.harness.reference.test_unifieddb_emergent_assembly

      - name: Run EAP model-input benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research_entity.harness.reference.benchmark_unifieddb_emergent_assembly \
            > /tmp/UNIFIEDDB_EAP_BENCHMARK.json
          python3 - <<'PY'
          import json, os, platform, socket
          from datetime import datetime, timezone
          from pathlib import Path
          bench=json.loads(Path('/tmp/UNIFIEDDB_EAP_BENCHMARK.json').read_text(encoding='utf-8'))
          eap=bench['methods']['eap_hot_assembly']
          staged=bench['methods']['recursive_sql_staged_assembly']
          oob=bench['out_of_box_experiment']
          payload={
              'schema_version':'1.0',
              'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
              'scope':'UNIFIEDDB_EAP_MODEL_INPUT_PRELIMINARY_NOT_ANDREAS_TARGET_ACCEPTANCE',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'github_sha':os.environ.get('GITHUB_SHA',''),
              'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
              'github_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT',''),
              'runner_name':os.environ.get('RUNNER_NAME','unknown'),
              'runner_os':os.environ.get('RUNNER_OS','unknown'),
              'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
              'hostname':socket.gethostname(),
              'platform':platform.platform(),
              'python':platform.python_version(),
              'benchmark':bench,
              'acceptance':{
                  'retrieval_quality_exact': eap['recall_at_12']==1.0 and eap['precision_at_12']==1.0 and eap['ndcg_at_12']==1.0,
                  'faster_than_staged_sql_p50': eap['latency_us']['p50'] < staged['latency_us']['p50'],
                  'speedup_vs_staged_sql_p50': eap['speedup_vs_recursive_sql_staged_p50'],
                  'negative_space_improves_precision': oob['gated_precision_at_2'] > oob['ungated_precision_at_2'],
              },
              'scope_guard':'A pass proves only this bounded synthetic model-input benchmark on this self-hosted Ubuntu runner; it is not universal database superiority or final Andreas target acceptance.',
              'authority_invariant':'model output != execution authority',
          }
          Path('/tmp/UNIFIEDDB_EAP_VPS_RECEIPT.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload['acceptance'],sort_keys=True))
          assert payload['acceptance']['retrieval_quality_exact']
          assert payload['acceptance']['negative_space_improves_precision']
          PY

      - name: Upload VPS receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unifieddb-eap-vps-${{ github.run_id }}
          path: /tmp/UNIFIEDDB_EAP_VPS_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

  persist-receipt:
    if: always()
    needs: eap-vps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout persistence lane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Download tested receipt
        uses: actions/download-artifact@v4
        with:
          name: unifieddb-eap-vps-${{ github.run_id }}
          path: /tmp/unifieddb-eap

      - name: Validate and persist receipt
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source=Path('/tmp/unifieddb-eap/UNIFIEDDB_EAP_VPS_RECEIPT.json')
          data=json.loads(source.read_text(encoding='utf-8'))
          assert data['evidence_class']=='REAL_SELF_HOSTED_UBUNTU_EXECUTION'
          assert data['github_sha']==os.environ['TESTED_SHA']
          assert data['authority_invariant']=='model output != execution authority'
          root=Path('research_entity/state/system/unifieddb_eap_benchmark')
          root.mkdir(parents=True,exist_ok=True)
          (root/'LATEST.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (root/f"{data['github_run_id']}.json").write_text(json.dumps(data,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name 'clay-eap-benchmark'
          git config user.email 'clay-eap-benchmark@users.noreply.github.com'
          git add research_entity/state/system/unifieddb_eap_benchmark/
          git commit -m "evidence(unifieddb): persist EAP VPS benchmark ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
