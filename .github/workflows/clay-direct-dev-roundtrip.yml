name: Clay direct-dev sandbox roundtrip

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  probe:
    if: "github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] clay-direct-dev roundtrip' && github.event.issue.user.login == 'gschaidergabriel' && contains(github.event.issue.body || '', 'dispatch_schema: CLAY_ORDINARY_DISPATCH/v1')"
    concurrency:
      group: clay-direct-dev-roundtrip-v1
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Validate semantic dispatch singleton
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re

          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          body = str((event.get('issue') or {}).get('body') or '')
          fields = {}
          for line in body.splitlines():
              if ':' not in line:
                  continue
              k, v = line.split(':', 1)
              k = k.strip()
              if k in {'dispatch_schema', 'dispatch_key'} and k not in fields:
                  fields[k] = v.strip()

          if fields.get('dispatch_schema') != 'CLAY_ORDINARY_DISPATCH/v1':
              raise SystemExit('invalid or missing dispatch_schema')
          key = fields.get('dispatch_key', '')
          if not re.fullmatch(r'clay-direct-dev-roundtrip-v1-g[0-9]{4}', key):
              raise SystemExit('invalid or missing dispatch_key')

          spec_path = pathlib.Path('research_entity/continuity/ordinary_dispatch_specs/clay-direct-dev-roundtrip-v1.json')
          spec = json.loads(spec_path.read_text())
          expected = str(spec.get('current_dispatch_key') or '')
          generated = f"{spec['dispatch_class']}-g{int(spec['retry_generation']):04d}"
          if expected != generated:
              raise SystemExit('dispatch spec key/generation mismatch')
          if key != expected:
              raise SystemExit(f'stale/noncanonical dispatch key: {key} != {expected}')

          claim_path = pathlib.Path(f'research_entity/continuity/ordinary_dispatch_claims/{key}.json')
          if not claim_path.is_file():
              raise SystemExit('create-only dispatch claim missing')
          claim = json.loads(claim_path.read_text())
          if claim.get('dispatch_key') != key or claim.get('dispatch_class') != spec.get('dispatch_class'):
              raise SystemExit('dispatch claim identity mismatch')
          if claim.get('new_issue_authorized_by_this_claim') is False:
              raise SystemExit('claim is quarantine-only; no new issue is authorized for this generation')

          result_path = pathlib.Path(f'research_entity/continuity/ordinary_dispatch_results/{key}.json')
          skip = result_path.is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'dispatch_key={key}\n')
              out.write(f'skip={str(skip).lower()}\n')
              out.write(f'result_path={result_path.as_posix()}\n')
          if skip:
              print(f'ALREADY_SATISFIED {key} -> {result_path}')
          else:
              print(f'ADMITTED_SINGLETON {key}')
          PY

      - name: Discover and enter clay-direct-dev
        if: steps.dispatch.outputs.skip != 'true'
        shell: bash
        env:
          DISPATCH_KEY: ${{ steps.dispatch.outputs.dispatch_key }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/clay-direct-dev-probe
          python3 - <<'PY' > /tmp/clay-direct-dev-probe/base.json
          import json, os, platform, socket, subprocess
          event=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8'))
          print(json.dumps({
            'schema':'CLAY_DIRECT_DEV_ROUNDTRIP/v1',
            'dispatch_schema':'CLAY_ORDINARY_DISPATCH/v1',
            'dispatch_key':os.environ['DISPATCH_KEY'],
            'issue_number':(event.get('issue') or {}).get('number'),
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),
            'runner_os':os.environ.get('RUNNER_OS','unknown'),
            'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
            'runner_hostname':socket.gethostname(),
            'runner_platform':platform.platform(),
            'event_sha':os.environ.get('GITHUB_SHA',''),
            'checkout_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'run_id':os.environ.get('GITHUB_RUN_ID',''),
          },indent=2,sort_keys=True))
          PY

          runtime=''
          exec_prefix=()
          found='false'

          try_runtime() {
            local rt="$1"
            if ! command -v "$rt" >/dev/null 2>&1; then return 1; fi
            if "$rt" inspect clay-direct-dev >/dev/null 2>&1; then
              runtime="$rt"; exec_prefix=("$rt" exec clay-direct-dev); found='true'; return 0
            fi
            if command -v sudo >/dev/null 2>&1 && sudo -n "$rt" inspect clay-direct-dev >/dev/null 2>&1; then
              runtime="sudo-$rt"; exec_prefix=(sudo -n "$rt" exec clay-direct-dev); found='true'; return 0
            fi
            return 1
          }

          try_runtime docker || try_runtime podman || true

          if [[ "$found" != true ]] && command -v incus >/dev/null 2>&1 && incus info clay-direct-dev >/dev/null 2>&1; then
            runtime='incus'; exec_prefix=(incus exec clay-direct-dev --); found='true'
          fi
          if [[ "$found" != true ]] && command -v lxc >/dev/null 2>&1 && lxc info clay-direct-dev >/dev/null 2>&1; then
            runtime='lxc'; exec_prefix=(lxc exec clay-direct-dev --); found='true'
          fi

          if [[ "$found" == true ]]; then
            "${exec_prefix[@]}" sh -lc 'set -eu; echo CLAY_DIRECT_DEV_ROUNDTRIP=PASS; id; uname -a; pwd; df -Pk . | tail -n 1; command -v python3 || true; python3 --version 2>&1 || true' > /tmp/clay-direct-dev-probe/inside.txt 2>&1
            status='PASS'
          else
            status='BLOCKED_SANDBOX_NOT_DISCOVERED_FROM_RUNNER'
            {
              echo 'docker:'; command -v docker || true; docker ps -a --format '{{.Names}}' 2>&1 || true
              echo 'sudo docker:'; command -v sudo || true; sudo -n docker ps -a --format '{{.Names}}' 2>&1 || true
              echo 'podman:'; command -v podman || true; podman ps -a --format '{{.Names}}' 2>&1 || true
              echo 'incus:'; command -v incus || true; incus list 2>&1 || true
              echo 'lxc:'; command -v lxc || true; lxc list 2>&1 || true
            } > /tmp/clay-direct-dev-probe/discovery.txt
          fi

          STATUS="$status" RUNTIME="$runtime" python3 - <<'PY' > /tmp/clay-direct-dev-probe/receipt.json
          import json, os, pathlib
          base=json.loads(pathlib.Path('/tmp/clay-direct-dev-probe/base.json').read_text())
          base.update({
            'status':os.environ['STATUS'],
            'sandbox':'clay-direct-dev',
            'transport':'SELF_HOSTED_LINUX_X64',
            'container_runtime':os.environ.get('RUNTIME') or None,
            'inside_output':pathlib.Path('/tmp/clay-direct-dev-probe/inside.txt').read_text(errors='replace') if pathlib.Path('/tmp/clay-direct-dev-probe/inside.txt').exists() else None,
            'discovery_output':pathlib.Path('/tmp/clay-direct-dev-probe/discovery.txt').read_text(errors='replace') if pathlib.Path('/tmp/clay-direct-dev-probe/discovery.txt').exists() else None,
            'secret_values_recorded':False,
            'scope':'non-invasive bridge/sandbox roundtrip only; no model intervention',
            'whole_entityos_hcu_runtime_credit':0,
          })
          print(json.dumps(base,indent=2,sort_keys=True))
          PY

      - name: Persist singleton receipt and result
        if: steps.dispatch.outputs.skip != 'true'
        shell: bash
        env:
          DISPATCH_KEY: ${{ steps.dispatch.outputs.dispatch_key }}
        run: |
          set -euo pipefail
          mkdir -p research_entity/runtime/tool_results research_entity/continuity/ordinary_dispatch_results
          target="research_entity/runtime/tool_results/clay-direct-dev-roundtrip-${DISPATCH_KEY}.json"
          result="research_entity/continuity/ordinary_dispatch_results/${DISPATCH_KEY}.json"

          git fetch origin main
          if git show "origin/main:${result}" >/dev/null 2>&1; then
            echo "ALREADY_SATISFIED_REMOTE ${DISPATCH_KEY}"
            exit 0
          fi

          cp /tmp/clay-direct-dev-probe/receipt.json "$target"
          TARGET="$target" RESULT="$result" python3 - <<'PY' > "$result"
          import json, os, pathlib
          receipt=json.loads(pathlib.Path('/tmp/clay-direct-dev-probe/receipt.json').read_text())
          print(json.dumps({
            'schema':'CLAY_ORDINARY_DISPATCH_RESULT/v1',
            'dispatch_key':receipt['dispatch_key'],
            'dispatch_class':'clay-direct-dev-roundtrip-v1',
            'status':receipt['status'],
            'issue_number':receipt.get('issue_number'),
            'run_id':receipt.get('run_id'),
            'event_sha':receipt.get('event_sha'),
            'checkout_head':receipt.get('checkout_head'),
            'receipt_path':os.environ['TARGET'],
            'runtime_credit':'ROUNDTRIP_COMPONENT_ONLY' if receipt['status']=='PASS' else 0,
            'whole_entityos_hcu_runtime_credit':0,
            'retry_requires_generation_advance':True,
          },indent=2,sort_keys=True))
          PY

          git config user.name 'clay-direct-dev-runner'
          git config user.email 'clay-direct-dev-runner@users.noreply.github.com'
          git add "$target" "$result"
          git commit -m "evidence(vps): singleton clay-direct-dev ${DISPATCH_KEY} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
