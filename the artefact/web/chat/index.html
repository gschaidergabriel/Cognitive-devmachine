<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>entityOS</title>
<!-- __CLERK_API__ / __CLERK_PUBLISHABLE_KEY__ are server-substituted (html.escape'd)
     placeholders -- filled in by the route the same way key/api are filled into the
     terminal page today. Do not hardcode real values into this file. -->
<script defer crossorigin="anonymous" src="__CLERK_API__/npm/@clerk/ui@1/dist/ui.browser.js"></script>
<script defer crossorigin="anonymous" data-clerk-publishable-key="__CLERK_PUBLISHABLE_KEY__" src="__CLERK_API__/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>
<link rel="stylesheet" href="/web/schale/schale.css?v=137">
<link rel="stylesheet" href="/web/anmeldung/anmeldung.css?v=137">
<script defer src="/web/schale/schale.js?v=137"></script>
<script src="/web/anmeldung/anmeldung.js?v=137"></script>
<link rel="stylesheet" href="/web/avatare/zero-avatar.css?v=137">
<script src="/web/avatare/zero-avatar.js?v=137"></script>
<script defer src="/web/chat/emergenz.js?v=137"></script>
<script defer src="/web/chat/systeme.js?v=139"></script>
<style>
/* Die Chatseite traegt keine eigene Farbtafel mehr -- sie lebt aus schale.css.
   Was hier steht, ist nur noch das, was NUR der Chat hat. Eigene Farbwerte an
   dieser Stelle waeren der zweite Dialekt. */
html { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

/* Alles Lesbare haengt an EINEM Rand. Vorher lief auf 1440 px jede Nachricht
   bis an die Bildschirmkante und die Eingabezeile klebte quer darunter -- zwei
   Bruchstellen mit derselben Ursache: es gab keine Spalte, nur eine Flaeche.
   Kopfzeile, Verlauf und Eingabe teilen sich jetzt dieselbe Kante. */
#chat { --rand: max(16px, calc((100% - var(--spalte)) / 2)); }

/* ── Anmeldung ───────────────────────────────────────────────────────── */
/* overflow-y:auto ist eine stille Sicherung, keine optische Aenderung: auf
   jedem Schirm, auf dem der Stapel (Phi + Marke + Zeile + Clerk-Box) in die
   Hoehe passt, greift sie nie. Erst auf einem kurzen Handy-Viewport (z.B.
   360x740 MIT Tastatur-Rest) verhindert sie, dass html,body{overflow:hidden}
   (oben) das untere Ende der Anmeldebox wortwoertlich abschneidet -- ohne sie
   waere die Anmeldung dort unerreichbar, nicht nur unschoen. */
#anmeldung { height: calc(100dvh - var(--schale-h)); margin-top: var(--schale-h);
             display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 22px;
             overflow-y: auto; -webkit-overflow-scrolling: touch;
             padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
/* Auch hier steht der Name in seiner einen Schreibweise: entityOS. */
.anmelde-marke { font-family: var(--schrift-marke); font-weight: 600;
                 font-size: var(--s-34); letter-spacing: .01em; color: var(--text); }
#authError { position: fixed; top: var(--schale-h); left: 0; right: 0; padding: 10px 16px;
             background: #3a1414; color: var(--warn); font-size: var(--s-13);
             display: none; z-index: 30; text-align: center; }

#chat { display: none; height: 100dvh; padding-top: var(--schale-h); flex-direction: column; }

/* ── Kopfzeile des Gespraechs ────────────────────────────────────────── */
/* Knapp gehalten: sie nennt den Gespraechspartner und sagt einmal, warum die
   Antwort am Stueck kommt. Der Satz bleibt woertlich stehen -- er ist die
   ehrliche Ansage, dass es kein Wort-fuer-Wort gibt, und keine Verzierung. */
.unterzeile { flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
              padding: 8px var(--rand); border-bottom: 1px solid var(--linie);
              background: color-mix(in srgb, var(--flaeche) 70%, transparent); }
.unterzeile .avatar { width: 26px; height: 26px; }
.unterzeile .titel { font-family: var(--schrift-marke); font-weight: 600;
                     font-size: var(--s-15); letter-spacing: .06em; }
.unterzeile .note { flex: 1 1 240px; min-width: 0; color: var(--matt);
                    font-size: var(--s-12); line-height: 1.3; }

/* ── Verlauf ─────────────────────────────────────────────────────────── */
#messages { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden;
            padding: 24px var(--rand) 8px;
            display: flex; flex-direction: column; gap: 16px; }

/* Der leere Zustand. Vorher klaffte hier eine schwarze Flaeche, die aussah wie
   ein Ladefehler. Jetzt steht in der Mitte, wer hier wartet und was dieses
   Fenster ist -- KEINE Beispielnachrichten: ein erfundener Verlauf waere die
   schlimmste Sorte Platzhalter, weil er sich wie Gedaechtnis liest.
   Er verschwindet ohne eine Zeile Steuerlogik: sobald eine echte Nachricht im
   Verlauf steht, ist er nicht mehr das einzige Kind. */
#leer { margin: auto; display: flex; flex-direction: column; align-items: center;
        gap: 14px; text-align: center; max-width: 440px; padding: 20px 0; }
#messages > #leer:not(:only-child) { display: none; }
#leer .z0feld { width: 72px; height: 72px; }
#leer .name { font-family: var(--schrift-marke); font-weight: 600;
              font-size: var(--s-24); letter-spacing: .12em; color: var(--text); }
#leer p { margin: 0; color: var(--matt); font-size: var(--s-13); line-height: 1.55; }
/* Trennlinie zwischen geladenem Verlauf und dem, was in diesem Besuch dazukommt.
   Ohne sie ist nicht unterscheidbar, was Zero gerade gesagt hat und was von
   gestern stammt. */
.verlaufsgrenze { display: flex; align-items: center; gap: 12px; margin: 18px 4px 6px;
  color: var(--matt); font-size: var(--s-13); }
.verlaufsgrenze::before, .verlaufsgrenze::after { content: ""; flex: 1;
  border-top: 1px solid var(--linie); }
.aelter { align-self: center; margin: 6px 0 2px; padding: 6px 14px;
  background: transparent; border: 1px solid var(--linie); border-radius: 999px;
  color: var(--matt); font: inherit; font-size: var(--s-13); cursor: pointer; }
.aelter:hover { color: var(--text); border-color: var(--matt); }
.aelter[disabled] { opacity: .5; cursor: default; }
.ladefehler { margin: 10px 4px; padding: 8px 12px; border: 1px solid #6b1f1f;
  background: #3a1414; color: var(--warn); border-radius: 8px; font-size: var(--s-13); }

.msg { display: flex; gap: 12px; max-width: 78%; }
.msg-user { align-self: flex-end; flex-direction: row-reverse; max-width: 78%; }
.msg-zero { align-self: flex-start; }
.avatar { width: 34px; height: 34px; flex: 0 0 auto; border-radius: 50%; }
.bubble { background: var(--flaeche); border: 1px solid var(--linie);
          border-radius: 14px; padding: 10px 13px;
          white-space: pre-wrap; word-break: break-word; }
/* Der Mensch traegt die kalte Kante. Das ist die einzige Stelle im ganzen Haus,
   an der --kalt vorkommt: eigene Eingaben, eigene Nachrichten. */
.msg-user .bubble { background: color-mix(in srgb, var(--kalt) 12%, var(--flaeche));
                    border-color: color-mix(in srgb, var(--kalt) 65%, var(--linie)); }
.msg-error .bubble { background: #3a1414; border-color: #6b1f1f; color: var(--warn); }
.toggle-original { margin-top: 8px; background: none; border: none; color: var(--matt);
                   font-size: var(--s-12); cursor: pointer; padding: 0; text-decoration: underline;
                   font-family: inherit; }
.toggle-original:hover { color: var(--text); }
.original { margin-top: 8px; border-top: 1px dashed var(--linie); padding-top: 8px;
            font-size: var(--s-13); color: var(--matt); }
.original .caveman { color: #c7c8cc; font-family: var(--schrift-mono); font-size: var(--s-12);
                     white-space: pre-wrap; }
.original .caveman.leer { color: var(--matt); font-style: italic; font-family: inherit; }
.original .receipt { margin-top: 6px; font-size: 11px; opacity: .75;
                     font-family: var(--schrift-mono); }

/* ── Bild-Nachricht: kleine tippbare Miniatur, oeffnet gross auf Antippen ──
   Zero zeigt manchmal ein Bild (z.B. einen Seiten-Screenshot) statt nur Text.
   Die Blase bleibt die Blase -- das Bild ist nur ein zusaetzliches Element
   darin, kein eigener Nachrichtentyp mit eigenem Layout. */
.bild-mini { display: block; margin-top: 8px; max-width: 220px; max-height: 160px;
             border-radius: 10px; border: 1px solid var(--linie); cursor: zoom-in;
             object-fit: cover; transition: filter 140ms ease, transform 140ms ease; }
.bild-mini:hover { filter: brightness(1.08); transform: scale(1.01); }
.bild-mini-label { display: block; margin-top: 4px; font-size: var(--s-12); color: var(--matt); }
.lightbox { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center;
            justify-content: center; background: rgba(8,9,12,.86); backdrop-filter: blur(2px);
            cursor: zoom-out; animation: lightbox-ein .16s ease both; padding: 24px; box-sizing: border-box; }
@keyframes lightbox-ein { from { opacity: 0; } to { opacity: 1; } }
.lightbox img { max-width: min(94vw, 1400px); max-height: 90vh; border-radius: 10px;
                 box-shadow: 0 12px 60px rgba(0,0,0,.6); border: 1px solid var(--linie); }
.lightbox-schliessen { position: absolute; top: 18px; right: 22px; background: none; border: none;
                        color: var(--text); font-size: 28px; line-height: 1; cursor: pointer;
                        opacity: .8; font-family: inherit; }
.lightbox-schliessen:hover { opacity: 1; }

.msg-pending .bubble { color: var(--matt); }
.pending-note { display: block; margin-top: 4px; font-size: var(--s-12); opacity: .8; }

/* ── Verfassen ───────────────────────────────────────────────────────── */
/* Gebunden statt angeklebt: dieselbe Spaltenkante wie die Nachrichten, eine
   Trennlinie, die genau so breit ist wie sie, und darueber ein weicher Verlauf
   statt einer harten Kante -- der Verlauf laeuft unter den letzten Nachrichten
   aus, damit die Eingabe aus der Seite herauswaechst und nicht davorliegt. */
#composer { position: relative; z-index: 1; flex: 0 0 auto;
            padding: 12px var(--rand) calc(16px + env(safe-area-inset-bottom, 0px));
            background: var(--grund);
            display: flex; gap: 10px; align-items: flex-end; }
#composer::before { content: ""; position: absolute; left: 0; right: 0; top: -34px;
                    height: 34px; pointer-events: none;
                    background: linear-gradient(to top, var(--grund), transparent); }
#composer::after { content: ""; position: absolute; top: 0; height: 1px;
                   left: var(--rand); right: var(--rand); pointer-events: none;
                   background: linear-gradient(90deg, transparent, var(--linie) 12%,
                                               var(--linie) 88%, transparent); }
#text { flex: 1 1 auto; resize: none; max-height: 140px; min-height: 22px;
        background: var(--flaeche-hoch); color: var(--text); border: 1px solid var(--linie);
        border-radius: var(--rundung); padding: 11px 13px;
        font: var(--s-15)/1.45 var(--schrift-text); }
#text::placeholder { color: var(--matt); }
#text:focus { outline: none; border-color: color-mix(in srgb, var(--signal) 60%, var(--linie));
              background: var(--flaeche); }
#text:focus-visible { outline: none; }
/* Senden ist die Wirkung dieser Seite -- also traegt der Knopf die Signalfarbe
   und nicht das kalte Blau. Kalt gehoert dem, was der Mensch SAGT; das Signal
   gehoert dem, was das System TUT. */
#send { flex: 0 0 auto; background: var(--signal); color: #06120b; border: none;
        border-radius: var(--rundung); padding: 11px 20px; cursor: pointer;
        font-family: var(--schrift-marke); font-weight: 600; font-size: var(--s-13);
        letter-spacing: .08em; text-transform: uppercase;
        transition: filter 160ms ease, opacity 160ms ease; }
#send:hover:not(:disabled) { filter: brightness(1.12); }
#send:disabled { opacity: .35; cursor: default; }

#switcher { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.slot-btn { background: transparent; color: var(--matt); border: 1px solid var(--linie);
            border-radius: 7px; padding: 5px 11px; cursor: pointer; position: relative;
            font-family: var(--schrift-mono); font-size: var(--s-12);
            transition: color 150ms ease, border-color 150ms ease, background 150ms ease,
                        transform 110ms ease, box-shadow 150ms ease; }
.slot-btn:hover:not(:disabled) { color: var(--text); border-color: var(--matt);
            transform: translateY(-1px); }
.slot-btn:active:not(:disabled) { transform: translateY(0) scale(.96); }
.slot-btn.active { color: var(--text); border-color: var(--signal);
                   background: color-mix(in srgb, var(--signal) 14%, transparent);
                   box-shadow: 0 0 0 1px color-mix(in srgb, var(--signal) 30%, transparent),
                               0 0 12px color-mix(in srgb, var(--signal) 22%, transparent); }
.slot-btn:disabled { opacity: .5; cursor: default; }
/* Der angeklickte Knopf laedt sichtbar, statt still zu haengen. */
.slot-btn.laedt { color: transparent; }
.slot-btn.laedt::after { content: ""; position: absolute; inset: 0; margin: auto;
            width: 12px; height: 12px; border-radius: 50%;
            border: 2px solid color-mix(in srgb, var(--matt) 55%, transparent);
            border-top-color: var(--signal); animation: dreh .7s linear infinite; }
@keyframes dreh { to { transform: rotate(360deg); } }

/* ── Emergentes Gitter im Hintergrund: das Substrat, sichtbar ── */
#emergenz { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 0;
            pointer-events: none; opacity: .6; }
body { background: var(--grund); position: relative; }

/* ── Login-Seite: Schale weg, Phi-Hero, mehr Bewegung (2026-08-19) ──────── */
/* Vor der Anmeldung KEINE Navigationsleiste -- Nav ohne Zugang ist sinnlos. */
body.vor-anmeldung #entityos-schale { display: none; }
body.vor-anmeldung #anmeldung { margin-top: 0; height: 100dvh; }

/* Der Phi-Hero: der neue Markenkern, gross, mit atmendem Lichthof und einem
   langsam kreisenden Ring. Der chromatische Glitch kommt aus den vorhandenen
   .eos-phi-* Klassen -- kein zweiter Dialekt. */
.anmelde-phi { position: relative; display: flex; align-items: center; justify-content: center;
  width: 138px; height: 138px; margin-bottom: 2px; }
.anmelde-phi .eos-marke-phi { width: 90px; height: 110px;
  filter: drop-shadow(0 0 16px color-mix(in srgb, var(--signal) 55%, transparent))
          drop-shadow(0 0 44px color-mix(in srgb, var(--signal) 28%, transparent)); }
.anmelde-phi .eos-phi-g { stroke-width: 1.5; }
.anmelde-phi::after {   /* atmender Lichthof HINTER dem Zeichen */
  content: ""; position: absolute; inset: -26%; z-index: -1; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--signal) 26%, transparent), transparent 70%);
  animation: phi-hof 5.6s ease-in-out infinite; }
.anmelde-phi::before {  /* dünner, langsam rotierender Ring */
  content: ""; position: absolute; inset: 4%; z-index: -1; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0 74%,
    color-mix(in srgb, var(--signal) 65%, transparent) 86%, transparent 100%);
  -webkit-mask: radial-gradient(closest-side, transparent 60%, #000 62%, #000 67%, transparent 69%);
          mask: radial-gradient(closest-side, transparent 60%, #000 62%, #000 67%, transparent 69%);
  animation: phi-ring 9s linear infinite; opacity: .55; }
@keyframes phi-hof  { 0%,100% { opacity: .5; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.09); } }
@keyframes phi-ring { to { transform: rotate(360deg); } }

/* Gestaffelter Auftritt: der ganze Stapel taucht weich aus der Tiefe auf. */
@keyframes eos-ein { from { opacity: 0; transform: translateY(16px) scale(.92); filter: blur(8px); }
                     to   { opacity: 1; transform: none; filter: none; } }
.anmelde-phi   { animation: eos-ein .9s cubic-bezier(.2,.7,.2,1) both; }
.anmelde-marke { animation: eos-ein .9s .12s cubic-bezier(.2,.7,.2,1) both; }
.anmelde-zeile { animation: eos-ein .9s .22s cubic-bezier(.2,.7,.2,1) both; }
#anmeldung #auth { animation: eos-ein 1s .34s cubic-bezier(.2,.7,.2,1) both; }

@media (prefers-reduced-motion: reduce) {
  .anmelde-phi::after, .anmelde-phi::before { animation: none; }
  .anmelde-phi, .anmelde-marke, .anmelde-zeile, #anmeldung #auth { animation: none; }
}

/* ── Kein-Zugang-Schirm: was ein Fremdkonto sieht -- und sonst nichts ── */
#keinzugang { position: fixed; inset: 0; z-index: 60; display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: var(--grund); text-align: center; padding: 24px; }
#keinzugang .kz-marke { font-family: var(--schrift-marke); font-weight: 600;
  font-size: var(--s-24); letter-spacing: .12em; color: var(--text); }
#keinzugang .kz-text { color: var(--matt); font-size: var(--s-15); margin: 0; max-width: 360px; }
#keinzugang .kz-btn { padding: 9px 18px; border-radius: 10px; border: 1px solid var(--linie);
  background: transparent; color: var(--text); font: inherit; cursor: pointer;
  transition: border-color .16s ease, color .16s ease; }
#keinzugang .kz-btn:hover { border-color: var(--signal); color: var(--signal); }

/* ── Systeme-Bubble: das Tailscale-Nervensystem, links ausklappbar ──────
   Zero lebt auf dem VPS und greift per Tailscale auf die Rechner zu -- die
   Bubble macht dieses Nervensystem sichtbar. Zu: drei Status-Punkte am Rand.
   Auf: eine Glaskarte mit Live-Stats; der Chat rueckt nach rechts. ── */
:root { --sys-w: min(304px, 84vw); --sys-w-dienste: min(440px, 94vw); }
/* Gabriel 19.08. (Eigner-Feedback): die Bubble wird BREITER im Dienste-Tab (mehr
   Platz fuer Task-Manager-Zeilen + Graphen). Eine einzige Body-Klasse reicht --
   sie ueberschreibt die Custom Property, jeder min-width/width/left-Wert unten,
   der var(--sys-w) liest, zieht automatisch mit (Systeme-Tab bleibt schmal). */
body.systeme-dienste-breit { --sys-w: var(--sys-w-dienste); }
#systeme-panel { position: fixed; top: var(--schale-h); bottom: 0; left: 0; z-index: 25;
  pointer-events: none; }
#systeme-panel > * { pointer-events: auto; }
/* ⭐ Handy-Overlay (2026-08-19): auf dem Desktop macht die Bubble den Chat
   schmaler (siehe die min-width:861px-Regel unten bei #chat). Auf dem Handy
   geht das nicht -- also legt sich die Bubble stattdessen als Overlay ueber
   den Chat (--sys-w wird unten auf 100vw gesetzt) und ein abgedunkelter Schirm
   dahinter macht unmissverstaendlich klar, dass der Chat gerade nicht dran
   ist. Tippen auf den Schirm schliesst -- derselbe Reflex wie bei jedem
   Bottom-Sheet. Auf dem Desktop bleibt der Schirm unsichtbar UND unklickbar. */
#systeme-scrim { position: fixed; inset: 0; z-index: 24;
  background: rgba(4,5,6,.6); opacity: 0; pointer-events: none;
  transition: opacity .28s ease; }
#systeme-schub { position: relative; height: 100%; width: 0; overflow: hidden;
  display: flex; flex-direction: column;
  background: color-mix(in srgb, var(--flaeche) 82%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-right: 1px solid var(--linie); box-shadow: 0 0 40px rgba(0,0,0,.35);
  transition: width .32s cubic-bezier(.22,.61,.36,1); }
#systeme-panel.auf #systeme-schub { width: var(--sys-w); }
#systeme-titel { flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: 14px 16px 10px; border-bottom: 1px solid var(--linie); min-width: var(--sys-w); }
.sys-titel-text { font-family: var(--schrift-marke); font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; font-size: var(--s-13); color: var(--text); }
#systeme-zu { margin-left: auto; background: none; border: none; color: var(--matt);
  font-size: 22px; line-height: 1; cursor: pointer; padding: 0 6px; border-radius: 6px; }
#systeme-zu:hover { color: var(--text); background: color-mix(in srgb, var(--signal) 12%, transparent); }

/* Umschaltung Systeme/Dienste -- zwei kleine Segmente, ruhig im Haus-Stil. */
#systeme-segmente { flex: 0 0 auto; display: flex; gap: 4px; padding: 10px 16px 0;
  min-width: var(--sys-w); }
.sys-seg { flex: 1 1 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--linie);
  background: transparent; color: var(--matt); font: inherit; font-size: var(--s-12);
  cursor: pointer; transition: border-color .16s ease, color .16s ease, background .16s ease; }
.sys-seg:hover { color: var(--text); }
.sys-seg.an { color: var(--text); border-color: var(--signal);
  background: color-mix(in srgb, var(--signal) 14%, transparent); }

#systeme-liste, #systeme-dienste { flex: 1 1 auto; overflow-y: auto; padding: 12px; display: flex;
  flex-direction: column; gap: 12px; min-width: var(--sys-w); }
#systeme-dienste { gap: 0; padding: 6px 12px; }
/* ⭐ BUGFIX 19.08.: die ID-Regel oben setzt display:flex unbedingt -- das schlaegt
   die UA-Regel [hidden]{display:none}, weil ein ID-Selektor sie in Spezifitaet
   schlaegt. Ergebnis war: die Dienste-Liste "blutete" ins Systeme-Tab (und
   umgekehrt), obwohl JS das hidden-Attribut korrekt setzte. Explizite [hidden]-
   Regel MIT mindestens derselben Spezifitaet + !important, damit die Tabs sich
   wirklich exklusiv ausschliessen. */
#systeme-liste[hidden], #systeme-dienste[hidden] { display: none !important; }

/* Dienste: kompakte Liste, je EIN Wort + Lampe. Gruen an, rot aus. */
.sys-dienst-zeile { display: flex; align-items: center; gap: 9px; padding: 8px 4px;
  border-bottom: 1px solid var(--linie); }
.sys-dienst-zeile:last-child { border-bottom: none; }
.sys-dienst-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--matt); }
.sys-dienst-dot.an { background: var(--signal);
  box-shadow: 0 0 6px color-mix(in srgb, var(--signal) 55%, transparent); }
.sys-dienst-dot.aus { background: var(--warn); }
.sys-dienst-name { flex: 1 1 auto; font-size: var(--s-13); color: var(--text); }
.sys-dienst-status { font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--matt); font-family: var(--schrift-mono); }

/* ── Dienste-Tab, Task-Manager-Stil (Eigner-Feedback 19.08.): Immunsystem-
   Schalter oben, darunter animierte VPS-Graphen, darunter die steuerbaren
   Dienste-Zeilen mit Knoepfen + ausklappbarer Erklaerung, ganz unten der
   Immunsystem-Log. ── */
#dienste-immun { padding: 2px 4px 12px; border-bottom: 1px solid var(--linie); margin-bottom: 10px; }
#dienste-immun-kopf { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.dienst-knopf-immun { min-width: 78px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--linie);
  background: transparent; color: var(--matt); font: inherit; font-size: var(--s-12); cursor: pointer;
  transition: border-color .16s ease, color .16s ease, background .16s ease; }
.dienst-knopf-immun.an { color: #06120b; background: var(--signal); border-color: var(--signal); font-weight: 600; }
.dienst-knopf-immun.aus { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--linie)); }
.dienst-knopf-immun:disabled { opacity: .55; cursor: default; }

#dienste-graphen { padding: 2px 4px 12px; border-bottom: 1px solid var(--linie); margin-bottom: 6px; }
.dg-titel { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--matt); margin-bottom: 8px; }
.dg-reihe { display: flex; flex-direction: column; gap: 8px; }
.dg-spur { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 8px; }
.dg-lbl { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--matt); }
.dg-canvas { width: 100%; height: 34px; display: block; border-radius: 6px;
  background: color-mix(in srgb, var(--linie) 40%, transparent); }
.dg-wert { font-size: 11px; color: var(--text); font-family: var(--schrift-mono); white-space: nowrap;
  font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }

/* Task-Manager-Zeilen: wie .sys-dienst-zeile, aber mit Knoepfen + Klapp-Erklaerung. */
.td-zeile { border-bottom: 1px solid var(--linie); }
.td-zeile:last-child { border-bottom: none; }
.td-hauptzeile { display: flex; align-items: center; gap: 9px; padding: 8px 4px; cursor: pointer;
  border-radius: 6px; }
.td-hauptzeile:hover { background: color-mix(in srgb, var(--signal) 6%, transparent); }
.td-hauptzeile .sys-dienst-name { flex: 1 1 auto; font-size: var(--s-13); color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-badge-kritisch { font-size: 9px; letter-spacing: .05em; text-transform: uppercase; color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--linie)); border-radius: 5px; padding: 1px 5px;
  flex: 0 0 auto; }
.td-knoepfe { display: flex; align-items: center; gap: 3px; flex: 0 0 auto; }
.dienst-knopf { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 6px; border: 1px solid var(--linie); background: transparent; color: var(--matt);
  font-size: 12px; line-height: 1; cursor: pointer; padding: 0;
  transition: border-color .16s ease, color .16s ease, background .16s ease; }
.dienst-knopf:hover:not(:disabled) { color: var(--text); border-color: var(--signal); }
.dienst-knopf[data-aktion="start"]:hover:not(:disabled) { color: var(--signal); }
.dienst-knopf[data-aktion="stop"]:hover:not(:disabled) { color: var(--warn); }
.dienst-knopf:disabled { opacity: .4; cursor: default; }
.td-spinner { font-size: 11px; color: var(--matt); padding: 0 2px; font-family: var(--schrift-mono); }
.td-chevron { font-size: 11px; color: var(--matt); flex: 0 0 auto; transition: transform .2s ease; }
.td-zeile.offen .td-chevron { transform: rotate(90deg); }
.td-erklaerung { overflow: hidden; max-height: 0; transition: max-height .24s ease; padding: 0 4px; }
.td-erklaerung p { margin: 0 0 8px 26px; font-size: var(--s-12); color: var(--matt); line-height: 1.5; }

#dienste-immun-log { margin-top: 10px; }
#dienste-immun-log summary { cursor: pointer; font-size: var(--s-12); color: var(--matt);
  padding: 6px 4px; list-style: none; display: flex; align-items: center; gap: 6px; user-select: none; }
#dienste-immun-log summary::-webkit-details-marker { display: none; }
#dienste-immun-log summary::before { content: "›"; display: inline-block; transition: transform .2s ease; }
#dienste-immun-log[open] summary::before { transform: rotate(90deg); }
#dienste-immun-log-inhalt { font-family: var(--schrift-mono); font-size: 10.5px; line-height: 1.5;
  color: var(--matt); white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow-y: auto;
  background: color-mix(in srgb, var(--grund) 55%, transparent); border: 1px solid var(--linie);
  border-radius: 8px; padding: 8px 9px; margin: 0 4px 8px; }

.sys-karte { padding: 12px 13px; border-radius: 12px; border: 1px solid var(--linie);
  background: color-mix(in srgb, var(--grund) 55%, transparent); }
.sys-karte.offline { opacity: .55; }
.sys-kopf { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.sys-name { font-weight: 600; font-size: var(--s-15); color: var(--text); }
.sys-rolle { font-size: var(--s-12); color: var(--matt); font-family: var(--schrift-mono);
  flex: 1 1 100%; }
.sys-dot { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto; background: var(--matt); }
.sys-dot.online { background: var(--signal);
  animation: sys-puls 2.4s ease-out infinite; }
.sys-dot.erreichbar-nein { background: #e0a83a; }
.sys-dot.offline { background: color-mix(in srgb, var(--matt) 70%, transparent); animation: none; }
@keyframes sys-puls {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--signal) 55%, transparent); }
  70%  { box-shadow: 0 0 0 6px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; } }

.sys-metrik { display: grid; grid-template-columns: 32px 1fr auto; align-items: center;
  gap: 8px; margin-top: 6px; }
.sys-lbl { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--matt); }
.sys-bar { height: 6px; border-radius: 999px; overflow: hidden;
  background: color-mix(in srgb, var(--linie) 85%, transparent); }
.sys-fill { display: block; height: 100%; border-radius: 999px; background: var(--signal);
  transition: width .5s ease, background .5s ease; }
.sys-fill.warn { background: #e0a83a; }
.sys-fill.krit { background: var(--warn); }
.sys-wert { font-size: 11px; color: var(--text); font-family: var(--schrift-mono);
  white-space: nowrap; font-variant-numeric: tabular-nums; }
.sys-hinweis { font-size: var(--s-12); color: var(--matt); font-style: italic; padding: 2px 0; }

#systeme-fuss { flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-top: 1px solid var(--linie); min-width: var(--sys-w);
  font-size: 11px; color: var(--matt); font-family: var(--schrift-mono); }
.sys-live { width: 7px; height: 7px; border-radius: 50%; background: var(--signal);
  box-shadow: 0 0 6px var(--signal); animation: sys-blink 1.8s ease-in-out infinite; flex: 0 0 auto; }
.sys-live.alt { background: #e0a83a; box-shadow: none; animation: none; }
@keyframes sys-blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

#systeme-griff { position: absolute; top: 50%; left: 0; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 13px 8px;
  cursor: pointer; color: var(--matt);
  background: color-mix(in srgb, var(--flaeche) 88%, transparent);
  backdrop-filter: blur(10px); border: 1px solid var(--linie); border-left: none;
  border-radius: 0 13px 13px 0; box-shadow: 4px 0 14px rgba(0,0,0,.25);
  transition: left .32s cubic-bezier(.22,.61,.36,1), color .16s ease, background .16s ease; }
#systeme-panel.auf #systeme-griff { left: var(--sys-w); }
#systeme-griff:hover { color: var(--text); background: color-mix(in srgb, var(--signal) 12%, var(--flaeche)); }
#systeme-griff-punkte { display: flex; flex-direction: column; gap: 6px; }
.sys-griff-chevron { font-size: 14px; line-height: 1; opacity: .8; transition: transform .32s ease; }
#systeme-panel.auf .sys-griff-chevron { transform: rotate(180deg); }

#chat { transition: margin-left .32s cubic-bezier(.22,.61,.36,1); }
@media (min-width: 861px) { body.systeme-auf #chat { margin-left: var(--sys-w); } }
@media (prefers-reduced-motion: reduce) {
  #systeme-schub, #systeme-griff, #chat, .sys-fill { transition: none; }
  .sys-dot.online, .sys-live { animation: none; }

  #dienste-immun-log summary::before { transition: none; }
}
#chat { position: relative; z-index: 1; background: transparent; }
#messages { background: transparent; }
/* Die Blasen bleiben lesbar-solide; das Gitter zeigt sich NUR im Freiraum. */

/* ── Nachrichten treten ein, statt zu erscheinen ── */
@keyframes msg-ein { from { opacity: 0; transform: translateY(9px) scale(.985); }
                     to   { opacity: 1; transform: none; } }
.msg { animation: msg-ein .32s cubic-bezier(.2,.7,.2,1) both; }
/* Zeros Blase traegt einen Hauch Signal-Glow an der Kante, der Mensch die kalte. */
.msg-zero .bubble { background: color-mix(in srgb, var(--flaeche) 82%, transparent);
                    backdrop-filter: blur(3px);
                    box-shadow: 0 1px 0 color-mix(in srgb, var(--signal) 8%, transparent) inset,
                                0 6px 22px rgba(0,0,0,.28); }
.msg-user .bubble { backdrop-filter: blur(3px);
                    box-shadow: 0 6px 22px rgba(0,0,0,.28); }
.avatar { transition: transform .18s ease, filter .3s ease; }

/* ── Composer: fokus-Glow, Sende-Knopf mit Schimmer ── */
#text { transition: border-color 180ms ease, box-shadow 220ms ease, background 180ms ease; }
#text:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--signal) 16%, transparent),
                          0 0 22px color-mix(in srgb, var(--signal) 12%, transparent); }
#send { position: relative; overflow: hidden;
        transition: filter 160ms ease, opacity 160ms ease, transform 120ms ease,
                    box-shadow 200ms ease; }
#send:hover:not(:disabled) { transform: translateY(-1px);
        box-shadow: 0 6px 20px color-mix(in srgb, var(--signal) 30%, transparent); }
#send:active:not(:disabled) { transform: translateY(0) scale(.97); }
#send::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%;
        left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent);
        transform: skewX(-18deg); transition: none; }
#send:hover:not(:disabled)::after { animation: send-schimmer .8s ease; }
@keyframes send-schimmer { from { left: -60%; } to { left: 130%; } }

/* ── Dezenter, signal-getoenter Scrollbalken ── */
#messages::-webkit-scrollbar { width: 10px; }
#messages::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--signal) 18%, var(--linie));
        border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
#messages::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--signal) 34%, var(--linie));
        background-clip: content-box; }

@media (prefers-reduced-motion: reduce) {
  .msg { animation: none; }
  #send:hover:not(:disabled)::after { animation: none; }
}

/* ── Warten: Zero denkt (Avatar lebt), drei Punkte pulsen, ein Countdown ── */
.warte { display: flex; align-items: center; gap: 9px; }
.warte-label { color: var(--matt); font-size: var(--s-13); }
.denk-punkte { display: inline-flex; gap: 5px; }
.denk-punkte i { width: 6px; height: 6px; border-radius: 50%; background: var(--signal);
                 display: inline-block; animation: denk 1.05s ease-in-out infinite; }
.denk-punkte i:nth-child(2) { animation-delay: .16s; }
.denk-punkte i:nth-child(3) { animation-delay: .32s; }
@keyframes denk { 0%,80%,100% { opacity: .3; transform: translateY(0); }
                  40% { opacity: 1; transform: translateY(-4px); } }
.warte-timer { font-family: var(--schrift-mono); font-size: var(--s-12); color: var(--matt);
               font-variant-numeric: tabular-nums; margin-left: 2px; }
/* ── Pac-Man: die Punkte werden gefressen, der Avatar chompt dazu ── */
.denk-punkte i.gefressen { animation: fressen .17s ease-in forwards; }
@keyframes fressen { to { transform: translateX(-24px) scale(.08); opacity: 0; } }
.avatar.chompt { animation: chomp .17s ease-in-out; }
@keyframes chomp { 0% { transform: scale(1); } 45% { transform: scale(1.18) rotate(-5deg); }
                   100% { transform: scale(1); } }

/* ── Der Terminal: die Konsole zu Zero, mit CRT-Anmutung ──────────────────
   Der raw-PTY-Weg (/terminal) ist ein Backend-Altpfad ("bleibt erreichbar, bis
   der neue Weg getragen hat" -- terminal_gateway.py); DIESER Verlauf hier ist
   der Weg, ueber den ein Mensch heute wirklich mit Zero spricht, also traegt
   ER die Konsolen-Anmutung. Bewusst zurueckhaltend: schale.css dokumentiert
   das Bewegungsgesetz des Hauses -- "genau EIN Effekt, der Glitch, hart und
   kurz" --, deshalb kein Dauerflackern, kein zweiter Dialekt. Was hier dazu-
   kommt, ist STATISCH (Scanlines, Phosphor-Glow) oder nutzt den vorhandenen
   Riss (EntityOS.riss(bubble) feuert schon bei jeder fertigen Antwort). Reine
   Deko auf einer voll bedienbaren Flaeche: nichts hier faengt Klicks/Taps ab,
   nichts kostet einen Animationsframe. */
#messages { position: relative; }
#messages::before {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(180deg,
      rgba(255,255,255,.028) 0 1px, transparent 1px 3px);
  mix-blend-mode: overlay; opacity: .5;
}
#messages > * { position: relative; z-index: 1; }
.msg-zero .bubble { text-shadow: 0 0 9px color-mix(in srgb, var(--signal) 22%, transparent); }
@media (prefers-reduced-motion: reduce) { #messages::before { opacity: .3; } }

@media (max-width: 640px) {
  #chat { --rand: 12px; }
  .unterzeile { flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
  .unterzeile .note { font-size: 11px; flex-basis: 100%; order: 3; }
  #switcher { margin-left: auto; }
  #messages { padding-top: 16px; }
  .msg, .msg-user { max-width: 92%; }
  #leer .z0feld { width: 58px; height: 58px; }
  .anmelde-marke { font-size: var(--s-24); }

  /* ⭐ Handy-Optimierung 2026-08-19 (Auftrag Eigner: "der Terminal muss voll
     funktionieren"). Drei Baustellen, additiv, Desktop unberuehrt:
     1) Eingabe-Schriftgroesse: 15px lockt bei iOS-Safari automatisches
        Hineinzoomen aus, sobald das Feld fokussiert wird -- danach steht die
        Seite verschoben und die Sendeleiste ist teils verdeckt. 16px ist die
        harte Untergrenze, bei der iOS das Auto-Zoom laesst.
     2) Tastziele: 24px-Knoepfe (Dienst-Start/Stop/Neustart, Segment-Umschalter,
        Sitzungs-Wechsel, Einklapp-Kreuz) unterschreiten die 44px-Untergrenze
        (Apple HIG / WCAG 2.5.5) deutlich -- auf dem Desktop trifft eine Maus
        das genau, ein Daumen nicht.
     3) Die Systeme/Dienste-Bubble wird zum Vollbild-Overlay (--sys-w:100vw)
        statt einer schmalen Spalte, die auf 360-390px kaum noch Chat sichtbar
        liesse -- mit dem Schirm (#systeme-scrim) von oben als klarer
        Schliess-Reflex und einem groesseren Kreuz. */
  #text { font-size: 16px; }
  :root { --sys-w: 100vw; --sys-w-dienste: 100vw; }
  body.systeme-auf #systeme-scrim { opacity: 1; pointer-events: auto; }
  #systeme-schub { border-right: none; }
  #systeme-griff { padding: 16px 11px; }
  #systeme-zu { min-width: 44px; min-height: 44px; font-size: 26px;
    display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .sys-seg { padding: 11px 10px; min-height: 44px; }
  .slot-btn { padding: 9px 14px; min-height: 40px; display: inline-flex; align-items: center; }
  .dienst-knopf-immun { padding: 10px 16px; min-height: 44px; }
  .td-hauptzeile { padding: 11px 4px; min-height: 44px; }
  .td-knoepfe { gap: 6px; }
  .dienst-knopf { width: 38px; height: 38px; font-size: 15px; }
  .sys-dienst-zeile { padding: 11px 4px; min-height: 44px; }
  #dienste-immun-log summary { padding: 11px 4px; min-height: 44px; }
  #dienste-immun-kopf { min-height: 44px; }

  /* ⭐ Hilfstasten fuer die Handy-Tastatur (Auftrag Eigner: "der Terminal muss
     voll funktionieren" -- Esc/Tab/Pfeile, die eine Bildschirmtastatur nicht
     hat). Die Konsole hier ist zeilenweise/nachrichtenweise, kein rohes PTY
     (das ist /terminal, ein Backend-Altpfad -- siehe die Erklaerung oben bei
     #messages) -- deshalb keine Strg-C-Attrappe, die nichts abbricht, sondern
     drei Tasten mit echter Wirkung: Esc leert den Entwurf (wie in jeder
     Shell), Tab fuegt einen Tabulator ein (fehlt auf jeder Mobiltastatur,
     wird aber beim Einfuegen von Code gebraucht), Pfeil-hoch holt die zuletzt
     GESENDETE Nachricht zurueck -- dieselbe Geste wie Verlaufs-Aufruf in
     einer Konsole. Nur auf dem Handy sichtbar: am Desktop hat die Tastatur
     alle drei Tasten schon echt. */
  #term-hilfstasten { display: flex; gap: 6px; padding: 0 var(--rand) 8px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #term-hilfstasten button { flex: 0 0 auto; min-width: 44px; min-height: 38px;
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--linie);
    background: var(--flaeche-hoch); color: var(--matt);
    font-family: var(--schrift-mono); font-size: 13px; cursor: pointer;
    transition: color .16s ease, border-color .16s ease; }
  #term-hilfstasten button:active { color: var(--text); border-color: var(--signal); }
}
@media (min-width: 641px) { #term-hilfstasten { display: none; } }
@media (prefers-reduced-motion: reduce){ * { scroll-behavior: auto !important; } }

  <div id="messages">
    <div id="leer">
      <div class="z0feld" id="leerAvatar"></div>
      <div class="name">Zero</div>
      <p id="leerText">Verlauf wird geladen …</p>
    </div>
  </div>
  <div id="term-hilfstasten" role="toolbar" aria-label="Zusatztasten fuer die Handy-Tastatur" aria-controls="text">
    <button type="button" data-taste="esc" title="Eingabe leeren">Esc</button>
    <button type="button" data-taste="tab" title="Tabulator einfuegen">Tab</button>
    <button type="button" data-taste="hoch" title="Letzte gesendete Nachricht zurueckholen">&uarr; Verlauf</button>
  </div>
  <div id="composer">
    <textarea id="text" rows="1" placeholder="Nachricht an Zero…"></textarea>
    <button id="send">Senden</button>
  </div>
</div>
<script>
window.addEventListener('load', async () => {
  await Clerk.load({ui:{ClerkUI:window.__internal_ClerkUICtor}});
  const auth=document.getElementById('auth'); const chat=document.getElementById('chat');
  const authError=document.getElementById('authError');
  const anmeldeGrund=document.getElementById('anmelde-grund');
  let grundFeld=null;
  if (window.EntityOSAnmeldung && anmeldeGrund) {
    grundFeld=EntityOSAnmeldung.grund(anmeldeGrund);
  }
  if (!Clerk.isSignedIn) {
    // Aussehen aus denselben Marken-Merkmalen wie der Rest -- kein zweites
    // Farbsystem nur fuer das Anmeldeformular.
    const aussehen=(window.EntityOSAnmeldung && EntityOSAnmeldung.clerkAussehen)
      ? {appearance: EntityOSAnmeldung.clerkAussehen()} : undefined;
    try { Clerk.mountSignIn(auth, aussehen); }
    catch(e){ Clerk.mountSignIn(auth); }   // lieber schlicht als gar nicht
    return;
  }

  // ⭐ Bombenfest: nur die zwei kanonischen Konten duerfen die Oberflaeche
  // sehen. Ein fremdes -- aber via Clerk angemeldetes -- Konto bekommt NICHTS,
  // nicht mal die leere Schale. /api/me gibt 200 nur fuer gabriel/andreas.
  function zeigeKeinZugang(){
    const a=document.getElementById('anmeldung'); if(a) a.style.display='none';
    const c=document.getElementById('chat'); if(c) c.style.display='none';
    let box=document.getElementById('keinzugang');
    if(!box){
      box=document.createElement('div'); box.id='keinzugang';
      box.innerHTML='<div class="kz-marke">entityOS</div>'+
        '<p class="kz-text">Dieses Konto hat keinen Zugang zu EntityOS.</p>'+
        '<button id="kz-ab" class="kz-btn">Abmelden</button>';
      document.body.appendChild(box);
      document.getElementById('kz-ab').addEventListener('click', async()=>{
        try{ await Clerk.signOut(); }catch(e){}
        location.reload();
      });
    }
    box.style.display='flex';
  }
  try {
    const _t = await Clerk.session.getToken();
    const _r = await fetch('/api/me', {headers:{Authorization:'Bearer '+_t}});
    if (!_r.ok) { zeigeKeinZugang(); return; }
  } catch(_e) { zeigeKeinZugang(); return; }   // im Zweifel: nicht durchlassen

  // Angemeldet: das Feld hat seinen Zweck erfuellt und hoert auf zu rechnen.
  // Ein Hintergrund, der hinter dem Chat weiterlaeuft, waere reine Heizung.
  if (grundFeld) grundFeld.halt();
  if (anmeldeGrund) anmeldeGrund.remove();
  document.body.classList.remove('vor-anmeldung');   // jetzt darf die Schale erscheinen
  document.getElementById('anmeldung').style.display='none'; chat.style.display='flex';

  // Die Schale misst den Zustand fuer beide Seiten und braucht dafuer ein Token.
  // Erst hier ist sicher, dass jemand angemeldet ist.
  if (window.EntityOS) EntityOS.anmeldungBereit(() => Clerk.session.getToken());
  // Die Systeme-Bubble braucht dasselbe Token -- erst jetzt ist jemand angemeldet.
  if (window.SYSTEME) SYSTEME.start(() => Clerk.session.getToken());

  if (window.ZeroAvatar) {
    ZeroAvatar.erzeugen(document.getElementById('headerAvatar'), {aktiv:false});
    // Der Avatar im leeren Zustand glitcht: er ist das Einzige, was hier steht,
    // also darf er der aktive sein.
    ZeroAvatar.erzeugen(document.getElementById('leerAvatar'), {aktiv:true});
  }

  const messages=document.getElementById('messages');
  const textEl=document.getElementById('text');
  const sendBtn=document.getElementById('send');
  const switcherEl=document.getElementById('switcher');
  const maxChatChars=8000;
  let currentPlatz=null; let lastPlaetze=[]; let switching=false; let switchingTo=null; let composerEnabled=false;
  // Every glitching/tracking Zero avatar ever created in this session, oldest
  // first. ZeroAvatar.nurNeuesteAktiv() keeps only the last one glitching --
  // per zero-avatar.js's own rule, so a long history stays calm.
  const zeroAvatars=[];

  function scrollDown(){ messages.scrollTop=messages.scrollHeight; }

  function makeZeroAvatarEl(){
    const el=document.createElement('div'); el.className='avatar';
    if (window.ZeroAvatar) {
      const av=ZeroAvatar.erzeugen(el, {aktiv:false});
      zeroAvatars.push(av);
      ZeroAvatar.nurNeuesteAktiv(zeroAvatars);
      return {el, av};
    }
    return {el, av:null};
  }

  function addUserMessage(text){
    const row=document.createElement('div'); row.className='msg msg-user';
    row.innerHTML='<img class="avatar" src="/web/avatare/user.svg" alt="">'+
      '<div class="bubble"></div>';
    row.querySelector('.bubble').textContent=text;
    messages.appendChild(row); scrollDown();
  }

  // Autonome Dauer-Schaetzung OHNE KI: nur aus der Nachricht. Gemessene Erfahrung
  // -- Gruss ~7s, Frage/Aufgabe ~10-13s. Grobe Heuristik, nur fuer den Countdown.
  function schaetzeDauer(text){
    const t=(text||'').toLowerCase();
    let s=7;
    if (t.length>40) s+=2;
    if (t.length>140) s+=2;
    if (/[?]/.test(t)) s+=2;
    if (/(pr[uü]f|[aä]nder|such|ver[oö]ffentlich|erreichbar|platte|speicher|wie|was|ist |wer |warum|zeig|lies|find)/.test(t)) s+=3;
    return Math.min(16, Math.max(6, s));
  }

  function addPending(fuerText){
    const row=document.createElement('div'); row.className='msg msg-zero msg-pending';
    const {el,av}=makeZeroAvatarEl();
    row.__zeroAv=av;
    row.appendChild(el);
    // Der Avatar denkt: generative Pupillen-Gesten + Stimmung + mitmorphender Glow.
    if (av && av.starteDenken) av.starteDenken({wert:0, grund:'denkt nach', quelle:'ui'});
    if (window.EMERGENZ) EMERGENZ.denken(true);   // Knoten im Gitter fangen an zu gluehen
    const bubble=document.createElement('div'); bubble.className='bubble';
    const warte=document.createElement('div'); warte.className='warte';
    const label=document.createElement('span'); label.className='warte-label'; label.textContent='Zero denkt';
    const punkte=document.createElement('span'); punkte.className='denk-punkte';
    punkte.innerHTML='<i></i><i></i><i></i>';
    const timer=document.createElement('span'); timer.className='warte-timer';
    warte.appendChild(label); warte.appendChild(punkte); warte.appendChild(timer);
    bubble.appendChild(warte);
    row.appendChild(bubble);
    messages.appendChild(row); scrollDown();
    // Countdown aus der Schaetzung -- laeuft er ab, ehrlich "gleich…" statt Luege.
    const dauer=schaetzeDauer(fuerText); const start=Date.now();
    const tick=()=>{
      const rest=dauer-(Date.now()-start)/1000;
      timer.textContent = rest>0.4 ? '≈ '+Math.ceil(rest)+' s' : 'gleich…';
    };
    tick(); row.__timer=setInterval(tick, 200);
    return row;
  }

  // Ein Bild-Anhang oeffnet gross in einer Lightbox -- eine pro Klick, die
  // vorherige (falls noch offen) verschwindet zuerst. Schliessen per Klick
  // irgendwo, per X, oder per Escape.
  let offeneLightbox=null;
  function zeigeLightbox(url, alt){
    if (offeneLightbox) { offeneLightbox.remove(); offeneLightbox=null; }
    const box=document.createElement('div'); box.className='lightbox';
    const img=document.createElement('img'); img.src=url; img.alt=alt||'';
    const zu=document.createElement('button');
    zu.className='lightbox-schliessen'; zu.type='button'; zu.textContent='×';
    zu.setAttribute('aria-label','Bild schliessen');
    const schliessen=()=>{ box.remove(); if(offeneLightbox===box) offeneLightbox=null;
      document.removeEventListener('keydown', aufEscape); };
    const aufEscape=(ev)=>{ if(ev.key==='Escape') schliessen(); };
    box.addEventListener('click', schliessen);
    img.addEventListener('click', (ev)=>ev.stopPropagation());
    zu.addEventListener('click', schliessen);
    document.addEventListener('keydown', aufEscape);
    box.appendChild(img); box.appendChild(zu);
    document.body.appendChild(box);
    offeneLightbox=box;
  }

  // Herausgeloest, damit geladener Verlauf und Live-Antwort GENAU dieselbe
  // Blase bauen. Zwei Darstellungswege fuer dieselbe Sache laufen unweigerlich
  // auseinander, und dann sieht Geschichte anders aus als Gegenwart.
  function fuelleZeroBlase(bubble, payload){
    bubble.textContent='';
    const german=payload.text||'';
    const germanLine=document.createElement('div');
    germanLine.textContent=german;
    bubble.appendChild(germanLine);

    // Bild-Anhang (z.B. ein Seiten-Screenshot): Miniatur in der Blase, tippen
    // oeffnet gross. payload.image = {url, alt}. Kein eigener Nachrichtentyp --
    // die Blase traegt einfach zusaetzlich ein Bild.
    if (payload.image && payload.image.url) {
      const mini=document.createElement('img');
      mini.className='bild-mini'; mini.loading='lazy';
      mini.src=payload.image.url; mini.alt=payload.image.alt||'Bild';
      mini.addEventListener('click', ()=>zeigeLightbox(payload.image.url, payload.image.alt));
      bubble.appendChild(mini);
      if (payload.image.label) {
        const label=document.createElement('span'); label.className='bild-mini-label';
        label.textContent=payload.image.label;
        bubble.appendChild(label);
      }
    }

    // Unter "Original" gehoert Zeros ROHE Caveman-Stimme -- das, was das Modell
    // wirklich gesagt hat, BEVOR die Vorstufe schoenes Deutsch daraus baut.
    // Frueher wurde payload.caveman immer gezeigt; bei kurzen Gruessen ist die
    // Caveman-Fassung aber zufaellig wortgleich mit dem Deutschen (und ein
    // reiner CLI-Zug hat gar keine), also klappte der Leser das Original auf und
    // las denselben deutschen Satz ein zweites Mal. Deshalb: nur eine WIRKLICH
    // abweichende Rohfassung zeigen; sonst ein ehrlicher Vermerk statt einer
    // stummen Dopplung.
    const caveman=(payload.caveman||'').trim();
    const hatEchteCaveman = caveman && caveman!==german.trim();
    const receipt=payload.translator_receipt;
    // Ohne echte Caveman-Fassung UND ohne Beleg gibt es nichts aufzuklappen.
    if (!hatEchteCaveman && !receipt) return;

    const toggle=document.createElement('button');
    toggle.className='toggle-original'; toggle.type='button';
    toggle.textContent='Original anzeigen';
    const original=document.createElement('div');
    original.className='original'; original.hidden=true;

    const rohzeile=document.createElement('div');
    rohzeile.className='caveman';
    if (hatEchteCaveman) {
      rohzeile.textContent=payload.caveman;
    } else {
      // Nie das Deutsche wiederholen: ein klarer Hinweis, dass es fuer diesen
      // Zug keine eigene Caveman-Fassung gibt (gleich wie oben oder ein CLI-Zug).
      rohzeile.textContent='keine caveman-Fassung';
      rohzeile.classList.add('leer');
    }
    original.appendChild(rohzeile);

    if (receipt) {
      const receiptEl=document.createElement('div');
      receiptEl.className='receipt';
      receiptEl.textContent='Übersetzungs-ID: '+receipt;
      original.appendChild(receiptEl);
    }
    toggle.addEventListener('click', ()=>{
      original.hidden=!original.hidden;
      toggle.textContent=original.hidden?'Original anzeigen':'Original verbergen';
    });
    bubble.appendChild(toggle); bubble.appendChild(original);
  }

  // Pac-Man: bevor die Antwort erscheint, frisst Zero die drei Denk-Punkte, einen
  // nach dem anderen, und chompt mit dem Avatar dazu -- eine kurze, lustige Geste.
  function fressenDann(row, danach){
    const punkte=[].slice.call(row.querySelectorAll('.denk-punkte i'));
    const timerEl=row.querySelector('.warte-timer'); if(timerEl) timerEl.remove();
    const labelEl=row.querySelector('.warte-label'); if(labelEl) labelEl.remove();
    const avatarEl=row.querySelector('.avatar');
    if(row.__zeroAv && row.__zeroAv.stoppeDenken) row.__zeroAv.stoppeDenken();
    if(!punkte.length){ danach(); return; }
    let i=0;
    (function chomp(){
      if(i>=punkte.length){ setTimeout(danach, 90); return; }
      const d=punkte[i++];
      d.classList.add('gefressen');
      if(avatarEl){ avatarEl.classList.remove('chompt'); void avatarEl.offsetWidth; avatarEl.classList.add('chompt'); }
      setTimeout(chomp, 165);
    })();
  }

  function replaceWithReply(pendingRow, payload){
    if (window.EMERGENZ) EMERGENZ.denken(false);
    if (pendingRow.__timer){ clearInterval(pendingRow.__timer); pendingRow.__timer=null; }
    const bubble=pendingRow.querySelector('.bubble');
    fressenDann(pendingRow, ()=>{
      pendingRow.className='msg msg-zero';
      if (pendingRow.__zeroAv) {
        pendingRow.__zeroAv.setzeZustand({wert:1, grund:'Antwort vollständig erhalten und übersetzt', quelle:'pipeline'});
      }
      fuelleZeroBlase(bubble, payload);
      if (window.EntityOS) EntityOS.riss(bubble);
      scrollDown();
    });
  }

  function replaceWithError(pendingRow, message){
    if (window.EMERGENZ) EMERGENZ.denken(false);
    if (pendingRow.__timer){ clearInterval(pendingRow.__timer); pendingRow.__timer=null; }
    if (pendingRow.__zeroAv && pendingRow.__zeroAv.stoppeDenken) pendingRow.__zeroAv.stoppeDenken();
    pendingRow.className='msg msg-zero msg-error';
    pendingRow.querySelector('.bubble').textContent='Fehler: '+message;
    if (pendingRow.__zeroAv) {
      pendingRow.__zeroAv.setzeZustand({wert:-1, grund:message, quelle:'pipeline'});
    }
    scrollDown();
  }

  function addStandaloneError(message){
    const row=document.createElement('div'); row.className='msg msg-zero msg-error';
    const {el}=makeZeroAvatarEl();
    row.appendChild(el);
    const bubble=document.createElement('div'); bubble.className='bubble';
    bubble.textContent='Fehler: '+message;
    row.appendChild(bubble);
    messages.appendChild(row); scrollDown();
  }

  // ── Dauerhafter Verlauf ────────────────────────────────────────────
  const leerEl=document.getElementById('leer');
  const leerText=document.getElementById('leerText');
  let aeltesterOrdinal=null; let aelterKnopf=null; let grenzeGesetzt=false;

  function addZeroMessage(payload){
    const row=document.createElement('div'); row.className='msg msg-zero';
    const {el,av}=makeZeroAvatarEl();
    row.__zeroAv=av; row.appendChild(el);
    const bubble=document.createElement('div'); bubble.className='bubble';
    fuelleZeroBlase(bubble, payload);
    row.appendChild(bubble);
    return row;
  }

  function zeigeLadefehler(text){
    // Sichtbar, nicht verschluckt: ein stiller Fehlschlag sieht aus wie eine
    // leere Sitzung -- und damit waere der Fehler zurueck, eine Ebene tiefer.
    const d=document.createElement('div'); d.className='ladefehler';
    d.textContent='Verlauf konnte nicht geladen werden: '+text;
    messages.insertBefore(d, messages.firstChild);
  }

  function setzeGrenze(){
    if(grenzeGesetzt) return;
    grenzeGesetzt=true;
    const d=document.createElement('div'); d.className='verlaufsgrenze';
    d.textContent='ab hier dieser Besuch';
    messages.appendChild(d);
  }

  async function ladeVerlauf(sessionId, {aelter=false}={}){
    let token;
    try { token=await Clerk.session.getToken(); }
    catch(e){ zeigeLadefehler('Anmeldung abgelaufen'); return; }
    // Der Server liest `session_id`, nicht `session`. Mit dem falschen Namen
    // kommt "" an, die Sitzungspruefung schlaegt fehl und die Antwort ist 403 --
    // die Sperre tut dann genau das Richtige aus dem falschen Grund.
    const p=new URLSearchParams({session_id:sessionId, limit:'50'});
    if(aelter && aeltesterOrdinal!=null) p.set('before', String(aeltesterOrdinal));
    let d;
    try {
      const r=await fetch('/api/history?'+p.toString(), {headers:{Authorization:'Bearer '+token}});
      if(!r.ok){ zeigeLadefehler('Server antwortete '+r.status); return; }
      d=await r.json();
    } catch(e){ zeigeLadefehler(String(e && e.message || e)); return; }

    const zuege=Array.isArray(d.turns)?d.turns:[];
    if(zuege.length){
      aeltesterOrdinal=zuege[0].ordinal;
      // Aelteres kommt VOR alles Bestehende, Neues ans Ende -- sonst steht der
      // nachgeladene Block hinter der Gegenwart.
      const anker=aelter?messages.firstChild:null;
      const reihe=aelter?zuege.slice().reverse():zuege;
      reihe.forEach((t)=>{
        const row=(t.role==='user')
          ? (()=>{ const r2=document.createElement('div'); r2.className='msg msg-user';
                   r2.innerHTML='<img class="avatar" src="/web/avatare/user.svg" alt="">'+
                     '<div class="bubble"></div>';
                   r2.querySelector('.bubble').textContent=t.text||''; return r2; })()
          : addZeroMessage(t);
        if(aelter) messages.insertBefore(row, anker); else messages.appendChild(row);
      });
    }

    if(!aelter){
      if(zuege.length){
        // Leer ist ein ZUSTAND: nur ausblenden, wenn wirklich etwas da ist.
        if(leerEl) leerEl.style.display='none';
        setzeGrenze();
      } else if(leerText){
        leerText.textContent='Noch keine Nachrichten in dieser Sitzung.';
      }
    }

    if(aelterKnopf){ aelterKnopf.remove(); aelterKnopf=null; }
    if(d.has_more){
      aelterKnopf=document.createElement('button');
      aelterKnopf.type='button'; aelterKnopf.className='aelter';
      aelterKnopf.textContent='Ältere Nachrichten laden';
      aelterKnopf.addEventListener('click', ()=>{
        aelterKnopf.disabled=true; aelterKnopf.textContent='lädt …';
        ladeVerlauf(sessionId, {aelter:true});
      });
      messages.insertBefore(aelterKnopf, messages.firstChild);
    }
    if(!aelter) scrollDown();
  }

  function verlaufZuruecksetzen(){
    // Beim Sitzungswechsel muss das Fenster leer sein, sonst mischen sich die
    // Verlaeufe zweier Sitzungen zu einem Gespraech, das nie stattgefunden hat.
    Array.from(messages.children).forEach((k)=>{ if(k!==leerEl) k.remove(); });
    if(leerEl) leerEl.style.display='';
    if(leerText) leerText.textContent='Verlauf wird geladen …';
    aeltesterOrdinal=null; aelterKnopf=null; grenzeGesetzt=false;
    zeroAvatars.length=0;
  }

  const proto=location.protocol==='https:'?'wss':'ws';
  let ws=null; let gewollteTrennung=false; let reconnDelay=600; let reconnVersuche=0;
  const WS_URL=`${proto}://${location.host}/ws/chat`;
  // ⭐ Auto-Reconnect: bricht der Socket ab (z.B. weil das kurzlebige Clerk-Token
  // waehrend eines langen Zero-Zugs ablief), still neu verbinden statt einfrieren.
  function verbinde(){ ws=new WebSocket(WS_URL); ws.onopen=aufOpen; ws.onmessage=aufMessage; ws.onclose=aufClose; }
  verbinde();
  let chatReady=false; let authRefreshTimer=null; let pendingRow=null;

  const scheduleAuthRefresh=(expiresAt)=>{
    if(authRefreshTimer) clearTimeout(authRefreshTimer);
    const delay=Math.max(1000,Number(expiresAt)*1000-Date.now()-10000);
    authRefreshTimer=setTimeout(async()=>{
      try{
        const token=await Clerk.session.getToken({skipCache:true});
        if(chatReady&&ws.readyState===1) ws.send(JSON.stringify({type:'reauth',token}));
      }catch{ws.close();}
    },delay);
  };

  function setComposerEnabled(enabled){
    composerEnabled=enabled;
    sendBtn.disabled=!enabled; textEl.disabled=!enabled;
    renderSwitcher(lastPlaetze);
  }

  // Slot list comes from the server (IdentityRouter.plaetze()) -- never
  // hardcode session ids/labels here, the owner may add a third slot later.
  function renderSwitcher(plaetze){
    lastPlaetze=plaetze||[];
    switcherEl.innerHTML='';
    lastPlaetze.forEach((p)=>{
      const btn=document.createElement('button');
      btn.type='button'; btn.className='slot-btn'+(p.platz===currentPlatz?' active':'')+(p.platz===switchingTo?' laedt':'');
      btn.textContent='Sitzung '+p.platz;
      btn.title=p.terminal||('session '+p.platz);
      btn.disabled=(p.platz===currentPlatz)||switching||!chatReady||!composerEnabled;
      btn.addEventListener('click', ()=>{
        if(switching||!chatReady||p.platz===currentPlatz||ws.readyState!==1) return;
        switching=true; switchingTo=p.platz; setComposerEnabled(false); renderSwitcher(lastPlaetze);
        ws.send(JSON.stringify({type:'switch_platz', platz:p.platz}));
      });
      switcherEl.appendChild(btn);
    });
  }

  async function aufOpen(){
    try{ const token=await Clerk.session.getToken({skipCache:true}); ws.send(JSON.stringify({type:'auth',token})); }
    catch(e){ try{ ws.close(); }catch(_){} }
  }
  function aufMessage(ev){
    let m; try{ m=JSON.parse(ev.data); }catch{ return; }
    if(m.type==='ready'){
      chatReady=true; switching=false; switchingTo=null; reconnVersuche=0; reconnDelay=600; pendingRow=null;
      if(typeof m.platz==='number') currentPlatz=m.platz;
      if(Array.isArray(m.plaetze)) lastPlaetze=m.plaetze;
      scheduleAuthRefresh(m.auth_expires_at);
      setComposerEnabled(true); textEl.focus();
      // `ready` feuert beim Verbinden UND beim Sitzungswechsel -- deshalb hier
      // und nicht beim Seitenstart. Die session_id kommt vom Server mit; im
      // Frontend darf sie nie zusammengebaut werden.
      if(m.session_id){ verlaufZuruecksetzen(); ladeVerlauf(m.session_id); }
      return;
    }
    if(m.type==='reauthenticated'){ scheduleAuthRefresh(m.auth_expires_at); return; }
    if(m.type==='pending'){ setComposerEnabled(false); pendingRow=addPending(letzteFrage); return; }
    if(m.type==='reply'){
      setComposerEnabled(true);
      if(pendingRow){ replaceWithReply(pendingRow, m); pendingRow=null; }
      return;
    }
    if(m.type==='error'){
      // Vergaengliche Lease-/Fluss-Fehler NICHT als Schreck-Blase: bei 'expired'
      // ist der Zug schon fertig+ausgeliefert, der Auto-Reconnect holt den Rest.
      const verg=/expired|lease|in flight/i.test(m.message||'');
      if(!chatReady){ if(!verg){ authError.textContent='entityOS: '+m.message; authError.style.display='block'; } return; }
      if(verg){ return; }
      setComposerEnabled(true);
      if(pendingRow){ replaceWithError(pendingRow, m.message); pendingRow=null; }
      else { addStandaloneError(m.message); }
      return;
    }
  };
  function aufClose(){
    chatReady=false; setComposerEnabled(false);
    if(authRefreshTimer) clearTimeout(authRefreshTimer);
    if(gewollteTrennung) return;
    reconnVersuche++;
    if(reconnVersuche>8){ addStandaloneError('Verbindung verloren – bitte Seite neu laden.'); return; }
    setTimeout(verbinde, reconnDelay);
    reconnDelay=Math.min(8000, Math.round(reconnDelay*1.7));
  }

  let letzteFrage='';
  function send(){
    const value=textEl.value.trim();
    if(!value || !chatReady || ws.readyState!==1) return;
    if(value.length>maxChatChars){ addStandaloneError('Nachricht zu lang ('+value.length+' > '+maxChatChars+' Zeichen).'); return; }
    letzteFrage=value;
    addUserMessage(value);
    ws.send(JSON.stringify({type:'message', text:value}));
    textEl.value=''; textEl.style.height='auto';
  }
  sendBtn.addEventListener('click', send);
  textEl.addEventListener('keydown', (ev)=>{
    if(ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); send(); }
  });
  textEl.addEventListener('input', ()=>{
    textEl.style.height='auto'; textEl.style.height=Math.min(140, textEl.scrollHeight)+'px';
  });

  // ── Hilfstasten fuer die Handy-Tastatur (nur < 641px sichtbar, CSS oben) ─
  // Esc/Tab/Pfeil-hoch fehlen jeder Bildschirmtastatur -- hier bekommen sie
  // eine echte, kleine Wirkung statt nur dekorativ auf einer Taste zu stehen.
  const hilfstasten=document.getElementById('term-hilfstasten');
  if (hilfstasten) {
    hilfstasten.addEventListener('click', (ev)=>{
      const btn=ev.target.closest('button[data-taste]'); if(!btn) return;
      const taste=btn.getAttribute('data-taste');
      if (taste==='esc') {
        textEl.value=''; textEl.style.height='auto';
      } else if (taste==='tab') {
        const start=textEl.selectionStart||0, end=textEl.selectionEnd||0;
        textEl.value=textEl.value.slice(0,start)+'\t'+textEl.value.slice(end);
        textEl.selectionStart=textEl.selectionEnd=start+1;
        textEl.style.height='auto'; textEl.style.height=Math.min(140, textEl.scrollHeight)+'px';
      } else if (taste==='hoch') {
        if (letzteFrage) {
          textEl.value=letzteFrage;
          textEl.style.height='auto'; textEl.style.height=Math.min(140, textEl.scrollHeight)+'px';
          textEl.selectionStart=textEl.selectionEnd=textEl.value.length;
        }
      }
      textEl.focus();
    });
  }

  setComposerEnabled(false);
});
</script></body></html>
