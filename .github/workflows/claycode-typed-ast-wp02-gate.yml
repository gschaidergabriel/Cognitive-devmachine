name: ClayCode typed AST WP-02 gate
on:
  pull_request:
    paths:
      - 'tools/claycode_typed_ast.py'
      - 'tests/test_claycode_typed_ast.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V5.lark'
      - 'research_entity/claycode/g9/*.clay'
      - '.github/workflows/claycode-typed-ast-wp02-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-ast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet 'lark==1.3.1' 'interegular==0.3.3' 'pytest==8.4.2'
      - name: Unit and fail-closed tests
        run: pytest -q tests/test_claycode_typed_ast.py
      - name: Full G9 typed-AST roundtrip and mutation gate
        run: |
          python tools/claycode_typed_ast.py \
            --grammar research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V5.lark \
            --source research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay \
            --source research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay \
            --output research_entity/claycode/base/BASE_TYPED_AST_RECEIPT_V1_20260809.json
      - name: Fail closed on receipt scope
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/base/BASE_TYPED_AST_RECEIPT_V1_20260809.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['pass'] is True
          assert d['ast_schema']=='claycode.typed-syntax-ast.v1'
          assert len(d['sources'])==2
          assert all(x['deterministic_repeat'] for x in d['sources'])
          assert all(x['roundtrip']['pass'] for x in d['sources'])
          assert all(x['pass'] for x in d['semantic_discrimination'])
          assert all(x['pass'] for x in d['semantic_equivalence'])
          print('CLAYCODE_TYPED_AST_WP02_DELTA=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: claycode-typed-ast-receipt
          path: research_entity/claycode/base/BASE_TYPED_AST_RECEIPT_V1_20260809.json
          if-no-files-found: error
