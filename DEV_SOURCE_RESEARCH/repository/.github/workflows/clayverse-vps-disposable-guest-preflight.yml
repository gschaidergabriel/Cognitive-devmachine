name: ClayVerse VPS disposable guest preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clayverse-vps-disposable-guest-preflight.yml'

permissions:
  contents: read

concurrency:
  group: clayverse-vps-disposable-guest-preflight
  cancel-in-progress: false

jobs:
  orchestrator-preflight:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Probe guest-orchestration capability only
        shell: bash
        run: |
          set -euo pipefail
          out="/tmp/clayverse-vps-guest-preflight-${GITHUB_RUN_ID}.json"
          python3 - "$out" <<'PY'
          import json, os, pathlib, platform, shutil, subprocess, sys

          out = pathlib.Path(sys.argv[1])
          def cmd(argv):
              try:
                  return subprocess.check_output(argv, text=True, stderr=subprocess.STDOUT, timeout=10).strip()
              except Exception as exc:
                  return 'UNAVAILABLE:' + type(exc).__name__ + ':' + str(exc)
          def exists(name):
              return shutil.which(name)

          kvm = pathlib.Path('/dev/kvm')
          accel_help = cmd(['qemu-system-x86_64','-accel','help']) if exists('qemu-system-x86_64') else 'UNAVAILABLE:qemu-system-x86_64'
          sandbox_help = cmd(['qemu-system-x86_64','-sandbox','help']) if exists('qemu-system-x86_64') else 'UNAVAILABLE:qemu-system-x86_64'
          mem = {}
          try:
              for line in pathlib.Path('/proc/meminfo').read_text().splitlines():
                  if ':' in line:
                      k,v=line.split(':',1)
                      if k in {'MemTotal','MemAvailable','SwapTotal'}: mem[k]=v.strip()
          except Exception as exc:
              mem={'error':str(exc)}
          payload={
              'schema':'ClayVerseVpsDisposableGuestPreflight/v1',
              'github_sha':os.environ.get('GITHUB_SHA',''),
              'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
              'runner_name':os.environ.get('RUNNER_NAME','unknown'),
              'runner_os':os.environ.get('RUNNER_OS','unknown'),
              'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
              'host_kernel':platform.release(),
              'host_platform':platform.platform(),
              'cpu_count':os.cpu_count(),
              'memory':mem,
              'kvm_device_present':kvm.exists(),
              'kvm_readable':os.access(kvm,os.R_OK) if kvm.exists() else False,
              'kvm_writable':os.access(kvm,os.W_OK) if kvm.exists() else False,
              'qemu_system_x86_64':exists('qemu-system-x86_64'),
              'qemu_img':exists('qemu-img'),
              'qemu_version':cmd(['qemu-system-x86_64','--version']) if exists('qemu-system-x86_64') else 'UNAVAILABLE',
              'qemu_accel_help':accel_help,
              'qemu_sandbox_help':sandbox_help,
              'firecracker':exists('firecracker'),
              'jailer':exists('jailer'),
              'cloud_localds':exists('cloud-localds'),
              'genisoimage':exists('genisoimage'),
              'orchestration_only':True,
              'product_code_executed_on_host':False,
              'host_docker_used':False,
              'guest_started':False,
              'runtime_credit':0,
              'whole_product_credit':0,
              'unusual_experiment_count_added':0,
          }
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'kvm_present':payload['kvm_device_present'],
              'kvm_rw':payload['kvm_readable'] and payload['kvm_writable'],
              'qemu':bool(payload['qemu_system_x86_64']),
              'firecracker':bool(payload['firecracker']),
              'jailer':bool(payload['jailer']),
              'guest_started':False,
              'runtime_credit':0,
          },sort_keys=True))
          PY

      - name: Upload bounded preflight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clayverse-vps-guest-preflight-${{ github.run_id }}
          path: /tmp/clayverse-vps-guest-preflight-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 7
