name: ClayCode BASE Frontend CI

on:
  push:
    paths:
      - 'research_entity/claycode/base/ANDREAS_UBUNTU_TARGET_RECEIPT_CONTRACT.json'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_*.lark'
      - 'research_entity/claycode/base/CI_STRICT_V9_TRIGGER.txt'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_frontend_validation.py'
      - 'tools/claycode_base_canonicalizer.py'
      - 'tools/claycode_base_canonicalizer_validation.py'
      - 'tools/claycode_base_ir.py'
      - 'tools/claycode_v17_declarative_trivia_discriminator.py'
      - '.github/workflows/claycode-base-frontend-ci.yml'
  pull_request:
    paths:
      - 'research_entity/claycode/base/ANDREAS_UBUNTU_TARGET_RECEIPT_CONTRACT.json'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_*.lark'
      - 'research_entity/claycode/base/CI_STRICT_V9_TRIGGER.txt'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_frontend_validation.py'
      - 'tools/claycode_base_canonicalizer.py'
      - 'tools/claycode_base_canonicalizer_validation.py'
      - 'tools/claycode_base_ir.py'
      - 'tools/claycode_v17_declarative_trivia_discriminator.py'
      - '.github/workflows/claycode-base-frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strict-selected-wp02-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'lark[interegular]>=1.2,<2'

      - name: Resolve selected WP02 grammar from acceptance contract
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          contract=Path('research_entity/claycode/base/ANDREAS_UBUNTU_TARGET_RECEIPT_CONTRACT.json')
          doc=json.loads(contract.read_text(encoding='utf-8'))
          path=(doc.get('wp02_parser_contract') or {}).get('selected_grammar_path')
          assert isinstance(path,str) and path, doc
          assert Path(path).exists(), path
          print(f'CLAYCODE_ACTIVE_GRAMMAR={path}')
          PY

      - name: Capture execution environment and grammar identity
        run: |
          mkdir -p receipts/claycode-base-frontend
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "python=$(python --version 2>&1)"
            echo "active_grammar=${CLAYCODE_ACTIVE_GRAMMAR}"
            echo "active_grammar_sha256=$(sha256sum "${CLAYCODE_ACTIVE_GRAMMAR}" | awk '{print $1}')"
            echo "contract_sha256=$(sha256sum research_entity/claycode/base/ANDREAS_UBUNTU_TARGET_RECEIPT_CONTRACT.json | awk '{print $1}')"
            python - <<'PY'
          import importlib.metadata
          for pkg in ('lark', 'interegular'):
              try:
                  print(f"{pkg}={importlib.metadata.version(pkg)}")
              except importlib.metadata.PackageNotFoundError:
                  print(f"{pkg}=MISSING")
          PY
          } | tee receipts/claycode-base-frontend/ENVIRONMENT.txt

      - name: Syntax compile validation tools
        run: |
          set -o pipefail
          python -m py_compile \
            tools/claycode_base_frontend.py \
            tools/claycode_base_frontend_validation.py \
            tools/claycode_base_canonicalizer.py \
            tools/claycode_base_canonicalizer_validation.py \
            tools/claycode_base_ir.py \
            tools/claycode_v17_declarative_trivia_discriminator.py \
            tools/claycode_wp02_strict_local_closure_v2.py \
            2>&1 | tee receipts/claycode-base-frontend/PY_COMPILE.log

      - name: Assert production frontend default matches contract selection
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,sys
          sys.path.insert(0,'tools')
          import claycode_base_frontend as frontend
          doc=json.loads(Path('research_entity/claycode/base/ANDREAS_UBUNTU_TARGET_RECEIPT_CONTRACT.json').read_text())
          expected=Path(doc['wp02_parser_contract']['selected_grammar_path']).resolve()
          assert Path(frontend.DEFAULT_GRAMMAR).resolve()==expected,(frontend.DEFAULT_GRAMMAR,expected)
          print('DEFAULT_DECLARATIVE_CONTRACT_BINDING=PASS')
          PY

      - name: Strict selected grammar construction
        run: |
          set -o pipefail
          python tools/claycode_strict_lalr_probe.py \
            --grammar "${CLAYCODE_ACTIVE_GRAMMAR}" \
            --output receipts/claycode-base-frontend/STRICT_LALR_SELECTED.json \
            2>&1 | tee receipts/claycode-base-frontend/STRICT_LALR_SELECTED.log
          python - <<'PY'
          import json
          p=json.load(open('receipts/claycode-base-frontend/STRICT_LALR_SELECTED.json'))
          assert p.get('strict_build_ok') is True,p
          assert not p.get('conflict_diagnostics'),p
          PY

      - name: Strict selected full-corpus frontend validation
        run: |
          set -o pipefail
          python tools/claycode_base_frontend_validation.py \
            --grammar "${CLAYCODE_ACTIVE_GRAMMAR}" \
            --output receipts/claycode-base-frontend/FRONTEND_SELECTED_STRICT.json \
            2>&1 | tee receipts/claycode-base-frontend/FRONTEND_SELECTED_STRICT.log

      - name: Strict selected canonical syntax identity validation
        run: |
          set -o pipefail
          python tools/claycode_base_canonicalizer.py \
            --grammar "${CLAYCODE_ACTIVE_GRAMMAR}" \
            --output receipts/claycode-base-frontend/CANONICAL_SELECTED_STRICT.json \
            2>&1 | tee receipts/claycode-base-frontend/CANONICAL_SELECTED_STRICT.log
          python tools/claycode_base_canonicalizer_validation.py \
            2>&1 | tee receipts/claycode-base-frontend/PRODUCTION_CANONICALIZER.log

      - name: Strict selected typed declaration IR on admitted corpora
        run: |
          set -o pipefail
          python tools/claycode_base_ir.py \
            research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay \
            --grammar "${CLAYCODE_ACTIVE_GRAMMAR}" \
            --output receipts/claycode-base-frontend/IR_G9_SELECTED_STRICT.json \
            2>&1 | tee receipts/claycode-base-frontend/IR_G9_SELECTED_STRICT.log
          python tools/claycode_base_ir.py \
            research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay \
            --grammar "${CLAYCODE_ACTIVE_GRAMMAR}" \
            --output receipts/claycode-base-frontend/IR_DIALECT_SELECTED_STRICT.json \
            2>&1 | tee receipts/claycode-base-frontend/IR_DIALECT_SELECTED_STRICT.log

      - name: Strict V17 selection discriminator when V17 is selected
        run: |
          if [[ "${CLAYCODE_ACTIVE_GRAMMAR}" == *"V17_DECLARATIVE_TRIVIA_SAFE.lark" ]]; then
            python tools/claycode_v17_declarative_trivia_discriminator.py \
              --require-strict \
              --output receipts/claycode-base-frontend/V17_SELECTION_DISCRIMINATOR_STRICT.json
          else
            echo "selected grammar is not V17; V17-specific discriminator skipped"
          fi

      - name: Assert every grammar-bound receipt matches selected bytes
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          grammar=Path(os.environ['CLAYCODE_ACTIVE_GRAMMAR'])
          expected=hashlib.sha256(grammar.read_bytes()).hexdigest()
          checked=0
          for p in sorted(Path('receipts/claycode-base-frontend').glob('*.json')):
              try: row=json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              vals=[]
              for key in ('grammar_sha256',):
                  if isinstance(row.get(key),str): vals.append(row[key])
              ident=row.get('identity') or {}
              if isinstance(ident,dict) and isinstance(ident.get('grammar_sha256'),str): vals.append(ident['grammar_sha256'])
              cand=row.get('candidate') or {}
              if isinstance(cand,dict) and isinstance(cand.get('sha256'),str): vals.append(cand['sha256'])
              if not vals: continue
              checked+=1
              assert all(v==expected for v in vals),{'receipt':str(p),'expected':expected,'observed':vals}
          assert checked>=4,{'error':'insufficient_selected_grammar_receipts','checked':checked}
          print(f'SELECTED_GRAMMAR_BINDING_RECEIPTS={checked}:PASS')
          PY

      - name: Receipt hashes
        if: always()
        run: |
          find receipts/claycode-base-frontend -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee receipts/claycode-base-frontend/SHA256SUMS.txt

      - name: Persist research-center receipt
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          target="research_entity/claycode/base/receipts/ci/${GITHUB_SHA}"
          mkdir -p "$target"
          cp -a receipts/claycode-base-frontend/. "$target/"
          printf '%s\n' \
            "schema_version=1.3" \
            "source_commit=${GITHUB_SHA}" \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" \
            "run_attempt=${GITHUB_RUN_ATTEMPT}" \
            "active_grammar=${CLAYCODE_ACTIVE_GRAMMAR}" \
            "active_grammar_sha256=$(sha256sum "${CLAYCODE_ACTIVE_GRAMMAR}" | awk '{print $1}')" \
            "job_status_before_persist=${JOB_STATUS}" \
            > "$target/WORKFLOW_RECEIPT.txt"
          git config user.name "clay-research-center-ci"
          git config user.email "clay-research-center-ci@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "receipt(claycode): strict selected WP02 frontend ${GITHUB_SHA}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claycode-base-frontend-selected-${{ github.sha }}
          path: receipts/claycode-base-frontend/
          if-no-files-found: error
          retention-days: 30
