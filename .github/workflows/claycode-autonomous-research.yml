name: ClayCode autonomous FREE_ONLY research

# FREE_ONLY fail-closed pause (2026-08-12): GitHub-hosted ubuntu-latest jobs are
# currently rejected before runner allocation by an account billing/spending-limit
# block (runs 31548258330 and 31555133561). Do not buy capacity or raise limits.
# Keep explicit dispatch available for a future verified zero-cost execution surface;
# restore schedule/push only after supervisor evidence shows the selected runner path
# is currently available without paid fallback.
on:
  workflow_dispatch:

concurrency:
  group: claycode-autonomous-free-only-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify autonomous provider authority gate and direct CLI fail-closed boundary
        run: |
          python -m pytest -q \
            tests/test_claycode_autonomous_provider_gate.py \
            tests/test_claycode_autonomous_cycle_direct_gate_v1.py

      - name: Exercise direct CLI under current HARD_OFF authority
        run: |
          python tools/claycode_autonomous_cycle.py | tee /tmp/claycode-direct-cycle.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/claycode-direct-cycle.json').read_text().strip().splitlines()[-1])
          assert payload['status'] == 'SKIPPED_PROVIDER_AUTHORITY', payload
          assert payload['entrypoint'] == 'DIRECT_CLI_GATED', payload
          assert payload['provider_calls'] == 0, payload
          assert payload['secret_lookups'] == 0, payload
          assert payload['authority']['admitted'] is False, payload
          PY

      - name: Run one bounded FREE_ONLY research cycle through current-authority guard
        run: |
          python tools/claycode_autonomous_cycle_guarded.py | tee /tmp/claycode-cycle.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/claycode-cycle.json').read_text().strip().splitlines()[-1])
          assert payload['status'] == 'SKIPPED_PROVIDER_AUTHORITY', payload
          assert payload['provider_calls'] == 0, payload
          assert payload['secret_lookups'] == 0, payload
          assert payload['authority']['admitted'] is False, payload
          PY

      - name: Record exact source/runtime hashes for provider-boundary evidence
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "dirty=$(test -z \"$(git status --porcelain)\" && echo false || echo true)"
            echo "python=$(python --version 2>&1)"
            sha256sum \
              tools/claycode_autonomous_provider_gate.py \
              tools/claycode_autonomous_cycle.py \
              tools/claycode_autonomous_cycle_guarded.py \
              tools/claycode_autonomous_cycle_legacy_impl.py \
              tests/test_claycode_autonomous_provider_gate.py \
              tests/test_claycode_autonomous_cycle_direct_gate_v1.py
          } | tee /tmp/claycode-provider-boundary-source.txt

      - name: Commit cycle receipts, supervisor inbox and bounded requests
        run: |
          git config user.name 'claycode-autonomous-research'
          git config user.email 'claycode-autonomous-research@users.noreply.github.com'
          git add research_entity/claycode/autonomous/ research_entity/runtime/tool_requests/ || true
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode autonomous FREE_ONLY research cycle'
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1
