name: ClayCode Andreas live PR diagnostic

# Measurement-only trigger: the workflow is intentionally changed by a PR so this
# already-mainline workflow executes on the registered self-hosted target.
on:
  pull_request:
    paths:
      - '.github/workflows/claycode-andreas-target-live-pr-diagnostic.yml'

concurrency:
  group: claycode-andreas-live-pr-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  target-diagnostic:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify registered Andreas Ubuntu target
        run: python3 tools/claycode_target_host_identity.py verify --json
      - name: Create ephemeral diagnostic environment
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/claycode-target-venv"
          "$RUNNER_TEMP/claycode-target-venv/bin/python" -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Execute current fail-closed target diagnostic
        shell: bash
        run: "$RUNNER_TEMP/claycode-target-venv/bin/python" tools/claycode_andreas_target_diagnostic.py
      - name: Enforce diagnostic boundary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          p='research_entity/claycode/target/ANDREAS_UBUNTU_BASE_DIAGNOSTIC.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['target_host_verified'] is True
          assert d['all_executed_stages_pass'] is True, [x for x in d['stages'] if not x.get('pass')]
          assert d['overall_pass'] is False
          assert d['counts_as_target_acceptance'] is False
          print('ANDREAS_LIVE_TARGET_DIAGNOSTIC=PASS_NOT_ACCEPTANCE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claycode-andreas-live-target-diagnostic
          path: research_entity/claycode/target/*.json
          if-no-files-found: error
