name: WP03 Structural Types State Identity V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/claycode_wp03_typed_ir_v2_state_identity.py'
      - 'tools/test_claycode_wp03_typed_ir_v2_state_identity.py'
      - 'tools/claycode_wp03_residual_semantics_candidate.py'
      - 'tools/claycode_base_typed_ir.py'
      - 'tools/claycode_base_frontend.py'
      - 'research_entity/claycode/base/fixtures/WP03_MVC_TYPED_STATE_V1.clay'
      - 'research_entity/claycode/base/fixtures/WP03_ABA_VERSIONED_STATE_V1.clay'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V18_REWARD_RELATIONS.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
      - '.github/workflows/wp03-types-state-identity-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: python -m pip install 'lark==1.3.1' 'interegular==0.3.3'
      - run: python -m py_compile tools/claycode_wp03_typed_ir_v2_state_identity.py tools/test_claycode_wp03_typed_ir_v2_state_identity.py
      - run: python tools/test_claycode_wp03_typed_ir_v2_state_identity.py
