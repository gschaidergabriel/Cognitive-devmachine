name: RAE OpenRouter research runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_entity/runtime/openrouter_requests/*.json'
      - 'tools/openrouter_inference.py'
      - 'tools/trigger1_openrouter_qwen06_logit_vector_execute.py'
      - 'tools/trigger1_openrouter_qwen06_route_bound_execute.py'
      - 'tools/trigger1_openrouter_runtime_identity.py'
      - 'tools/trigger1_openrouter_logit_bias_control.py'
      - 'governance/FREE_LANE_ECONOMIC_PROVENANCE_2026-08-24.json'
      - 'research_entity/private/API_TOKENS.env'
      - '.github/workflows/openrouter-research.yml'

concurrency:
  group: rae-openrouter-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute-openrouter-requests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute pending OpenRouter requests
        shell: bash
        env:
          CLAY_FREE_PROVIDER_BUDGET_DB: /tmp/clay-openrouter-research/provider_budget.sqlite3
          CLAY_SWARM_ARTIFACT_ROOT: /tmp/clay-openrouter-research/free-lane
        run: |
          set -euo pipefail
          mkdir -p /tmp/clay-openrouter-research
          shopt -s nullglob
          for req in research_entity/runtime/openrouter_requests/*.json; do
            rid="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["request_id"])' "$req")"
            mode="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("mode","chat"))' "$req")"
            out="research_entity/runtime/tool_results/${rid}.json"
            if [ -f "$out" ]; then
              continue
            fi
            if [ "$mode" = "trigger1_qwen06_logit_vector" ]; then
              set +e
              python3 tools/free_swarm_exec_with_vault.py \
                python3 tools/trigger1_openrouter_qwen06_route_bound_execute.py \
                --output "$out" \
                > /tmp/openrouter-last.json 2>&1
              rc=$?
              set -e
              if [ ! -s "$out" ]; then
                cat > "$out" <<EOF
          {
            "schema": "CLAY_TRIGGER1_OPENROUTER_QWEN06_LOGIT_VECTOR_EXPERIMENT/v1",
            "status": "BLOCKED_BEFORE_RESULT",
            "process_exit_code": ${rc},
            "secret_exposed": false,
            "paid_fallback_attempt_count": 0,
            "credit_scope": "NONE"
          }
          EOF
              fi
            else
              python tools/openrouter_inference.py --request "$req" >/tmp/openrouter-last.json
            fi
          done

      - name: Commit sanitized OpenRouter results
        run: |
          git config user.name 'rae-openrouter-runner'
          git config user.email 'rae-openrouter-runner@users.noreply.github.com'
          git add research_entity/runtime/tool_results/
          git diff --cached --quiet && exit 0
          git commit -m 'Record OpenRouter research results'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
