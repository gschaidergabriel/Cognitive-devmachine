services:
  clayverse:
    image: entityos:latest
    container_name: entityos
    build:
      context: .
      args:
        ENTITYOS_SHA256: "${CLAYVERSE_ENTITYOS_SHA256:?required}"
    restart: unless-stopped
    # Must match host uid:gid 5001:5001 ("clay") to read/write the /var/lib/clay
    # bind mount below. Overrides the image's baked-in USER clayverse (10001).
    user: "5001:5001"
    ports:
      - "127.0.0.1:${CLAYVERSE_PORT:-3000}:3000"
    environment:
      CLAYVERSE_STATE_ROOT: /var/lib/clayverse
      # The real heart DB. Owner decision 2026-08-18: EntityOS/UnifiedDB does NOT get
      # a fresh empty database. It opens the existing 87-table wiki.db (corpus/graph/
      # retrieval material) and adds its own 19 runtime-spine objects on top of it.
      # Requires the /var/lib/clay bind mount below (NOT the named state volume).
      CLAYVERSE_DB_PATH: /var/lib/clay/wiki.db
      CLAYVERSE_WORKSPACE: /workspace
      CLAYVERSE_REQUIRE_CLAUDE: "1"
      # Gedaechtnis aus normalem Gespraech ziehen. Ohne das bleibt
      # durable_memory leer -- gemessen trugen 0 von 24 Zuegen einen
      # Marker -- und die ganze Lernkette steht still.
      CLAYVERSE_MEMORY_EXTRACT: "1"
      # EntityOS bytes are digest-bound into the one ClayVerse image. External
      # execution remains disabled until the exact embedded artifact has accepted
      # isolated-sandbox runtime evidence.
      CLAYVERSE_ENABLE_ENTITYOS_EXEC: "0"
      CLAYVERSE_ENTITYOS_PATH: /opt/entityos/EntityOS
      CLAYVERSE_ENTITYOS_SHA256: "${CLAYVERSE_ENTITYOS_SHA256:?required}"
      CLAYVERSE_CLERK_MAP_JSON: "${CLAYVERSE_CLERK_MAP_JSON:?required}"
      CLERK_ISSUER: "${CLERK_ISSUER:?required}"
      CLERK_JWKS_URL: "${CLERK_JWKS_URL:-}"
      CLERK_JWT_KEY: "${CLERK_JWT_KEY:-}"
      CLERK_AUDIENCE: "${CLERK_AUDIENCE:-}"
      CLERK_AUTHORIZED_PARTIES: "${CLERK_AUTHORIZED_PARTIES:?required}"
      CLERK_PUBLISHABLE_KEY: "${CLERK_PUBLISHABLE_KEY:?required}"
      CLERK_FRONTEND_API_URL: "${CLERK_FRONTEND_API_URL:?required}"
    volumes:
      # Per-user Claude Code HOME/auth/session state and terminal continuity live
      # under the ClayVerse state root (named volume, container-managed, disposable).
      - clayverse-state:/var/lib/clayverse
      - clayverse-workspace:/workspace
      # The real heart DB and its 4 always-on writer services live on the HOST at
      # /var/lib/clay. Bind mount, deliberately NOT a named volume, so the container
      # sees the exact same file the host services (clayverse-kern/-puls/-verdichtung/
      # -wikiarbeit) are writing. Container process must run as host uid:gid 5001:5001
      # (the "clay" user) or it cannot even enter /var/lib/clay (host mode 700).
      - /var/lib/clay:/var/lib/clay
      # UnifiedDB (udb/abruf/*): NVIDIA-Embeddings, Neuronpedia, Memory-Entitaet.
      # Read-only, lebt ausserhalb des Images (/opt/unifieddb ist ein eigenes
      # Git-Repo) -- Aenderungen dort brauchen keinen Image-Rebuild.
      - /opt/unifieddb:/opt/unifieddb:ro
      # Der Erfindungsmelder verdichtung.py, den der Moeglichkeitsraum
      # wiederverwendet statt nachzubauen. EIGENER Name: /opt/clayverse ist im
      # Container das Anwendungspaket, ein Ueberhaengen haette es verdeckt.
      # ⚠️ GENAU dieser Pfad: udb._wz sucht wortwoertlich unter
      # /opt/clayverse/werkzeug. Ein eigener Name half deshalb nicht.
      - /opt/clayverse/werkzeug:/opt/clayverse/werkzeug:ro
      - /opt/entityos/the artefact/web:/opt/clayverse/web:ro
      # Die zwei Tresore und ihr Schluessel. SCHREIBGESCHUETZT: der Container
      # liest Katalog und Werte, angelegt und geaendert wird nur auf dem Wirt.
      # Ein Dienst, der seinen eigenen Tresor umschreiben kann, ist kein Tresor.
      - /etc/entityos/tresor:/etc/entityos/tresor:ro
      - /etc/entityos/tresor.key:/etc/entityos/tresor.key:ro
      # Die Plattformdatenbank und die Projektverzeichnisse -- NUR LESEN.
      # Daraus kommen Besucherzahlen und Seitengewicht; geschrieben wird dort
      # von agentforge, nicht von uns.
      - /var/lib/clay:/var/lib/clay
      - /var/lib/agentforge/db:/var/lib/agentforge/db:ro
      - /var/lib/agentforge/projects:/var/lib/agentforge/projects:ro
      # Provider-Zugaenge (u.a. NVIDIA_NIM_API_KEY). Read-only, 640 root:clay --
      # der Container-Prozess laeuft als uid 5001 (clay) und kann damit lesen,
      # aber nicht schreiben. Werte duerfen NIE in UnifiedDB-Zeilen, Snapshots,
      # Quittungen oder Logs landen (Produktgesetz).
      - /etc/clayverse/freie-zugaenge.env:/etc/clayverse/freie-zugaenge.env:ro
      # Postfachzugaenge der zwei Menschen (Adresse + Passwort) und der
      # IMAP/SMTP-Wirt. Read-only, 640 root:clay -- derselbe Weg wie die Zeile
      # darueber: uid 5001 liest, schreiben kann sie nicht. Bewusst eine Datei
      # und keine Umgebungsvariablen: ein Passwort in der Prozessumgebung
      # stuende in jedem Absturzbericht des Dienstes.
      # Die Werte duerfen NIE in UnifiedDB-Zeilen, Snapshots, Quittungen oder
      # Logs landen (Produktgesetz). Im Beleg einer gesendeten Mail stehen
      # deshalb nur Empfaenger, Betreff, Zeit, Urteil und eine Pruefsumme --
      # nicht der Mailtext und unter keinen Umstaenden ein Zugang.
      - /etc/entityos/postfach.env:/etc/entityos/postfach.env:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  clayverse-state:
  clayverse-workspace:
