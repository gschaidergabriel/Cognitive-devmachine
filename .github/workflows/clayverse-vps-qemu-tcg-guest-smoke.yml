name: ClayVerse VPS QEMU TCG disposable guest smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clayverse-vps-qemu-tcg-guest-smoke.yml'

permissions:
  contents: read

concurrency:
  group: clayverse-vps-qemu-tcg-guest-smoke
  cancel-in-progress: false

jobs:
  qemu-tcg-guest-smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Resolve orchestration-only QEMU tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for cmd in qemu-system-x86_64 qemu-img cloud-localds gpgv curl; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              missing=1
              break
            fi
          done
          if [ ! -r /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg ]; then missing=1; fi
          if ! find /usr/share/OVMF -maxdepth 1 -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) -print -quit 2>/dev/null | grep -q .; then missing=1; fi
          if [ "$missing" -eq 1 ]; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                qemu-system-x86 qemu-utils ovmf cloud-image-utils ubuntu-cloudimage-keyring ca-certificates curl gnupg
            elif sudo -n true 2>/dev/null; then
              sudo -n apt-get update -qq
              sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                qemu-system-x86 qemu-utils ovmf cloud-image-utils ubuntu-cloudimage-keyring ca-certificates curl gnupg
            else
              echo 'QEMU_ORCHESTRATOR_TOOLING_MISSING_AND_PASSWORDLESS_SUDO_UNAVAILABLE' >&2
              exit 75
            fi
          fi
          command -v qemu-system-x86_64
          command -v qemu-img
          command -v cloud-localds
          test -r /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg
          find /usr/share/OVMF -maxdepth 1 -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) -print -quit | grep -q .
          qemu-system-x86_64 --version | head -n1
          qemu-img --version | head -n1

      - name: Boot fresh networkless TCG guest and capture bounded receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work="/tmp/clayverse-qemu-guest-${GITHUB_RUN_ID}"
          receipt="/tmp/clayverse-qemu-guest-${GITHUB_RUN_ID}.json"
          serial="$work/serial.log"
          base="$work/ubuntu-noble-amd64.img"
          overlay="$work/overlay.qcow2"
          seed="$work/seed.img"
          base_url='https://cloud-images.ubuntu.com/releases/noble/release-20260725'
          image_name='ubuntu-24.04-server-cloudimg-amd64.img'
          mkdir -p "$work"
          cleanup() {
            rc=$?
            pkill -TERM -P $$ qemu-system-x86_64 2>/dev/null || true
            sleep 1
            pkill -KILL -P $$ qemu-system-x86_64 2>/dev/null || true
            rm -rf "$work"
            exit "$rc"
          }
          trap cleanup EXIT INT TERM

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$base_url/SHA256SUMS" -o "$work/SHA256SUMS"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$base_url/SHA256SUMS.gpg" -o "$work/SHA256SUMS.gpg"
          keyring='/usr/share/keyrings/ubuntu-cloudimage-keyring.gpg'
          test -r "$keyring"
          gpgv --keyring "$keyring" "$work/SHA256SUMS.gpg" "$work/SHA256SUMS"
          expected=$(awk -v f="*$image_name" '$2==f {print $1}' "$work/SHA256SUMS")
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{64}$'; then
            echo 'IMAGE_CHECKSUM_NOT_FOUND' >&2
            exit 41
          fi
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$base_url/$image_name" -o "$base"
          printf '%s  %s\n' "$expected" "$base" | sha256sum -c -
          chmod 0444 "$base"

          qemu-img create -q -f qcow2 -F qcow2 -b "$base" "$overlay"
          cat >"$work/user-data" <<'EOF'
          #cloud-config
          network:
            config: disabled
          ssh_pwauth: false
          disable_root: true
          runcmd:
            - [sh, -c, 'printf "CLAYVERSE_QEMU_TCG_GUEST_OK kernel=%s arch=%s machine=%s\\n" "$(uname -r)" "$(uname -m)" "$(cat /etc/machine-id)" > /dev/ttyS0']
            - [sh, -c, 'sync; poweroff -f']
          EOF
          cat >"$work/meta-data" <<EOF
          instance-id: clayverse-qemu-${GITHUB_RUN_ID}
          local-hostname: clayverse-qemu-guest
          EOF
          cloud-localds "$seed" "$work/user-data" "$work/meta-data"

          ovmf=$(find /usr/share/OVMF -maxdepth 1 -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | sort | head -n1)
          test -n "$ovmf"
          qemu_version=$(qemu-system-x86_64 --version | head -n1)
          qemu-system-x86_64 -accel tcg,thread=multi -machine q35 -cpu max -smp 2 -m 2048 \
            -bios "$ovmf" \
            -drive "file=$overlay,if=virtio,format=qcow2,cache=unsafe" \
            -drive "file=$seed,if=virtio,format=raw,readonly=on" \
            -net none -display none -monitor none -serial "file:$serial" \
            -no-reboot \
            -sandbox on,obsolete=deny,elevateprivileges=deny,spawn=deny,resourcecontrol=deny &
          qemu_pid=$!
          qemu_rc=0
          if ! timeout --foreground 420s bash -c "while kill -0 $qemu_pid 2>/dev/null; do sleep 2; done"; then
            qemu_rc=124
            kill -TERM "$qemu_pid" 2>/dev/null || true
            sleep 2
            kill -KILL "$qemu_pid" 2>/dev/null || true
          else
            wait "$qemu_pid" || qemu_rc=$?
          fi

          test -f "$serial"
          serial_sha=$(sha256sum "$serial" | awk '{print $1}')
          marker=$(grep -aE '^CLAYVERSE_QEMU_TCG_GUEST_OK kernel=[^ ]+ arch=x86_64 machine=[0-9a-f-]+$' "$serial" | tail -n1 || true)
          guest_started=false
          if [ -n "$marker" ] && [ "$qemu_rc" -eq 0 ]; then guest_started=true; fi

          python3 - "$receipt" "$expected" "$serial_sha" "$qemu_rc" "$guest_started" "$qemu_version" "$marker" <<'PY'
          import json, os, pathlib, sys
          out,image_sha,serial_sha,qemu_rc,guest_started,qemu_version,marker=sys.argv[1:]
          payload={
            'schema':'ClayVerseVpsQemuTcgGuestSmoke/v1',
            'github_sha':os.environ.get('GITHUB_SHA',''),
            'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),
            'executor_type':'QEMU_TCG',
            'host_orchestration_only':True,
            'product_code_executed_on_host':False,
            'host_docker_used':False,
            'guest_base':'ubuntu-24.04-server-cloudimg-amd64.img@release-20260725',
            'guest_base_sha256':image_sha,
            'guest_kernel_marker':marker or None,
            'guest_network_mode':'NONE',
            'guest_memory_mib':2048,
            'guest_vcpus':2,
            'guest_disk':'READ_ONLY_VERIFIED_BASE_PLUS_DISPOSABLE_QCOW2_OVERLAY',
            'qemu_sandbox':'on,obsolete=deny,elevateprivileges=deny,spawn=deny,resourcecontrol=deny',
            'qemu_version':qemu_version,
            'qemu_exit_status':int(qemu_rc),
            'serial_log_sha256':serial_sha,
            'guest_started':guest_started=='true',
            'cleanup_required':True,
            'runtime_credit':0,
            'whole_product_credit':0,
            'unusual_experiment_count_added':0,
          }
          pathlib.Path(out).write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,sort_keys=True))
          if not payload['guest_started']:
            raise SystemExit(42)
          PY

      - name: Upload bounded QEMU guest receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clayverse-vps-qemu-guest-smoke-${{ github.run_id }}
          path: /tmp/clayverse-qemu-guest-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7