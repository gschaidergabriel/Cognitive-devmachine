name: ChatGPT Authenticated State Shadow Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'research_entity/harness/reference/state_auth_shadow.py'
      - 'research_entity/harness/reference/test_state_auth_shadow.py'
      - 'research_entity/harness/reference/benchmark_state_auth_shadow.py'
      - '.github/workflows/chatgpt-auth-shadow-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact PR merge without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
          python3 --version
      - name: Unit falsifiers
        shell: bash
        run: python3 -m unittest -v research_entity.harness.reference.test_state_auth_shadow
      - name: Bounded benchmark
        shell: bash
        run: python3 -m research_entity.harness.reference.benchmark_state_auth_shadow --rows 5000 --updates 12
