name: RAE Status Snapshot 20260809
on:
  push:
    paths: ['.github/workflows/rae_status_snapshot_20260809.yml']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          python tools/program_progress.py --json --as-of 2026-08-09 > research_entity/rooms/LATEST_STATUS_SNAPSHOT.json
          git config user.name rae-status-snapshot
          git config user.email actions@users.noreply.github.com
          git add research_entity/rooms/LATEST_STATUS_SNAPSHOT.json
          git commit -m 'status: snapshot post-Level0 program progress' || exit 0
          for i in 1 2 3 4 5 6; do git fetch origin main; git rebase origin/main; git push origin HEAD:main && exit 0; sleep 2; done
          exit 1
