name: claycog-validator-pr

on:
  pull_request:
    paths:
      - 'the artefact/blogpost_entity/mini_cognition/**'
      - '.github/workflows/claycog-validator-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claycog-validator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Record source identity
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$GITHUB_SHA"
          git rev-parse HEAD
          git status --short
      - name: Run strict ClayCode admission regressions
        run: |
          set -euo pipefail
          python3 'the artefact/blogpost_entity/mini_cognition/test_validate_sft_v1.py'
          python3 'the artefact/blogpost_entity/mini_cognition/test_validate_corpus_v2.py'
      - name: Regenerate and validate exact SFT v2 corpus
        run: |
          set -euo pipefail
          cd 'the artefact/blogpost_entity/mini_cognition'
          python3 generate_sft_v2.py
          python3 validate_corpus_v2.py train_v2.jsonl validation_v2.jsonl
          git diff --exit-code -- corpus_manifest_v2.json
      - name: Run exact omega OOD promotion regression
        run: |
          set -euo pipefail
          python3 'the artefact/blogpost_entity/mini_cognition/test_eval_exact_vector_v1.py'
          python3 'the artefact/blogpost_entity/mini_cognition/test_eval_tool_amputation_v1.py'
