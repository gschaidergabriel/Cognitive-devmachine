name: WP03 Rule Invariant Binding Gate v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/claycode_wp03_rule_invariant_binding_gate_v1.py'
      - 'tools/test_claycode_wp03_rule_invariant_binding_gate_v1.py'
      - '.github/workflows/wp03-rule-invariant-binding-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen parser dependency
        run: python -m pip install 'lark==1.3.1' 'interegular==0.3.3'
      - name: Compile candidate
        run: python -m py_compile tools/claycode_wp03_rule_invariant_binding_gate_v1.py tools/test_claycode_wp03_rule_invariant_binding_gate_v1.py
      - name: Run real G9 and dialect binding diagnostic
        run: python tools/test_claycode_wp03_rule_invariant_binding_gate_v1.py | tee /tmp/wp03-binding.json
      - name: Assert diagnostic contract
        run: |
          python - /tmp/wp03-binding.json <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='PASS_DIAGNOSTIC_EXACT_BINDING_FRONTIER',x
          assert x['total_clauses']==81,x
          assert x['accepted_explicit_or_single_binding'] + x['rejected_ambiguous_binding'] == 81,x
          assert x['rejected_ambiguous_binding'] > 0,x
          assert x['mixed_flat_chain']=='FAIL_CLOSED_PASS',x
          assert x['parenthesized_nested_binding']=='PASS',x
          assert x['runtime_call_execution']=='FORBIDDEN',x
          assert x['implicit_execution_count']==0,x
          assert x['effect_authority']==x['truth_authority']=='NONE',x
          assert x['promotion']=='NONE',x
          print('WP03_RULE_INVARIANT_BINDING_DIAGNOSTIC=PASS')
          PY
