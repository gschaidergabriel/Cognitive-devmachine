name: Qwen35 Abliteration VPS Probe

on:
  push:
    paths:
      - 'research_entity/state/work/events/QWEN35_ABLITERATION_VPS_PROBE_TRIGGER.json'

permissions:
  contents: write

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe VPS model/runtime state
        shell: bash
        run: |
          set -euo pipefail
          OUT='research_entity/experiments/qwen35_abliteration_vps/VPS_PROBE_CURRENT.json'
          mkdir -p "$(dirname "$OUT")"
          python3 - <<'PY'
          import json, os, pathlib, platform, shutil, subprocess, time
          def run(cmd):
              try:
                  return subprocess.run(cmd, shell=True, text=True, capture_output=True, timeout=20).stdout.strip()
              except Exception as e:
                  return f'ERROR:{type(e).__name__}:{e}'
          roots=[]
          for p in [os.environ.get('HOME'), '/opt', '/srv', '/mnt', '/var/lib', '/home']:
              if p and os.path.exists(p): roots.append(p)
          files=[]
          seen=set()
          for root in roots:
              try:
                  proc=subprocess.run(['find', root, '-maxdepth', '6', '-type', 'f', '-name', '*.gguf', '-print'], text=True, capture_output=True, timeout=45)
                  for line in proc.stdout.splitlines():
                      if line not in seen:
                          seen.add(line)
                          try: size=os.path.getsize(line)
                          except OSError: size=None
                          files.append({'path':line,'size_bytes':size})
              except Exception:
                  pass
          llama_bins={name:shutil.which(name) for name in ['llama-server','llama-cli','llama','llama-quantize'] if shutil.which(name)}
          versions={k:run(f'"{v}" --version') for k,v in llama_bins.items()}
          data={
            'schema_version':'1.0',
            'kind':'VPS_RUNTIME_PROBE_RECEIPT',
            'observed_unix':time.time(),
            'github_run_id':os.environ.get('GITHUB_RUN_ID'),
            'github_sha':os.environ.get('GITHUB_SHA'),
            'runner_name':os.environ.get('RUNNER_NAME'),
            'runner_os':os.environ.get('RUNNER_OS'),
            'platform':platform.platform(),
            'cpu_count':os.cpu_count(),
            'memory_kib':run("awk '/MemTotal/ {print $2}' /proc/meminfo"),
            'disk':run('df -B1 --output=source,size,used,avail,target | head -20'),
            'nvidia_smi':run('nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader 2>/dev/null || true'),
            'llama_bins':llama_bins,
            'llama_versions':versions,
            'gguf_files':sorted(files,key=lambda x:(x['path']))
          }
          pathlib.Path('research_entity/experiments/qwen35_abliteration_vps').mkdir(parents=True,exist_ok=True)
          pathlib.Path('research_entity/experiments/qwen35_abliteration_vps/VPS_PROBE_CURRENT.json').write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Commit probe receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'clay-vps-runner'
          git config user.email 'clay-vps-runner@users.noreply.github.com'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add research_entity/experiments/qwen35_abliteration_vps/VPS_PROBE_CURRENT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'experiment: record Qwen35 VPS probe receipt'
          git push origin HEAD:"$GITHUB_REF_NAME"
