name: GWT R6 NVIDIA 4B Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  nvidia-r6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute exact R6 NVIDIA request
        run: |
          python tools/nvidia_nim.py --request research_entity/runtime/nvidia_requests/gwt-r6-nvidia-rcwc-reader-20260809T0142p0700.json >/tmp/nvidia-summary.json
          python - <<'PY'
          import json
          p='research_entity/runtime/tool_results/gwt-r6-nvidia-rcwc-reader-20260809T0142p0700.json'
          d=json.load(open(p,encoding='utf-8'))
          print('NVIDIA_GWT_R6_STATUS', d.get('status'))
          r=d.get('result') or {}
          print('model=', r.get('model'))
          print('finish_reason=', r.get('finish_reason'))
          print('usage=', r.get('usage'))
          print('content=', r.get('content'))
          if d.get('status')!='SUCCESS':
              print('error=',d.get('error'))
              raise SystemExit(1)
          PY
