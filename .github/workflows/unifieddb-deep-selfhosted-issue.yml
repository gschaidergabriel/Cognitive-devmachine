name: UnifiedDB Deep Self-Hosted Issue Gate

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: unifieddb-deep-selfhosted-issue
  cancel-in-progress: false

jobs:
  deep-benchmark:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] UnifiedDB deep benchmark'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Run exact-repo regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            research_entity.harness.reference.test_unifieddb_query_plane \
            research_entity.harness.reference.test_state_ledger_streaming_root \
            research_entity.harness.reference.test_state_auth_shadow_embedded_v2 \
            research_entity.harness.reference.test_unifieddb_emergent_assembly \
            research_entity.harness.reference.test_unifieddb_emergent_cascade

      - name: Run matched auth-shadow benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research_entity.harness.reference.benchmark_state_auth_shadow_v1_v2 \
            --rows 20000 --updates 30 > /tmp/AUTH_SHADOW_V1_V2.json
          python3 - /tmp/AUTH_SHADOW_V1_V2.json <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p['pass']
          assert p['comparison']['both_rebuild_equivalent']
          assert p['comparison']['both_verify_pass']
          assert p['comparison']['both_tamper_detect']
          print(json.dumps(p['comparison'],sort_keys=True))
          PY

      - name: Run EAP model-input and held-out seed benchmarks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research_entity.harness.reference.benchmark_unifieddb_emergent_assembly > /tmp/EAP_MODEL.json
          python3 -m research_entity.harness.reference.benchmark_unifieddb_emergent_cascade > /tmp/EAP_CASCADE.json

      - name: Build exact-repo receipts
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p research_entity/unifieddb/receipts
          python3 - /tmp/AUTH_SHADOW_V1_V2.json /tmp/EAP_MODEL.json /tmp/EAP_CASCADE.json "$ISSUE_NUMBER" "$RUN_ID" <<'PY'
          import json,os,platform,socket,subprocess,sys,time
          auth_path,model_path,cascade_path,issue_number,run_id=sys.argv[1:]
          source_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          auth=json.load(open(auth_path,encoding='utf-8'))
          auth.update({
            'evidence_class':'VERIFIED_REMOTE_EXECUTION_EXACT_CLAY_CHECKOUT',
            'created_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'source_commit':source_sha,'github_run_id':run_id,'issue_number':int(issue_number),
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),'hostname':socket.gethostname(),
            'platform':platform.platform(),'python_runtime':platform.python_version(),
            'scope_guard':'Hostinger Ubuntu/Linux exact Clay checkout; not Andreas final target hardware.',
          })
          open('research_entity/unifieddb/receipts/AUTH_STATE_SHADOW_V1_V2_HOSTINGER_LATEST.json','w',encoding='utf-8').write(json.dumps(auth,indent=2,sort_keys=True)+'\n')

          model=json.load(open(model_path,encoding='utf-8'))
          cascade=json.load(open(cascade_path,encoding='utf-8'))
          eap=model['methods']['eap_hot_assembly']; staged=model['methods']['recursive_sql_staged_assembly']; refs=model['methods']['recursive_sql_refs_only']; key=model['methods']['indexed_key']; oob=model['out_of_box_experiment']
          by_name={row['name']:row for row in cascade['results']}; direct=by_name['direct_canonical_lexical_plus_eap']; u12=by_name['u12_fail_closed_resolver_plus_eap']
          acceptance={
            'retrieval_quality_exact':eap['recall_at_12']==1.0 and eap['precision_at_12']==1.0 and eap['ndcg_at_12']==1.0,
            'faster_than_staged_sql_p50':eap['latency_us']['p50']<staged['latency_us']['p50'],
            'negative_space_improves_precision':oob['gated_precision_at_2']>oob['ungated_precision_at_2'],
            'u12_improves_held_out_decision_accuracy':u12['decision_accuracy']>direct['decision_accuracy'],
            'u12_zero_false_open_on_abstention_cases':u12['false_open_rate_on_abstention_cases']==0.0,
            'u12_exact_known_assembly':u12['known_exact_assembly_rate']==1.0,
          }
          eap_receipt={
            'schema_version':'1.0','evidence_class':'VERIFIED_REMOTE_EXECUTION_EXACT_CLAY_CHECKOUT',
            'experiment':'UNIFIEDDB_EAP_MODEL_INPUT_DEEP_SELFHOSTED',
            'created_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'source_commit':source_sha,'github_run_id':run_id,'issue_number':int(issue_number),
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),'hostname':socket.gethostname(),
            'platform':platform.platform(),'python':platform.python_version(),
            'benchmark':model,'held_out_seed_benchmark':cascade,
            'summary':{
              'eap_recall_at_12':eap['recall_at_12'],'eap_precision_at_12':eap['precision_at_12'],'eap_ndcg_at_12':eap['ndcg_at_12'],
              'eap_p50_us':eap['latency_us']['p50'],'staged_sql_p50_us':staged['latency_us']['p50'],
              'eap_speedup_vs_staged_sql_p50':staged['latency_us']['p50']/eap['latency_us']['p50'],
              'recursive_sql_refs_only_p50_us':refs['latency_us']['p50'],'indexed_key_p50_us':key['latency_us']['p50'],
              'negative_space_gated_precision_at_2':oob['gated_precision_at_2'],'negative_space_ungated_precision_at_2':oob['ungated_precision_at_2'],
              'u12_held_out_decision_accuracy':u12['decision_accuracy'],'direct_held_out_decision_accuracy':direct['decision_accuracy'],
              'u12_false_open_rate_on_abstention_cases':u12['false_open_rate_on_abstention_cases'],'u12_known_exact_assembly_rate':u12['known_exact_assembly_rate'],
            },
            'acceptance':acceptance,'pass':all(acceptance.values()),
            'scope_guard':'Bounded synthetic model-input/seed evidence on exact Clay checkout, Hostinger Ubuntu/Linux; not universal DB superiority or Andreas final target acceptance.',
            'authority':'CONTEXT_PREPROCESSING_ONLY_NO_EFFECT_AUTHORITY',
          }
          open('research_entity/unifieddb/receipts/EAP_MODEL_INPUT_DIRECT_HOSTINGER_LATEST.json','w',encoding='utf-8').write(json.dumps(eap_receipt,indent=2,sort_keys=True)+'\n')
          assert eap_receipt['pass']
          PY

      - name: Persist direct receipts
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'clay-deep-benchmark-runner'
          git config user.email 'clay-deep-benchmark-runner@users.noreply.github.com'
          git add \
            research_entity/unifieddb/receipts/AUTH_STATE_SHADOW_V1_V2_HOSTINGER_LATEST.json \
            research_entity/unifieddb/receipts/EAP_MODEL_INPUT_DIRECT_HOSTINGER_LATEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(unifieddb): persist deep self-hosted benchmark ${RUN_ID} [skip ci]"
          for n in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((n * 2))
          done
          exit 1
