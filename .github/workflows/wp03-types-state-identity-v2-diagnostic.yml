name: WP03 Structural Types State Identity V2 Diagnostic

on:
  push:
    branches:
      - chatgpt/claycode-wp03-types-state-identity-v2-20260810
    paths:
      - 'tools/claycode_wp03_typed_ir_v2_state_identity.py'
      - 'tools/test_claycode_wp03_typed_ir_v2_state_identity.py'
      - 'tools/claycode_wp03_residual_semantics_candidate.py'
      - 'tools/claycode_base_typed_ir.py'
      - 'tools/claycode_base_frontend.py'
      - 'research_entity/claycode/base/fixtures/WP03_MVC_TYPED_STATE_V1.clay'
      - 'research_entity/claycode/base/fixtures/WP03_ABA_VERSIONED_STATE_V1.clay'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V18_REWARD_RELATIONS.lark'
      - '.github/workflows/wp03-types-state-identity-v2-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/claycode-wp03-types-state-identity-v2-20260810
          fetch-depth: 0
      - name: Install exact parser deps
        run: python -m pip install 'lark==1.3.1' 'interegular==0.3.3'
      - name: Execute fail-observable test
        id: test
        shell: bash
        run: |
          set +e
          python -m py_compile tools/claycode_wp03_typed_ir_v2_state_identity.py tools/test_claycode_wp03_typed_ir_v2_state_identity.py > /tmp/compile.out 2> /tmp/compile.err
          compile_rc=$?
          if [ "$compile_rc" = 0 ]; then
            python tools/test_claycode_wp03_typed_ir_v2_state_identity.py > /tmp/test.out 2> /tmp/test.err
            test_rc=$?
          else
            test_rc=99
            : > /tmp/test.out
            : > /tmp/test.err
          fi
          echo "compile_rc=$compile_rc" >> "$GITHUB_OUTPUT"
          echo "test_rc=$test_rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist diagnostic receipt
        if: always()
        shell: bash
        env:
          COMPILE_RC: ${{ steps.test.outputs.compile_rc }}
          TEST_RC: ${{ steps.test.outputs.test_rc }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, platform, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          def text(p):
              q=Path(p)
              return q.read_text(errors='replace') if q.exists() else ''
          def blob(p):
              return subprocess.check_output(['git','hash-object',p],text=True).strip()
          try: compile_rc=int(os.environ.get('COMPILE_RC','99'))
          except Exception: compile_rc=99
          try: test_rc=int(os.environ.get('TEST_RC','99'))
          except Exception: test_rc=99
          stdout=text('/tmp/test.out')
          parsed=None
          try: parsed=json.loads(stdout) if stdout.strip() else None
          except Exception: parsed=None
          receipt={
            'schema_version':'1.0',
            'truth_class':'HOSTED_UBUNTU_DIAGNOSTIC_ONLY',
            'promotion':'NONE',
            'wp03_status':'OPEN',
            'status':'PASS' if compile_rc==0 and test_rc==0 else 'FAIL',
            'compile_exit_code':compile_rc,
            'test_exit_code':test_rc,
            'branch':'chatgpt/claycode-wp03-types-state-identity-v2-20260810',
            'workflow_commit':os.environ.get('GH_SHA'),
            'candidate_blob':blob('tools/claycode_wp03_typed_ir_v2_state_identity.py'),
            'test_blob':blob('tools/test_claycode_wp03_typed_ir_v2_state_identity.py'),
            'residual_blob':blob('tools/claycode_wp03_residual_semantics_candidate.py'),
            'frontend_blob':blob('tools/claycode_base_frontend.py'),
            'typed_ir_parent_blob':blob('tools/claycode_base_typed_ir.py'),
            'grammar_blob':blob('research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V18_REWARD_RELATIONS.lark'),
            'stdout':stdout[-20000:],
            'stderr':(text('/tmp/compile.err')+text('/tmp/test.err'))[-20000:],
            'parsed_result':parsed,
            'runner':{'platform':platform.platform(),'python':platform.python_version()},
            'workflow_run_id':os.environ.get('GH_RUN_ID'),
            'workflow_run_attempt':os.environ.get('GH_RUN_ATTEMPT'),
            'observed_at':datetime.now(timezone.utc).isoformat(),
          }
          out=Path('research_entity/claycode/base/WP03_TYPES_STATE_IDENTITY_V2_HOSTED_DIAGNOSTIC.json')
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'claycode-diagnostic'
          git config user.email 'claycode-diagnostic@users.noreply.github.com'
          git add research_entity/claycode/base/WP03_TYPES_STATE_IDENTITY_V2_HOSTED_DIAGNOSTIC.json
          git diff --cached --quiet || git commit -m 'evidence(wp03): record structural state hosted diagnostic [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin chatgpt/claycode-wp03-types-state-identity-v2-20260810 && git push origin HEAD:chatgpt/claycode-wp03-types-state-identity-v2-20260810 && exit 0
            sleep $((attempt * 2))
          done
          exit 1
      - name: Enforce diagnostic verdict
        if: always()
        env:
          COMPILE_RC: ${{ steps.test.outputs.compile_rc }}
          TEST_RC: ${{ steps.test.outputs.test_rc }}
        run: test "$COMPILE_RC" = 0 -a "$TEST_RC" = 0
