name: ClayCode BASE14 closure sweep

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base14_closure_sweep.py'
      - 'tools/claycode_strict_lalr_probe.py'
      - 'tools/claycode_base_frontend_validation.py'
      - 'tools/claycode_base_grammar_differential.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V4.lark'
      - 'research_entity/claycode/g9/CLAYCODE_G9_FUSION_SPEC_V3.clay'
      - 'research_entity/claycode/g9/DIALECT_REGISTRY_V3.clay'
      - 'research_entity/trigger_runs/spawn/spawn_20260809T111551Z/EXPERIMENT_ATOMIC_CAS.py'
      - 'research_entity/trigger_runs/spawn/spawn-20260809T1814p0700-claycode-http-sqlite-0a7066/http_sqlite_vertical_probe.py'
      - 'research_entity/trigger_runs/spawn/spawn-20260809T1742p0700-claycode-loop-eval-lowering/EXPERIMENT_REPRODUCER.py'
      - '.github/workflows/claycode-base14-closure-sweep.yml'

concurrency:
  group: claycode-base14-closure-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install strict parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Run BASE14 fail-closed closure sweep
        run: |
          python tools/claycode_base14_closure_sweep.py \
            --output research_entity/claycode/autonomous/BASE14_CLOSURE_SWEEP_RECEIPT.json
      - name: Require no regression while refusing false BASE promotion
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/BASE14_CLOSURE_SWEEP_RECEIPT.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['verdict']=='REGRESSION_SWEEP_PASS_NO_BASE_PROMOTION', d['verdict']
          assert d['release_packages_passed']==0
          assert d['release_packages_total']==14
          assert not d['regressions'], d['regressions']
          assert all(d['checks'].values()), d['checks']
          print('BASE14_REGRESSION_SWEEP_PASS')
          PY
      - name: Commit evidence receipts
        run: |
          git config user.name 'claycode-base14-closure'
          git config user.email 'claycode-base14-closure@users.noreply.github.com'
          git add \
            research_entity/claycode/autonomous/STRICT_LALR_D_REPAIR_RECEIPT.json \
            research_entity/claycode/autonomous/BASE_FRONTEND_REPAIR_VALIDATION_RECEIPT.json \
            research_entity/claycode/autonomous/BASE_GRAMMAR_DIFFERENTIAL_RECEIPT.json \
            research_entity/claycode/autonomous/BASE14_CLOSURE_SWEEP_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record BASE14 closure sweep receipts'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
