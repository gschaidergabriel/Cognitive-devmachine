name: EntityOS runtime authority observable

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research_entity/runtime/reconcile_requests/*.json'

permissions:
  contents: read

jobs:
  audit-runtime-authority:
    if: github.event.pull_request.user.login == 'gschaidergabriel'
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - name: Checkout request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Execute non-mutating runtime authority audit
        shell: bash
        run: |
          set -Eeuo pipefail
          LIVE=/workspace/clay-global-research-entity
          ART=/artifacts/clay-entityos-swarm
          OUT=/tmp/clay-runtime-authority-audit-pr-${GITHUB_RUN_ID}
          mkdir -p "$OUT"
          status=EXECUTED
          before=""; after=""; target=""

          if [[ ! -d "$LIVE/.git" ]]; then
            status=BLOCKED_LIVE_REPO_NOT_FOUND
          else
            before="$(git -C "$LIVE" rev-parse HEAD 2>/dev/null || true)"
            if ! git -C "$LIVE" fetch --quiet origin main >"$OUT/fetch.log" 2>&1; then
              status=BLOCKED_LIVE_FETCH_FAILED
            else
              target="$(git -C "$LIVE" rev-parse origin/main 2>/dev/null || true)"
              dirty="$(git -C "$LIVE" status --porcelain=v1 2>/dev/null || true)"
              unknown_dirty="$(printf '%s\n' "$dirty" | grep -Ev '^[ MARC?]{2} (free swarm/(README.md|LIVE_METRICS.json|DISTILLERY_LIVE.json|FORGE_LIVE.json|SYSTEM_ANALYSIS_LIVE.json|FABRIC_6000_LIVE.json|SYSTEM_ANALYSIS_CURRENT.json)|000_FREE_SWARM_LIVE_DASHBOARD.md)$' || true)"
              if [[ -n "$unknown_dirty" ]]; then
                status=BLOCKED_LIVE_CHECKOUT_DIRTY_NONGENERATED
                printf '%s\n' "$unknown_dirty" >"$OUT/unknown-dirty.txt"
              else
                for p in \
                  'free swarm/README.md' \
                  'free swarm/LIVE_METRICS.json' \
                  'free swarm/DISTILLERY_LIVE.json' \
                  'free swarm/FORGE_LIVE.json' \
                  'free swarm/SYSTEM_ANALYSIS_LIVE.json' \
                  'free swarm/FABRIC_6000_LIVE.json' \
                  'free swarm/SYSTEM_ANALYSIS_CURRENT.json' \
                  '000_FREE_SWARM_LIVE_DASHBOARD.md'; do
                  git -C "$LIVE" restore --worktree -- "$p" 2>/dev/null || true
                done
                if ! git -C "$LIVE" merge --ff-only origin/main >"$OUT/fast-forward.log" 2>&1; then
                  status=BLOCKED_FAST_FORWARD_FAILED
                else
                  after="$(git -C "$LIVE" rev-parse HEAD 2>/dev/null || true)"
                  tree="$(git -C "$LIVE" rev-parse HEAD^{tree})"
                  if [[ -n "$(git -C "$LIVE" status --porcelain=v1)" ]]; then
                    status=BLOCKED_POST_UPDATE_DIRTY
                  elif ! python3 "$LIVE/tools/free_provider_admission.py" --json >"$OUT/admission.json" 2>"$OUT/admission.err"; then
                    status=BLOCKED_CANONICAL_ADMISSION_INVALID
                  else
                    # Non-mutating only. Do NOT invoke activate_6000_free_swarm.sh,
                    # update_root_results.py, update_system_analysis legacy publishers,
                    # process termination, process restart, or any provider-capable code.
                    python3 "$LIVE/tools/free_swarm_restart_authority_attribution_v4.py" \
                      --repo "$LIVE" >"$OUT/restart-authority.json" 2>"$OUT/restart-authority.err" || true
                    python3 "$LIVE/tools/system_analysis_authority_consumer_audit_v1.py" \
                      --repo "$LIVE" >"$OUT/consumer-audit.json" 2>"$OUT/consumer-audit.err" || true
                    python3 "$LIVE/tools/system_analysis_current_reader_v1.py" \
                      --repo "$LIVE" >"$OUT/current-readback.json" 2>"$OUT/current-readback.err" || true
                    printf '%s\n' "$after" >"$OUT/head.txt"
                    printf '%s\n' "$tree" >"$OUT/tree.txt"
                    sha256sum \
                      "$LIVE/tools/free_provider_admission.py" \
                      "$LIVE/tools/free_swarm_restart_authority_attribution_v4.py" \
                      "$LIVE/tools/system_analysis_authority_consumer_audit_v1.py" \
                      "$LIVE/tools/system_analysis_current_reader_v1.py" \
                      >"$OUT/source-sha256.txt"
                  fi
                fi
              fi
            fi
          fi

          STATUS="$status" BEFORE="$before" AFTER="$after" TARGET="$target" OUT="$OUT" python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          out = Path(os.environ['OUT'])
          def load(name):
              try:
                  v = json.loads((out/name).read_text(encoding='utf-8'))
                  return v if isinstance(v, dict) else {}
              except Exception:
                  return {}
          admission = load('admission.json')
          restart = load('restart-authority.json')
          consumer = load('consumer-audit.json')
          current = load('current-readback.json')
          result = {
            'schema': 'CLAY_RUNTIME_AUTHORITY_PR_AUDIT/v2',
            'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'run_id': os.environ.get('GITHUB_RUN_ID'),
            'status': os.environ['STATUS'],
            'live_head_before': os.environ['BEFORE'] or None,
            'live_head_after': os.environ['AFTER'] or None,
            'origin_main_target': os.environ['TARGET'] or None,
            'canonical_provider_admission': admission,
            'restart_authority_read_only': restart,
            'authority_consumer_audit': consumer,
            'current_publication_readback': current,
            'process_mutations_performed': False,
            'provider_calls_performed': 0,
            'secret_lookups_performed': 0,
            'legacy_update_root_results_invoked': False,
            'legacy_system_analysis_invoked': False,
            'physical_grid10_runtime_credit': 0,
            'whole_hcu_runtime_credit': 0,
            'training_credit': 0,
            'evidence_boundary': 'READ_ONLY_RUNTIME_AUTHORITY_OBSERVATION_ONLY; NO QUIESCENCE OR HCU CREDIT'
          }
          (out/'result.json').write_text(json.dumps(result, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          print('RUNTIME_AUTHORITY_AUDIT_RESULT='+json.dumps(result, separators=(',',':'), ensure_ascii=False))
          PY
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-authority-observable-${{ github.run_id }}
          path: |
            ${{ env.OUT }}/result.json
            ${{ env.OUT }}/admission.json
            ${{ env.OUT }}/admission.err
            ${{ env.OUT }}/restart-authority.json
            ${{ env.OUT }}/restart-authority.err
            ${{ env.OUT }}/consumer-audit.json
            ${{ env.OUT }}/consumer-audit.err
            ${{ env.OUT }}/current-readback.json
            ${{ env.OUT }}/current-readback.err
            ${{ env.OUT }}/head.txt
            ${{ env.OUT }}/tree.txt
            ${{ env.OUT }}/source-sha256.txt
            ${{ env.OUT }}/fetch.log
            ${{ env.OUT }}/fast-forward.log
            ${{ env.OUT }}/unknown-dirty.txt
          if-no-files-found: warn
          retention-days: 7
