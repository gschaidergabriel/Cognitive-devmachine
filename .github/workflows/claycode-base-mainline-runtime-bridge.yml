name: ClayCode compiler to mainline runtime bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_effect_pipeline.py'
      - 'tools/claycode_base_runtime.py'
      - 'tools/claycode_effect_mainline_runtime_bridge.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - '.github/workflows/claycode-base-mainline-runtime-bridge.yml'

permissions:
  contents: write

concurrency:
  group: claycode-mainline-runtime-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Execute compiler effect IR through selected mainline runtime
        run: python tools/claycode_effect_mainline_runtime_bridge.py
      - name: Require semantic and runtime-trace differential agreement
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/BASE_COMPILER_MAINLINE_RUNTIME_BRIDGE_RECEIPT.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['pass'] is True, d['failures']
          assert d['runtime_version']=='claycode-base-runtime/0.4'
          assert d['output_mismatches']==0
          assert d['trace_failures']==0
          assert d['counts_as_target_acceptance'] is False
          assert d['counts_as_full_wp07_pass'] is False
          print('COMPILER_MAINLINE_RUNTIME_BRIDGE_PROXY_PASS')
          PY
      - name: Commit bridge receipt
        run: |
          git config user.name 'claycode-mainline-runtime-bridge'
          git config user.email 'claycode-mainline-runtime-bridge@users.noreply.github.com'
          git add research_entity/claycode/autonomous/BASE_COMPILER_MAINLINE_RUNTIME_BRIDGE_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record compiler mainline runtime bridge receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
