name: UnifiedDB EAP VPS Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unifieddb-eap-vps-benchmark.yml'
      - 'research_entity/harness/reference/unifieddb_emergent_preprocessor.py'
      - 'research_entity/harness/reference/unifieddb_emergent_cascade.py'
      - 'research_entity/harness/reference/test_unifieddb_emergent_assembly.py'
      - 'research_entity/harness/reference/test_unifieddb_emergent_cascade.py'
      - 'research_entity/harness/reference/benchmark_unifieddb_emergent_assembly.py'
      - 'research_entity/harness/reference/benchmark_unifieddb_emergent_cascade.py'
      - 'research_entity/harness/reference/unifieddb_query_plane.py'
      - 'research_entity/harness/reference/state_ledger.py'
      - 'research_entity/runtime/semantic_entity_resolver_v12.py'
      - 'research_entity/runtime/RAE_UNIFIEDDB_V12_ENTITY_RESOLUTION.sql'

permissions:
  contents: read

concurrency:
  group: unifieddb-eap-vps-benchmark
  cancel-in-progress: false

jobs:
  eap-vps:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout tested tree read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Run UnifiedDB query, EAP and fail-closed cascade regression suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            research_entity.harness.reference.test_unifieddb_query_plane \
            research_entity.harness.reference.test_unifieddb_emergent_assembly \
            research_entity.harness.reference.test_unifieddb_emergent_cascade

      - name: Run EAP model-input and held-out seed benchmarks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research_entity.harness.reference.benchmark_unifieddb_emergent_assembly \
            > /tmp/UNIFIEDDB_EAP_BENCHMARK.json
          python3 -m research_entity.harness.reference.benchmark_unifieddb_emergent_cascade \
            > /tmp/UNIFIEDDB_EAP_CASCADE_BENCHMARK.json
          python3 - <<'PY'
          import json, os, platform, socket
          from datetime import datetime, timezone
          from pathlib import Path
          bench=json.loads(Path('/tmp/UNIFIEDDB_EAP_BENCHMARK.json').read_text(encoding='utf-8'))
          cascade=json.loads(Path('/tmp/UNIFIEDDB_EAP_CASCADE_BENCHMARK.json').read_text(encoding='utf-8'))
          eap=bench['methods']['eap_hot_assembly']
          staged=bench['methods']['recursive_sql_staged_assembly']
          oob=bench['out_of_box_experiment']
          by_name={row['name']:row for row in cascade['results']}
          direct=by_name['direct_canonical_lexical_plus_eap']
          u12=by_name['u12_fail_closed_resolver_plus_eap']
          payload={
              'schema_version':'1.2',
              'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION',
              'scope':'UNIFIEDDB_EAP_MODEL_INPUT_PRELIMINARY_NOT_ANDREAS_TARGET_ACCEPTANCE',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'github_sha':os.environ.get('GITHUB_SHA',''),
              'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
              'github_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT',''),
              'runner_name':os.environ.get('RUNNER_NAME','unknown'),
              'runner_os':os.environ.get('RUNNER_OS','unknown'),
              'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
              'hostname':socket.gethostname(),
              'platform':platform.platform(),
              'python':platform.python_version(),
              'regression_suites':['unifieddb_query_plane','emergent_assembly','fail_closed_emergent_cascade'],
              'benchmark':bench,
              'held_out_seed_benchmark':cascade,
              'acceptance':{
                  'retrieval_quality_exact': eap['recall_at_12']==1.0 and eap['precision_at_12']==1.0 and eap['ndcg_at_12']==1.0,
                  'faster_than_staged_sql_p50': eap['latency_us']['p50'] < staged['latency_us']['p50'],
                  'speedup_vs_staged_sql_p50': eap['speedup_vs_recursive_sql_staged_p50'],
                  'negative_space_improves_precision': oob['gated_precision_at_2'] > oob['ungated_precision_at_2'],
                  'fail_closed_nl_seed_gate_regression': True,
                  'u12_held_out_decision_accuracy': u12['decision_accuracy'],
                  'direct_held_out_decision_accuracy': direct['decision_accuracy'],
                  'u12_improves_held_out_decision_accuracy': u12['decision_accuracy'] > direct['decision_accuracy'],
                  'u12_zero_false_open_on_abstention_cases': u12['false_open_rate_on_abstention_cases'] == 0.0,
                  'u12_exact_known_assembly': u12['known_exact_assembly_rate'] == 1.0,
              },
              'scope_guard':'A pass proves only these bounded synthetic model-input/seed benchmarks and regressions on this self-hosted Ubuntu runner; it is not universal database superiority or final Andreas target acceptance.',
              'authority_invariant':'model output != execution authority',
          }
          Path('/tmp/UNIFIEDDB_EAP_VPS_RECEIPT.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload['acceptance'],sort_keys=True))
          assert payload['acceptance']['retrieval_quality_exact']
          assert payload['acceptance']['negative_space_improves_precision']
          assert payload['acceptance']['u12_improves_held_out_decision_accuracy']
          assert payload['acceptance']['u12_zero_false_open_on_abstention_cases']
          assert payload['acceptance']['u12_exact_known_assembly']
          PY

      - name: Upload VPS receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unifieddb-eap-vps-${{ github.run_id }}
          path: /tmp/UNIFIEDDB_EAP_VPS_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

  persist-receipt:
    if: always()
    needs: eap-vps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout persistence lane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Download tested receipt
        uses: actions/download-artifact@v4
        with:
          name: unifieddb-eap-vps-${{ github.run_id }}
          path: /tmp/unifieddb-eap

      - name: Validate and persist receipt
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source=Path('/tmp/unifieddb-eap/UNIFIEDDB_EAP_VPS_RECEIPT.json')
          data=json.loads(source.read_text(encoding='utf-8'))
          assert data['schema_version']=='1.2'
          assert data['evidence_class']=='REAL_SELF_HOSTED_UBUNTU_EXECUTION'
          assert data['github_sha']==os.environ['TESTED_SHA']
          assert data['authority_invariant']=='model output != execution authority'
          assert 'fail_closed_emergent_cascade' in data['regression_suites']
          root=Path('research_entity/state/system/unifieddb_eap_benchmark')
          root.mkdir(parents=True,exist_ok=True)
          (root/'LATEST.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (root/f"{data['github_run_id']}.json").write_text(json.dumps(data,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name 'clay-eap-benchmark'
          git config user.email 'clay-eap-benchmark@users.noreply.github.com'
          git add research_entity/state/system/unifieddb_eap_benchmark/
          git commit -m "evidence(unifieddb): persist EAP VPS benchmark ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
