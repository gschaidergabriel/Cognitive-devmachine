name: ClayVerse artefact CI

# Manual until GitHub-hosted runners are available again. The first automatic
# run (31995291479) was rejected before any step because of account billing /
# spending-limit state, so push-triggered runs would only create false-red noise.
on:
  workflow_dispatch:
    inputs:
      entityos_release_tag:
        description: 'Same-repository release tag containing exactly one asset named EntityOS'
        required: true
        type: string
      entityos_sha256:
        description: 'Expected lowercase/uppercase 64-hex SHA-256 of the EntityOS asset'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 'the artefact'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'the artefact/requirements.txt'
      - name: Stage exact EntityOS release asset
        env:
          GH_TOKEN: ${{ github.token }}
          ENTITYOS_RELEASE_TAG: ${{ inputs.entityos_release_tag }}
          ENTITYOS_SHA256_INPUT: ${{ inputs.entityos_sha256 }}
        run: |
          set -euo pipefail
          entityos_sha256=$(printf '%s' "$ENTITYOS_SHA256_INPUT" | tr 'A-F' 'a-f')
          case "$entityos_sha256" in
            *[!0-9a-f]*|'') echo 'invalid EntityOS SHA-256' >&2; exit 64 ;;
          esac
          test "${#entityos_sha256}" -eq 64
          rm -rf /tmp/clayverse-entityos-release
          mkdir -p /tmp/clayverse-entityos-release
          gh release download "$ENTITYOS_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'EntityOS' \
            --dir /tmp/clayverse-entityos-release
          test -f /tmp/clayverse-entityos-release/EntityOS
          test "$(find /tmp/clayverse-entityos-release -maxdepth 1 -type f -name 'EntityOS' | wc -l)" -eq 1
          sh ./stage-entityos.sh /tmp/clayverse-entityos-release/EntityOS "$entityos_sha256"
          echo "ENTITYOS_SHA256=$entityos_sha256" >> "$GITHUB_ENV"
          printf 'entityos_release_tag=%s entityos_sha256=%s\n' "$ENTITYOS_RELEASE_TAG" "$entityos_sha256"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run full candidate tests
        run: python -m pytest -q
      - name: Build exact OCI candidate
        run: docker build --pull=false --build-arg "ENTITYOS_SHA256=${ENTITYOS_SHA256}" -t clayverse:${GITHUB_SHA} .
      - name: Verify packaged runtimes, EntityOS bytes and non-root image
        run: |
          docker run --rm --entrypoint python clayverse:${GITHUB_SHA} --version
          docker run --rm --entrypoint node clayverse:${GITHUB_SHA} --version
          docker run --rm --entrypoint claude clayverse:${GITHUB_SHA} --version
          embedded_sha=$(docker run --rm --entrypoint python clayverse:${GITHUB_SHA} -c "import hashlib; print(hashlib.sha256(open('/opt/entityos/EntityOS','rb').read()).hexdigest())")
          test "$embedded_sha" = "$ENTITYOS_SHA256"
          test "$(docker image inspect clayverse:${GITHUB_SHA} --format '{{.Config.User}}')" = "clayverse"
      - name: Run packaged state self-check
        run: docker run --rm clayverse:${GITHUB_SHA} --once
      - name: Verify production startup fails closed without identity and Clerk config
        run: |
          set +e
          docker run --rm clayverse:${GITHUB_SHA} >/tmp/clayverse-no-config.log 2>&1
          rc=$?
          set -e
          cat /tmp/clayverse-no-config.log
          test "$rc" -ne 0
          grep -q 'CLAYVERSE_CLERK_MAP_JSON is required' /tmp/clayverse-no-config.log
      - name: Capture exact image identity
        env:
          ENTITYOS_RELEASE_TAG: ${{ inputs.entityos_release_tag }}
        run: |
          docker image inspect clayverse:${GITHUB_SHA} --format 'repo_digest={{json .RepoDigests}} image_id={{.Id}} user={{.Config.User}}' | tee /tmp/clayverse-image-receipt.txt
          printf 'source_sha=%s entityos_release_tag=%s entityos_sha256=%s\n' "$GITHUB_SHA" "$ENTITYOS_RELEASE_TAG" "$ENTITYOS_SHA256" | tee -a /tmp/clayverse-image-receipt.txt
