name: UnifiedDB ClayGraph Ranker Hostinger

on:
  pull_request:
    paths:
      - '.github/workflows/unifieddb-claygraph-ranker-hostinger.yml'
      - 'research_entity/runtime/verified_claygraph_ranker.py'
      - 'research_entity/runtime/test_verified_claygraph_ranker.py'
      - 'research_entity/runtime/benchmark_verified_claygraph_ranker.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unifieddb-claygraph-ranker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ranker-hostinger:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact tested tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Capture Ubuntu runner metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/claygraph-ranker
          {
            echo "github_sha=${GITHUB_SHA}"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
            uname -a
            python3 --version
            python3 - <<'PY'
          import platform,sqlite3
          print('platform=',platform.platform())
          print('machine=',platform.machine())
          print('processor=',platform.processor() or 'UNKNOWN')
          print('sqlite=',sqlite3.sqlite_version)
          PY
            command -v lscpu >/dev/null && lscpu || true
            command -v free >/dev/null && free -h || true
          } | tee /tmp/claygraph-ranker/environment.txt

      - name: Run current V16 recovery guards
        working-directory: research_entity/runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_semantic_access_pulse_v16.SegmentedPulseV16Tests

      - name: Run verified ClayGraph ranker falsifiers
        working-directory: research_entity/runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_verified_claygraph_ranker.VerifiedClayGraphRankerTests

      - name: Run relation-target accuracy benchmark
        working-directory: research_entity/runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmark_verified_claygraph_ranker.py \
            | tee /tmp/claygraph-ranker/benchmark.json

      - name: Build bounded execution receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,platform,socket,sqlite3
          from datetime import datetime,timezone
          from pathlib import Path
          bench=json.loads(Path('/tmp/claygraph-ranker/benchmark.json').read_text())
          q=bench['quality']
          receipt={
            'schema_version':'1.0',
            'receipt_id':'U16-CLAYGRAPH-RANKER-'+os.environ['GITHUB_RUN_ID'],
            'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION_SYNTHETIC_RELATION_TARGET_SCOPE',
            'created_at':datetime.now(timezone.utc).isoformat(),
            'github_sha':os.environ['GITHUB_SHA'],
            'github_run_id':os.environ['GITHUB_RUN_ID'],
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),
            'runner_os':os.environ.get('RUNNER_OS','unknown'),
            'runner_arch':os.environ.get('RUNNER_ARCH','unknown'),
            'hostname':socket.gethostname(),
            'platform':platform.platform(),
            'python':platform.python_version(),
            'sqlite':sqlite3.sqlite_version,
            'tests':{'v16_recovery':8,'verified_graph_ranker':8,'status':'PASS_IF_JOB_REACHES_RECEIPT'},
            'benchmark':bench,
            'acceptance':{
              'ranker_hit1_exact':q['verified_claygraph_query_ranker']['hit_at_1']==1.0,
              'ranker_not_worse_than_fts':q['verified_claygraph_query_ranker']['hit_at_1']>=q['sqlite_fts5_bm25']['hit_at_1'],
              'ranker_not_worse_than_plain_graph':q['verified_claygraph_query_ranker']['hit_at_1']>=q['plain_sql_graph_weight']['hit_at_1'],
            },
            'authority':'ASSEMBLY_CONTEXT_ONLY_NO_EFFECT_AUTHORITY',
            'scope_guard':'This is self-hosted Ubuntu evidence for a frozen synthetic one-hop relation-target workload. It does not prove universal database superiority, automatic entity resolution, or Andreas target acceptance.',
          }
          assert all(receipt['acceptance'].values())
          Path('/tmp/claygraph-ranker/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt['acceptance'],sort_keys=True))
          PY

      - name: Upload raw Hostinger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unifieddb-claygraph-ranker-${{ github.run_id }}
          path: /tmp/claygraph-ranker/
          if-no-files-found: error
          retention-days: 30
