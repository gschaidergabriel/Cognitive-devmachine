name: ClayCode WP02 cross-canonicalizer tripwire

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/claycode_base_canonicalizer.py'
      - 'tools/claycode_base_canonicalizer_validation.py'
      - 'tools/claycode_wp02_cross_canonicalizer_parity.py'
      - 'tools/claycode_wp02_strict_local_closure_v2.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V17_DECLARATIVE_TRIVIA_SAFE.lark'
      - '.github/workflows/claycode-wp02-cross-canon-tripwire.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-hosted-cross-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact parser dependencies
        run: python -m pip install --disable-pip-version-check 'lark==1.3.1' 'interegular==0.3.3'
      - name: Strict cross-canonicalizer parity + lesion rescue
        run: |
          python tools/claycode_wp02_cross_canonicalizer_parity.py \
            --strict \
            --output research_entity/claycode/base/receipts/CI_WP02_CROSS_CANON_PARITY.json
      - name: Production canonicalizer receipt with coupled parity
        run: python tools/claycode_base_canonicalizer_validation.py
      - name: Full selected-WP02 strict closure preflight
        run: |
          python tools/claycode_wp02_strict_local_closure_v2.py \
            --allow-ci \
            --output research_entity/claycode/base/receipts/CI_WP02_SELECTED_GRAMMAR_CLOSURE.json
      - name: Upload exact receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp02-cross-canon-receipts
          if-no-files-found: error
          path: |
            research_entity/claycode/base/receipts/CI_WP02_CROSS_CANON_PARITY.json
            research_entity/claycode/base/receipts/CI_WP02_SELECTED_GRAMMAR_CLOSURE.json
            research_entity/claycode/autonomous/BASE_CANONICALIZER_RECEIPT.json
            research_entity/claycode/autonomous/BASE_CROSS_CANON_PARITY_RECEIPT.json
