name: ClayCode WP11 WP12 conformance corpus gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_pure_toolchain.py'
      - 'tools/claycode_wp11_wp12_conformance_corpus.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - '.github/workflows/claycode-wp11-wp12-conformance-corpus.yml'

permissions:
  contents: write

concurrency:
  group: claycode-wp11-wp12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Generate and execute conformance corpus
        run: python tools/claycode_wp11_wp12_conformance_corpus.py
      - name: Commit corpus, manifest and receipt
        if: always()
        run: |
          git config user.name 'claycode-wp11-wp12'
          git config user.email 'claycode-wp11-wp12@users.noreply.github.com'
          for p in \
            research_entity/claycode/corpus/base_v1/BASE_SEMANTIC_CORPUS_V1.jsonl \
            research_entity/claycode/corpus/base_v1/BASE_SEMANTIC_CORPUS_V1_MANIFEST.json \
            research_entity/claycode/autonomous/WP11_WP12_CONFORMANCE_CORPUS_RECEIPT.json; do
            test -f "$p" && git add "$p"
          done
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record WP11 WP12 conformance corpus receipts'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
