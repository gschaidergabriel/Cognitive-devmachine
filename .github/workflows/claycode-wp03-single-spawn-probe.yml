name: ClayCode WP03 Single-Spawn Discriminator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claycode-wp03-single-spawn-probe.yml'
      - 'tools/claycode_wp03_type_decl_candidate.py'
      - 'tools/claycode_wp03_single_spawn_probe.py'
      - 'tools/claycode_base_frontend.py'
      - 'tools/claycode_base_typed_ir.py'
      - 'tools/claycode_structured_backend.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V18_REWARD_RELATIONS.lark'
      - 'research_entity/global/FRANK_V0_1_SINGLE_SPAWN_GLOBAL_BUSY_LEASE_DIRECTIVE.clay'

permissions:
  contents: read

concurrency:
  group: claycode-wp03-single-spawn-discriminator
  cancel-in-progress: false

jobs:
  target-vps-probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Install isolated parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          DEPS_DIR="${RUNNER_TEMP:-/tmp}/claycode-wp03-single-spawn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          rm -rf "$DEPS_DIR"
          python3 -m pip install --target "$DEPS_DIR" --disable-pip-version-check --no-input --no-compile \
            'lark==1.3.1' 'interegular==0.3.3'
          echo "DEPS_DIR=$DEPS_DIR" >> "$GITHUB_ENV"

      - name: Execute typed-identity and atomic-boundary discriminator
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONNOUSERSITE=1
          export PYTHONPATH="$DEPS_DIR:$GITHUB_WORKSPACE/tools"
          python3 tools/claycode_wp03_single_spawn_probe.py > /tmp/CLAYCODE_WP03_SINGLE_SPAWN_PROBE.json
          python3 - <<'PY'
          import json, os, platform, socket
          from datetime import datetime, timezone
          from pathlib import Path

          src = Path('/tmp/CLAYCODE_WP03_SINGLE_SPAWN_PROBE.json')
          payload = json.loads(src.read_text(encoding='utf-8'))
          assert payload['pass'] is True, payload
          assert payload['baseline_current_typed_ir']['reproduced'] is True
          assert payload['candidate_type_decl_ir']['pass'] is True
          assert payload['structured_atomic_boundary']['gap_reproduced'] is True
          assert payload['sqlite_host_reference_control']['pass'] is True
          payload['evidence_class'] = 'REAL_SELF_HOSTED_TARGET_VPS_EXECUTABLE_DISCRIMINATOR'
          payload['created_at'] = datetime.now(timezone.utc).isoformat()
          payload['github_sha'] = os.environ.get('GITHUB_SHA','')
          payload['github_run_id'] = os.environ.get('GITHUB_RUN_ID','')
          payload['github_run_attempt'] = os.environ.get('GITHUB_RUN_ATTEMPT','')
          payload['hostname'] = socket.gethostname()
          payload['runner_name'] = os.environ.get('RUNNER_NAME','unknown')
          payload['runner_os'] = os.environ.get('RUNNER_OS','unknown')
          payload['runner_arch'] = os.environ.get('RUNNER_ARCH','unknown')
          payload['platform'] = platform.platform()
          payload['python'] = platform.python_version()
          src.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print(json.dumps({
              'pass': payload['pass'],
              'baseline_gap': payload['baseline_current_typed_ir']['reproduced'],
              'candidate_fix': payload['candidate_type_decl_ir']['pass'],
              'atomic_gap': payload['structured_atomic_boundary']['gap_reproduced'],
              'sqlite_control': payload['sqlite_host_reference_control']['pass'],
              'sqlite_rounds': payload['sqlite_host_reference_control']['rounds_completed'],
          }, sort_keys=True))
          PY

      - name: Remove isolated dependencies
        if: always()
        shell: bash
        run: |
          rm -rf "${DEPS_DIR:-/__missing__}"

      - name: Upload exact target-VPS receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claycode-wp03-single-spawn-${{ github.run_id }}
          path: /tmp/CLAYCODE_WP03_SINGLE_SPAWN_PROBE.json
          if-no-files-found: error
          retention-days: 30

  persist-receipt:
    if: always()
    needs: target-vps-probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout persistence lane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Download target receipt
        uses: actions/download-artifact@v4
        with:
          name: claycode-wp03-single-spawn-${{ github.run_id }}
          path: /tmp/claycode-wp03-single-spawn

      - name: Validate exact SHA and persist receipt
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          src=/tmp/claycode-wp03-single-spawn/CLAYCODE_WP03_SINGLE_SPAWN_PROBE.json
          python3 - "$src" "$TESTED_SHA" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p['schema_version']=='1.0'
          assert p['evidence_class']=='REAL_SELF_HOSTED_TARGET_VPS_EXECUTABLE_DISCRIMINATOR'
          assert p['github_sha']==sys.argv[2], (p['github_sha'],sys.argv[2])
          assert p['pass'] is True
          assert p['baseline_current_typed_ir']['reproduced'] is True
          assert p['candidate_type_decl_ir']['pass'] is True
          assert p['structured_atomic_boundary']['gap_reproduced'] is True
          assert p['sqlite_host_reference_control']['pass'] is True
          assert p['sqlite_host_reference_control']['rounds_completed']==32
          PY

          mkdir -p research_entity/claycode/base/receipts
          cp "$src" "research_entity/claycode/base/receipts/CLAYCODE_WP03_SINGLE_SPAWN_${RUN_ID}.json"
          cp "$src" research_entity/claycode/base/receipts/CLAYCODE_WP03_SINGLE_SPAWN_LATEST.json

          git config user.name 'clay-ci-receipt-writer'
          git config user.email 'clay-ci-receipt-writer@users.noreply.github.com'
          git add "research_entity/claycode/base/receipts/CLAYCODE_WP03_SINGLE_SPAWN_${RUN_ID}.json" \
                  research_entity/claycode/base/receipts/CLAYCODE_WP03_SINGLE_SPAWN_LATEST.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(claycode): persist WP03 single-spawn receipt ${RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
