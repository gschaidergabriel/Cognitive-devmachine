name: Execution Surface Resolution CI

on:
  pull_request:
    paths:
      - 'CLAY_EXECUTION_AUTHORITY.md'
      - 'AUTHORITATIVE_STATE_RESOLUTION.md'
      - 'AGENTS.md'
      - 'research_entity/continuity/BOOTSTRAP_MINIMAL.json'
      - 'research_entity/rooms/PROGRAM_STATE.json'
      - 'research_entity/continuity/VERCEL_SANDBOX_EXECUTION_PATH_CURRENT.md'
      - 'governance/EXECUTION_SURFACE_**'
      - 'governance/CURRENT_EXECUTION_SURFACE_PROJECTIONS_V1.json'
      - 'tools/execution_surface_resolver_v1.py'
      - 'tools/current_execution_authority_lint_v1.py'
      - 'tests/test_execution_surface_resolver_v1.py'
      - 'tests/test_current_execution_authority_lint_v1.py'
      - '.github/workflows/execution-surface-resolution-ci.yml'
  push:
    branches: [main]
    paths:
      - 'CLAY_EXECUTION_AUTHORITY.md'
      - 'AUTHORITATIVE_STATE_RESOLUTION.md'
      - 'AGENTS.md'
      - 'research_entity/continuity/BOOTSTRAP_MINIMAL.json'
      - 'research_entity/rooms/PROGRAM_STATE.json'
      - 'research_entity/continuity/VERCEL_SANDBOX_EXECUTION_PATH_CURRENT.md'
      - 'governance/EXECUTION_SURFACE_**'
      - 'governance/CURRENT_EXECUTION_SURFACE_PROJECTIONS_V1.json'
      - 'tools/execution_surface_resolver_v1.py'
      - 'tools/current_execution_authority_lint_v1.py'
      - 'tests/test_execution_surface_resolver_v1.py'
      - 'tests/test_current_execution_authority_lint_v1.py'
      - '.github/workflows/execution-surface-resolution-ci.yml'

permissions:
  contents: read

jobs:
  resolver-and-currentness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run execution-surface resolver tests
        run: python3 -m unittest tests.test_execution_surface_resolver_v1 -v
      - name: Run authority-currentness tests
        run: python3 -m unittest tests.test_current_execution_authority_lint_v1 -v
      - name: Lint current-facing execution authority projections
        run: python3 tools/current_execution_authority_lint_v1.py
