name: ClayVerse VPS rootless QEMU TCG disposable guest smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clayverse-vps-qemu-rootless-stage-preflight.yml'

permissions:
  contents: read

concurrency:
  group: clayverse-vps-qemu-rootless-tcg-guest
  cancel-in-progress: false

jobs:
  rootless-qemu-tcg-guest:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Stage rootless QEMU dependency closure and boot fresh networkless guest
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work="/tmp/clayverse-qemu-rootless-${GITHUB_RUN_ID}"
          debs="$work/debs"
          root="$work/root"
          guest="$work/guest"
          receipt="/tmp/clayverse-qemu-rootless-${GITHUB_RUN_ID}.json"
          serial="$guest/serial.log"
          base="$guest/ubuntu-noble-amd64.img"
          overlay="$guest/overlay.qcow2"
          seed="$guest/seed.iso"
          base_url='https://cloud-images.ubuntu.com/releases/noble/release-20260725'
          image_name='ubuntu-24.04-server-cloudimg-amd64.img'
          mkdir -p "$debs" "$root" "$guest"
          qemu_pid=''
          cleanup(){
            rc=$?
            if [ -n "$qemu_pid" ] && kill -0 "$qemu_pid" 2>/dev/null; then
              kill -TERM "$qemu_pid" 2>/dev/null || true
              sleep 1
              kill -KILL "$qemu_pid" 2>/dev/null || true
            fi
            rm -rf "$work"
            exit "$rc"
          }
          trap cleanup EXIT INT TERM

          for tool in apt apt-cache dpkg-deb sha256sum curl gpgv awk sed sort python3 timeout; do command -v "$tool" >/dev/null; done
          uid=$(id -u)
          sudo_noninteractive=false
          if command -v sudo >/dev/null && sudo -n true 2>/dev/null; then sudo_noninteractive=true; fi

          # Host mutation is intentionally limited to user-owned temporary files. Resolve and
          # download the complete non-recommended runtime dependency closure from the host's
          # already configured Ubuntu APT metadata; never apt install and never sudo.
          seeds=(qemu-system-x86 qemu-system-common qemu-system-data qemu-utils seabios genisoimage ubuntu-cloudimage-keyring)
          closure="$work/package-closure.txt"
          apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances "${seeds[@]}" \
            | sed -n -E '/^[[:alnum:]][[:alnum:]+.-]*(:[[:alnum:]_-]+)?$/p' \
            | LC_ALL=C sort -u >"$closure"
          for seed_pkg in "${seeds[@]}"; do grep -qx "$seed_pkg" "$closure" || printf '%s\n' "$seed_pkg" >>"$closure"; done
          LC_ALL=C sort -u -o "$closure" "$closure"
          test -s "$closure"

          policy="$work/policy.txt"
          : >"$policy"
          while IFS= read -r p; do apt-cache policy "$p" >>"$policy" || true; done <"$closure"

          download_fail="$work/download-fail.txt"
          : >"$download_fail"
          while IFS= read -r p; do
            if ! (cd "$debs" && apt download "$p" >/dev/null 2>>"$work/apt-download.err"); then
              printf '%s\n' "$p" >>"$download_fail"
            fi
          done <"$closure"
          if [ -s "$download_fail" ]; then
            echo 'ROOTLESS_QEMU_DEPENDENCY_DOWNLOAD_FAILED' >&2
            cat "$download_fail" >&2
            exit 31
          fi

          shopt -s nullglob
          files=("$debs"/*.deb)
          test "${#files[@]}" -ge 8
          for f in "${files[@]}"; do dpkg-deb -x "$f" "$root"; done
          sha256sum "${files[@]}" | LC_ALL=C sort >"$work/deb-sha256.txt"

          export PATH="$root/usr/bin:$root/bin:$PATH"
          export LD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu:$root/usr/lib:$root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          qemu="$root/usr/bin/qemu-system-x86_64"
          qemu_img="$root/usr/bin/qemu-img"
          geniso="$root/usr/bin/genisoimage"
          keyring="$root/usr/share/keyrings/ubuntu-cloudimage-keyring.gpg"
          test -x "$qemu" && test -x "$qemu_img" && test -x "$geniso" && test -r "$keyring"

          ldd "$qemu" >"$work/qemu-ldd.txt" 2>&1 || true
          missing=$(grep -c 'not found' "$work/qemu-ldd.txt" || true)
          if [ "$missing" -ne 0 ]; then
            grep 'not found' "$work/qemu-ldd.txt" >&2 || true
            exit 32
          fi
          qemu_version=$($qemu --version | head -n1)
          qemu_img_version=$($qemu_img --version | head -n1)

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$base_url/SHA256SUMS" -o "$guest/SHA256SUMS"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$base_url/SHA256SUMS.gpg" -o "$guest/SHA256SUMS.gpg"
          gpgv --keyring "$keyring" "$guest/SHA256SUMS.gpg" "$guest/SHA256SUMS"
          expected=$(awk -v f="*$image_name" '$2==f {print $1}' "$guest/SHA256SUMS")
          printf '%s' "$expected" | grep -Eq '^[0-9a-f]{64}$'
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$base_url/$image_name" -o "$base"
          printf '%s  %s\n' "$expected" "$base" | sha256sum -c -
          chmod 0444 "$base"

          "$qemu_img" create -q -f qcow2 -F qcow2 -b "$base" "$overlay"
          cat >"$guest/user-data" <<'EOF'
          #cloud-config
          network:
            config: disabled
          ssh_pwauth: false
          disable_root: true
          runcmd:
            - [sh, -c, 'printf "CLAYVERSE_QEMU_TCG_GUEST_OK kernel=%s arch=%s machine=%s\\n" "$(uname -r)" "$(uname -m)" "$(cat /etc/machine-id)" > /dev/ttyS0']
            - [sh, -c, 'sync; poweroff -f']
          EOF
          cat >"$guest/meta-data" <<EOF
          instance-id: clayverse-qemu-${GITHUB_RUN_ID}
          local-hostname: clayverse-qemu-guest
          EOF
          "$geniso" -quiet -output "$seed" -volid cidata -joliet -rock "$guest/user-data" "$guest/meta-data"

          "$qemu" -accel tcg,thread=multi -machine q35 -cpu max -smp 2 -m 2048 \
            -L "$root/usr/share/qemu" \
            -drive "file=$overlay,if=virtio,format=qcow2,cache=unsafe" \
            -drive "file=$seed,if=virtio,format=raw,readonly=on" \
            -net none -display none -monitor none -serial "file:$serial" \
            -no-reboot -sandbox on,obsolete=deny,elevateprivileges=deny,spawn=deny,resourcecontrol=deny &
          qemu_pid=$!
          qemu_rc=0
          if ! timeout --foreground 420s bash -c "while kill -0 $qemu_pid 2>/dev/null; do sleep 2; done"; then
            qemu_rc=124
            kill -TERM "$qemu_pid" 2>/dev/null || true
            sleep 1
            kill -KILL "$qemu_pid" 2>/dev/null || true
          else
            wait "$qemu_pid" || qemu_rc=$?
          fi
          qemu_pid=''

          test -f "$serial"
          serial_sha=$(sha256sum "$serial" | awk '{print $1}')
          marker=$(grep -aE '^CLAYVERSE_QEMU_TCG_GUEST_OK kernel=[^ ]+ arch=x86_64 machine=[0-9a-f-]+$' "$serial" | tail -n1 || true)
          guest_started=false
          if [ -n "$marker" ] && [ "$qemu_rc" -eq 0 ]; then guest_started=true; fi

          policy_sha=$(sha256sum "$policy" | awk '{print $1}')
          closure_sha=$(sha256sum "$closure" | awk '{print $1}')
          package_set_sha=$(sha256sum "$work/deb-sha256.txt" | awk '{print $1}')
          ldd_sha=$(sha256sum "$work/qemu-ldd.txt" | awk '{print $1}')
          python3 - "$receipt" "$uid" "$sudo_noninteractive" "${#files[@]}" "$policy_sha" "$closure_sha" "$package_set_sha" "$ldd_sha" "$qemu_version" "$qemu_img_version" "$expected" "$serial_sha" "$qemu_rc" "$guest_started" "$marker" <<'PY'
          import json, os, pathlib, sys
          (out,uid,sudo_ok,count,policy_sha,closure_sha,pkg_sha,ldd_sha,qemu_version,qemu_img_version,image_sha,serial_sha,qemu_rc,guest_started,marker)=sys.argv[1:]
          payload={
            'schema':'ClayVerseVpsRootlessQemuTcgGuestSmoke/v1',
            'github_sha':os.environ.get('GITHUB_SHA',''),
            'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
            'runner_name':os.environ.get('RUNNER_NAME','unknown'),
            'host_uid':int(uid),
            'sudo_noninteractive':sudo_ok=='true',
            'orchestrator_install_mode':'ROOTLESS_APT_DOWNLOAD_AND_DPKG_EXTRACT',
            'host_packages_changed':False,
            'staged_deb_count':int(count),
            'apt_policy_sha256':policy_sha,
            'package_closure_sha256':closure_sha,
            'staged_package_ledger_sha256':pkg_sha,
            'qemu_ldd_sha256':ldd_sha,
            'qemu_missing_library_count':0,
            'qemu_version':qemu_version,
            'qemu_img_version':qemu_img_version,
            'executor_type':'QEMU_TCG',
            'kvm_required':False,
            'guest_base':'ubuntu-24.04-server-cloudimg-amd64.img@release-20260725',
            'guest_base_sha256':image_sha,
            'guest_kernel_marker':marker or None,
            'guest_network_mode':'NONE',
            'guest_memory_mib':2048,
            'guest_vcpus':2,
            'guest_disk':'READ_ONLY_VERIFIED_BASE_PLUS_DISPOSABLE_QCOW2_OVERLAY',
            'qemu_sandbox':'on,obsolete=deny,elevateprivileges=deny,spawn=deny,resourcecontrol=deny',
            'qemu_exit_status':int(qemu_rc),
            'serial_log_sha256':serial_sha,
            'guest_started':guest_started=='true',
            'orchestration_only':True,
            'product_code_executed_on_host':False,
            'host_docker_used':False,
            'cleanup_required':True,
            'runtime_credit':0,
            'whole_product_credit':0,
            'unusual_experiment_count_added':0,
          }
          pathlib.Path(out).write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,sort_keys=True))
          if not payload['guest_started']:
            raise SystemExit(42)
          PY

      - name: Upload bounded rootless QEMU guest receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clayverse-vps-qemu-rootless-${{ github.run_id }}
          path: /tmp/clayverse-qemu-rootless-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7
