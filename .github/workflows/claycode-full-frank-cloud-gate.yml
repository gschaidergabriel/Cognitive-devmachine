name: ClayCode aggregate Full-FRANK cloud semantic gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_full_frank_cloud_gate.py'
      - 'tools/claycode_full_frank_active_assembly_validation.py'
      - 'tools/claycode_wp13_active_assembly_h2.py'
      - 'tools/claycode_wp13_h3_consolidation.py'
      - 'tools/claycode_wp13_frank_handoff_validation.py'
      - 'tools/claycode_base_frank_block_toolchain.py'
      - 'tools/claycode_structured_backend.py'
      - 'tools/claycode_base_record_selection.py'
      - 'tools/claycode_base_effect_pipeline.py'
      - 'tools/claycode_base_runtime.py'
      - 'research_entity/harness/reference/active_assembly.py'
      - 'research_entity/claycode/base/examples/FRANK_ACTIVE_ASSEMBLY_FULL_V1.clay'
      - 'research_entity/claycode/base/examples/FRANK_ACTIVE_ASSEMBLY_H2_V1.clay'
      - 'research_entity/claycode/base/examples/FRANK_GRT_FRAME_V1.clay'
      - 'research_entity/claycode/apps/frank_active_assembly_packet_score_v1.clay'
      - '.github/workflows/claycode-full-frank-cloud-gate.yml'
  pull_request:
    paths:
      - 'tools/claycode_full_frank_cloud_gate.py'
      - 'tools/claycode_full_frank_active_assembly_validation.py'
      - 'tools/claycode_wp13_active_assembly_h2.py'
      - 'tools/claycode_wp13_h3_consolidation.py'
      - 'tools/claycode_wp13_frank_handoff_validation.py'
      - 'tools/claycode_base_frank_block_toolchain.py'
      - 'tools/claycode_structured_backend.py'
      - 'tools/claycode_base_record_selection.py'
      - 'tools/claycode_base_effect_pipeline.py'
      - 'tools/claycode_base_runtime.py'
      - 'research_entity/harness/reference/active_assembly.py'
      - 'research_entity/claycode/base/examples/FRANK_ACTIVE_ASSEMBLY_FULL_V1.clay'
      - 'research_entity/claycode/base/examples/FRANK_ACTIVE_ASSEMBLY_H2_V1.clay'
      - 'research_entity/claycode/base/examples/FRANK_GRT_FRAME_V1.clay'
      - 'research_entity/claycode/apps/frank_active_assembly_packet_score_v1.clay'
      - '.github/workflows/claycode-full-frank-cloud-gate.yml'
      - 'research_entity/claycode/diagnostics/**'

permissions:
  contents: write

concurrency:
  group: claycode-full-frank-cloud-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Show native compiler
        run: cc --version
      - name: Execute all five cloud-safe Full-FRANK semantic routes
        run: python tools/claycode_full_frank_cloud_gate.py || true
      - name: Commit all generated evidence, including failures
        if: always() && github.event_name != 'pull_request'
        run: |
          test -f research_entity/claycode/autonomous/FULL_FRANK_CLOUD_SEMANTIC_GATE.json
          git config user.name 'claycode-full-frank-cloud-gate'
          git config user.email 'claycode-full-frank-cloud-gate@users.noreply.github.com'
          for p in \
            research_entity/claycode/autonomous/FULL_FRANK_CLOUD_SEMANTIC_GATE.json \
            research_entity/claycode/autonomous/FULL_FRANK_ACTIVE_ASSEMBLY_STRUCTURED_RECEIPT.json \
            research_entity/claycode/autonomous/FRANK_ACTIVE_ASSEMBLY_H2_RECEIPT.json \
            research_entity/claycode/autonomous/FRANK_ACTIVE_ASSEMBLY_H3_CONSOLIDATION_RECEIPT.json \
            research_entity/claycode/autonomous/WP13_FRANK_PACKET_SCORE_HANDOFF_RECEIPT.json \
            research_entity/claycode/autonomous/FRANK_GRT_BLOCK_TOOLCHAIN_RECEIPT.json; do
            test -f "$p" && git add "$p"
          done
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record aggregate Full-FRANK semantic evidence'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1
      - name: Enforce aggregate verdict without target promotion
        if: always()
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/FULL_FRANK_CLOUD_SEMANTIC_GATE.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['pass'] is True, d
          assert d['counts_as_target_acceptance'] is False
          assert d['counts_as_wp13_pass'] is False
          assert all(d['invariants'].values()), d['invariants']
          print('FULL_FRANK_CLOUD_SEMANTIC_GATE=PASS')
          PY
