name: GO877 collective metrics freshness dispatch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  implement-and-test:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] collective metrics freshness v1' && github.event.issue.user.login == 'gschaidergabriel'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      BRANCH: go877/collective-metrics-freshness-gpt56sol-20260825
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Re-enter current main and create fixed work branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --detach origin/main
          git switch -C "$BRANCH"
          git config user.name 'clay-go877-runner'
          git config user.email 'clay-go877-runner@users.noreply.github.com'
          git status --short
          git rev-parse HEAD > /tmp/go877-base-head

      - name: Apply freshness fail-closed delta
        shell: bash
        run: |
          set -euo pipefail
