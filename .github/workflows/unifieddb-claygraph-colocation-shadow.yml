name: UnifiedDB ClayGraph Colocation Shadow

on:
  pull_request:
    branches: [main]
    paths:
      - 'research_entity/experiments/unifieddb_claygraph_colocation/**'
      - '.github/workflows/unifieddb-claygraph-colocation-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  colocation-shadow:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Runtime metadata
        run: |
          set -euo pipefail
          uname -a
          python3 --version
          python3 - <<'PY'
          import platform, sqlite3
          print('platform=', platform.platform())
          print('machine=', platform.machine())
          print('processor=', platform.processor() or 'UNKNOWN')
          print('sqlite=', sqlite3.sqlite_version)
          PY
      - name: Compile and invariants
        run: |
          set -euo pipefail
          python3 -m py_compile research_entity/experiments/unifieddb_claygraph_colocation/benchmark_colocation_v1.py
          python3 -m py_compile research_entity/experiments/unifieddb_claygraph_colocation/build_colocated_database_v1.py
          python3 -m py_compile research_entity/experiments/unifieddb_claygraph_colocation/benchmark_snapshot_coherence_v1.py
          python3 -m py_compile research_entity/experiments/unifieddb_claygraph_colocation/benchmark_cross_store_epoch_guard_v1.py
          python3 -m unittest research_entity.experiments.unifieddb_claygraph_colocation.test_colocation_v1 -v
      - name: Matched co-location benchmark
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 research_entity/experiments/unifieddb_claygraph_colocation/benchmark_colocation_v1.py --transactions 1000 --output artifacts/colocation_v1.json
          cat artifacts/colocation_v1.json
      - name: Cross-file WAL snapshot-coherence falsifier
        run: |
          set -euo pipefail
          python3 research_entity/experiments/unifieddb_claygraph_colocation/benchmark_snapshot_coherence_v1.py --trials 100 --output artifacts/snapshot_coherence_v1.json
          cat artifacts/snapshot_coherence_v1.json
      - name: Guarded two-store counterbaseline
        run: |
          set -euo pipefail
          python3 research_entity/experiments/unifieddb_claygraph_colocation/benchmark_cross_store_epoch_guard_v1.py --trials 100 --steady-reads 5000 --output artifacts/cross_store_epoch_guard_v1.json
          cat artifacts/cross_store_epoch_guard_v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unifieddb-claygraph-colocation-${{ github.sha }}
          path: artifacts/*.json
          if-no-files-found: error
