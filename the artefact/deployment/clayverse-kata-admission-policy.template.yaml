# TEMPLATE: fail-closed admission fence for the final ClayVerse Kata profile.
#
# This is deployment security material, not a second ClayVerse application.
# The canonical StatefulSet reserves Pod names clayverse-N. Match that stable
# canonical Pod path rather than mutable labels or RuntimeClass, then validate
# the required label, Kata RuntimeClass and the complete unreviewed
# io.katacontainers.* annotation namespace after admission mutation.
#
# This structure prevents a mutating admission component from bypassing the
# fence by removing app=clayverse or switching runtimeClassName before
# validating admission runs.
#
# Final acceptance must bind the exact applied policy/binding bytes, prove that
# the API server admits the policy, and exercise positive/negative requests on
# the real target after all mutating admission has completed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: clayverse-kata-annotation-fence.seimensch.net
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  # RuntimeClass and labels are deliberately NOT match conditions. They are
  # required below, so mutation cannot make the canonical Pod skip validation.
  matchConditions:
    - name: canonical-clayverse-pod
      expression: object.metadata.name.startsWith('clayverse-')
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'app' in object.metadata.labels &&
        object.metadata.labels['app'] == 'clayverse'
      message: "Canonical ClayVerse Pods must retain app=clayverse after admission mutation"
      reason: Forbidden
    - expression: >-
        has(object.spec.runtimeClassName) &&
        object.spec.runtimeClassName == 'kata-qemu-runtime-rs'
      message: "Canonical ClayVerse Pods must retain the admitted Kata VM-backed RuntimeClass after admission mutation"
      reason: Forbidden
    - expression: >-
        !has(object.metadata.annotations) ||
        object.metadata.annotations.all(k, !k.startsWith('io.katacontainers.'))
      message: "ClayVerse Pods may not carry unreviewed io.katacontainers.* workload annotations"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: clayverse-kata-annotation-fence.seimensch.net
spec:
  policyName: clayverse-kata-annotation-fence.seimensch.net
  validationActions:
    - Deny
