# EntityOS Dream Daemon -- Konfiguration
# ========================================
# ENABLED=0 schaltet den Traum zentral ab, OHNE den systemd-Timer anzufassen
# (z.B. wenn der Timer aus anderen Gruenden aktiv bleiben soll). Die zweite,
# gleichwertige Abschaltung ist ganz normal: systemctl disable --now eos-dream.timer
ENABLED=1

# Sperrzeit zwischen zwei vollstaendigen Traeumen (Stunden). Schuetzt gegen
# doppeltes Ausloesen (Timer + manueller Start), der Timer selbst laeuft
# alle 12h -- die Sperrzeit hier ist die Sicherheitsmarge, nicht der Takt.
COOLDOWN_HOURS=8

# Harte Laufzeit-Obergrenze je Zyklus in Sekunden. Wird sie ueberschritten,
# bricht der Zyklus NACH Phase 1 kontrolliert ab (kein Absturz, kein Artikel
# mit halben Daten).
MAX_RUNTIME_SEC=480

# Ueber dieser Last (load1/nproc*100) wird kein Traum gestartet.
CPU_LOAD_MAX_PCT=50

# Mistral-Aufruf (hoechstens EINER je Zyklus, Phase 2 Synthese)
LLM_MODEL=mistral-small-latest
LLM_MAX_TOKENS=400
LLM_TIMEOUT_SEC=60
LLM_RETRIES=1

# Max. Zeilen je Beobachtungs-Query in Phase 1 (Replay)
REPLAY_LIMIT=30
