name: OMEGA G8 Preflight Compile Unblock

on:
  pull_request:
    paths:
      - 'tools/vps_control_sync_refresh_v1.py'
      - 'tests/test_vps_control_sync_refresh_v1.py'
      - '.github/workflows/omega-g8-preflight-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g8-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile repaired control-sync source
        run: python3 -m py_compile tools/vps_control_sync_refresh_v1.py
      - name: Run repository-bound adversarial refresh tests
        run: python3 -m pytest -q tests/test_vps_control_sync_refresh_v1.py
