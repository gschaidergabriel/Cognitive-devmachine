name: clayverse-python-lock-generator

on:
  pull_request:
    paths:
      - '.github/workflows/clayverse-python-lock-generator.yml'
      - 'the artefact/requirements.txt'
      - 'the artefact/requirements.lock.txt'
      - 'the artefact/Dockerfile'
      - 'the artefact/SOURCE_LOCK.json'
      - 'the artefact/tests/test_python_dependency_lock.py'
      - 'the artefact/tests/test_python_lock_generator_source_binding.py'

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Generate and verify exact Python hash lock
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DOCKERFILE='the artefact/Dockerfile'
          PRODUCT_REQUIREMENTS='the artefact/requirements.txt'
          PRODUCT_SOURCE_LOCK='the artefact/SOURCE_LOCK.json'
          test -f "$PRODUCT_DOCKERFILE"
          test -f "$PRODUCT_REQUIREMENTS"
          test -f "$PRODUCT_SOURCE_LOCK"

          # Bind the resolver environment to the actual first product FROM image.
          # Current ClayVerse uses a direct digest-pinned Python image rather than an
          # ARG BASE_IMAGE indirection; deriving from any parallel hardcoded value
          # would allow the generator to resolve a lock for different runtime bytes.
          BASE_IMAGE="$(sed -n -E 's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]+([^[:space:]]+).*/\1/p' "$PRODUCT_DOCKERFILE" | head -n1)"
          if ! printf '%s\n' "$BASE_IMAGE" | grep -Eq '^python:[^[:space:]]+@sha256:[0-9a-f]{64}$'; then
            echo "Product first FROM is not an exact digest-pinned Python image: $BASE_IMAGE" >&2
            exit 1
          fi
          REQUIREMENTS_SHA256="$(sha256sum "$PRODUCT_REQUIREMENTS" | awk '{print $1}')"
          SOURCE_LOCK_SHA256="$(sha256sum "$PRODUCT_SOURCE_LOCK" | awk '{print $1}')"
          echo "PRODUCT_BASE_IMAGE=$BASE_IMAGE"
          echo "PRODUCT_REQUIREMENTS_SHA256=$REQUIREMENTS_SHA256"
          echo "PRODUCT_SOURCE_LOCK_SHA256=$SOURCE_LOCK_SHA256"

          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -e EXPECTED_REQUIREMENTS_SHA256="$REQUIREMENTS_SHA256" \
            -e EXPECTED_SOURCE_LOCK_SHA256="$SOURCE_LOCK_SHA256" \
            "$BASE_IMAGE" bash -s <<'INNER'
          set -euo pipefail
          PRODUCT_REQUIREMENTS='/workspace/the artefact/requirements.txt'
          PRODUCT_SOURCE_LOCK='/workspace/the artefact/SOURCE_LOCK.json'
          actual_sha="$(sha256sum "$PRODUCT_REQUIREMENTS" | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_REQUIREMENTS_SHA256"
          actual_source_lock_sha="$(sha256sum "$PRODUCT_SOURCE_LOCK" | awk '{print $1}')"
          test "$actual_source_lock_sha" = "$EXPECTED_SOURCE_LOCK_SHA256"
          cp "$PRODUCT_REQUIREMENTS" /tmp/requirements.in

          python --version
          python -m pip --version

          # The resolver executable itself is part of the lock-generation trust root.
          # Bind the pip-tools wheel bytes before installation. Its transitive bootstrap
          # dependencies remain an explicitly open supply-chain gate until a complete
          # generator-environment hash lock is admitted in authorized isolated execution.
          python - <<'PY' > /tmp/pip-tools-source-lock.values
          import json
          import re
          from pathlib import Path

          lock = json.loads(Path('/workspace/the artefact/SOURCE_LOCK.json').read_text(encoding='utf-8'))
          pip_tools = lock['python_lock_generator']['pip_tools']
          version = pip_tools['version']
          wheel = pip_tools['wheel']
          sha256 = pip_tools['sha256']
          if wheel != f'pip_tools-{version}-py3-none-any.whl':
              raise SystemExit(f'PIP_TOOLS_WHEEL_IDENTITY_MISMATCH:{wheel}:{version}')
          if re.fullmatch(r'[0-9a-f]{64}', sha256) is None:
              raise SystemExit(f'PIP_TOOLS_SHA256_INVALID:{sha256}')
          print(version)
          print(wheel)
          print(sha256)
          PY
          mapfile -t PIP_TOOLS_LOCK < /tmp/pip-tools-source-lock.values
          test "${#PIP_TOOLS_LOCK[@]}" -eq 3
          PIP_TOOLS_VERSION="${PIP_TOOLS_LOCK[0]}"
          PIP_TOOLS_WHEEL="${PIP_TOOLS_LOCK[1]}"
          PIP_TOOLS_SHA256="${PIP_TOOLS_LOCK[2]}"
          rm -rf /tmp/pip-tools-bootstrap && mkdir -p /tmp/pip-tools-bootstrap
          python -m pip download --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --no-deps \
            "pip-tools==$PIP_TOOLS_VERSION" -d /tmp/pip-tools-bootstrap
          test "$(find /tmp/pip-tools-bootstrap -maxdepth 1 -type f | wc -l)" -eq 1
          PIP_TOOLS_WHEEL_PATH="/tmp/pip-tools-bootstrap/$PIP_TOOLS_WHEEL"
          test -f "$PIP_TOOLS_WHEEL_PATH"
          printf '%s  %s\n' "$PIP_TOOLS_SHA256" "$PIP_TOOLS_WHEEL_PATH" | sha256sum -c -
          echo "PIP_TOOLS_WHEEL_SHA256=$PIP_TOOLS_SHA256"
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: "$PIP_TOOLS_WHEEL_PATH"
          pip-compile --version | grep -F "version $PIP_TOOLS_VERSION"
          python -m pip freeze --all | LC_ALL=C sort > /tmp/generator.freeze
          echo -n 'GENERATOR_FREEZE_SHA256='; sha256sum /tmp/generator.freeze | awk '{print $1}'
          echo 'GENERATOR_ENVIRONMENT_BEGIN'
          cat /tmp/generator.freeze
          echo 'GENERATOR_ENVIRONMENT_END'

          pip-compile --generate-hashes --strip-extras --allow-unsafe --resolver=backtracking \
            -o /tmp/requirements.lock.1 /tmp/requirements.in
          pip-compile --generate-hashes --strip-extras --allow-unsafe --resolver=backtracking \
            -o /tmp/requirements.lock.2 /tmp/requirements.in
          diff -u /tmp/requirements.lock.1 /tmp/requirements.lock.2

          echo -n 'LOCK_SHA256='; sha256sum /tmp/requirements.lock.1 | awk '{print $1}'
          rm -rf /tmp/wheelhouse && mkdir /tmp/wheelhouse
          python -m pip download --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --require-hashes \
            -r /tmp/requirements.lock.1 -d /tmp/wheelhouse
          echo -n 'WHEELHOUSE_FILE_COUNT='; find /tmp/wheelhouse -maxdepth 1 -type f | wc -l
          echo 'WHEELHOUSE_SHA256_BEGIN'
          while IFS= read -r wheel; do
            printf '%s  %s\n' "$(sha256sum "$wheel" | awk '{print $1}')" "${wheel##*/}"
          done < <(find /tmp/wheelhouse -maxdepth 1 -type f -print | LC_ALL=C sort)
          echo 'WHEELHOUSE_SHA256_END'
          printf 'LOCK_GZIP_B64='; gzip -n -c /tmp/requirements.lock.1 | base64 -w0; printf '\n'
          INNER
