name: ClayCode BASE application proxy suite

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/claycode_base_application_proxy_suite.py'
      - 'tools/claycode_base_pure_toolchain.py'
      - 'tools/claycode_base_runtime.py'
      - 'research_entity/claycode/base/D_LALR_GRAMMAR_REPAIR_CANDIDATE_V7_OPERATOR_FN.lark'
      - 'research_entity/harness/reference/active_assembly.py'
      - '.github/workflows/claycode-base-application-proxy.yml'

permissions:
  contents: write

concurrency:
  group: claycode-base-app-proxy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  application-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'lark[interegular]==1.3.1'
      - name: Execute all ten application proxy classes
        run: python tools/claycode_base_application_proxy_suite.py
      - name: Require proxy PASS without target promotion
        run: |
          python - <<'PY'
          import json
          p='research_entity/claycode/autonomous/BASE_APPLICATION_PROXY_SUITE_RECEIPT.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['counts_as_target_acceptance'] is False
          assert d['counts_as_application_acceptance_pass'] is False
          assert d['total'] == 10
          assert d['pass'], d['failures']
          assert d['passed'] == 10
          print('BASE_APPLICATION_PROXY_10_OF_10_PASS')
          PY
      - name: Commit proxy receipt
        run: |
          git config user.name 'claycode-base-app-proxy'
          git config user.email 'claycode-base-app-proxy@users.noreply.github.com'
          git add research_entity/claycode/autonomous/BASE_APPLICATION_PROXY_SUITE_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ClayCode: record ten-class application proxy receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
