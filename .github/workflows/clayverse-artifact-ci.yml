name: clayverse-artifact-ci

# Canonical manual ClayVerse OCI gate. GitHub-hosted runner admission has been
# unavailable, so this workflow remains dispatch-only. The release tag is a
# transport locator only: EntityOS identity is derived exclusively from the
# tracked lock and reverified before and after image construction.
on:
  workflow_dispatch:
    inputs:
      entityos_release_tag:
        description: 'Same-repository release tag containing exactly one asset named EntityOS'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clayverse-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oci-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "source_sha=$GITHUB_SHA"
          git status --porcelain=v1

      - name: Resolve tracked EntityOS authority and stage exact release bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENTITYOS_RELEASE_TAG: ${{ inputs.entityos_release_tag }}
        run: |
          set -euo pipefail
          readarray -t LOCK < <(python3 - <<'PY'
          import json
          from pathlib import Path

          doc = json.loads(Path("the artefact/entityos.lock.json").read_text(encoding="utf-8"))
          assert doc["schema"] == "ClayVerseEntityOSArtifactLock/v1"
          sha = doc["sha256"]
          size = doc["size_bytes"]
          assert isinstance(sha, str) and len(sha) == 64 and all(c in "0123456789abcdef" for c in sha)
          assert isinstance(size, int) and size > 0
          print(sha)
          print(size)
          PY
          )
          LOCK_SHA256="${LOCK[0]}"
          LOCK_SIZE="${LOCK[1]}"

          rm -rf /tmp/clayverse-entityos-release
          mkdir -p /tmp/clayverse-entityos-release
          gh release download "$ENTITYOS_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'EntityOS' \
            --dir /tmp/clayverse-entityos-release
          test "$(find /tmp/clayverse-entityos-release -maxdepth 1 -type f -name 'EntityOS' | wc -l)" -eq 1
          test -f /tmp/clayverse-entityos-release/EntityOS
          test ! -L /tmp/clayverse-entityos-release/EntityOS
          test "$(stat -c %s /tmp/clayverse-entityos-release/EntityOS)" = "$LOCK_SIZE"

          cd "the artefact"
          sh ./stage-entityos.sh /tmp/clayverse-entityos-release/EntityOS "$LOCK_SHA256"
          test -f ./EntityOS
          test ! -L ./EntityOS
          test "$(sha256sum ./EntityOS | awk '{print $1}')" = "$LOCK_SHA256"
          test "$(stat -c %s ./EntityOS)" = "$LOCK_SIZE"

          echo "CLAYVERSE_ENTITYOS_SHA256=$LOCK_SHA256" >> "$GITHUB_ENV"
          echo "ENTITYOS_LOCK_SIZE=$LOCK_SIZE" >> "$GITHUB_ENV"
          echo "ENTITYOS_RELEASE_TAG=$ENTITYOS_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "entityos_release_tag=$ENTITYOS_RELEASE_TAG entityos_sha256=$LOCK_SHA256 entityos_size=$LOCK_SIZE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "the artefact/requirements.txt"

      - name: Install candidate test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r "the artefact/requirements.txt" pytest

      - name: Run full candidate tests
        shell: bash
        working-directory: "the artefact"
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Reverify tracked EntityOS authority before image construction
        shell: bash
        run: |
          set -euo pipefail
          test -f "the artefact/EntityOS"
          test ! -L "the artefact/EntityOS"
          ACTUAL_SHA256="$(sha256sum "the artefact/EntityOS" | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -c %s "the artefact/EntityOS")"
          test "$ACTUAL_SHA256" = "$CLAYVERSE_ENTITYOS_SHA256"
          test "$ACTUAL_SIZE" = "$ENTITYOS_LOCK_SIZE"

      - name: Validate Compose shape
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f "the artefact/compose.yaml" config >/tmp/clayverse-compose.rendered.yaml
          grep -q 'read_only: true' /tmp/clayverse-compose.rendered.yaml
          grep -q 'no-new-privileges:true' /tmp/clayverse-compose.rendered.yaml

      - name: Build exact OCI candidate and verify embedded EntityOS bytes
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="clayverse:${GITHUB_SHA}"
          docker build --pull --no-cache \
            --build-arg "ENTITYOS_SHA256=${CLAYVERSE_ENTITYOS_SHA256}" \
            -t "$IMAGE" "the artefact"
          IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          ARCHIVE_SHA256="$(docker save "$IMAGE" | sha256sum | awk '{print $1}')"
          EMBEDDED_SHA256="$(docker run --rm --entrypoint python "$IMAGE" -c "import hashlib; print(hashlib.sha256(open('/opt/entityos/EntityOS','rb').read()).hexdigest())")"
          test "$EMBEDDED_SHA256" = "$CLAYVERSE_ENTITYOS_SHA256"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
          echo "ARCHIVE_SHA256=$ARCHIVE_SHA256" >> "$GITHUB_ENV"
          printf 'image_id=%s\narchive_sha256=%s\nembedded_entityos_sha256=%s\n' "$IMAGE_ID" "$ARCHIVE_SHA256" "$EMBEDDED_SHA256"

      - name: Enforce non-root and hardened offline restart continuity
        shell: bash
        run: |
          set -euo pipefail
          UID_ACTUAL="$(docker run --rm --entrypoint id "$IMAGE" -u)"
          test "$UID_ACTUAL" = "10001"

          VOL="clayverse-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$VOL" >/dev/null
          cleanup() { docker volume rm -f "$VOL" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          run_once() {
            docker run --rm \
              --network none \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --pids-limit 128 \
              --memory 512m \
              --cpus 1.0 \
              -v "$VOL:/var/lib/clayverse" \
              "$IMAGE" --once
          }

          OUT1="$(run_once)"
          OUT2="$(run_once)"
          printf '%s\n%s\n' "$OUT1" "$OUT2"
          python3 - "$OUT1" "$OUT2" <<'PY'
          import json, sys
          for raw in sys.argv[1:]:
              doc = json.loads(raw)
              assert doc["service"] == "clayverse"
              assert doc["status"] == "probe_ok"
              assert doc["scope"] == "state_only"
              assert doc["ready"] is False
              assert isinstance(doc["checkpoint"], int) and doc["checkpoint"] > 0
              assert len(doc["state_hash"]) == 64
          PY

          CHECKPOINTS="$(docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$VOL:/var/lib/clayverse" \
            --entrypoint python "$IMAGE" \
            -c 'import sqlite3; db=sqlite3.connect("/var/lib/clayverse/unified.db"); print(db.execute("select count(*) from checkpoints").fetchone()[0])')"
          test "$CHECKPOINTS" -ge 2
          echo "runtime_uid=$UID_ACTUAL checkpoints_after_restart=$CHECKPOINTS"

      - name: Verify production startup fails closed without identity and Clerk config
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm "$IMAGE" >/tmp/clayverse-no-config.log 2>&1
          rc=$?
          set -e
          cat /tmp/clayverse-no-config.log
          test "$rc" -ne 0
          grep -q 'CLAYVERSE_CLERK_MAP_JSON is required' /tmp/clayverse-no-config.log

      - name: Artifact evidence summary
        shell: bash
        run: |
          {
            echo "## ClayVerse OCI artifact gate"
            echo "- source: $GITHUB_SHA"
            echo "- image: $IMAGE"
            echo "- image id: $IMAGE_ID"
            echo "- docker-save sha256: $ARCHIVE_SHA256"
            echo "- EntityOS release locator: $ENTITYOS_RELEASE_TAG"
            echo "- embedded EntityOS sha256: $CLAYVERSE_ENTITYOS_SHA256"
            echo "- embedded EntityOS size: $ENTITYOS_LOCK_SIZE"
            echo "- tests: full candidate pytest suite"
            echo "- runtime: non-root uid 10001, network=none, read-only rootfs, cap-drop=ALL, no-new-privileges"
            echo "- continuity: two isolated state-only probe restarts against one persistent state volume"
            echo "- production no-config: required fail-closed Clerk/identity startup gate"
            echo "- readiness claim: none; --once must report probe_ok with ready=false"
          } >> "$GITHUB_STEP_SUMMARY"
