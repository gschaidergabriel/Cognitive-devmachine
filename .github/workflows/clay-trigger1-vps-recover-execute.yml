name: Trigger1 VPS recover and execute

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: read

jobs:
  execute:
    if: >-
      github.repository == 'gschaidergabriel/clay-global-research-entity' &&
      github.event.pull_request.title == '[CLAY-DISPATCH] Trigger1 VPS recovery execute' &&
      github.event.pull_request.user.login == 'gschaidergabriel' &&
      contains(github.event.pull_request.body || '', 'dispatch_schema: CLAY_TRIGGER1_VPS_RECOVER_EXECUTE/v1') &&
      contains(github.event.pull_request.body || '', 'dispatch_nonce: 20260825T1200P0700_GPT56SOL_RECOVER')
    # Acquire the recovery singleton only for the exact authorized dispatch. Keeping this
    # at workflow scope caused every unrelated opened PR to sit in this concurrency queue
    # before its strict job-if could skip, adding avoidable self-hosted backpressure.
    concurrency:
      group: clay-trigger1-vps-recovery-execute-v1
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Recover bridge wrapper and execute exact native run
        id: experiment
        shell: bash
        run: |
          set -euo pipefail
          host_out="${RUNNER_TEMP}/trigger1-recover-${GITHUB_RUN_ID}"
          mkdir -p "$host_out"
          source_head="$(git rev-parse HEAD)"
          runtime=''; prefix=()
          if command -v podman >/dev/null 2>&1 && podman inspect clay-direct-dev >/dev/null 2>&1; then runtime='podman'; prefix=(podman)
          elif command -v docker >/dev/null 2>&1 && docker inspect clay-direct-dev >/dev/null 2>&1; then runtime='docker'; prefix=(docker)
          elif command -v sudo >/dev/null 2>&1 && sudo -n podman inspect clay-direct-dev >/dev/null 2>&1; then runtime='sudo-podman'; prefix=(sudo -n podman)
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker inspect clay-direct-dev >/dev/null 2>&1; then runtime='sudo-docker'; prefix=(sudo -n docker)
          fi
          [[ -n "$runtime" ]] || { echo 'clay-direct-dev unavailable' >&2; exit 40; }

          # Kill only the accidentally self-blocking wrapper; regex avoids matching this recovery command itself.
          "${prefix[@]}" exec clay-direct-dev bash -lc "pkill -TERM -f '[t]rigger1-structural-native-abstract-v4-gpt56sol-20260825' || true"
          sleep 2

          # If a real executor survived independently, do not duplicate it.
          if "${prefix[@]}" exec clay-direct-dev bash -lc "pgrep -f '[t]rigger1_structural_native_abstract_execute.py' >/dev/null"; then
            echo 'REAL_EXECUTOR_ALREADY_ACTIVE' > "$host_out/status.txt"
            echo "host_out=$host_out" >> "$GITHUB_OUTPUT"
            echo "status=REAL_EXECUTOR_ALREADY_ACTIVE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote="/tmp/clay-trigger1-recover-${GITHUB_RUN_ID}"
          "${prefix[@]}" exec clay-direct-dev sh -lc "rm -rf '$remote' && mkdir -p '$remote/repo' '$remote/out'"
          "${prefix[@]}" cp "${GITHUB_WORKSPACE}/." "clay-direct-dev:${remote}/repo"

          set +e
          "${prefix[@]}" exec -e CLAY_REMOTE="$remote" -e CLAY_SOURCE_HEAD="$source_head" clay-direct-dev bash -lc '
            set -euo pipefail
            cd "$CLAY_REMOTE/repo"
            unset OPENAI_API_KEY OPENAI_API_KEYS ANTHROPIC_API_KEY ANTHROPIC_API_KEYS || true
            unset GROQ_API_KEY GROQ_API_KEYS GROQ2_API_KEY GROQ3_API_KEY || true
            unset MISTRAL_API_KEY MISTRAL_API_KEYS MISTRAL2_API_KEY MISTRAL3_API_KEY || true
            unset NVIDIA_API_KEY NVIDIA_API_KEYS NVIDIA_NIM_API_KEY NVIDIA2_API_KEY NVIDIA3_API_KEY NGC_API_KEY || true
            unset OPENROUTER_API_KEY OPENROUTER_API_KEYS OPENROUTER2_API_KEY OPENROUTER3_API_KEY || true
            unset TOGETHER_API_KEY TOGETHER_API_KEYS HF_TOKEN HUGGING_FACE_HUB_TOKEN HUGGINGFACE_HUB_TOKEN || true
            export HF_HUB_OFFLINE=1 HF_HUB_DISABLE_IMPLICIT_TOKEN=1 HF_HUB_DISABLE_TELEMETRY=1 TOKENIZERS_PARALLELISM=false OMP_NUM_THREADS=2 MKL_NUM_THREADS=2
            PY=/cache/clay-qwen06/venv/bin/python
            LLAMA_ROOT=/cache/clay-qwen06/llama.cpp
            GGUF=/cache/clay-qwen06/Qwen3-0.6B-Q8_0.gguf
            test "$(sha256sum "$GGUF" | awk "{print \$1}")" = 9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031
            test "$(git -C "$LLAMA_ROOT" rev-parse HEAD)" = bb4caa7540188872173c44d161602d9271386413
            "$PY" -m py_compile tools/trigger1_structural_label_free_cases.py tools/trigger1_nuisance_residualize.py tools/trigger1_structural_native_abstract_execute.py
            "$PY" -m unittest -v tests.test_trigger1_structural_label_free_cases tests.test_trigger1_nuisance_residualize > "$CLAY_REMOTE/out/source-tests.txt" 2>&1
            CAP="$CLAY_REMOTE/out/native-layer-capture"
            LOG="$CLAY_REMOTE/out/native-cvec-logits"
            c++ -std=c++17 -O2 -I"$LLAMA_ROOT/include" -I"$LLAMA_ROOT/ggml/include" tools/trigger1_native_llamacpp_layer_capture.cpp -L"$LLAMA_ROOT/build/bin" -Wl,-rpath,"$LLAMA_ROOT/build/bin" -lllama -lggml -lggml-base -lggml-cpu -pthread -o "$CAP"
            c++ -std=c++17 -O2 -I"$LLAMA_ROOT/include" -I"$LLAMA_ROOT/ggml/include" tools/trigger1_native_llamacpp_cvec_logits.cpp -L"$LLAMA_ROOT/build/bin" -Wl,-rpath,"$LLAMA_ROOT/build/bin" -lllama -lggml -lggml-base -lggml-cpu -pthread -o "$LOG"
            "$PY" tools/trigger1_structural_native_abstract_execute.py --output-dir "$CLAY_REMOTE/out" --llama-root "$LLAMA_ROOT" --gguf "$GGUF" --capture-harness "$CAP" --logits-harness "$LOG" --source-head "$CLAY_SOURCE_HEAD" > "$CLAY_REMOTE/out/launcher.stdout.txt" 2> "$CLAY_REMOTE/out/launcher.stderr.txt"
          '
          rc=$?
          set -e
          "${prefix[@]}" cp "clay-direct-dev:${remote}/out/." "$host_out/" >/dev/null 2>&1 || true
          echo "$rc" > "$host_out/process_exit_code.txt"
          echo "host_out=$host_out" >> "$GITHUB_OUTPUT"
          if [[ $rc -eq 0 && -s "$host_out/trigger1_structural_native_abstract_result.json" ]]; then
            echo "status=COMPLETE" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED_RC_$rc" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist runtime evidence to main
        if: always()
        shell: bash
        env:
          HOST_OUT: ${{ steps.experiment.outputs.host_out }}
          EXP_STATUS: ${{ steps.experiment.outputs.status }}
        run: |
          set -euo pipefail
          [[ -n "${HOST_OUT:-}" && -d "$HOST_OUT" ]] || exit 0
          target="research_entity/runtime/tool_results/trigger1-structural-native-recover-run${GITHUB_RUN_ID}"
          mkdir -p "$target"
          cp -a "$HOST_OUT/." "$target/"
          git config user.name 'clay-trigger1-native-runner'
          git config user.email 'clay-trigger1-native-runner@users.noreply.github.com'
          git add "$target"
          git commit -m "evidence(trigger1): structural native recovery run ${GITHUB_RUN_ID} [skip ci]" || exit 0
          for attempt in 1 2 3 4 5 6; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((attempt*3)); done
          exit 1