# EntityOS Hypothesen-Generator -- Konfiguration
# =================================================
# ENABLED=0 schaltet den Generator zentral ab, OHNE den systemd-Timer
# anzufassen (gleiches Muster wie eos-dream/config/dream.conf). Zweite,
# gleichwertige Abschaltung: systemctl disable --now eos-hypothesen.timer

ENABLED=1

# Sperrzeit zwischen zwei Laeufen (Stunden). Der Timer selbst laeuft alle
# 12h -- die Sperrzeit hier ist die Sicherheitsmarge gegen Doppelstart
# (Timer + manueller Aufruf), nicht der Takt.
COOLDOWN_HOURS=10

# Ueber dieser Last (load1/nproc*100) wird kein Lauf gestartet.
CPU_LOAD_MAX_PCT=60

# Budget: neue Hypothesen (artikel+folgerung-Paare) je Zyklus. Bei 2
# Laeufen/Tag also hoechstens 6 neue Hypothesen/Tag -- bewusst klein
# gehalten (Frank-Vorbild: 30/Tag bei viel breiterer Datenbasis).
MAX_PER_RUN=3

# Mindestanzahl Nulltreffer-Zeilen mit derselben Schluesselwort-Signatur,
# damit ein vp_paket_log-Cluster als "wiederkehrend" gilt (nicht als
# Einzelfall). zero_luecke-Artikel (vom Traum-Daemon bereits als
# wiederkehrend erkannt) sind davon unabhaengig immer Kandidaten.
CLUSTER_MIN=5

# Wie weit vp_paket_log fuer die Cluster-Suche zurueckgelesen wird.
PAKET_LOG_LOOKBACK_DAYS=30
