name: GO878 historical Free-Swarm backfill runtime

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  historical-backfill:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] GO878 historical backfill' && github.event.issue.user.login == 'gschaidergabriel'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          test "${#SOURCE_SHA}" -eq 40
          test "${#SOURCE_TREE}" -eq 40
          python3 -m py_compile \
            tools/free_swarm_historical_backfill.py \
            tools/run_free_swarm_historical_backfill_capsule_878.py
          printf 'SOURCE_SHA=%s\nSOURCE_TREE=%s\n' "$SOURCE_SHA" "$SOURCE_TREE" >> "$GITHUB_ENV"

      - name: Execute credential-blind capsule inside clay-direct-dev
        id: capsule
        shell: bash
        run: |
          set -euo pipefail
          HOST_OUT="/tmp/go878-historical-backfill-${GITHUB_RUN_ID}"
          mkdir -p "$HOST_OUT"
          runtime=''
          exec_in=()
          exec_io=()

          if command -v docker >/dev/null 2>&1 && docker inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='docker'; exec_in=(docker exec clay-direct-dev); exec_io=(docker exec -i clay-direct-dev)
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='sudo-docker'; exec_in=(sudo -n docker exec clay-direct-dev); exec_io=(sudo -n docker exec -i clay-direct-dev)
          elif command -v podman >/dev/null 2>&1 && podman inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='podman'; exec_in=(podman exec clay-direct-dev); exec_io=(podman exec -i clay-direct-dev)
          elif command -v sudo >/dev/null 2>&1 && sudo -n podman inspect clay-direct-dev >/dev/null 2>&1; then
            runtime='sudo-podman'; exec_in=(sudo -n podman exec clay-direct-dev); exec_io=(sudo -n podman exec -i clay-direct-dev)
          elif command -v incus >/dev/null 2>&1 && incus info clay-direct-dev >/dev/null 2>&1; then
            runtime='incus'; exec_in=(incus exec clay-direct-dev --); exec_io=(incus exec clay-direct-dev --)
          elif command -v lxc >/dev/null 2>&1 && lxc info clay-direct-dev >/dev/null 2>&1; then
            runtime='lxc'; exec_in=(lxc exec clay-direct-dev --); exec_io=(lxc exec clay-direct-dev --)
          else
            echo 'clay-direct-dev not discoverable from self-hosted runner' >&2
            exit 20
          fi

          CAPSULE_ROOT="/tmp/clay-go878-${GITHUB_RUN_ID}"
          "${exec_in[@]}" sh -lc "rm -rf '$CAPSULE_ROOT' && mkdir -p '$CAPSULE_ROOT/src'"
          tar --exclude=.git -C "$GITHUB_WORKSPACE" -cf - . | "${exec_io[@]}" tar -xf - -C "$CAPSULE_ROOT/src"

          "${exec_in[@]}" sh -lc "set -eu; test -d /artifacts/clay-entityos-swarm; find /artifacts/clay-entityos-swarm -type f -name workers.jsonl -print -quit | grep -q .; python3 -m py_compile '$CAPSULE_ROOT/src/tools/free_swarm_historical_backfill.py' '$CAPSULE_ROOT/src/tools/run_free_swarm_historical_backfill_capsule_878.py'"

          set +e
          "${exec_in[@]}" env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/tmp LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            CLAY_SWARM_ARTIFACT_ROOT=/artifacts/clay-entityos-swarm \
            CLAY_GO878_SOURCE_SHA="$SOURCE_SHA" \
            CLAY_GO878_SOURCE_TREE="$SOURCE_TREE" \
            CLAY_GO878_DIRTY_STATE=CLEAN \
            CLAY_GO878_TRANSPORT=SELF_HOSTED_LINUX_X64 \
            CLAY_GO878_SANDBOX=clay-direct-dev \
            CLAY_GO878_RUN_ID="$GITHUB_RUN_ID" \
            python3 "$CAPSULE_ROOT/src/tools/run_free_swarm_historical_backfill_capsule_878.py" \
              --artifact-root /artifacts/clay-entityos-swarm \
              --max-lines-per-pass 50000 \
              --max-passes 64 \
              --receipt "$CAPSULE_ROOT/receipt.json" \
              >"$HOST_OUT/capsule.stdout" 2>"$HOST_OUT/capsule.stderr"
          rc=$?
          set -e

          "${exec_in[@]}" cat "$CAPSULE_ROOT/receipt.json" > "$HOST_OUT/receipt.json" 2>/dev/null || true
          test -s "$HOST_OUT/receipt.json"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('/tmp') / f"go878-historical-backfill-{os.environ['GITHUB_RUN_ID']}"
          receipt=json.loads((root/'receipt.json').read_text())
          assert receipt['source']['commit'] == os.environ['SOURCE_SHA']
          assert receipt['source']['tree'] == os.environ['SOURCE_TREE']
          assert receipt['execution']['sandbox'] == 'clay-direct-dev'
          assert receipt['execution']['provider_model_network_io'] is False
          assert receipt['execution']['paid_provider_io'] is False
          assert receipt['execution']['together_io'] is False
          print(json.dumps({
              'status': receipt['status'],
              'lines_scanned': receipt['scan']['lines_scanned'],
              'files': receipt['scan']['scan_set_files'],
              'new_execution_variants': receipt['recovery']['new_execution_variants'],
              'pending_extraction': receipt['recovery']['remaining_pending_extraction'],
              'manifest': receipt['scan']['scan_set_manifest_sha256'],
          }, sort_keys=True))
          PY
          printf 'CAPSULE_RC=%s\nCAPSULE_RUNTIME=%s\nHOST_OUT=%s\n' "$rc" "$runtime" "$HOST_OUT" >> "$GITHUB_ENV"

      - name: Persist exact receipt to canonical repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_entity/runtime/tool_results
          target="research_entity/runtime/tool_results/go878-historical-backfill-${GITHUB_RUN_ID}.json"
          cp "$HOST_OUT/receipt.json" "$target"
          git config user.name 'clay-direct-dev-runner'
          git config user.email 'clay-direct-dev-runner@users.noreply.github.com'
          git add "$target"
          git commit -m "evidence(go878): historical backfill ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main && git push origin HEAD:main && break
            if [[ "$attempt" -eq 8 ]]; then exit 30; fi
            sleep $((attempt * 3))
          done

      - name: Enforce saturation result
        shell: bash
        run: |
          set -euo pipefail
          test "$CAPSULE_RC" -eq 0
