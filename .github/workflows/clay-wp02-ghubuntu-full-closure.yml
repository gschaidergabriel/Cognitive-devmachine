name: Clay WP02 GitHub-hosted Ubuntu Full Closure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp02-full-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR base Clay revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Capture base identity
        run: |
          set -euo pipefail
          echo "CLAY_WP02_GHUBUNTU_EXECUTION_STARTED"
          echo "head=$(git rev-parse HEAD)"
          git status --porcelain
          uname -a
          cat /etc/os-release
          python3 --version

      - name: Create isolated strict dependency environment
        run: |
          set -euo pipefail
          python3 -m venv /tmp/clay-wp02-ghubuntu
          /tmp/clay-wp02-ghubuntu/bin/python -m pip install --disable-pip-version-check 'lark[interegular]==1.3.1'

      - name: Run complete selected WP02 closure
        env:
          PYTHONSAFEPATH: "1"
        run: |
          set -euo pipefail
          /tmp/clay-wp02-ghubuntu/bin/python -P tools/claycode_wp02_strict_local_closure_v2.py \
            --allow-ci \
            --output /tmp/CLAY_WP02_GHUBUNTU_FULL_CLOSURE.json
          /tmp/clay-wp02-ghubuntu/bin/python - <<'PY'
          import json
          p='/tmp/CLAY_WP02_GHUBUNTU_FULL_CLOSURE.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['pass'] is True, d.get('failure')
          print('CLAY_WP02_GHUBUNTU_FULL_CLOSURE_PASS')
          print('selected_grammar='+str(d.get('selected_grammar')))
          print('packages='+json.dumps(d.get('packages'), sort_keys=True))
          print('host='+json.dumps(d.get('host'), sort_keys=True))
          for row in d.get('components', []):
              print('component='+row['name']+' pass='+str(row['semantic_pass'])+' elapsed_ms='+str(row['elapsed_ms']))
          prod=d.get('production_canonicalizer', {})
          print('production_canonicalizer_pass='+str(prod.get('semantic_pass'))+' elapsed_ms='+str(prod.get('elapsed_ms')))
          PY

      - name: Upload exact closure receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clay-wp02-ghubuntu-full-closure-${{ github.run_id }}
          path: /tmp/CLAY_WP02_GHUBUNTU_FULL_CLOSURE.json
          if-no-files-found: error
          retention-days: 30
