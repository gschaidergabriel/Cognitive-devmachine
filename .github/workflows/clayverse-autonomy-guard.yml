name: ClayVerse autonomy guard

on:
  push:
    paths:
      - 'the artefact/clayverse/autonomy.py'
      - 'the artefact/clayverse/mcp_server.py'
      - 'the artefact/clayverse/recovery.py'
      - 'the artefact/clayverse/turn_lifecycle.py'
      - 'the artefact/clayverse/terminal_hooks.py'
      - 'the artefact/clayverse/autonomy_context.py'
      - 'the artefact/tests/test_autonomy.py'
      - 'the artefact/tests/test_autonomy_mcp_effect_dispatch.py'
      - 'the artefact/tests/test_autonomy_human_preemption_reentry.py'
      - 'the artefact/tests/test_autonomy_recovery_hardening.py'
      - 'the artefact/tests/test_autonomy_schema_neutral_hardening.py'
      - 'the artefact/tests/test_autonomous_turn_gate.py'
      - 'the artefact/tests/test_autonomy_context_integration.py'
      - 'the artefact/tests/test_autonomy_cross_attempt_replay_guard.py'
      - '.github/workflows/clayverse-autonomy-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomy-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused test harness
        run: python -m pip install --disable-pip-version-check 'pytest==8.4.1'
      - name: Compile autonomy causal spine
        working-directory: the artefact
        run: |
          python -m py_compile clayverse/autonomy.py clayverse/mcp_server.py clayverse/recovery.py clayverse/turn_lifecycle.py clayverse/terminal_hooks.py clayverse/autonomy_context.py
      - name: Run exact autonomy regressions
        working-directory: the artefact
        run: |
          python -m pytest -q \
            tests/test_autonomy.py \
            tests/test_autonomy_mcp_effect_dispatch.py \
            tests/test_autonomy_human_preemption_reentry.py \
            tests/test_autonomy_recovery_hardening.py \
            tests/test_autonomy_schema_neutral_hardening.py \
            tests/test_autonomous_turn_gate.py \
            tests/test_autonomy_context_integration.py \
            tests/test_autonomy_cross_attempt_replay_guard.py
