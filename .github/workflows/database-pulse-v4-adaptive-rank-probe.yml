name: UnifiedDB Pulse Adaptive Rank V4 Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_entity/runtime/database_pulse_rank_path_v4.py'
      - 'research_entity/runtime/test_database_pulse_rank_path_v4.py'
      - 'research_entity/runtime/database_pulse_runtime_v4.py'
      - 'research_entity/runtime/test_database_pulse_runtime_v4.py'
      - 'tools/database_pulse_rank_path_v4_benchmark.py'
      - '.github/workflows/database-pulse-v4-adaptive-rank-probe.yml'

permissions:
  contents: write

jobs:
  hosted-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, clean: true}
      - name: Compile and falsify adaptive rank plus Runtime V4
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research_entity/runtime/database_pulse_rank_path_v4.py \
            research_entity/runtime/test_database_pulse_rank_path_v4.py \
            research_entity/runtime/database_pulse_runtime_v4.py \
            research_entity/runtime/test_database_pulse_runtime_v4.py \
            tools/database_pulse_rank_path_v4_benchmark.py
          python3 -m unittest -v \
            research_entity.runtime.test_database_pulse_rank_path_v4 \
            research_entity.runtime.test_database_pulse_runtime_v4
      - name: Benchmark V4 adaptive build
        run: |
          set -euo pipefail
          mkdir -p research_entity/benchmarks/database_pulse
          python3 tools/database_pulse_rank_path_v4_benchmark.py \
            --rows 3000 --repeats 200 --budget 64 \
            --output research_entity/benchmarks/database_pulse/rank_path_v4_hosted.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-runtime-v4-hosted
          path: research_entity/benchmarks/database_pulse/rank_path_v4_hosted.json

  hostinger-v4:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, clean: true, persist-credentials: true}
      - name: Compile and falsify adaptive rank plus Runtime V4
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research_entity/runtime/database_pulse_rank_path_v4.py \
            research_entity/runtime/test_database_pulse_rank_path_v4.py \
            research_entity/runtime/database_pulse_runtime_v4.py \
            research_entity/runtime/test_database_pulse_runtime_v4.py \
            tools/database_pulse_rank_path_v4_benchmark.py
          python3 -m unittest -v \
            research_entity.runtime.test_database_pulse_rank_path_v4 \
            research_entity.runtime.test_database_pulse_runtime_v4
      - name: Benchmark V4 adaptive build
        run: |
          set -euo pipefail
          mkdir -p research_entity/benchmarks/database_pulse
          python3 tools/database_pulse_rank_path_v4_benchmark.py \
            --rows 3000 --repeats 200 --budget 64 \
            --output research_entity/benchmarks/database_pulse/rank_path_v4_vps.json
      - name: Attach Hostinger metadata and program progress
        env:
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 tools/program_progress.py --json > /tmp/program-progress.json
          python3 - <<'PY'
          import json,os,pathlib,platform,sqlite3,socket,sys
          from datetime import datetime,timezone
          p=pathlib.Path('research_entity/benchmarks/database_pulse/rank_path_v4_vps.json'); x=json.loads(p.read_text())
          x['execution_metadata']={'evidence_class':'REAL_SELF_HOSTED_UBUNTU_EXECUTION','scope':'REMOTE_PRELIMINARY_DATABASE_PULSE_NOT_ANDREAS_TARGET_ACCEPTANCE','created_at':datetime.now(timezone.utc).isoformat(),'git_sha':os.environ.get('GIT_SHA',''),'github_run_id':os.environ.get('RUN_ID',''),'hostname':socket.gethostname(),'runner_name':os.environ.get('RUNNER_NAME','UNKNOWN'),'runner_os':os.environ.get('RUNNER_OS','UNKNOWN'),'runner_arch':os.environ.get('RUNNER_ARCH','UNKNOWN'),'platform':platform.platform(),'python':sys.version,'sqlite':sqlite3.sqlite_version}
          x['program_progress']=json.loads(pathlib.Path('/tmp/program-progress.json').read_text())
          x['release_boundary']='Hostinger preliminary only; not Andreas target acceptance.'
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
          assert x['correctness']['all_correct'] is True
          assert x['v4_sparse_history']['index_built'] is False
          assert x['v4_sparse_history']['horizon_status']=='INSUFFICIENT_HISTORY'
          assert x['v4_stable_history_admission']['physical_mode']=='COMPILED_INDEX'
          PY
      - name: Persist Hostinger V4 receipt
        run: |
          set -euo pipefail
          cp research_entity/benchmarks/database_pulse/rank_path_v4_vps.json /tmp/rank_path_v4_vps.json
          git reset --hard HEAD
          git clean -fd
          mkdir -p research_entity/benchmarks/database_pulse
          cp /tmp/rank_path_v4_vps.json research_entity/benchmarks/database_pulse/rank_path_v4_vps.json
          git config user.name 'clay-pulse-runtime-v4-runner'
          git config user.email 'clay-pulse-v4@users.noreply.github.com'
          git add research_entity/benchmarks/database_pulse/rank_path_v4_vps.json
          git commit -m 'evidence(frank): persist Pulse Runtime V4 Hostinger receipt [skip ci]' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt*3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-runtime-v4-hostinger
          path: research_entity/benchmarks/database_pulse/rank_path_v4_vps.json
