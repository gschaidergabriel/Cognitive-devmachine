name: GO878 historical backfill supervisor gate

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  wire-test-backfill:
    if: github.repository == 'gschaidergabriel/clay-global-research-entity' && github.event.issue.title == '[CLAY-DISPATCH] historical backfill 8.78' && github.event.issue.user.login == 'gschaidergabriel'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      BRANCH: go878/historical-backfill-supervisor-gpt56sol-20260825
      ARTIFACT_ROOT: /artifacts/clay-entityos-swarm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Re-enter exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --detach origin/main
          git switch -C "$BRANCH"
          git config user.name 'clay-go878-runner'
          git config user.email 'clay-go878-runner@users.noreply.github.com'
          git rev-parse HEAD > /tmp/go878-base-head
          test -z "$(git status --porcelain=v1)"

      - name: Wire backlog-first Forge into single supervisor path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          supervisor = Path('tools/run_6000_free_swarm_supervisor.sh')
          activation = Path('tools/activate_6000_free_swarm.sh')
          test = Path('tests/test_6000_safe_forge_wiring_872.py')
          s = supervisor.read_text(encoding='utf-8')
          a = activation.read_text(encoding='utf-8')

          if 'local x="$ROOT/tools/run_free_evidence_forge_backfill.py"' in s:
              raise SystemExit('BACKFILL_WIRING_ALREADY_PRESENT_OR_PARALLEL_WORK_LANDED')
          old = '''start_forge(){
  local x="$ROOT/tools/run_free_evidence_forge_safe.py"; [[ -f "$x" ]] || return 0
  # The active 6000 lane must never keep the shell-capable legacy Forge alive.
  # Retire any pre-fix process before starting the argv-only, secret-free,
  # bubblewrap-gated successor. A zero-match is the normal steady state.
  while IFS= read -r pid; do
    [[ -n "$pid" ]] && kill "$pid" 2>/dev/null || true
  done < <(pgrep -f '[r]un_free_evidence_forge.py' || true)
  pgrep -f '[r]un_free_evidence_forge_safe.py' >/dev/null 2>&1 && return 0
  nohup python3 "$x" --hours 24 --sleep-seconds 20 --discovery-parallel 8 --local-parallel 4 --e2b-parallel 20 >"$STATE_DIR/forge.log" 2>&1 </dev/null &
  echo $! >"$STATE_DIR/forge.pid"
}
'''
          new = '''start_forge(){
  local x="$ROOT/tools/run_free_evidence_forge_backfill.py"; [[ -f "$x" ]] || return 0
  # One Forge authority only: retire both the shell-capable legacy entrypoint and
  # the pre-backfill safe entrypoint before starting the backlog-first successor.
  while IFS= read -r pid; do
    [[ -n "$pid" ]] && kill "$pid" 2>/dev/null || true
  done < <(pgrep -f '[r]un_free_evidence_forge.py|[r]un_free_evidence_forge_safe.py' || true)
  pgrep -f '[r]un_free_evidence_forge_backfill.py' >/dev/null 2>&1 && return 0
  nohup python3 "$x" --hours 24 --sleep-seconds 5 --questions-per-cycle 2 --backpressure-questions-per-cycle 0 --backpressure-threshold 1 --discovery-parallel 4 --local-parallel 4 --e2b-parallel 20 >"$STATE_DIR/forge.log" 2>&1 </dev/null &
  echo $! >"$STATE_DIR/forge.pid"
}
'''
          if old not in s:
              raise SystemExit('SUPERVISOR_START_FORGE_ANCHOR_MISSING')
          s = s.replace(old, new, 1)
          s = s.replace("'forge_running':running('run_free_evidence_forge_safe.py')", "'forge_running':running('run_free_evidence_forge_backfill.py')")
          s = s.replace("LEGACY_FORGE_TERMINATED; SAFE_FORGE_ONLY", "LEGACY_AND_PREBACKFILL_FORGE_TERMINATED; BACKLOG_FIRST_SAFE_FORGE_ONLY")
          supervisor.write_text(s, encoding='utf-8')

          compile_anchor = '  tools/run_free_evidence_forge_safe.py \\\n  tools/forge_evidence_credit_871.py \\\n'
          compile_replacement = '  tools/run_free_evidence_forge_safe.py \\\n  tools/free_swarm_historical_backfill.py \\\n  tools/run_free_evidence_forge_backfill.py \\\n  tools/forge_evidence_credit_871.py \\\n'
          if compile_anchor not in a:
              raise SystemExit('ACTIVATION_COMPILE_ANCHOR_MISSING')
          a = a.replace(compile_anchor, compile_replacement, 1)
          a = a.replace(" 'tools/run_free_evidence_forge_safe.py',\n", " 'tools/run_free_evidence_forge_safe.py',\n 'tools/run_free_evidence_forge_backfill.py',\n")
          activation.write_text(a, encoding='utf-8')

          test.write_text('''from pathlib import Path\nimport unittest\n\n\nROOT = Path(__file__).resolve().parents[1]\nSUPERVISOR = ROOT / "tools/run_6000_free_swarm_supervisor.sh"\nACTIVATION = ROOT / "tools/activate_6000_free_swarm.sh"\n\n\nclass BacklogFirstForge6000Wiring878(unittest.TestCase):\n    def test_active_6000_supervisor_uses_single_backlog_first_forge(self):\n        text = SUPERVISOR.read_text(encoding="utf-8")\n        start = text.index("start_forge(){")\n        end = text.index("\\n}\\n\\nrefresh_root_results", start) + 3\n        block = text[start:end]\n        self.assertIn('local x="$ROOT/tools/run_free_evidence_forge_backfill.py"', block)\n        self.assertIn("pgrep -f '[r]un_free_evidence_forge.py|[r]un_free_evidence_forge_safe.py'", block)\n        self.assertIn("kill \\\"$pid\\\"", block)\n        self.assertIn("pgrep -f '[r]un_free_evidence_forge_backfill.py'", block)\n        self.assertNotIn('local x="$ROOT/tools/run_free_evidence_forge_safe.py"', block)\n        self.assertIn('--backpressure-threshold 1', block)\n        self.assertIn('--backpressure-questions-per-cycle 0', block)\n\n    def test_supervisor_status_exposes_backfill_and_legacy_process_state(self):\n        text = SUPERVISOR.read_text(encoding="utf-8")\n        self.assertIn("'forge_running':running('run_free_evidence_forge_backfill.py')", text)\n        self.assertIn("'legacy_forge_running':running('run_free_evidence_forge.py')", text)\n        self.assertIn("'forge_execution_policy':'CLAY_FORGE_EXECUTION_ADMISSION/v1'", text)\n        self.assertIn("BACKLOG_FIRST_SAFE_FORGE_ONLY", text)\n\n    def test_activation_preflights_backfill_and_cleans_old_forge(self):\n        text = ACTIVATION.read_text(encoding="utf-8")\n        for required in (\n            "tools/forge_execution_admission_871.py",\n            "tools/run_free_evidence_forge_safe_871.py",\n            "tools/run_free_evidence_forge_safe.py",\n            "tools/free_swarm_historical_backfill.py",\n            "tools/run_free_evidence_forge_backfill.py",\n            "tools/forge_evidence_credit_871.py",\n            "tools/ingest_forge_accepts_into_distillery.py",\n            "tools/run_forge_distillery_bridge_loop.py",\n        ):\n            self.assertIn(required, text)\n        self.assertIn("bash -n tools/run_6000_free_swarm_supervisor.sh", text)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Add exact historical-backfill receipt runner
        shell: bash
        run: |
          set -euo pipefail
          cat > tools/run_free_swarm_historical_backfill_receipt_878.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse
          import hashlib
          import json
          from pathlib import Path
          import sqlite3
          import subprocess
          from typing import Any

          import run_free_evidence_forge_safe_871 as safe
          from free_swarm_historical_backfill import backfill_metrics, ensure_schema, ingest_artifact_history

          base = safe.base
          SCHEMA = "FREE_SWARM_HISTORICAL_BACKFILL_RECEIPT/v1"

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def scalar(con: sqlite3.Connection, sql: str, args: tuple[Any, ...] = ()) -> int:
              row = con.execute(sql, args).fetchone()
              return int((row or [0])[0] or 0)

          def snapshot(con: sqlite3.Connection) -> dict[str, int]:
              return {
                  "concepts": scalar(con, "SELECT COUNT(DISTINCT concept_id) FROM candidates WHERE concept_id IS NOT NULL"),
                  "variants": scalar(con, "SELECT COUNT(DISTINCT variant_id) FROM candidates WHERE variant_id IS NOT NULL"),
                  "duplicates_superseded": scalar(con, "SELECT COUNT(*) FROM candidates WHERE state='DUPLICATE_SUPERSEDED'"),
                  "ready_backlog": scalar(con, "SELECT COUNT(*) FROM candidates WHERE ready=1 AND state='NEW'"),
                  "implementation_backlog": scalar(con, "SELECT COUNT(*) FROM candidates WHERE state='NEEDS_IMPLEMENTATION'"),
                  "explicit_links": scalar(con, "SELECT COUNT(*) FROM candidate_sources WHERE extraction_mode='EXPLICIT_WORKER_DELTA'"),
                  "batch_links": scalar(con, "SELECT COUNT(*) FROM candidate_sources WHERE extraction_mode='HISTORICAL_BATCH'"),
              }

          def main() -> int:
              ap = argparse.ArgumentParser()
              ap.add_argument("--artifact-root", type=Path, default=base.ARTIFACT_ROOT)
              ap.add_argument("--output", type=Path, required=True)
              ap.add_argument("--max-lines-per-pass", type=int, default=50000)
              ap.add_argument("--max-passes", type=int, default=256)
              args = ap.parse_args()
              root = args.artifact_root.resolve()
              files = sorted(root.rglob("workers.jsonl")) if root.exists() else []
              scan_set = [{"path": str(p), "size": p.stat().st_size, "sha256": sha256_file(p)} for p in files]

              con = base.connect()
              ensure_schema(con)
              before = snapshot(con)
              totals = {"passes": 0, "lines_scanned": 0, "successful_outputs": 0, "candidate_variants_added": 0, "chunks_added": 0, "batches_seen": 0}
              saturated = False
              try:
                  for _ in range(max(1, args.max_passes)):
                      stats = ingest_artifact_history(con, root, max_new_lines=max(1, args.max_lines_per_pass))
                      totals["passes"] += 1
                      for key in ("lines_seen", "successful_outputs", "candidate_variants_added", "chunks_added", "batches_seen"):
                          target = "lines_scanned" if key == "lines_seen" else key
                          totals[target] += int(stats.get(key, 0))
                      if int(stats.get("lines_seen", 0)) == 0:
                          saturated = True
                          break
                  after = snapshot(con)
                  metrics = backfill_metrics(con)
              finally:
                  con.close()

              dirty = git("status", "--porcelain=v1")
              receipt = {
                  "schema": SCHEMA,
                  "authority_epoch": "8.78",
                  "program": "ENTITYOS_HCU",
                  "product": "EntityOS",
                  "architecture": "HCU",
                  "mode": "FREE_ONLY",
                  "source_commit": git("rev-parse", "HEAD"),
                  "source_tree": git("rev-parse", "HEAD^{tree}"),
                  "source_dirty": bool(dirty),
                  "source_dirty_porcelain": dirty.splitlines()[:100],
                  "artifact_root": str(root),
                  "artifact_scan_set": scan_set,
                  "artifact_scan_file_count": len(scan_set),
                  "saturation": {"source_scan_saturated": saturated, **totals},
                  "recovered": {
                      "explicit_deltas_recovered": max(0, after["explicit_links"] - before["explicit_links"]),
                      "batch_deltas_recovered": max(0, after["batch_links"] - before["batch_links"]),
                      "new_concepts": max(0, after["concepts"] - before["concepts"]),
                      "new_execution_variants": max(0, after["variants"] - before["variants"]),
                      "duplicates_superseded": max(0, after["duplicates_superseded"] - before["duplicates_superseded"]),
                  },
                  "backlog": {
                      "ready_backlog": after["ready_backlog"],
                      "implementation_backlog": after["implementation_backlog"],
                      "remaining_pending_extraction": int(metrics.get("pending_extraction") or 0),
                  },
                  "historical_metrics": metrics,
                  "network_calls": 0,
                  "provider_model_calls": 0,
                  "runtime_credit_scope": "HISTORICAL_BACKFILL_COMPONENT_ONLY",
                  "credits": {"entityos_whole": 0, "hcu_full": 0, "jspace_model": 0, "training": 0, "provider_runtime": 0},
                  "status": "PASS" if saturated and not dirty and len(scan_set) > 0 else "NONPASS",
              }
              args.output.parent.mkdir(parents=True, exist_ok=True)
              args.output.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print(json.dumps({"status": receipt["status"], "files": len(scan_set), **totals, **receipt["recovered"], **receipt["backlog"]}, sort_keys=True))
              return 0 if receipt["status"] == "PASS" else 2

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod +x tools/run_free_swarm_historical_backfill_receipt_878.py

      - name: Run source and fail-closed wiring regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/free_swarm_historical_backfill.py \
            tools/run_free_evidence_forge_backfill.py \
            tools/run_free_swarm_historical_backfill_receipt_878.py \
            tests/test_6000_safe_forge_wiring_872.py
          bash -n tools/run_6000_free_swarm_supervisor.sh
          bash -n tools/activate_6000_free_swarm.sh
          python3 -m unittest -v tests.test_6000_safe_forge_wiring_872
          git diff --check

      - name: Commit exact executable source before runtime receipt
        shell: bash
        run: |
          set -euo pipefail
          git add tools/run_6000_free_swarm_supervisor.sh tools/activate_6000_free_swarm.sh tests/test_6000_safe_forge_wiring_872.py tools/run_free_swarm_historical_backfill_receipt_878.py
          git commit -m 'forge: wire backlog-first historical backfill supervisor'
          git rev-parse HEAD > /tmp/go878-source-head
          test -z "$(git status --porcelain=v1)"

      - name: Execute full historical source replay to scan saturation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_entity/continuity/receipts
          python3 tools/run_free_swarm_historical_backfill_receipt_878.py \
            --artifact-root "$ARTIFACT_ROOT" \
            --max-lines-per-pass 50000 \
            --max-passes 256 \
            --output research_entity/continuity/receipts/2026-08-25_GO878_FREE_SWARM_HISTORICAL_BACKFILL_GPT56SOL.json \
            | tee /tmp/go878-backfill-summary.log

      - name: Commit receipt and push bounded branch
        shell: bash
        run: |
          set -euo pipefail
          git add research_entity/continuity/receipts/2026-08-25_GO878_FREE_SWARM_HISTORICAL_BACKFILL_GPT56SOL.json
          git commit -m 'evidence: record historical backfill saturation receipt'
          git push --force-with-lease origin "HEAD:$BRANCH"
